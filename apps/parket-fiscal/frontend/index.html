  // Sobe foto OU vídeo pro bucket fiscal-midias e devolve o link público.
  // Foto e vídeo seguem o mesmo caminho de propósito: a única coisa que entra
  // em fiscal_fotos.url é um link. O que fica no banco tem que ser leve, senão
  // toda tela que lista as fotos da obra carrega as imagens junto com o JSON.
  async function subirMidiaStorage(file, servicoKey, tipo, statusFn){
    let corpo = file, ext, mime;
    if (tipo === "video"){
      ext = (file.name.split(".").pop() || "mp4").toLowerCase();
      mime = file.type || "video/mp4";
      statusFn && statusFn(`Enviando vídeo… (${(file.size/1024/1024).toFixed(1)}MB)`);
    } else {
      statusFn && statusFn("Processando foto…");
      corpo = await compressPhoto(file);
      ext = "jpg";
      mime = "image/jpeg";
      statusFn && statusFn(`Enviando foto… (${Math.round(corpo.size/1024)}KB)`);
    }
    const path = `${laudoId}/${servicoKey || "outros"}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    const { error: upErr } = await sb.storage.from("fiscal-midias").upload(path, corpo, {
      contentType: mime, upsert: false,
    });
    if (upErr) throw upErr;
    const { data: pub } = sb.storage.from("fiscal-midias").getPublicUrl(path);
    return { url: pub.publicUrl, storage_path: path };
  }

  // Upload IMEDIATO de foto/vídeo direto pro Supabase — não fica preso em
  // memória local. Se o user trocar de aba, o app fechar, ou recarregar a
  // página, a mídia já está persistida no banco. O botão "Salvar laudo"
  // continua valendo só pros campos de texto/checklist.
  async function uploadMidiaImediato(file, servicoKey, tipo, descricao, statusFn){
    try {
      const { url, storage_path } = await subirMidiaStorage(file, servicoKey, tipo, statusFn);
      const { error: insErr } = await sb.from("fiscal_fotos").insert({
        laudo_id: laudoId,
        card_id: laudo.card_id,
        servico: servicoKey || "outros",
        ambiente: servicoKey || "outros",
        tipo,
        storage_path,
        descricao: descricao || null,
        url,
      });
      if (insErr) throw insErr;
      statusFn && statusFn(`${tipo === "video" ? "Vídeo" : "Foto"} salva`);
      await recarregarGaleria(servicoKey);
      setTimeout(() => statusFn && statusFn(""), 2000);
      return true;
    } catch (err) {
      statusFn && statusFn(`Falha: ${err.message || err}. Tente novamente.`);
      console.error("[fiscal upload]", err);
      return false;
    }
  }

  // Rebusca a galeria inteira do laudo e redesenha a seção.
  async function recarregarGaleria(servicoKey){
    const { data: fxNew } = await sb.from("fiscal_fotos").select("*").eq("laudo_id", laudoId).order("created_at");
    fotosExistentes = fxNew || [];
    renderFotosDoServico(servicoKey);
  }

  // Upload EM MASSA de fotos: o fiscal seleciona quantas quiser e todas sobem
  // direto, sem abrir editor nenhum no meio do caminho (o comentário e o desenho
  // ficam pra depois, tocando na foto na lista).
  //
  // Compressão + upload pro storage rodam em 3 frentes ao mesmo tempo (é a parte
  // lenta, de rede). O INSERT no banco é sequencial e na ordem em que o fiscal
  // escolheu os arquivos, pra galeria (ordenada por created_at) sair na ordem certa.
  async function subirFotosEmMassa(files, servicoKey, statusFn){
    const total = files.length;
    let prontas = 0, falhas = 0;
    const progresso = () => statusFn && statusFn(`Enviando fotos… ${prontas}/${total}`);
    progresso();

    // Fase 1: sobe os arquivos pro storage com concorrência limitada.
    const resultados = new Array(total).fill(null);
    let proximo = 0;
    const worker = async () => {
      while (proximo < total){
        const i = proximo++;
        try {
          resultados[i] = await subirMidiaStorage(files[i], servicoKey, "foto", null);
        } catch (err){
          console.error("[fiscal upload massa]", err);
          falhas++;
        }
        prontas++;
        progresso();
      }
    };
    await Promise.all([worker(), worker(), worker()].slice(0, Math.max(1, Math.min(3, total))));

    // Fase 2: grava as linhas na ordem original.
    for (let i = 0; i < total; i++){
      const r = resultados[i];
      if (!r) continue;
      const { error } = await sb.from("fiscal_fotos").insert({
        laudo_id: laudoId,
        card_id: laudo.card_id,
        servico: servicoKey || "outros",
        ambiente: servicoKey || "outros",
        tipo: "foto",
        storage_path: r.storage_path,
        descricao: null,
        url: r.url,
      });
      if (error){ console.error("[fiscal insert massa]", error); falhas++; }
    }

    await recarregarGaleria(servicoKey);
    const ok = total - falhas;
    statusFn && statusFn(falhas
      ? `${ok} de ${total} enviadas. ${falhas} falharam, tente de novo.`
      : `${ok} ${ok === 1 ? "foto enviada" : "fotos enviadas"}. Toque na foto pra comentar ou desenhar.`);
    setTimeout(() => statusFn && statusFn(""), falhas ? 6000 : 4000);
  }

  // Bind dos inputs (foto+vídeo) de cada seção
  function bindFotoInputs(){
    // Cria um statusEl global pra mensagens de upload
    let statusEl = document.getElementById("_upload_status");
    if (!statusEl) {
      statusEl = el(`<div id="_upload_status" style="position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#fff;padding:10px 18px;border-radius:0;font-size:13px;z-index:99999;min-width:200px;text-align:center;display:none"></div>`);
      document.body.appendChild(statusEl);
    }
    const showStatus = (msg) => {
      if (!msg) { statusEl.style.display = "none"; return; }
      statusEl.textContent = msg;
      statusEl.style.display = "block";
    };

    // FOTOS: tudo que o fiscal seleciona sobe direto, sem editor no meio.
    // O editor (comentário + desenho) abre depois, tocando na foto da lista.
    root.querySelectorAll("._foto_servico").forEach(inp => {
      const servicoKey = inp.dataset.servico;
      renderFotosDoServico(servicoKey);
      inp.onchange = async (e) => {
        const files = Array.from(e.target.files);
        e.target.value = "";
        if (!files.length) return;
        await subirFotosEmMassa(files, servicoKey, showStatus);
      };
    });
    // VÍDEOS — sobem imediato
    root.querySelectorAll("._video_servico").forEach(inp => {
      const servicoKey = inp.dataset.servico;
      inp.onchange = async (e) => {
        const file = e.target.files[0];
        e.target.value = "";
        if (!file) return;
        if (file.size > 100 * 1024 * 1024){
          _appToast(`Vídeo muito grande (${(file.size/1024/1024).toFixed(1)}MB). Limite: 100MB. Grava mais curto ou em qualidade menor.`);
          return;
        }
        const comentario = prompt("Comentário do vídeo (opcional):") || "";
        await uploadMidiaImediato(file, servicoKey, "video", comentario, showStatus);
      };
    });
  }
  // Chamada depois de tudo renderizar (no fim da função renderEditarLaudo)
  setTimeout(bindFotoInputs, 0);

  // ── Observação geral ──
  root.appendChild(renderTextField("observacoes", "Observação geral", true));

  // ── Ações: Salvar rascunho / Concluir / Ver link público ──
  const actions = el(`<div class="card">
    <div class="grid2">
      <button class="ghost" id="_rascunho">Salvar rascunho</button>
      <button class="primary" id="_concluir">Concluir laudo</button>
    </div>
    <div class="grid2" style="margin-top:8px">
      <button class="ghost" id="_ver_link">Ver link público (PDF)</button>
      <button class="ghost" id="_copiar_link">Copiar link</button>
    </div>
    <div id="_save_msg"></div>
  </div>`);
  root.appendChild(actions);

  document.getElementById("_ver_link").onclick = () => {
    // Página pública do laudo (mesma origem) no visor in-app
    abrirVisorAnexos([{ url: "/laudo/" + laudoId, nome: "Laudo (link público)" }], 0);
  };
  document.getElementById("_copiar_link").onclick = async () => {
    const url = location.origin + "/laudo/" + laudoId;
    try {
      await navigator.clipboard.writeText(url);
      _appToast("Link copiado: " + url);
    } catch { prompt("Copia o link:", url); }
  };

  async function salvar(concluir){
    const msgEl = document.getElementById("_save_msg");
    msgEl.innerHTML = `<div class="small"><span class="spinner"></span> Salvando…</div>`;
    const payload = {
      updated_at: new Date().toISOString(),
      status: concluir ? "concluido" : "em_andamento",
    };
    // Mapeia checklist por serviço pras colunas correspondentes
    for (const k of ["piso","deck","forro","painel","porta","escada","bancos","liberacao","equipe","produtividade"]){
      if (ck[k]) payload[`checklist_${k}`] = ck[k];
    }
    // Campos texto direto
    for (const k of Object.keys(textFields)){
      payload[k] = textFields[k] || null;
    }
    // Checklist extra (entrega/reparo + conferência de medidas do vendido nas vistorias)
    if (laudo.tipo === "entrega" || laudo.tipo === "reparo" || (extra.vendido && Object.keys(extra.vendido).length)){
      payload.checklist_extra = extra;
    }
    // Upload imediato já fez o trabalho — só varre `novasFotos` (legado, pode
    // estar vazio se tudo subiu) pra não perder nada caso o user tenha
    // adicionado algo via fluxo antigo.
    for (let i = 0; i < novasFotos.length; i++){
      const nf = novasFotos[i];
      const tipo = nf.tipo || "foto";
      msgEl.innerHTML = `<div class="small"><span class="spinner"></span> ${tipo === "video" ? "Vídeo" : "Foto"} ${i+1}/${novasFotos.length}…</div>`;
      try {
        const { url, storage_path } = await subirMidiaStorage(nf.file, nf.servico, tipo, null);
        await sb.from("fiscal_fotos").insert({
          laudo_id: laudoId,
          card_id: laudo.card_id,
          servico: nf.servico || "outros",
          tipo,
          storage_path,
          descricao: nf.descricao || null,
          url,
        });
      } catch (err){
        msgEl.innerHTML = `<div class="err">Falha na mídia ${i+1}: ${esc(err.message || err)}</div>`;
        return;
      }
    }

    const { error: upErr } = await sb.from("fiscal_laudos").update(payload).eq("id", laudoId);
    if (upErr){
      msgEl.innerHTML = `<div class="err">${esc(upErr.message)}</div>`;
      return;
    }

    // ─── SYNC com o card do operacional (acompanhamento de obra) ───
    // Grava link público do laudo + status no kanban_cards.details pra o
    // operacional ver no card de obra.
    if (laudo.card_id) {
      try {
        const linkPublico = location.origin + "/laudo/" + laudoId;
        const { data: cardAtual } = await sb.from("kanban_cards").select("details").eq("id", laudo.card_id).single();
        const detalhes = (cardAtual && cardAtual.details) || {};
        const laudosArr = Array.isArray(detalhes.fiscal_laudos) ? detalhes.fiscal_laudos : [];
        // Atualiza/adiciona entrada deste laudo
        const tipoLabel = (TIPOS[laudo.tipo] && TIPOS[laudo.tipo].label) || laudo.tipo;
        const idx = laudosArr.findIndex(x => x.id === laudoId);
        const entry = {
          id: laudoId,
          tipo: laudo.tipo,
          tipo_label: tipoLabel,
          status: concluir ? "concluido" : "rascunho",
          fiscal_nome: laudo.fiscal_nome || null,
          link: linkPublico,
          atualizado_em: new Date().toISOString(),
        };
        if (idx >= 0) laudosArr[idx] = entry; else laudosArr.push(entry);
        await sb.from("kanban_cards").update({
          details: { ...detalhes, fiscal_laudos: laudosArr, ultimo_laudo: entry },
        }).eq("id", laudo.card_id);
      } catch (syncErr) {
        console.warn("[sync card operacional]", syncErr);
      }
    }

    // Link abre no visor in-app (nunca aba nova)
    msgEl.innerHTML = `<div class="ok">${concluir ? "Laudo concluído" : "Rascunho salvo"} · Link: <a href="#" data-laudo-visor style="color:var(--pk-accent)">/laudo/${laudoId.slice(0,8)}</a></div>`;
    msgEl.querySelector("[data-laudo-visor]").onclick = (ev) => {
      ev.preventDefault();
      abrirVisorAnexos([{ url: "/laudo/" + laudoId, nome: "Laudo (link público)" }], 0);
    };
    if (concluir) setTimeout(() => renderHome(), 1200);
    else {
      novasFotos.forEach(nf => { if (nf._objUrl){ try { URL.revokeObjectURL(nf._objUrl); } catch(_){} } });
      novasFotos = [];
      const { data: fx2 } = await sb.from("fiscal_fotos").select("*").eq("laudo_id", laudoId).order("created_at");
      fotosExistentes = fx2 || [];
      // Re-render todas as galerias de cada serviço
      root.querySelectorAll("._fotos_box").forEach(box => {
        renderFotosDoServico(box.dataset.servico);
      });
    }
  }
  document.getElementById("_rascunho").onclick = () => salvar(false);
  document.getElementById("_concluir").onclick = () => salvar(true);

  // ── AUTO-SAVE silencioso: qualquer mudança em input/checkbox/textarea
  // dispara um patch em 1.5s (debounced). Assim o fiscal nunca perde
  // trabalho por fechar o app / recarregar sem clicar em "Salvar rascunho".
  let autoSaveTimer = null;
  let autoSaveInflight = false;
  async function patchLaudoSilencioso(){
    if (autoSaveInflight) return;
    autoSaveInflight = true;
    try {
      const payload = { updated_at: new Date().toISOString() };
      for (const k of ["piso","deck","forro","painel","porta","escada","bancos","liberacao","equipe","produtividade"]){
        if (ck[k]) payload[`checklist_${k}`] = ck[k];
      }
      for (const k of Object.keys(textFields)){
        payload[k] = textFields[k] || null;
      }
      if (laudo.tipo === "entrega" || laudo.tipo === "reparo" || (extra.vendido && Object.keys(extra.vendido).length)){
        payload.checklist_extra = extra;
      }
      const { error: asErr } = await sb.from("fiscal_laudos").update(payload).eq("id", laudoId);
      if (asErr) throw asErr;
      const ind = document.getElementById("_autosave_ind");
      if (ind){
        ind.style.color = "var(--pk-accent)";
        ind.textContent = "salvo automaticamente";
        ind.style.opacity = "0.65";
        setTimeout(() => { if (ind) ind.style.opacity = "0"; }, 1600);
      }
    } catch (_) {
      // Falhou (sem sinal, etc): avisa em vez de deixar "salvando…" preso, que
      // faria o fiscal achar que o texto está salvo. Tenta de novo na próxima mudança.
      const ind = document.getElementById("_autosave_ind");
      if (ind){
        ind.style.color = "var(--pk-status-err)";
        ind.textContent = "sem sinal: ainda não salvou, continue editando que salva sozinho";
        ind.style.opacity = "0.9";
      }
    }
    finally { autoSaveInflight = false; }
  }
  const scheduleAutoSave = () => {
    if (autoSaveTimer) clearTimeout(autoSaveTimer);
    const ind = document.getElementById("_autosave_ind");
    if (ind){ ind.textContent = "salvando…"; ind.style.opacity = "0.65"; }
    autoSaveTimer = setTimeout(patchLaudoSilencioso, 1500);
  };
  root.addEventListener("input", scheduleAutoSave);
  root.addEventListener("change", scheduleAutoSave);
  // Salva imediato antes de fechar aba/app.
  window.addEventListener("beforeunload", () => { patchLaudoSilencioso(); });
  // Indicador discreto no rodapé do formulário.
  root.appendChild(el(`<div id="_autosave_ind" style="text-align:center;font-size:11px;color:var(--pk-accent);opacity:0;transition:opacity 0.3s;margin:6px 0 20px">salvo automaticamente</div>`));
}

// ╔══════════════════════════════════════════════════════════════╗
// ║ CALENDÁRIO — mês com visitas/laudos                            ║
// ╚══════════════════════════════════════════════════════════════╝
// Tela de lista dedicada aberta na Home (null = home normal)
let _homeListKey = null;
let _homeListCliente = null;
let _calMonth = (() => { const d = new Date(); return { y: d.getFullYear(), m: d.getMonth() }; })();
let _calSelDay = (() => { const d = new Date(); return d.toISOString().slice(0,10); })();
// "mes" mostra grid 7×N (default). "semana" mostra 7 colunas com agenda detalhada.
let _calView = "mes";
// Início da semana atual em vista semanal (segunda da semana de _calSelDay).
let _calWeekStart = (() => {
  const d = new Date();
  const dow = d.getDay();
  // Segunda = dow 1; ajusta pra trás
  const back = dow === 0 ? 6 : dow - 1;
  d.setDate(d.getDate() - back);
  return d.toISOString().slice(0,10);
})();

async function renderCalendario(){
  setActiveNav("agenda");
  root.innerHTML = `<div class="card center"><span class="spinner"></span><div class="small" style="margin-top:8px">Carregando agenda…</div></div>`;
  subscribeFiscalRealtime("agenda", () => { if (_rtView === "agenda") renderCalendario(); });

  const filtroFiscalId = _isAdmin ? _operandoComoId : (_fiscal && _fiscal.id);
  // Janela visível depende da vista (mês: grid 6×7; semana: 7 dias da
  // segunda do _calWeekStart até o domingo)
  let startGrid, endGrid, first, last;
  if (_calView === "semana"){
    const ws = new Date(_calWeekStart + "T00:00:00");
    startGrid = new Date(ws);
    endGrid = new Date(ws); endGrid.setDate(ws.getDate() + 6); endGrid.setHours(23,59,59,999);
    first = startGrid; last = endGrid;
  } else {
    first = new Date(_calMonth.y, _calMonth.m, 1);
    startGrid = new Date(first); startGrid.setDate(first.getDate() - first.getDay());
    last = new Date(_calMonth.y, _calMonth.m + 1, 0);
    endGrid = new Date(last); endGrid.setDate(last.getDate() + (6 - last.getDay()));
  }

  let qA = sb.from("fiscal_agenda")
    .select("id, card_id, tipo, data_inicio, status, notas, obra, cliente, endereco, online, tags, attachments")
    .gte("data_inicio", startGrid.toISOString())
    .lte("data_inicio", endGrid.toISOString())
    .order("data_inicio", { ascending: true });
  if (filtroFiscalId) qA = qA.eq("fiscal_id", filtroFiscalId);
  const { data: ags } = await qA;

  let qL = sb.from("fiscal_laudos")
    .select("id, card_id, fiscal_id, fiscal_nome, obra, cliente, tipo, status, data_vistoria")
    .gte("data_vistoria", startGrid.toISOString())
    .lte("data_vistoria", endGrid.toISOString())
    .order("data_vistoria", { ascending: true });
  if (filtroFiscalId) qL = qL.eq("fiscal_id", filtroFiscalId);
  const { data: lds } = await qL;

  // Mapa dia (YYYY-MM-DD em LOCAL TIME) -> eventos. Antes usávamos
  // toISOString().slice(0,10) que dá a data UTC — eventos noturnos no BR
  // caíam no dia seguinte. Agora extrai Y-M-D do timezone do usuário.
  const byDay = {};
  function dayKeyLocal(d){
    const dt = (d instanceof Date) ? d : new Date(d);
    const y = dt.getFullYear();
    const m = String(dt.getMonth() + 1).padStart(2, "0");
    const day = String(dt.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }
  function bucket(date, ev){
    if (!date) return;
    const k = dayKeyLocal(date);
    if (!byDay[k]) byDay[k] = [];
    byDay[k].push(ev);
  }
  (ags || []).forEach(a => bucket(a.data_inicio, {
    kind: "agenda", id: a.id, card_id: a.card_id, when: a.data_inicio,
    cliente: a.cliente, obra: a.obra, endereco: a.endereco, tipo: a.tipo, status: a.status, notas: a.notas, online: a.online, tags: a.tags, attachments: a.attachments,
  }));
  (lds || []).forEach(l => bucket(l.data_vistoria, {
    kind: "laudo", id: l.id, card_id: l.card_id, when: l.data_vistoria,
    cliente: l.cliente, obra: l.obra, tipo: l.tipo, status: l.status, fiscal_nome: l.fiscal_nome,
  }));

  root.innerHTML = "";

  // Admin: seletor "operando como"
  if (_isAdmin){
    const opts = _fiscaisLista.map(f => `<option value="${f.id}" ${f.id===_operandoComoId?"selected":""}>${esc(f.nome)}</option>`).join("");
    const sel = el(`<div class="card">
      <div class="label">Operando como (fiscal)</div>
      <select id="_op_como_cal" style="margin-top:6px">${opts}</select>
    </div>`);
    root.appendChild(sel);
    document.getElementById("_op_como_cal").onchange = (e) => { _operandoComoId = e.target.value; renderCalendario(); };
  }

  // Calendário
  let titleLabel;
  if (_calView === "semana"){
    const a = startGrid.toLocaleDateString("pt-BR", { day: "2-digit", month: "short" });
    const b = endGrid.toLocaleDateString("pt-BR", { day: "2-digit", month: "short", year: "numeric" });
    titleLabel = `${a} – ${b}`;
  } else {
    titleLabel = first.toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
  }
  const wrap = el(`<div class="cal-wrap">
    <div class="cal-head">
      <div class="cal-title">${esc(titleLabel)}</div>
      <div class="cal-nav" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end">
        <div style="display:inline-flex;background:var(--pk-card1);border:1px solid var(--pk-border1);border-radius:0;padding:2px;gap:2px">
          <button id="_cal_view_mes" style="width:auto;height:26px;padding:0 10px;border:none;border-radius:0;font-size:11px;font-weight:600;cursor:pointer;background:${_calView==='mes'?'rgba(150,132,115,0.18)':'transparent'};color:${_calView==='mes'?'var(--pk-accent)':'var(--pk-text-dim)'}">Mês</button>
          <button id="_cal_view_sem" style="width:auto;height:26px;padding:0 10px;border:none;border-radius:0;font-size:11px;font-weight:600;cursor:pointer;background:${_calView==='semana'?'rgba(150,132,115,0.18)':'transparent'};color:${_calView==='semana'?'var(--pk-accent)':'var(--pk-text-dim)'}">Semana</button>
        </div>
        <button class="cal-btn today" id="_cal_today">Hoje</button>
        <button class="cal-btn" id="_cal_prev">‹</button>
        <button class="cal-btn" id="_cal_next">›</button>
      </div>
    </div>
    <div class="cal-grid ${_calView==='semana'?'cal-week':''}" id="_cal_grid"></div>
    <div class="swipe-hint">← arraste pro lado pra trocar de ${_calView==='semana'?'semana':'mês'} →</div>
    <div class="cal-legend">
      <div class="lg"><span class="lg-dot" style="background:#FBBF24"></span>Pendente</div>
      <div class="lg"><span class="lg-dot" style="background:#3B82F6"></span>Em andamento</div>
      <div class="lg"><span class="lg-dot" style="background:#34D399"></span>Concluído</div>
      <div class="lg"><span class="lg-dot" style="background:#A78BFA"></span>Agenda</div>
    </div>
  </div>`);
  root.appendChild(wrap);

  // ── Swipe horizontal pra trocar mês/semana (touch screens) ──
  // Detecta gesto horizontal limpo (Δx > 60 e |Δx| > 2×|Δy|) e dispara a
  // mesma ação dos botões ‹/›. Não interfere em scroll vertical da página.
  (function attachSwipe(){
    let sx = 0, sy = 0, started = false;
    wrap.addEventListener("touchstart", (e) => {
      const t = e.touches[0]; if (!t) return;
      sx = t.clientX; sy = t.clientY; started = true;
    }, { passive: true });
    wrap.addEventListener("touchend", (e) => {
      if (!started) return; started = false;
      const t = (e.changedTouches && e.changedTouches[0]) || null;
      if (!t) return;
      const dx = t.clientX - sx, dy = t.clientY - sy;
      if (Math.abs(dx) < 60) return;
      if (Math.abs(dx) < Math.abs(dy) * 2) return;
      // dx > 0 = swipe pra direita = ir pra trás (anterior)
      if (dx > 0) document.getElementById("_cal_prev").click();
      else        document.getElementById("_cal_next").click();
    }, { passive: true });
  })();

  document.getElementById("_cal_view_mes").onclick = () => { _calView = "mes"; renderCalendario(); };
  document.getElementById("_cal_view_sem").onclick = () => {
    _calView = "semana";
    // Realinha a semana do dia selecionado (ou hoje)
    const base = new Date((_calSelDay || new Date().toISOString().slice(0,10)) + "T00:00:00");
    const dow = base.getDay();
    const back = dow === 0 ? 6 : dow - 1;
    base.setDate(base.getDate() - back);
    _calWeekStart = base.toISOString().slice(0,10);
    renderCalendario();
  };
  document.getElementById("_cal_today").onclick = () => {
    const d = new Date();
    if (_calView === "semana"){
      const dow = d.getDay();
      const back = dow === 0 ? 6 : dow - 1;
      const ws = new Date(d); ws.setDate(d.getDate() - back);
      _calWeekStart = ws.toISOString().slice(0,10);
    } else {
      _calMonth = { y: d.getFullYear(), m: d.getMonth() };
    }
    _calSelDay = d.toISOString().slice(0,10);
    renderCalendario();
  };
  document.getElementById("_cal_prev").onclick = () => {
    if (_calView === "semana"){
      const ws = new Date(_calWeekStart + "T00:00:00");
      ws.setDate(ws.getDate() - 7);
      _calWeekStart = ws.toISOString().slice(0,10);
    } else {
      _calMonth.m -= 1;
      if (_calMonth.m < 0){ _calMonth.m = 11; _calMonth.y -= 1; }
    }
    renderCalendario();
  };
  document.getElementById("_cal_next").onclick = () => {
    if (_calView === "semana"){
      const ws = new Date(_calWeekStart + "T00:00:00");
      ws.setDate(ws.getDate() + 7);
      _calWeekStart = ws.toISOString().slice(0,10);
    } else {
      _calMonth.m += 1;
      if (_calMonth.m > 11){ _calMonth.m = 0; _calMonth.y += 1; }
    }
    renderCalendario();
  };

  const grid = document.getElementById("_cal_grid");
  // Header de dias da semana — segunda primeiro na vista semana, domingo na mês
  if (_calView === "semana"){
    ["S","T","Q","Q","S","S","D"].forEach(d => {
      grid.appendChild(el(`<div class="cal-dow">${d}</div>`));
    });
  } else {
    ["D","S","T","Q","Q","S","S"].forEach(d => {
      grid.appendChild(el(`<div class="cal-dow">${d}</div>`));
    });
  }

  const todayK = dayKeyLocal(new Date());
  // Cores por evento (escopo elevado pra ambas vistas usarem)
  function evColor(e){
    if (e.kind === "laudo"){
      if (e.status === "concluido") return "#34D399";
      if (e.status === "em_andamento") return "#3B82F6";
      if (e.status === "cancelado") return "#9CA3AF";
      return "#FBBF24"; // pendente = amarelo
    }
    return "#A78BFA"; // agenda = roxo claro (era var(--pk-accent) igual ao pendente)
  }

  const cur = new Date(startGrid);
  while (cur <= endGrid){
    const k = dayKeyLocal(cur);
    const inMonth = _calView === "semana" ? true : (cur.getMonth() === _calMonth.m);
    const evs = byDay[k] || [];
    const cls = [
      "cal-cell",
      !inMonth ? "muted" : "",
      k === todayK ? "today" : "",
      k === _calSelDay ? "sel" : "",
      evs.length && inMonth ? "has" : "",
    ].filter(Boolean).join(" ");

    let cellHtml;
    if (_calView === "semana"){
      // Vista semanal: cell maior, mostra até 5 eventos inline com hora+tipo
      const items = evs.slice(0,5).sort((a,b) => new Date(a.when) - new Date(b.when)).map(e => {
        const hora = new Date(e.when).toLocaleTimeString("pt-BR",{ hour:"2-digit", minute:"2-digit" });
        const tlabel = (TIPOS[e.tipo] && TIPOS[e.tipo].label) || e.tipo || "";
        const who = e.cliente || e.obra || "-";
        const onlineTag = e.kind === "agenda" && e.online ? ` · <span style="color:#3B82F6;font-weight:700">ONLINE</span>` : "";
        return `<div class="we-it" style="border-left:3px solid ${evColor(e)};padding:2px 4px;margin:2px 0;background:var(--pk-card1);border-radius:0;font-size:9.5px;line-height:1.25;text-align:left;overflow:hidden">
          <div style="color:var(--pk-accent);font-weight:600">${hora} · ${esc(tlabel)}${onlineTag}</div>
          <div style="color:var(--pk-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(who)}</div>
          ${e.kind === "agenda" ? tagChipsHtml(e.tags, 8.5) : ""}
        </div>`;
      }).join("");
      const more = evs.length > 5 ? `<div class="more" style="font-size:9px;color:var(--pk-accent);margin-top:2px">+${evs.length - 5} mais</div>` : "";
      cellHtml = `<div class="d" style="display:flex;justify-content:space-between;align-items:center">
          <span>${cur.getDate()}</span>
          ${evs.length ? `<span style="font-size:9px;color:var(--pk-text-muted)">${evs.length}</span>` : ""}
        </div>
        ${items}${more}`;
    } else {
      const dotsHtml = evs.slice(0,4).map(e => `<span class="dot" style="background:${evColor(e)}"></span>`).join("");
      const more = evs.length > 4 ? `<div class="more">+${evs.length - 4}</div>` : "";
      cellHtml = `<div class="d">${cur.getDate()}</div>
        <div class="dots">${dotsHtml}</div>
        ${more}`;
    }
    const cell = el(`<button class="${cls}" data-day="${k}" style="${_calView==='semana'?'min-height:140px;align-items:stretch;justify-content:flex-start;padding:6px':''}">
      ${cellHtml}
    </button>`);
    cell.onclick = () => { _calSelDay = k; renderCalendario(); };
    grid.appendChild(cell);
    cur.setDate(cur.getDate() + 1);
  }

  // Lista do dia selecionado
  const selEvs = (byDay[_calSelDay] || []).sort((a,b) => new Date(a.when) - new Date(b.when));
  const selDate = new Date(_calSelDay + "T12:00:00");
  const selLabel = selDate.toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "long" });

  root.appendChild(el(`<div class="sect-h"><div class="t">${esc(selLabel)}</div><div class="n">${selEvs.length} item(ns)</div></div>`));

  if (!selEvs.length){
    root.appendChild(el(`<div class="card"><div class="small center">Nenhuma visita ou laudo agendado pra esse dia.</div></div>`));
  } else {
    for (const e of selEvs){
      const tipoLabel = (TIPOS[e.tipo] && TIPOS[e.tipo].label) || e.tipo || "-";
      const hora = new Date(e.when).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
      let color = "var(--pk-accent)", labelKind = "Agenda";
      if (e.kind === "laudo"){
        if (e.status === "concluido"){ color = "#34D399"; labelKind = "Concluído"; }
        else if (e.status === "em_andamento"){ color = "#3B82F6"; labelKind = "Em andamento"; }
        else if (e.status === "cancelado"){ color = "#9CA3AF"; labelKind = "Cancelado"; }
        else { color = "#FBBF24"; labelKind = "Pendente"; }
      }
      const fiscalLine = _isAdmin && e.fiscal_nome ? ` · ${esc(e.fiscal_nome)}` : "";
      const modLine = e.kind === "agenda" ? (e.online ? ` · <span style="color:#3B82F6;font-weight:700">ONLINE</span>` : " · Presencial") : "";
      const c = el(`<div class="lcard">
        <div class="ldot" style="background:${color}"></div>
        <div class="lbody">
          <div class="lcli">${esc(e.cliente || e.obra || "-")}</div>
          <div class="lsub">${hora} · ${esc(tipoLabel)} · ${labelKind}${modLine}${fiscalLine}</div>
          ${e.kind === "agenda" && e.endereco ? `<div class="lsub" style="color:var(--pk-text-dim)">${esc(e.endereco)}</div>${endAcoesHtml(e.endereco)}` : ""}
          ${e.kind === "agenda" && e.notas ? `<div class="lsub" style="color:var(--pk-text);white-space:pre-wrap">${esc(e.notas)}</div>` : ""}
          ${e.kind === "agenda" ? tagChipsHtml(e.tags, 10) : ""}
          ${e.kind === "agenda" ? anexosBtnHtml(e.attachments) : ""}
        </div>
        ${e.kind === "agenda" ? `<button data-edit-tags style="width:auto;font-size:11px;font-weight:600;padding:3px 8px;border-radius:4px;cursor:pointer;border:1px dashed #8A7350;background:transparent;color:#8A7350;flex-shrink:0;align-self:center">+ tag</button>` : ""}
        <div class="larrow">›</div>
      </div>`);
      const btnTags = c.querySelector("[data-edit-tags]");
      if (btnTags) btnTags.onclick = (ev) => {
        ev.stopPropagation();
        abrirEditorTags(e, () => renderCalendario());
      };
      // QUE FAZ: liga o botao "Documentos (N)" deste card do dia ao visor
      // fullscreen de anexos (mesmo padrao dos outros 2 pontos da agenda)
      wireAnexosBtn(c, e.attachments);
      c.onclick = () => {
        if (e.kind === "laudo") renderEditarLaudo(e.id);
        else renderNovoLaudo({ agenda_id: e.id, card_id: e.card_id, obra: e.obra, cliente: e.cliente, tipo: e.tipo });
      };
      root.appendChild(c);
    }
  }

  // Botão "+ Novo laudo" no fim
  root.appendChild(el(`<div style="margin-top:14px"><button class="primary" id="_cal_novo">+ Novo laudo</button></div>`));
  document.getElementById("_cal_novo").onclick = () => renderNovoLaudo(null);
}

function _obraPickerMount(sel, cards){
  // Troca o select nativo (pequeno demais no celular) por lista de botões grandes.
  // O select fica escondido por baixo: value + evento change continuam funcionando.
  if (!sel) return;
  sel.style.display = "none";
  const lblCode = (c) => {
    const code = ((c && c.obra) || "").trim();
    return /^[A-Z]{2,6}-?\d{2,}$/i.test(code) ? code : "";
  };
  const nomeDe = (c) => (c && (c.title || (c.details && c.details.cliente))) || "-";
  const wrap = document.createElement("div");
  let termo = "";
  const paintLista = () => {
    const box = wrap.querySelector("[data-lista]");
    if (!box) return;
    const t = termo.trim().toLowerCase();
    const lista = t
      ? cards.filter(c => `${nomeDe(c)} ${(c.obra || "")}`.toLowerCase().includes(t))
      : cards;
    box.innerHTML = lista.length === 0
      ? `<div class="small" style="color:var(--pk-text-muted); padding:12px 2px;">${cards.length === 0 ? "Nenhuma obra vinculada a você." : "Nenhuma obra com esse nome."}</div>`
      : lista.map(c => `
          <button type="button" data-cid="${c.id}" style="text-align:left; padding:14px; cursor:pointer; background:transparent; border:1px solid var(--pk-border1); color:var(--pk-text); width:100%; box-sizing:border-box;">
            <div style="font-size:14.5px; font-weight:600; line-height:1.35; word-break:break-word;">${esc(nomeDe(c))}</div>
            ${lblCode(c) ? `<div class="small" style="color:var(--pk-text-muted); margin-top:3px; letter-spacing:0.08em;">${esc(lblCode(c))}</div>` : ""}
          </button>`).join("");
    box.querySelectorAll("[data-cid]").forEach(b => {
      b.onclick = () => {
        sel.value = b.dataset.cid; sel.dispatchEvent(new Event("change", { bubbles: true })); paint();
      };
    });
  };
  const paint = () => {
    if (sel.value){
      const c = cards.find(x => x.id === sel.value);
      wrap.innerHTML = `
        <div style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
          <div style="min-width:0;">
            <div class="small" style="letter-spacing:0.18em; color:var(--pk-text-muted); margin-bottom:4px;">OBRA</div>
            <div style="font-size:14.5px; font-weight:600; line-height:1.35; word-break:break-word;">${esc(nomeDe(c))}</div>
            ${lblCode(c) ? `<div class="small" style="color:var(--pk-text-muted); margin-top:2px; letter-spacing:0.08em;">${esc(lblCode(c))}</div>` : ""}
          </div>
          <button type="button" data-trocar style="flex-shrink:0; padding:8px 12px; cursor:pointer; background:transparent; border:1px dashed var(--pk-border1); color:var(--pk-text-dim); font-size:10px; letter-spacing:0.12em; font-family:'IBM Plex Mono',monospace;">TROCAR</button>
        </div>`;
      wrap.querySelector("[data-trocar]").onclick = () => {
        sel.value = ""; sel.dispatchEvent(new Event("change", { bubbles: true })); paint();
      };
    } else {
      wrap.innerHTML = `
        <div class="small" style="letter-spacing:0.18em; color:var(--pk-text-muted); margin-bottom:10px;">QUAL OBRA?</div>
        ${cards.length > 3 ? `<input type="search" data-busca placeholder="Buscar obra pelo nome…" style="width:100%; box-sizing:border-box; padding:11px 12px; margin-bottom:10px; background:var(--pk-bg); border:1px solid var(--pk-border1); color:var(--pk-text); font-size:13px; font-family:inherit; outline:none;">` : ""}
        <div data-lista style="display:flex; flex-direction:column; gap:8px;"></div>`;
      const busca = wrap.querySelector("[data-busca]");
      if (busca){ busca.value = termo; busca.oninput = () => { termo = busca.value; paintLista(); }; }
      paintLista();
    }
  };
  sel._pickerPaint = paint;
  sel.insertAdjacentElement("afterend", wrap);
  paint();
}

// Avisos e confirmações com cara de app — nada de popup nativo do navegador
function _appToast(msg){
  const old = document.getElementById("_pkToast");
  if (old) old.remove();
  const t = document.createElement("div");
  t.id = "_pkToast";
  t.style.cssText = "position:fixed; left:16px; right:16px; bottom:calc(84px + env(safe-area-inset-bottom,0px)); z-index:99999; background:var(--pk-card,#16150f); border:1px solid var(--pk-border1,#3a382f); color:var(--pk-text,#e8e4da); padding:13px 16px; font-size:12.5px; line-height:1.5; box-shadow:0 8px 30px rgba(0,0,0,0.45); cursor:pointer;";
  t.textContent = msg;
  t.onclick = () => t.remove();
  document.body.appendChild(t);
  setTimeout(() => { if (t.isConnected) t.remove(); }, 4500);
}
function _appConfirm(msg, okLabel, cor){
  cor = cor || "#4a7c59";
  return new Promise((res) => {
    const ov = document.createElement("div");
    ov.style.cssText = "position:fixed; inset:0; z-index:99998; background:rgba(0,0,0,0.55); display:flex; align-items:center; justify-content:center; padding:24px;";
    ov.innerHTML = `
      <div style="width:100%; max-width:340px; background:var(--pk-card,#16150f); border:1px solid var(--pk-border1,#3a382f); padding:18px 16px; display:flex; flex-direction:column; gap:14px;">
        <div data-msg style="font-size:13px; color:var(--pk-text,#e8e4da); line-height:1.55;"></div>
        <div style="display:flex; gap:8px;">
          <button data-ok style="flex:1; padding:12px 10px; background:${cor}; border:none; color:#fff; cursor:pointer; font-size:10.5px; letter-spacing:0.16em; text-transform:uppercase; font-family:'IBM Plex Mono',monospace; font-weight:600;">${okLabel || "Confirmar"}</button>
          <button data-no style="padding:12px 14px; background:transparent; border:1px solid var(--pk-border1,#3a382f); color:var(--pk-text-dim,#a8a396); cursor:pointer; font-size:10.5px; letter-spacing:0.16em; text-transform:uppercase; font-family:'IBM Plex Mono',monospace;">Voltar</button>
        </div>
      </div>`;
    ov.querySelector("[data-msg]").textContent = msg;
    const done = (v) => { ov.remove(); res(v); };
    ov.onclick = (ev) => { if (ev.target === ov) done(false); };
    ov.querySelector("[data-ok]").onclick = (ev) => { ev.stopPropagation(); done(true); };
    ov.querySelector("[data-no]").onclick = (ev) => { ev.stopPropagation(); done(false); };
    document.body.appendChild(ov);
  });
}

function _confirmInline(btn, msg, okLabel, cor, onOk){
  if (btn._confirmOpen) return;
  btn._confirmOpen = true;
  btn.style.display = "none";
  const wrap = document.createElement("div");
  wrap.style.cssText = `flex:1; display:flex; flex-direction:column; gap:7px; padding:9px 11px; border:1px solid ${cor}; background:rgba(0,0,0,0.18);`;
  wrap.innerHTML = `
    <div style="font-size:10.5px; color:var(--pk-text-dim); line-height:1.45;">${msg}</div>
    <div style="display:flex; gap:6px;">
      <button data-ok style="flex:1; padding:9px 10px; background:${cor}; border:none; color:#fff; cursor:pointer; font-size:10px; letter-spacing:0.16em; text-transform:uppercase; font-family:'IBM Plex Mono',monospace; font-weight:600;">${okLabel}</button>
      <button data-no style="padding:9px 12px; background:transparent; border:1px solid var(--pk-border1); color:var(--pk-text-dim); cursor:pointer; font-size:10px; letter-spacing:0.16em; text-transform:uppercase; font-family:'IBM Plex Mono',monospace;">Voltar</button>
    </div>`;
  wrap.onclick = (ev) => ev.stopPropagation();
  btn.insertAdjacentElement("afterend", wrap);
  wrap.querySelector("[data-ok]").onclick = (ev) => { ev.stopPropagation(); wrap.remove(); onOk(); };
  wrap.querySelector("[data-no]").onclick = (ev) => { ev.stopPropagation(); wrap.remove(); btn.style.display = ""; btn._confirmOpen = false; };
}

async function _marcarObraConcluida(cid, concluir){
  // Via gestão: além da flag no card, entrega/restaura TODOS os itens da lista.
  try {
    const r = await fetchGestao(`${GESTAO_API}/api/fiscal/obra/${cid}/concluir`, {
      method: "POST",
      // X-User-Email identifica o fiscal pro backend checar o escopo (obra de outro fiscal = 403)
      headers: { "Content-Type": "application/json", "X-User-Email": (_user && _user.email) || "" },
      body: JSON.stringify({ concluir, fiscal_nome: (_fiscal && _fiscal.nome) || "fiscal" }),
    });
    if (r.status === 403){
      // Escopo: obra vinculada a outro fiscal. NÃO cai no fallback (gravaria a flag mesmo assim).
      let msg = "Essa obra está com outro fiscal. Confira com a gestão antes de concluir.";
      try { msg = (await r.json()).detail || msg; } catch(_){}
      _appToast(msg);
      return;
    }
    if (!r.ok) throw new Error("HTTP " + r.status);
    renderHoje();
    return;
  } catch(_) { /* gestão fora do ar → pelo menos a flag no card (comportamento antigo) */ }
  const { data: card } = await sb.from("kanban_cards").select("details").eq("id", cid).maybeSingle();
  const details = { ...((card && card.details) || {}) };
  if (concluir){
    details.obra_concluida = { por: (_fiscal && _fiscal.nome) || "fiscal", em: new Date().toISOString() };
  } else {
    delete details.obra_concluida;
  }
  const { error } = await sb.from("kanban_cards").update({ details }).eq("id", cid);
  if (error){ _appToast("Não deu pra salvar: " + error.message); return; }
  renderHoje();
}

// ─── HOJE: obras do fiscal (responsabilidade) com progresso e evolução ────────
async function renderHoje(){
  try { if (_rtChannel){ sb.removeChannel(_rtChannel); _rtChannel = null; } } catch(_){}
  const root = document.getElementById("root");
  if (!root) return;
  const meId = _isAdmin ? _operandoComoId : (_fiscal && _fiscal.id);
  root.innerHTML = `<div class="card center"><span class="spinner"></span><div class="small" style="margin-top:8px">Carregando suas obras…</div></div>`;
  renderBottomNav(); setActiveNav("hoje");
  if (!meId){
    root.innerHTML = `<div class="card"><div class="err">Faça login pra ver suas obras.</div></div>`;
    return;
  }
  // 1) Cards onde eu sou fiscal responsável — dois formatos coexistem:
  //    (a) details.fiscais = [{id: uuid, nome: "..."}]  (formato novo, minoria)
  //    (b) details.fiscal  = "DAVI" / "ALVARO/CRISTIANO"  (formato legado, maioria)
  //    Nome do fiscal_equipe pode ter trailing space e case variado — normaliza.
  const meuNome = (_fiscal && _fiscal.nome ? _fiscal.nome : "").trim();
  const firstName = meuNome.split(/\s+/)[0] || "";
  const [{ data: kcA, error: eA }, { data: kcB, error: eB }] = await Promise.all([
    sb.from("kanban_cards")
      .select("id, title, obra, column_id, progress, details")
      .contains("details->fiscais", JSON.stringify([{ id: meId }])),
    firstName
      ? sb.from("kanban_cards")
          .select("id, title, obra, column_id, progress, details")
          .ilike("details->>fiscal", `%${firstName}%`)
      : Promise.resolve({ data: [], error: null }),
  ]);
  const err0 = eA || eB;
  if (err0){ root.innerHTML = erroTelaHtml(err0.message); return; }
  const seen = new Map();
  [...(kcA || []), ...(kcB || [])].forEach(c => { if (!seen.has(c.id)) seen.set(c.id, c); });
  let cards = Array.from(seen.values());
  // Filtra pra manter só as obras que já entraram no gestão (gestao.projetos por card_id).
  // Se o gestão estiver fora do ar, cai no comportamento antigo (mostra tudo).
  let _gestaoByCard = {};
  try {
    const rGe = await fetchGestao(`${GESTAO_API}/api/fiscal/obras-no-gestao`, {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ card_ids: cards.map(c => c.id) }),
    });
    if (rGe.ok) {
      _gestaoByCard = await rGe.json();
      cards = cards.filter(c => _gestaoByCard[c.id]);
    }
  } catch(_) {}
  if (cards.length === 0){
    root.innerHTML = `
      <div style="padding:18px 16px 24px;">
        <h2 style="font-family:'Cinzel',serif; font-size:20px; letter-spacing:0.08em; margin:0 0 4px;">Minhas obras</h2>
        <p class="small" style="color:var(--pk-text-muted); letter-spacing:0.22em; margin:0 0 16px;">0 OBRAS NO GESTÃO</p>
        <div class="card center" style="color:var(--pk-text-muted); padding:32px 18px;">Nenhuma obra sua entrou no gestão ainda.</div>
      </div>`;
    return;
  }
  const cardIds = cards.map(c => c.id);
  const obraCodes = cards.map(c => c.obra).filter(Boolean);
  // Buscas 2-6 + pendências de validação em PARALELO: são independentes entre si
  // (todas dependem só da lista de cards já filtrada). Em série a home somava as
  // latências uma a uma; em 4G isso era o grosso da espera do fiscal.
  const [
    _valByCard,       // validação: envios do instalador esperando veredito (batch, gestão fora do ar = sem o bloco)
    { data: laudos }, // 2) Laudos (count + últimos updates)
    { data: checkins }, // 3) Check-ins do instalador (pulso mais frequente)
    { data: servicos }, // 4) Serviços contratados (pra calcular progresso via qtd instalada)
    { data: itens },    // 5) Itens instalados (qtd concluída)
    ocorrIniciais,      // 6) Ocorrências abertas do instalador (o fiscal resolve por aqui)
  ] = await Promise.all([
    (async () => {
      try {
        const rVal = await fetchGestao(`${GESTAO_API}/api/fiscal/validacao/pendencias`, {
          method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ card_ids: cardIds }),
        });
        if (rVal.ok) return await rVal.json();
      } catch(_) {}
      return {};
    })(),
    sb.from("fiscal_laudos")
      .select("id, card_id, tipo, status, updated_at, created_at, data_vistoria")
      .in("card_id", cardIds),
    sb.from("instala_checkins")
      .select("id, card_id, created_at")
      .in("card_id", cardIds)
      .order("created_at", { ascending: false })
      .limit(500),
    obraCodes.length
      ? sb.from("prestadores_obra_servicos")
          .select("id, obra_id, contrato_qtd").in("obra_id", obraCodes)
      : Promise.resolve({ data: [] }),
    sb.from("instala_item_checks")
      .select("id, servico_id, card_id, qtd_concluida, created_at")
      .in("card_id", cardIds)
      .order("created_at", { ascending: false })
      .limit(1000),
    (async () => {
      try {
        const { data: oc } = await sb.from("instala_ocorrencias")
          .select("id, card_id, tipo, descricao, foto_url, audio_url, prestador_nome, created_at")
          .in("card_id", cardIds)
          .eq("status", "aberta")
          .order("created_at", { ascending: false })
          .limit(50);
        return oc || [];
      } catch(_) { return []; }
    })(),
  ]);
  // Mutável: o "Resolver" da lista remove a ocorrência sem rebuscar tudo.
  let _ocorrAbertas = ocorrIniciais;

  // Agrega
  const laudosPorCard = new Map();
  (laudos || []).forEach(l => {
    if (!laudosPorCard.has(l.card_id)) laudosPorCard.set(l.card_id, []);
    laudosPorCard.get(l.card_id).push(l);
  });
  const checkinsPorCard = new Map();
  (checkins || []).forEach(c => {
    if (!checkinsPorCard.has(c.card_id)) checkinsPorCard.set(c.card_id, []);
    checkinsPorCard.get(c.card_id).push(c);
  });
  const itensPorCard = new Map();
  (itens || []).forEach(it => {
    if (!itensPorCard.has(it.card_id)) itensPorCard.set(it.card_id, []);
    itensPorCard.get(it.card_id).push(it);
  });
  // Progresso por obra: sum(qtd_concluida) / sum(contrato_qtd) — igual view instalador
  const servicosPorObra = new Map();
  (servicos || []).forEach(s => {
    servicosPorObra.set(s.obra_id, (servicosPorObra.get(s.obra_id) || 0) + Number(s.contrato_qtd || 0));
  });
  const instaladoPorCard = new Map();
  (itens || []).forEach(it => {
    instaladoPorCard.set(it.card_id, (instaladoPorCard.get(it.card_id) || 0) + Number(it.qtd_concluida || 0));
  });

  const fmtRel = (dtStr) => {
    if (!dtStr) return "sem atividade";
    const dt = new Date(dtStr);
    const diff = Date.now() - dt.getTime();
    const min = Math.round(diff / 60000);
    if (min < 1) return "agora";
    if (min < 60) return `há ${min} min`;
    const h = Math.round(min / 60);
    if (h < 24) return `há ${h}h`;
    const d = Math.round(h / 24);
    if (d < 30) return `há ${d}d`;
    return dt.toLocaleDateString("pt-BR", { day:"2-digit", month:"short" });
  };

  const enriched = cards.map(c => {
    const ls = laudosPorCard.get(c.id) || [];
    const cs = checkinsPorCard.get(c.id) || [];
    const its = itensPorCard.get(c.id) || [];
    const contrato = servicosPorObra.get(c.obra) || 0;
    const instalado = instaladoPorCard.get(c.id) || 0;
    const _g = _gestaoByCard[c.id];
    const concluidaManual = !!((c.details || {}).obra_concluida);
    // % oficial vem do gestão (pct ponderado por qtd instalada); fallback pro cálculo antigo
    const pct = concluidaManual ? 100 : (_g && Number(_g.n_total) > 0)
      ? Math.min(100, Math.round(Number(_g.pct_completo)))
      : contrato > 0
      ? Math.min(100, Math.round((instalado / contrato) * 100))
      : (c.progress != null ? c.progress : 0);
    // Última atividade = max entre laudo update, checkin, item check
    const dates = [
      ...ls.map(l => l.updated_at || l.created_at),
      ...cs.map(c => c.created_at),
      ...its.map(i => i.created_at),
    ].filter(Boolean).map(x => new Date(x).getTime());
    const ultimaAtiv = dates.length ? new Date(Math.max(...dates)).toISOString() : null;
    const laudoEmAndamento = ls.find(l => l.status === "em_andamento");
    return {
      ...c,
      _nLaudos: ls.length,
      _nCheckins: cs.length,
      _nItens: its.length,
      _pct: pct,
      _ultima: ultimaAtiv,
      _laudoEmAnd: laudoEmAndamento,
      _concluidaManual: concluidaManual,
      _val: _valByCard[c.id] || null,
    };
  }).sort((a, b) => {
    // Menos evoluída em cima — as que vão terminando descem na lista
    if (a._pct !== b._pct) return a._pct - b._pct;
    const at = a._ultima ? new Date(a._ultima).getTime() : 0;
    const bt = b._ultima ? new Date(b._ultima).getTime() : 0;
    return bt - at;
  });

  // Índice de busca por obra (cliente/código/endereço/cidade/vendedor/arquiteto)
  const enrichedIdx = enriched.map(o => {
    const d = o.details || {};
    const bag = [
      o.title, o.obra,
      d.cliente, d.endereco, d.cidade,
      d.vendedor, d.responsavel_venda,
      d.arquiteto, d.arquiteta,
      d.telefone, d.telefone_cliente,
    ].filter(Boolean).join(" ").toLowerCase();
    return { o, bag };
  });

  const cardHtml = (o) => {
    const d = o.details || {};
    const cliente = o.title || d.cliente || "-";
    const endereco = d.endereco || "";
    const cidade = d.cidade || "";
    const telefone = d.telefone || d.telefone_cliente || "";
    const arquiteto = d.arquiteto || d.arquiteta || "";
    const vendedor = d.vendedor || d.responsavel_venda || "";
    const prazo = d.prazo_contratual || (d.prazo_inicio && d.prazo_fim ? `${d.prazo_inicio} a ${d.prazo_fim}` : (d.previsao_inicio || ""));
    // Prestador vinculado sempre visível no card; sem vínculo o botão âmbar
    // abre um seletor inline ali mesmo (vincula + marca principal)
    const _pr = _prestPrincipalDe(d.prestadores);
    const prestLinha = _pr.princ
      ? `<div style="display:flex; gap:6px; align-items:baseline; min-width:0;">
          <span class="small" style="letter-spacing:0.14em; color:var(--pk-text-muted); text-transform:uppercase; flex-shrink:0;">Prestador</span>
          <span style="font-size:12px; color:var(--pk-accent); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(_pr.princ.nome)}${_pr.total > 1 ? ` <span style=\"color:var(--pk-text-muted);font-weight:400\">+${_pr.total - 1}</span>` : ""}</span>
        </div>`
      : `<div class="prest-slot" data-cid="${o.id}" style="display:flex; gap:6px; align-items:center; min-width:0;">
          <span class="small" style="letter-spacing:0.14em; color:var(--pk-text-muted); text-transform:uppercase; flex-shrink:0;">Prestador</span>
          <button class="obra-btn" data-role="prestvinc" data-cid="${o.id}" style="width:auto; padding:4px 10px; background:rgba(251,191,36,0.10); border:1px solid rgba(251,191,36,0.5); color:#FBBF24; cursor:pointer; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; font-family:'IBM Plex Mono',monospace;">Escolher prestador</button>
        </div>`;
    const barCor = o._pct >= 100 ? "#4a7c59" : o._pct >= 50 ? "var(--pk-accent)" : "var(--pk-text-dim)";
    const chip = (label, valor) => valor
      ? `<div style="display:flex; gap:6px; align-items:baseline; min-width:0;">
          <span class="small" style="letter-spacing:0.14em; color:var(--pk-text-muted); text-transform:uppercase; flex-shrink:0;">${label}</span>
          <span style="font-size:12px; color:var(--pk-text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(valor)}</span>
        </div>` : "";
    return `<div class="obra-card" data-cid="${o.id}" style="background:var(--pk-card1); border:1px solid var(--pk-border1); padding:16px 18px; cursor:pointer; display:flex; flex-direction:column; gap:12px;">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px;">
        <div style="flex:1; min-width:0;">
          <div class="small" style="letter-spacing:0.18em; text-transform:uppercase; color:var(--pk-text-muted); margin-bottom:4px;">${esc(obraSemUuid(o.obra, o.title) || "SEM CÓDIGO")}</div>
          <div style="font-size:16px; font-weight:500; color:var(--pk-text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(cliente)}</div>
        </div>
        <div style="text-align:right; flex-shrink:0;">
          <div style="font-family:'Cinzel',serif; font-size:22px; font-weight:500; color:${barCor}; line-height:1;">${o._pct}%</div>
          <div class="small" style="letter-spacing:0.1em; color:var(--pk-text-muted); text-transform:uppercase;">concluído</div>
        </div>
      </div>
      <div style="display:flex; flex-direction:column; gap:5px; padding:10px 12px; background:rgba(150,132,115,0.06); border-left:2px solid var(--pk-accent);">
        ${endereco || cidade ? `<div style="display:flex; gap:6px; align-items:flex-start;">
          <span style="color:var(--pk-text-muted); flex-shrink:0; font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:0.1em;">LOCAL</span>
          <span style="font-size:12px; color:var(--pk-text-dim); line-height:1.4;">${esc(endereco || "")}${endereco && cidade ? " · " : ""}${esc(cidade || "")}</span>
        </div>${endAcoesHtml(endereco)}` : ""}
        ${telefone ? `<div style="display:flex; gap:6px; align-items:center;"><span style="color:var(--pk-text-muted); font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:0.1em;">TEL</span><a href="tel:${esc(telefone)}" style="font-size:12px; color:var(--pk-accent); text-decoration:none;" onclick="event.stopPropagation()">${esc(telefone)}</a></div>` : ""}
        ${chip("Arquiteto", arquiteto)}
        ${chip("Vendedor", vendedor)}
        ${chip("Prazo", prazo)}
        ${prestLinha}
      </div>
      <div style="height:6px; background:var(--pk-border1);">
        <div style="height:100%; width:${o._pct}%; background:${barCor}; transition:width .4s;"></div>
      </div>
      <div style="display:flex; gap:14px; flex-wrap:wrap; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.12em; color:var(--pk-text-dim); text-transform:uppercase;">
        <span>${o._nLaudos} LAUDO${o._nLaudos===1?"":"S"}</span>
        <span>${o._nCheckins} CHECK-IN${o._nCheckins===1?"":"S"}</span>
        <span>${o._nItens} ITEM${o._nItens===1?"":"S"}</span>
        <span style="margin-left:auto; color:var(--pk-text-muted);">${fmtRel(o._ultima)}</span>
      </div>
      ${o._val ? `<div class="obra-validar" data-cid="${o.id}" style="display:flex; align-items:center; gap:8px; padding:8px 10px; background:rgba(251,191,36,0.10); border:1px solid rgba(251,191,36,0.5); color:#FBBF24; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; font-family:'IBM Plex Mono',monospace; cursor:pointer;">
        <span style="font-weight:700;">${o._val.pendentes} PARA VALIDAR</span>
        ${o._val.finalizados_pendentes > 0 ? `<span>· ${o._val.finalizados_pendentes} FINALIZADO${o._val.finalizados_pendentes > 1 ? "S" : ""}</span>` : ""}
        <span style="margin-left:auto; text-transform:none; letter-spacing:0.04em;">${_pvEsperaTxt(o._val.mais_antigo_em)}</span>
      </div>` : ""}
      ${o._laudoEmAnd ? `<div style="padding:6px 10px; background:rgba(74,124,89,0.12); border:1px solid rgba(74,124,89,0.4); color:#4a7c59; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; font-family:'IBM Plex Mono',monospace;">▶ Vistoria em andamento (${esc(o._laudoEmAnd.tipo || "")})</div>` : ""}
      <div style="display:flex; gap:8px; padding-top:4px; border-top:1px solid var(--pk-border1);">
        <button class="obra-btn" data-role="lista" data-cid="${o.id}" style="flex:1; padding:8px 10px; background:transparent; border:1px solid var(--pk-border1); color:var(--pk-text); cursor:pointer; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; font-family:'IBM Plex Mono',monospace;">Lista</button>
        <button class="obra-btn" data-role="mapa" data-cid="${o.id}" data-mapa="${d.draw_mapa_id || ''}" style="flex:1; padding:8px 10px; background:transparent; border:1px solid var(--pk-border1); color:${d.draw_mapa_id ? 'var(--pk-text)' : 'var(--pk-text-muted)'}; cursor:${d.draw_mapa_id ? 'pointer' : 'not-allowed'}; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; font-family:'IBM Plex Mono',monospace;" ${d.draw_mapa_id ? '' : 'disabled'}>Mapa</button>
        ${o._concluidaManual
          ? `<button class="obra-btn" data-role="reabrir" data-cid="${o.id}" style="flex:1; padding:8px 10px; background:transparent; border:1px dashed var(--pk-border1); color:var(--pk-text-dim); cursor:pointer; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; font-family:'IBM Plex Mono',monospace;">↩ Reabrir</button>`
          : `<button class="obra-btn" data-role="terminou" data-cid="${o.id}" style="flex:1; padding:8px 10px; background:rgba(74,124,89,0.12); border:1px solid rgba(74,124,89,0.4); color:#4a7c59; cursor:pointer; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; font-family:'IBM Plex Mono',monospace;">Terminou</button>`}
      </div>
    </div>`;
  };

  // Agrupa por prontidão: concluídas / em execução / não iniciadas
  const bucketize = (lista) => {
    const concluidas = [], emExec = [], naoIni = [];
    lista.forEach(o => {
      if (o._pct >= 100) concluidas.push(o);
      else if (o._pct > 0) emExec.push(o);
      else naoIni.push(o);
    });
    return { concluidas, emExec, naoIni };
  };
  const groupHtml = (titulo, cor, items) => items.length === 0 ? "" : `
    <div style="margin-top:14px;">
      <div style="display:flex; align-items:baseline; gap:10px; margin-bottom:8px; padding:0 2px;">
        <span style="width:6px; height:6px; background:${cor}; border-radius:50%; align-self:center;"></span>
        <span style="font-family:'Cinzel',serif; font-size:12px; letter-spacing:0.18em; text-transform:uppercase; color:var(--pk-text);">${titulo}</span>
        <span class="small" style="color:var(--pk-text-muted); letter-spacing:0.14em; font-variant-numeric:tabular-nums;">${items.length}</span>
      </div>
      <div style="display:flex; flex-direction:column; gap:12px;">${items.map(cardHtml).join("")}</div>
    </div>`;

  const renderLista = (termo) => {
    const t = (termo || "").trim().toLowerCase();
    const filtrado = t
      ? enrichedIdx.filter(x => x.bag.includes(t)).map(x => x.o)
      : enriched;
    const box = document.getElementById("_pkObrasBox");
    const cnt = document.getElementById("_pkObrasCount");
    if (!box) return;
    if (filtrado.length === 0){
      box.innerHTML = `<div class="card center" style="color:var(--pk-text-muted); padding:24px 16px;">Nenhuma obra encontrada${t ? ` para "${esc(termo)}"` : ""}.</div>`;
    } else {
      const g = bucketize(filtrado);
      box.innerHTML = [
        groupHtml("Não iniciadas", "var(--pk-text-dim)", g.naoIni),
        groupHtml("Em execução", "var(--pk-accent)", g.emExec),
        groupHtml("Concluídas", "#4a7c59", g.concluidas),
      ].join("");
      box.querySelectorAll(".obra-card").forEach(el => {
        el.onclick = () => renderObraDetail(el.dataset.cid);
      });
      // Badge âmbar do card: abre a obra já rolando até a seção de validação
      box.querySelectorAll(".obra-validar").forEach(el => {
        el.onclick = (ev) => { ev.stopPropagation(); renderObraDetail(el.dataset.cid, { scrollValidacao: true }); };
      });
      box.querySelectorAll(".obra-btn").forEach(b => {
        b.onclick = (ev) => {
          ev.stopPropagation();
          const role = b.dataset.role;
          const cid = b.dataset.cid;
          if (role === "lista") return renderObraDetail(cid);
          // Vincular prestador direto do card da lista: troca o botão pelo
          // seletor inline; depois de vincular re-renderiza a lista inteira
          if (role === "prestvinc"){
            const slot = b.closest(".prest-slot");
            if (slot) _prestVincInline(slot, cid, () => renderHoje());
            return;
          }
          if (role === "terminou"){
            _confirmInline(b, "Marcar esta obra como terminada? Todos os itens da lista ficam concluídos, ela vai pra 100% e desce pra lista de concluídas.", "Sim, terminou", "#4a7c59", () => _marcarObraConcluida(cid, true));
            return;
          }
          if (role === "reabrir"){
            _confirmInline(b, "Reabrir a obra? O % volta a seguir o progresso real.", "↩ Sim, reabrir", "var(--pk-accent)", () => _marcarObraConcluida(cid, false));
            return;
          }
          if (role === "mapa"){
            const mid = b.dataset.mapa;
            if (mid) abrirVisorAnexos([{ url: `https://draw.parket.works/status/viewer/${mid}`, nome: "Mapa ao vivo" }], 0);
          }
        };
      });
    }
    if (cnt) cnt.textContent = `${filtrado.length} DE ${enriched.length} ${enriched.length===1?"OBRA":"OBRAS"}`;
  };

        <div>
          <h2 style="font-family:'Cinzel',serif; font-size:20px; letter-spacing:0.08em; margin:0 0 4px;">Obras</h2>

        </div>
        <button class="primary" id="_pkNovoLaudoBtn" style="padding:8px 14px; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; white-space:nowrap;">+ Novo laudo</button>

      <div id="_pkOcorrBox"></div>

          style="width:100%; box-sizing:border-box; padding:10px 34px 10px 32px; background:var(--pk-card1); border:1px solid var(--pk-border1); color:var(--pk-text); font-size:13px; font-family:inherit; outline:none;">

          style="display:none; position:absolute; right:8px; top:50%; transform:translateY(-50%); background:transparent; border:none; color:var(--pk-text-muted); cursor:pointer; font-size:16px; padding:2px 8px; line-height:1;">×</button>
      </div>
      <div id="_pkObrasBox"></div>
      <p class="small" style="margin-top:16px; text-align:center; color:var(--pk-text-muted); letter-spacing:0.1em;">
        Toque numa obra pra ver detalhes, criar laudo ou registrar vistoria.
      </p>
    </div>`;
  const cardById = new Map(cards.map(c => [c.id, c]));

  // Fila de validação cross-obra: o trabalho do dia do fiscal em 1 bloco no topo.
  // Cada linha = 1 obra com envios do instalador esperando veredito; toque abre
  // a obra já na seção de validação. Ordena por espera (mais antigo primeiro).
  const renderValBox = () => {
    const box = document.getElementById("_pkValBox");
    if (!box) return;
    const comPend = enriched.filter(o => o._val)
      .sort((a, b) => new Date(a._val.mais_antigo_em || 0) - new Date(b._val.mais_antigo_em || 0));
    if (!comPend.length){ box.innerHTML = ""; return; }
    const total = comPend.reduce((s, o) => s + o._val.pendentes, 0);
    box.innerHTML = `
      <div style="margin:2px 0 14px; border:1px solid rgba(251,191,36,0.5); background:rgba(251,191,36,0.06);">
        <div style="display:flex; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid rgba(251,191,36,0.25);">
          <span style="font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.18em; color:#FBBF24;">PARA VALIDAR</span>
          <span style="margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:700; color:#FBBF24; background:rgba(251,191,36,0.15); padding:2px 8px;">${total}</span>
        </div>
        ${comPend.map(o => {
          const v = o._val;
          const oLeg = obraSemUuid(o.obra, o.title);
          const lbl = `${oLeg ? oLeg + " · " : ""}${o.title || ""}`;

            <div style="flex:1; min-width:0;">
              <div style="font-size:12px; color:var(--pk-text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(lbl)}</div>
              <div class="small" style="margin-top:2px; color:var(--pk-text-dim);">
                ${v.pendentes} envio${v.pendentes > 1 ? "s" : ""}${v.finalizados_pendentes > 0 ? ` · ${v.finalizados_pendentes} item${v.finalizados_pendentes > 1 ? "s" : ""} finalizado${v.finalizados_pendentes > 1 ? "s" : ""} esperando seu OK` : ""}

        <div class="small" style="padding:8px 14px; color:var(--pk-text-muted);">Toque na obra pra ver as fotos e aprovar ou reprovar cada envio.</div>
      </div>`;
    box.querySelectorAll(".val-obra").forEach(elx => {

    });
  };
  renderValBox();

  const TIPO_OCORR = { material:"MATERIAL", execucao:"EXECUÇÃO", cliente:"CLIENTE", seguranca:"SEGURANÇA", outro:"OUTRO" };
  const renderOcorr = () => {
    const box = document.getElementById("_pkOcorrBox");
    if (!box) return;
    if (!_ocorrAbertas.length){ box.innerHTML = ""; return; }
    box.innerHTML = `
      <div style="margin:2px 0 14px; border:1px solid rgba(200,90,60,0.45); background:rgba(200,90,60,0.07);">
        <div style="display:flex; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid rgba(200,90,60,0.25);">
          <span style="font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.18em; color:#c85a3c;">OCORRÊNCIAS ABERTAS</span>
          <span style="margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:700; color:#c85a3c; background:rgba(200,90,60,0.15); padding:2px 8px;">${_ocorrAbertas.length}</span>
        </div>
        ${_ocorrAbertas.map(oc => {
          const c = cardById.get(oc.card_id);
          const obraLbl = c ? `${obraSemUuid(c.obra, c.title) ? obraSemUuid(c.obra, c.title) + " · " : ""}${c.title || ""}` : "-";
          const dt = new Date(oc.created_at).toLocaleDateString("pt-BR", { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" });
          return `
          <div style="padding:12px 14px; border-bottom:1px solid var(--pk-border1);">
            <div style="display:flex; justify-content:space-between; gap:8px; margin-bottom:4px;">
              <span class="small" style="letter-spacing:0.12em; text-transform:uppercase; color:var(--pk-text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(TIPO_OCORR[oc.tipo] || oc.tipo || "")} · ${esc(obraLbl)}</span>
              <span class="small" style="color:var(--pk-text-muted); white-space:nowrap;">${dt}</span>
            </div>
            <div style="font-size:13px; color:var(--pk-text); line-height:1.5; margin-bottom:8px;">${esc(oc.descricao || "")}</div>
            ${oc.audio_url ? `<div style="margin-bottom:8px;"><span class="small" style="color:var(--pk-text-dim); letter-spacing:0.1em;">ÁUDIO DO INSTALADOR</span><audio controls preload="none" src="${esc(oc.audio_url)}" style="display:block; width:100%; height:32px; margin-top:4px;"></audio></div>` : ""}
            <div style="display:flex; align-items:center; gap:10px;">
              <span class="small" style="color:var(--pk-text-dim);">${esc(oc.prestador_nome || "instalador")}</span>
              ${oc.foto_url ? `<a href="#" class="small ocorr-foto" data-foto="${esc(oc.foto_url)}" style="color:var(--pk-accent); text-decoration:none;">ver foto</a>` : ""}
              <button class="ocorr-resolver" data-oid="${oc.id}" style="margin-left:auto; padding:7px 12px; background:transparent; border:1px solid #4a7c59; color:#4a7c59; cursor:pointer; font-size:10px; letter-spacing:0.16em; font-family:'IBM Plex Mono',monospace;">RESOLVER</button>
            </div>
          </div>`;
        }).join("")}
      </div>`;
    // Foto da ocorrência no visor fullscreen do app (nunca aba nova)
    box.querySelectorAll(".ocorr-foto").forEach(a => {
      a.onclick = (ev) => { ev.preventDefault(); _pvVerMidia(a.dataset.foto, "foto"); };
    });
    box.querySelectorAll(".ocorr-resolver").forEach(btn => {
      btn.onclick = async () => {
        if (!(await _appConfirm("Marcar essa ocorrência como resolvida?", "Sim, resolvida"))) return;
        btn.disabled = true; btn.textContent = "SALVANDO…";
        const { error } = await sb.from("instala_ocorrencias").update({
          status: "resolvida",
          resolvida_por: fiscalAtualNome() || "fiscal",
          resolvida_em: new Date().toISOString(),
        }).eq("id", btn.dataset.oid);
        if (error){
          btn.disabled = false; btn.textContent = "RESOLVER";
          _appToast("Não deu pra resolver: " + (error.message || "erro"));
          return;
        }
        _ocorrAbertas = _ocorrAbertas.filter(o => o.id !== btn.dataset.oid);
        renderOcorr();
      };
    });
  };
  renderOcorr();
  renderLista("");
  const inp = document.getElementById("_pkObrasBusca");
  const clr = document.getElementById("_pkObrasBuscaClear");
  if (inp){
    inp.oninput = () => {
      renderLista(inp.value);
      if (clr) clr.style.display = inp.value ? "block" : "none";
    };
  }
  if (clr){
    clr.onclick = () => { if (inp){ inp.value = ""; inp.focus(); } renderLista(""); clr.style.display = "none"; };
  }
  const nlBtn = document.getElementById("_pkNovoLaudoBtn");
  if (nlBtn) nlBtn.onclick = () => renderNovoLaudo(null);
}

}

// Nota: as funções abaixo ainda se chamam *Placeholder por herança da Fase 1,
// mas são telas 100% funcionais (Iniciar e Ranking). Renomear tocaria o roteador,
// a bottom nav e os wrappers de histórico sem ganho real.
// ─── INICIAR: lista laudos/vistorias pendentes com botão INICIAR (geolocalização) ─
async function renderIniciarPlaceholder(){
  try { if (_rtChannel){ sb.removeChannel(_rtChannel); _rtChannel = null; } } catch(_){}
  const root = document.getElementById("root");
  if (!root) return;
  const meId = _isAdmin ? _operandoComoId : (_fiscal && _fiscal.id);
  root.innerHTML = `<div class="card center"><span class="spinner"></span><div class="small" style="margin-top:8px">Carregando…</div></div>`;
  renderBottomNav(); setActiveNav("iniciar");
  if (!meId){
    root.innerHTML = `<div class="card"><div class="err">Faça login pra ver suas vistorias.</div></div>`;
    return;
  }
  let q = sb.from("fiscal_laudos")
    .select("id, card_id, obra, cliente, endereco, tipo, status, data_agendamento, data_vistoria, iniciado_em")
    .eq("fiscal_id", meId)
    .neq("status", "concluido")
    .order("data_agendamento", { ascending: true, nullsFirst: false })
    .limit(80);
  const { data: laudos, error } = await q;
  if (error){ root.innerHTML = erroTelaHtml(error.message); return; }
  const emAndamento = (laudos || []).filter(l => l.iniciado_em);
  const pendentes   = (laudos || []).filter(l => !l.iniciado_em);
  const fmt = (l) => {
    const d = l.data_agendamento ? new Date(l.data_agendamento) : null;
    const dataStr = d ? d.toLocaleDateString("pt-BR", { weekday:"short", day:"2-digit", month:"short" }) : "sem data";
    const clickAttr = l.iniciado_em ? ` data-open="${l.id}" style="cursor:pointer;` : ` style="`;
    return `
      <div class="lc-row"${clickAttr}background:var(--pk-card1); border:1px solid var(--pk-border1); padding:14px 16px; display:flex; flex-direction:column; gap:12px;">
        <div>
          <div class="small" style="letter-spacing:0.18em; text-transform:uppercase; color:var(--pk-text-muted); margin-bottom:4px;">${esc(dataStr)} · ${esc(l.tipo || "")}</div>
          <div style="font-size:15px; font-weight:500; color:var(--pk-text); margin-bottom:2px;">${esc(l.cliente || l.obra || "-")}</div>
          ${l.endereco ? `<div class="small" style="color:var(--pk-text-dim)">${esc(l.endereco)}</div>${endAcoesHtml(l.endereco)}` : ""}
        </div>
        ${l.iniciado_em
          ? `<div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
              <div style="padding:8px 12px; background:rgba(74,124,89,0.12); border:1px solid rgba(74,124,89,0.4); color:#4a7c59; font-size:10px; letter-spacing:0.16em; text-transform:uppercase; font-family:'IBM Plex Mono',monospace; flex:1;">Vistoria em andamento</div>
              <button data-open="${l.id}" style="padding:8px 14px; background:var(--pk-text); color:var(--pk-bg); border:none; cursor:pointer; font-size:10px; letter-spacing:0.2em; font-family:'IBM Plex Mono',monospace; white-space:nowrap;">CONTINUAR ▸</button>
            </div>`
          : `<button class="btn-iniciar" data-id="${l.id}" style="align-self:flex-end; padding:8px 14px; background:var(--pk-text); color:var(--pk-bg); border:none; cursor:pointer; font-size:10px; letter-spacing:0.2em; font-family:'IBM Plex Mono',monospace;">▶ INICIAR</button>`}
      </div>`;
  };
  root.innerHTML = `
    <div style="padding:18px 16px 24px;">
      <h2 style="font-family:'Cinzel',serif; font-size:20px; letter-spacing:0.08em; margin:0 0 4px;">Iniciar vistoria</h2>
      <p class="small" style="color:var(--pk-text-dim); letter-spacing:0.14em; text-transform:uppercase; margin:0 0 20px;">Escolha uma vistoria e registre a chegada</p>
      ${emAndamento.length ? `
        <p class="small" style="color:var(--pk-text-muted); letter-spacing:0.22em; margin:0 0 10px;">EM ANDAMENTO · ${emAndamento.length}</p>
        <div style="display:flex; flex-direction:column; gap:10px; margin-bottom:24px;">${emAndamento.map(fmt).join("")}</div>` : ""}
      <p class="small" style="color:var(--pk-text-muted); letter-spacing:0.22em; margin:0 0 10px;">PRONTAS PRA INICIAR · ${pendentes.length}</p>
      ${pendentes.length === 0
        ? `<div class="card center" style="color:var(--pk-text-muted)">Nenhuma vistoria pendente. Bom trabalho.</div>`
        : `<div style="display:flex; flex-direction:column; gap:10px;">${pendentes.map(fmt).join("")}</div>`}
    </div>`;
  root.querySelectorAll(".btn-iniciar").forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.id;
      btn.disabled = true; btn.textContent = "PEGANDO LOCALIZAÇÃO…";
      try {
        const pos = await new Promise((res, rej) =>
          navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: true, timeout: 15000 })
        );
        btn.textContent = "SALVANDO…";
        const { error } = await sb.from("fiscal_laudos").update({
          iniciado_em: new Date().toISOString(),
          iniciado_lat: pos.coords.latitude,
          iniciado_lng: pos.coords.longitude,
          status: "em_andamento",
        }).eq("id", id);
        if (error) throw error;
        // Depois de iniciar, abre direto o laudo pra o fiscal preencher.
        renderEditarLaudo(id);
      } catch (e) {
        btn.disabled = false; btn.textContent = "▶ INICIAR";
        _appToast(e && e.code === 1
          ? "Permita o acesso à localização pra iniciar a vistoria."
          : "Não conseguimos sua localização. Verifique o GPS e tente de novo.");
      }
    };
  });
  // Cards já iniciados: clicar em qualquer lugar (ou no botão CONTINUAR) abre o laudo pra continuar.
  root.querySelectorAll("[data-open]").forEach(el => {
    el.onclick = (ev) => {
      ev.stopPropagation();
      renderEditarLaudo(el.dataset.open);
    };
  });
}

// ─── RANKING: fiscais ordenados por laudos concluídos ─────────────────────────
async function renderRankingPlaceholder(){
  try { if (_rtChannel){ sb.removeChannel(_rtChannel); _rtChannel = null; } } catch(_){}
  const root = document.getElementById("root");
  if (!root) return;
  const meId = _isAdmin ? _operandoComoId : (_fiscal && _fiscal.id);
  root.innerHTML = `<div class="card center"><span class="spinner"></span></div>`;
  renderBottomNav(); setActiveNav("mais");
  const [{ data: equipe }, { data, error }] = await Promise.all([
    sb.from("fiscal_equipe").select("id, nome").eq("ativo", true),
    sb.from("fiscal_laudos").select("fiscal_id, fiscal_nome").eq("status", "concluido"),
  ]);
  if (error){ root.innerHTML = erroTelaHtml(error.message); return; }
  // Todo fiscal ativo entra no ranking, mesmo zerado — os laudos só somam pontos.
  const contagem = new Map();
  (equipe || []).forEach(f => contagem.set(f.id, { id: f.id, nome: (f.nome || "-").trim(), total: 0 }));
  (data || []).forEach(r => {
    if (!r.fiscal_id) return;
    const cur = contagem.get(r.fiscal_id) || { id: r.fiscal_id, nome: r.fiscal_nome || "-", total: 0 };
    cur.total += 1;
    contagem.set(r.fiscal_id, cur);
  });
  const rows = Array.from(contagem.values()).sort((a, b) => b.total - a.total || a.nome.localeCompare(b.nome));
  const myPos = rows.findIndex(r => r.id === meId);
  root.innerHTML = `
    <div style="padding:18px 16px 24px;">
      <button onclick="voltarPagina()" style="background:transparent; border:1px solid var(--pk-border1); color:var(--pk-text-dim); padding:7px 12px; cursor:pointer; font-size:10px; letter-spacing:0.16em; font-family:'IBM Plex Mono',monospace; margin-bottom:14px;">← VOLTAR</button>
      <h2 style="font-family:'Cinzel',serif; font-size:20px; letter-spacing:0.08em; margin:0 0 4px;">Ranking</h2>
      <p class="small" style="color:var(--pk-text-dim); letter-spacing:0.14em; text-transform:uppercase; margin:0 0 20px;">Obras finalizadas por fiscal ${myPos >= 0 ? `· você em ${myPos + 1}º de ${rows.length}` : ""}</p>
      ${rows.length === 0
        ? `<div class="card center" style="color:var(--pk-text-muted)">Ainda não há laudos concluídos.</div>`
        : `<div style="display:flex; flex-direction:column; gap:8px;">
            ${rows.map((r, i) => {
              const pos = i + 1;
              const medal = `${pos}º`;
              const isMe = r.id === meId;
              return `<div style="display:flex; align-items:center; gap:12px; padding:14px 16px;
                background:${isMe ? "var(--pk-text)" : "var(--pk-card1)"};
                color:${isMe ? "var(--pk-bg)" : "var(--pk-text)"};
                border:1px solid ${isMe ? "var(--pk-text)" : "var(--pk-border1)"};">
                <div style="min-width:34px; text-align:center; font-family:'Cinzel',serif; font-size:${pos<=3?20:15}px;">${medal}</div>
                <div style="flex:1; min-width:0;">
                  <div style="font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(r.nome)}</div>
                  <div class="small" style="letter-spacing:0.1em; opacity:${isMe?0.85:0.65}; text-transform:uppercase;">Fiscal</div>
                </div>
                <div style="text-align:right;">
                  <div style="font-size:20px; font-weight:500;">${r.total}</div>
                  <div class="small" style="opacity:${isMe?0.85:0.65}; text-transform:uppercase; letter-spacing:0.1em;">obra${r.total===1?"":"s"}</div>
                </div>
              </div>`;
            }).join("")}
           </div>`}
      <div style="margin-top:22px; padding:12px 14px; border:1px dashed var(--pk-border1); font-size:10px; letter-spacing:0.1em; color:var(--pk-text-muted); line-height:1.6;">
        RANKING pelo total de obras finalizadas (laudos com status "concluído"). Quanto mais obra entregue, mais alto.
      </div>
