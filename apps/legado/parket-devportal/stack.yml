version: "3.9"
networks:
  network_public:
    external: true
services:
  devportal:
    image: parket-devportal:latest
    networks:
      - network_public
    volumes:
      - /root/Dashboardparketapp:/root/Dashboardparketapp
      - /root/parket-draw:/root/parket-draw
      - /root/parket-ai-squad:/root/parket-ai-squad
      - /root/parket-skills:/root/parket-skills
      - /root/.claude:/root/.claude:ro
      - /root/.config:/root/.config:ro
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      HOME: /root
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 512M
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_public"
        - "traefik.http.routers.devportal.rule=Host(`dev.parket.works`)"
        - "traefik.http.routers.devportal.entrypoints=websecure"
        - "traefik.http.routers.devportal.tls=true"
        - "traefik.http.routers.devportal.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.devportal.loadbalancer.server.port=8080"
        - "traefik.http.routers.devportal-http.rule=Host(`dev.parket.works`)"
        - "traefik.http.routers.devportal-http.entrypoints=web"
        - "traefik.http.routers.devportal-http.middlewares=https-redirect"
