<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#050505" id="_pk_theme_color">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Parket Fiscal">
<title>Parket Fiscal — Laudos</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<script>
  /* Pré-hidratação — evita flash de tema no carregamento. */
  (function(){
    try {
      var t = localStorage.getItem("parket-fiscal-theme");
      var mode = (t === "light" ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", mode);
      var m = document.getElementById("_pk_theme_color");
      if (m) m.setAttribute("content", mode === "light" ? "#D8D3C7" : "#050505");
    } catch(e){}
  })();
</script>

<style>
  /* ═════════════════════════════════════════════════════════════════════════
     Parket Fiscal (verifica.parket.works)
     Design alinhado ao PARKET_DESIGN_SYSTEM.md (SO Parket / Manual Navona)
       → src/app/components/parket/ParketClientHub.tsx (DARK/LIGHT scheme)

     Tipografia:
       - Cinzel (400-600) → títulos (SEMPRE uppercase, PARKET_DESIGN_SYSTEM.md)
       - Cinzel (400-600) → labels uppercase micro (categoria, tabs, badges)
       - Inter (300-600) → body

     Structural: cards sólidos, cantos retos, status badges tinted+border/44 alpha
     ═════════════════════════════════════════════════════════════════════════ */
  :root, :root[data-theme="dark"] {
    --pk-bg:#050505;
    --pk-panel:#030303;
    --pk-card1:#0B0B0B;
    --pk-card2:#101010;
    --pk-border1:#1F1F1F;
    --pk-border2:#2A2A2A;
    --pk-text:#D8D3C7;
    --pk-text-dim:#77736A;
    --pk-text-muted:#5F5D58;
    --pk-accent:#968473;
    --pk-accent-dim:#7A6B5C;
    --pk-status-ok:#968473;    --pk-status-ok-bg:rgba(150,132,115,0.09);
    --pk-status-run:#C8BDB1;   --pk-status-run-bg:rgba(216,211,199,0.05);
    --pk-status-warn:#C8922A;  --pk-status-warn-bg:rgba(185,130,42,0.10);
    --pk-status-mut:#5F5D58;   --pk-status-mut-bg:rgba(95,93,88,0.10);
    --pk-status-err:#9B4A5A;   --pk-status-err-bg:rgba(120,50,60,0.10);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    /* LIGHT alinhado ao Homebroker / valor / gestao / contrato — Sistema
       Operacional Parket (Manual de Marca Navona). Valores pré-misturados
       das opacidades canônicas sobre Bege Travertino pra garantir visual
       idêntico ao das outras apps Parket.
       bg #D8D3C7 · sidebar #CBC6BA · card #E7E3D9 · text #050505 · accent Walnut */
    --pk-bg:#D8D3C7;              /* Bege Travertino */
    --pk-panel:#CBC6BA;            /* Bege Travertino -15 lumens */
    --pk-card1:#E7E3D9;            /* cardBg = Off White Mineral @ 0.55 sobre bg */
    --pk-card2:#EFECE3;            /* cardHover = Off White Mineral @ 0.85 sobre bg */
    --pk-border1:#C3BEB4;          /* border = Preto Navona @ 0.10 sobre bg */
    --pk-border2:#A5A298;          /* borderHover = Preto Navona @ 0.24 sobre bg */
    --pk-text:#050505;             /* Preto Navona */
    --pk-text-dim:#77736A;         /* Cinza Pedra */
    --pk-text-muted:#8E8B83;       /* Preto Navona @ 0.35 sobre bg */
    --pk-accent:#60544D;           /* Walnut — accent light (mais contraste em bege) */
    --pk-accent-dim:#40362F;       /* Walnut escurecido */
    --pk-status-ok:#60544D;    --pk-status-ok-bg:rgba(96,84,77,0.10);
    --pk-status-run:#77736A;   --pk-status-run-bg:rgba(119,115,106,0.10);
    --pk-status-warn:#9E7238;  --pk-status-warn-bg:rgba(158,114,56,0.12);
    --pk-status-mut:#8E8B83;   --pk-status-mut-bg:rgba(5,5,5,0.05);
    --pk-status-err:#8E3D3D;   --pk-status-err-bg:rgba(142,61,61,0.10);
    color-scheme: light;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-synthesis-weight:none; }
  html, body {
    margin:0; padding:0;
    background:var(--pk-bg); color:var(--pk-text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    min-height:100vh; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    letter-spacing:0.02em;
  }

  /* Chat widget: FAB acima do bottom-nav (não sobrepor .bnav) */
  :root { --pk-fab-bottom: 88px; }

  /* ─── Header fixo ─────────────────── */
  #_pkHeader {
    position:sticky; top:0; z-index:100; background:var(--pk-panel);
    border-bottom:1px solid var(--pk-border1);
    padding:14px 20px 10px; display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  #_pkHeaderLeft { display:flex; flex-direction:column; gap:2px; }
  #_pkBrand { font-family:'Cinzel',serif; font-size:13px; font-weight:300; color:var(--pk-text); letter-spacing:0.42em; text-transform:uppercase; }
  #_pkSubtitle { font-family:'Cinzel',serif; font-size:9px; color:var(--pk-text-muted); letter-spacing:0.28em; text-transform:uppercase; margin-top:4px; }
  #_pkHeaderRight { display:flex; align-items:center; gap:8px; }
  #_pkThemeBtn {
    background:transparent; border:1px solid var(--pk-border1); color:var(--pk-text-dim);
    padding:7px 12px; font-family:'Cinzel',serif; font-size:9px; letter-spacing:0.22em; text-transform:uppercase;
    cursor:pointer; display:inline-flex; align-items:center; gap:6px; border-radius:0;
    width:auto;
  }
  #_pkThemeBtn:hover { color:var(--pk-text); border-color:var(--pk-border2); }
  #_pkThemeBtn svg { width:11px; height:11px; }
  /* Alturas iguais no header (chip do user × botão tema) */
  #_pkThemeBtn, #user_chip button { height:30px; box-sizing:border-box; }
  #user_chip { display:flex; align-items:center; }
  #user_chip .tag { display:inline-flex; align-items:center; height:22px; box-sizing:border-box; }
  @media (max-width:720px){
    #_pkHeader { padding:10px 12px 8px; gap:6px 8px; flex-wrap:wrap; }
    #_pkBrand { font-size:11px; letter-spacing:0.3em; }
    #_pkSubtitle { font-size:7.5px; letter-spacing:0.16em; margin-top:3px; }
    #_pkHeaderRight { gap:6px; flex:1; justify-content:flex-end; min-width:0; }
    #user_chip { min-width:0; }
    #user_chip .tag { font-size:8px; padding:2px 6px; margin-right:4px !important; flex-shrink:0; }
    #user_chip button { font-size:10px !important; padding:6px 8px !important; height:28px; white-space:nowrap; }
    #_pkThemeBtn { width:28px; height:28px; padding:0; justify-content:center; gap:0; flex-shrink:0; }
    #_pkThemeLabel { display:none; }

    /* Stats sem estourar o card */
    .wrap { padding:12px; }
    .stats-row { gap:6px; }
    .stat { padding:12px 4px; }
    .stat .n { font-size:22px; }
    .stat .l { font-size:8px; letter-spacing:0.08em; margin-top:6px; white-space:normal; line-height:1.4; }

    /* Nomes nos cards: quebra linha em vez de cortar */
    .lcard { padding:12px; gap:10px; }
    .lcard .lcli { white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
    .lcard .lsub { white-space:normal; letter-spacing:0.12em; }
  }

  /* .wrap agora só é wrapper interno */
  .wrap { max-width: 620px; margin: 0 auto; padding: 16px 20px; }
  .logo { display:none; }  /* legacy — Header agora é o #_pkHeader */
  .sub  { display:none; }

  /* ─── Tipografia hero (Cinzel serif — SO Parket) ───────────── */
  .h1 { font-family:'Cinzel','Georgia',serif; font-size:21px; font-weight:400; color:var(--pk-text); margin: 16px 0 8px; line-height:1.15; letter-spacing:0.10em;text-transform:uppercase; }
  .h2 { font-family:'Cinzel','Georgia',serif; font-size:15px; font-weight:400; color:var(--pk-text); margin: 16px 0 8px; line-height:1.2; letter-spacing:0.12em;text-transform:uppercase; }
  .sect-title, .sect-h .t, .label {
    font-family:'Cinzel',serif; font-size:10px; color:var(--pk-text-muted);
    letter-spacing:0.24em; text-transform:uppercase; font-weight:500;
  }
  .sect-title { margin:18px 0 10px; }
  .value { font-size: 14px; color:var(--pk-text); font-weight:400; margin-top:5px; letter-spacing:0.005em; }

  /* ─── Cards sólidos estilo Command Center ───────────────────────────── */
  .card { background:var(--pk-card1); border:1px solid var(--pk-border1); border-radius:0; padding:20px; margin-top:12px; }
  .scard { background:var(--pk-card1); border:1px solid var(--pk-border1); border-radius:0; padding:16px 18px; margin-bottom:8px; }
  .scard h3 { font-family:'Cinzel',serif; font-size:11px; margin:0 0 12px; color:var(--pk-text-muted); letter-spacing:0.24em; text-transform:uppercase; font-weight:500; }
  .scard .rowi { display:flex; justify-content:space-between; padding:10px 0; border-top:1px solid var(--pk-border1); font-size:13px; gap:8px; }
  .scard .rowi:first-of-type { border-top:none; padding-top:0; }
  .scard .rowi .k { color:var(--pk-text-dim); letter-spacing:0.02em; }
  .scard .rowi .v { color:var(--pk-text); font-weight:400; text-align:right; max-width:60%; letter-spacing:0.005em; }

  /* ─── Botões ─────────────────────────────────────────────────────────── */
  button, .btn {
    background:transparent; border:1px solid var(--pk-border1); color:var(--pk-text-dim);
    border-radius:0; padding:13px 18px; font-size:11px; font-weight:500; cursor:pointer; width:100%;
    text-align:center; letter-spacing:0.18em; text-transform:uppercase;
    font-family:'Inter',sans-serif; transition:border-color 120ms, color 120ms, background 120ms;
  }
  button:active { transform: scale(0.98); }
  button:hover { color:var(--pk-text); border-color:var(--pk-border2); }
  button.primary { background:var(--pk-accent); border-color:var(--pk-accent); color:var(--pk-bg); font-weight:500; letter-spacing:0.22em; font-size:12px; }
  button.primary:hover { background:var(--pk-accent-dim); border-color:var(--pk-accent-dim); color:var(--pk-bg); }
  button.danger  { background:transparent; border-color:var(--pk-status-err); color:var(--pk-status-err); }
  button.ghost   { background:transparent; border-color:var(--pk-border1); color:var(--pk-text-dim); }

  input, select, textarea {
    width:100%; background:var(--pk-card2); border:1px solid var(--pk-border1); color:var(--pk-text);
    border-radius:0; padding:12px 14px; font-size:14px; font-family:'Inter',sans-serif; letter-spacing:0.005em;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color:var(--pk-accent); background:var(--pk-card1); }

  .err { color:var(--pk-status-err); font-size:12px; margin-top:10px; letter-spacing:0.02em; }
  .ok  { color:var(--pk-status-ok); font-size:12px; margin-top:10px; letter-spacing:0.02em; }
  .small { font-size: 11px; color: var(--pk-text-dim); letter-spacing:0.02em; }
  .center { text-align:center; }

  .spinner { display:inline-block; width:18px; height:18px; border:2px solid var(--pk-border1); border-top-color:var(--pk-accent); border-radius:50%; animation:spin 700ms linear infinite; }
  @keyframes spin { to{ transform: rotate(360deg); } }
  hr { border:none; border-top: 1px solid var(--pk-border1); margin: 14px 0; }

  /* ─── Status badges — pattern exato do Command Center Obra ──────────── */
  .pill, .tag, .stage-pill, .badge-warn {
    display:inline-flex; align-items:center; gap:6px;
    padding:4px 10px; border-radius:0;
    font-family:'Cinzel',serif; font-size:10px; font-weight:500;
    letter-spacing:0.18em; text-transform:uppercase;
    border:1px solid transparent;
  }
  .pill { border-color:var(--pk-border1); color:var(--pk-text-dim); background:transparent; }
  .badge-warn { background:var(--pk-status-warn-bg); border-color:rgba(200,146,42,0.28); color:var(--pk-status-warn); }

  /* ─── Checklist / Rows ───────────────────────────────────────────────── */
  .ck-row { display:flex; flex-direction:column; gap:6px; padding:12px 0; border-top:1px solid var(--pk-border1); }
  .ck-row:first-child { border-top:none; padding-top:0; }
  .ck-q { font-size:14px; color:var(--pk-text); line-height:1.5; letter-spacing:0.005em; }
  .ck-btns { display:flex; gap:6px; }
  .ck-btn {
    flex:1; padding:10px 8px; border-radius:0; font-family:'Cinzel',serif; font-size:11px; font-weight:500; cursor:pointer;
    border:1px solid var(--pk-border1); background:transparent; color:var(--pk-text-dim);
    letter-spacing:0.20em; text-transform:uppercase;
  }
  .ck-btn.sim.on { background:var(--pk-status-ok-bg); border-color:rgba(150,132,115,0.36); color:var(--pk-status-ok); }
  .ck-btn.nao.on { background:var(--pk-status-err-bg); border-color:rgba(155,74,90,0.36); color:var(--pk-status-err); }
  .ck-btn.na.on  { background:var(--pk-status-mut-bg); border-color:rgba(95,93,88,0.36); color:var(--pk-status-mut); }
  .ck-obs { font-size: 12px; background:var(--pk-card2); border:1px solid var(--pk-border1); color:var(--pk-text); border-radius:0; padding:9px 12px; }

  .banner { padding:12px 14px; border-radius:0; font-family:'Cinzel',serif; font-size:10px; font-weight:500; text-align:center; margin-top:14px; letter-spacing:0.18em; text-transform:uppercase; border:1px solid; }
  .banner.warn { background:var(--pk-status-warn-bg); border-color:rgba(200,146,42,0.28); color:var(--pk-status-warn); }
  .banner.ok   { background:var(--pk-status-ok-bg); border-color:rgba(150,132,115,0.36); color:var(--pk-status-ok); }
  .banner.err  { background:var(--pk-status-err-bg); border-color:rgba(155,74,90,0.36); color:var(--pk-status-err); }

  /* ─── Bottom nav (mobile) ────────────────────────────────────────────── */
  body { padding-bottom: 76px; }
  .bnav {
    position:fixed; bottom:0; left:0; right:0;
    background:var(--pk-panel); backdrop-filter:blur(10px);
    border-top:1px solid var(--pk-border1);
    display:flex; justify-content:space-around; padding:10px 0 16px; z-index:90;
  }
  .bnav-item {
    display:flex; flex-direction:column; align-items:center; gap:4px;
    font-family:'Cinzel',serif; font-size:11px; color:var(--pk-text-muted);
    padding:8px 18px; cursor:pointer; font-weight:500; text-transform:uppercase; letter-spacing:0.24em;
    background:none; border:none; width:auto; border-radius:0;
  }
  .bnav-item.on { color:var(--pk-accent); }
  .bnav-item .ico { display:none; }

  /* ─── Jornada ────────────────────────────────────────────────────────── */
  .jh-tabs {
    display:flex; gap:0; margin-bottom:14px; background:transparent;
    border-bottom:1px solid var(--pk-border1); padding:0;
  }
  .jh-tab {
    flex:1; padding:13px 10px; text-align:center; font-family:'Cinzel',serif;
    font-size:11px; font-weight:500; color:var(--pk-text-muted); border-radius:0;
    cursor:pointer; border:none; background:transparent; width:auto;
    letter-spacing:0.22em; text-transform:uppercase;
    border-bottom:1px solid transparent; margin-bottom:-1px;
  }
  .jh-tab.on { color:var(--pk-accent); border-bottom-color:var(--pk-accent); }

  .obracard {
    background:var(--pk-card1); border:1px solid var(--pk-border1); border-radius:0;
    padding:14px 16px; margin-bottom:8px; cursor:pointer;
    display:flex; gap:12px; align-items:flex-start;
    transition:background 120ms, border-color 120ms;
  }
  .obracard:hover { background:var(--pk-card2); border-color:var(--pk-border2); }
  .obracard:active { background:var(--pk-card2); }
  .stage-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; margin-top:8px; }
  .obracard .info { flex:1; min-width:0; }
  .obracard .code { font-family:'Cinzel',serif; font-size:10px; color:var(--pk-accent); font-weight:500; letter-spacing:0.24em; text-transform:uppercase; }
  .obracard .cli  { font-family:'Cinzel',serif; font-size:13px; color:var(--pk-text); font-weight:400; margin-top:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; line-height:1.2; letter-spacing:0.08em;text-transform:uppercase; }
  .obracard .meta { font-size:12px; color:var(--pk-text-dim); margin-top:8px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; letter-spacing:0.005em; }

  .jheader {
    background:var(--pk-card1); border:1px solid var(--pk-border1); border-radius:0;
    padding:22px 20px; margin-bottom:16px;
  }
  .jheader .jh-code { font-family:'Cinzel',serif; font-size:10px; color:var(--pk-accent); font-weight:500; letter-spacing:0.28em; text-transform:uppercase; }
  .jheader .jh-cli  { font-family:'Cinzel',serif; font-size:19px; color:var(--pk-text); font-weight:400; margin-top:8px; letter-spacing:0.10em;text-transform:uppercase; line-height:1.15; }
  .jheader .jh-addr { font-size:12px; color:var(--pk-text-dim); margin-top:8px; letter-spacing:0.02em; line-height:1.5; }
  .jh-progress { margin-top:16px; }
  .jh-progress .lbl { display:flex; justify-content:space-between; font-family:'Cinzel',serif; font-size:10px; color:var(--pk-text-muted); margin-bottom:8px; text-transform:uppercase; letter-spacing:0.22em; }
  .jh-progress .bar  { height:2px; background:var(--pk-border1); border-radius:0; overflow:hidden; }
  .jh-progress .fill { height:100%; background:var(--pk-accent); border-radius:0; transition:width 0.5s; }

  .now-card, .next-visit {
    background:var(--pk-card1); border:1px solid var(--pk-border1); border-radius:0;
    padding:20px; margin-bottom:14px; cursor:pointer;
    transition:background 120ms;
  }
  .now-card:hover, .next-visit:hover { background:var(--pk-card2); }
  .now-card .pre, .next-visit .pre { font-family:'Cinzel',serif; font-size:10px; color:var(--pk-accent); letter-spacing:0.28em; text-transform:uppercase; font-weight:500; }
  .now-card .title, .next-visit .cli { font-family:'Cinzel',serif; font-size:16px; color:var(--pk-text); font-weight:400; margin-top:10px; letter-spacing:0.10em;text-transform:uppercase; line-height:1.2; }
  .next-visit .obra { font-size:12px; color:var(--pk-text-dim); margin-top:5px; letter-spacing:0.02em; }
  .next-visit .when { display:inline-block; margin-top:14px; padding:5px 12px; border-radius:0; background:var(--pk-status-ok-bg); border:1px solid rgba(150,132,115,0.36); color:var(--pk-status-ok); font-family:'Cinzel',serif; font-size:10px; font-weight:500; letter-spacing:0.20em; text-transform:uppercase; }
  .now-card .meta { display:flex; gap:16px; margin-top:14px; flex-wrap:wrap; }
  .now-card .mi { display:flex; flex-direction:column; gap:3px; }
  .now-card .ml { font-family:'Cinzel',serif; font-size:9px; color:var(--pk-text-muted); text-transform:uppercase; letter-spacing:0.24em; }
  .now-card .mv { font-size:13px; color:var(--pk-text); font-weight:400; letter-spacing:0.005em; }

  /* ─── Home stats — 3 colunas com números serif elegantes ──────────── */
  .stats-row { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px; }
  .stat { background:var(--pk-card1); border:1px solid var(--pk-border1); border-radius:0; padding:14px 8px; text-align:center; }
  .stat .n { font-family:'Cinzel',serif; font-size:26px; font-weight:400; color:var(--pk-text); line-height:1; letter-spacing:0.005em; font-variant-numeric: tabular-nums; }
  .stat .l { font-family:'Cinzel',serif; font-size:9px; color:var(--pk-text-muted); text-transform:uppercase; letter-spacing:0.24em; margin-top:10px; font-weight:500; }
  .stat.warn .n { color:var(--pk-status-warn); }
  .stat.info .n { color:var(--pk-text-dim); }
  .stat.ok   .n { color:var(--pk-accent); }
  /* .ok genérica (msg de sucesso, linha ~192) vazava margin/font pro card */
  .stat.ok { margin-top:0; font-size:inherit; letter-spacing:normal; color:inherit; }

  .sect-h { display:flex; align-items:center; justify-content:space-between; padding:0 4px; margin:22px 0 10px; }
  .sect-h .t { font-family:'Cinzel',serif; font-size:10px; color:var(--pk-text-muted); letter-spacing:0.24em; text-transform:uppercase; font-weight:500; }
  .sect-h .n { font-family:'Cinzel',serif; font-size:10px; color:var(--pk-text-muted); font-weight:500; font-variant-numeric:tabular-nums; letter-spacing:0.18em; }

  .lcard { background:var(--pk-card1); border:1px solid var(--pk-border1); border-radius:0; padding:12px 14px; margin-bottom:4px; cursor:pointer; display:flex; gap:12px; align-items:center; transition:background 120ms; }
  .lcard:hover { background:var(--pk-card2); }
  .lcard .lcli { font-family:'Cinzel',serif; font-size:12px; font-weight:400; color:var(--pk-text); line-height:1.25; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; letter-spacing:0.08em;text-transform:uppercase; }

  /* Toggle Sun/Moon — persiste em localStorage e reflete no <html data-theme>. */
  (function(){
    var btn   = document.getElementById("_pkThemeBtn");
    var icon  = document.getElementById("_pkThemeIcon");
    var label = document.getElementById("_pkThemeLabel");
    var meta  = document.getElementById("_pk_theme_color");
    var SUN  = '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>';
    var MOON = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
    function paint(){
      var mode = document.documentElement.getAttribute("data-theme") || "dark";
      if (icon)  icon.innerHTML   = mode === "dark" ? SUN : MOON;
      if (label) label.textContent = mode === "dark" ? "Claro" : "Escuro";
      if (meta)  meta.setAttribute("content", mode === "light" ? "#D8D3C7" : "#050505");
    }
    if (btn) btn.onclick = function(){
      var cur = document.documentElement.getAttribute("data-theme") || "dark";
      var next = cur === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem("parket-fiscal-theme", next); } catch(e){}
      paint();
    };
    paint();
  })();
</script>

// ║ Retorna File (jpeg comprimido) com a foto + desenhos          ║
// ╚══════════════════════════════════════════════════════════════╝
async function openPhotoEditor(file){
  return new Promise(async (resolve) => {
    // Carrega imagem
    const dataUrl = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result); r.onerror = () => rej(new Error("Falha ao ler"));
      r.readAsDataURL(file);
    });
    const img = await new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => res(im); im.onerror = () => rej(new Error("Img inválida"));
      im.src = dataUrl;
    });

    // Modal fullscreen
    const overlay = document.createElement("div");
    overlay.style.cssText = "position:fixed;inset:0;z-index:10000;background:#000;display:flex;flex-direction:column";

    // Top bar — cores + ferramentas
    const top = document.createElement("div");
    top.style.cssText = "background:rgba(0,0,0,0.6);padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap";
    const COLORS = ["#FF3B30","#FFCC00","#34C759","#FFFFFF","#000000","#0A84FF"];
    let curColor = "#FF3B30";
    let curWidth = 4;
    let mode = "pen"; // "pen" | "text"

    const colorBtns = COLORS.map(c => {
      const b = document.createElement("button");
      b.style.cssText = `width:28px;height:28px;border-radius:50%;background:${c};border:2px solid ${c===curColor?"#fff":"transparent"};padding:0;cursor:pointer`;
      b.onclick = (ev) => { ev.preventDefault(); curColor = c; colorBtns.forEach((bb,i) => bb.style.border = `2px solid ${COLORS[i]===curColor?"#fff":"transparent"}`); };
      top.appendChild(b);
      return b;
    });

    const sepDiv = document.createElement("div");
    sepDiv.style.cssText = "width:1px;height:24px;background:rgba(255,255,255,0.2);margin:0 4px";
    top.appendChild(sepDiv);

    // Espessura
    const wRange = document.createElement("input");
    wRange.type = "range"; wRange.min = "2"; wRange.max = "20"; wRange.value = "4";
    wRange.style.cssText = "width:80px";
    wRange.oninput = () => { curWidth = parseInt(wRange.value); };
    top.appendChild(wRange);

    // Undo
    const btnUndo = document.createElement("button");
    btnUndo.textContent = "↶";
    btnUndo.title = "Desfazer";
    btnUndo.style.cssText = "background:transparent;border:1px solid rgba(255,255,255,0.3);color:#fff;width:32px;height:32px;border-radius:0;font-size:18px;cursor:pointer;padding:0;margin-left:auto";
    top.appendChild(btnUndo);

    // Limpar
    const btnClear = document.createElement("button");
    btnClear.textContent = "✕";
    btnClear.title = "Limpar desenhos";
    btnClear.style.cssText = "background:transparent;border:1px solid rgba(255,255,255,0.3);color:#fff;width:32px;height:32px;border-radius:0;cursor:pointer;padding:0";
    top.appendChild(btnClear);

    overlay.appendChild(top);

    // Canvas
    const canvasWrap = document.createElement("div");
    canvasWrap.style.cssText = "flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative";
    overlay.appendChild(canvasWrap);

    const canvas = document.createElement("canvas");
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0);
    // Save initial state pra reset
    const baseImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    // Canvas escala pra caber na tela
    canvas.style.cssText = "max-width:100%;max-height:100%;object-fit:contain;touch-action:none";
    canvasWrap.appendChild(canvas);

    // Stack pra undo (cada traço = snapshot)
    const undoStack = [];
    function saveSnapshot(){
      undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
      if (undoStack.length > 30) undoStack.shift();
    }

    btnUndo.onclick = (ev) => {
      ev.preventDefault();
      if (undoStack.length > 0){
        const last = undoStack.pop();
        ctx.putImageData(last, 0, 0);
      }
    };
    btnClear.onclick = (ev) => {
      ev.preventDefault();
      undoStack.length = 0;
      ctx.putImageData(baseImageData, 0, 0);
    };

    // Desenho com pointer events
    let drawing = false;
    let lastX = 0, lastY = 0;
    function getCanvasPos(ev){
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const x = (ev.clientX - rect.left) * scaleX;
      const y = (ev.clientY - rect.top) * scaleY;
      return { x, y };
    }
    canvas.addEventListener("pointerdown", (ev) => {
      ev.preventDefault();
      const p = getCanvasPos(ev);
      drawing = true;
      saveSnapshot();
      lastX = p.x; lastY = p.y;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = curColor;
      ctx.lineWidth = curWidth * (canvas.width / canvas.getBoundingClientRect().width); // escala lineWidth
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x + 0.1, p.y + 0.1);
      ctx.stroke();
      canvas.setPointerCapture(ev.pointerId);
    });
    canvas.addEventListener("pointermove", (ev) => {
      if (!drawing) return;
      ev.preventDefault();
      const p = getCanvasPos(ev);
      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      lastX = p.x; lastY = p.y;
    });
    canvas.addEventListener("pointerup", () => { drawing = false; });
    canvas.addEventListener("pointercancel", () => { drawing = false; });

    // Bottom — comentário (estilo WhatsApp: input + botão enviar)
    const bottom = document.createElement("div");
    bottom.style.cssText = "background:rgba(0,0,0,0.7);padding:10px 12px;display:flex;flex-direction:column;gap:8px";

    const commentRow = document.createElement("div");
    commentRow.style.cssText = "display:flex;gap:8px;align-items:flex-end";

    const commentInput = document.createElement("textarea");
    commentInput.placeholder = "Adicionar comentário…";
    commentInput.rows = 1;
    commentInput.style.cssText = "flex:1;padding:10px 12px;border-radius:0;background:rgba(255,255,255,0.12);border:none;color:#fff;font-size:14px;font-family:inherit;resize:none;outline:none;max-height:80px;line-height:1.4";
    commentInput.addEventListener("input", () => {
      commentInput.style.height = "auto";
      commentInput.style.height = Math.min(80, commentInput.scrollHeight) + "px";
    });
    commentRow.appendChild(commentInput);

    bottom.appendChild(commentRow);

    const btnRow = document.createElement("div");
    btnRow.style.cssText = "display:flex;gap:10px";
    const btnCancel = document.createElement("button");
    btnCancel.textContent = "Cancelar";
    btnCancel.style.cssText = "flex:1;padding:12px;border-radius:0;background:rgba(255,255,255,0.1);border:none;color:#fff;font-weight:600;cursor:pointer";
    btnCancel.onclick = () => { document.body.removeChild(overlay); resolve(null); };
    const btnDone = document.createElement("button");
    btnDone.textContent = "✓ Pronto";
    btnDone.style.cssText = "flex:2;padding:12px;border-radius:0;background:var(--pk-accent);border:none;color:#000;font-weight:700;cursor:pointer";
    btnDone.onclick = () => {
      const comentario = commentInput.value.trim();
      canvas.toBlob((blob) => {
        document.body.removeChild(overlay);
        if (!blob){ resolve(null); return; }
        const newFile = new File([blob], file.name || "foto.jpg", { type: "image/jpeg", lastModified: Date.now() });
        resolve({ file: newFile, comentario });
      }, "image/jpeg", 0.85);
    };
    btnRow.appendChild(btnCancel);
    btnRow.appendChild(btnDone);
    bottom.appendChild(btnRow);

    overlay.appendChild(bottom);

    document.body.appendChild(overlay);
  });
}

// ── Compressão de foto (lado maior ~1280, jpeg 0.7, ~700KB) ──
async function compressPhoto(file){
  const dataUrl = await new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result); r.onerror = () => rej(new Error("Falha ao ler"));
    r.readAsDataURL(file);
  });
  const img = await new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im); im.onerror = () => rej(new Error("Imagem inválida"));
    im.src = dataUrl;
  });
  const MAX = 1280;
  let w = img.naturalWidth, h = img.naturalHeight;
  if (w > MAX || h > MAX){ if (w >= h){ h = Math.round(h * MAX / w); w = MAX; } else { w = Math.round(w * MAX / h); h = MAX; } }
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  canvas.getContext("2d").drawImage(img, 0, 0, w, h);
  let q = 0.72, out = canvas.toDataURL("image/jpeg", q);
  while (out.length > 700_000 && q > 0.35){ q -= 0.1; out = canvas.toDataURL("image/jpeg", q); }
  return out;
}

// ║ Estado global da app                                          ║
// ╚══════════════════════════════════════════════════════════════╝
let _user = null;     // user do Supabase (auth)
let _fiscal = null;   // row do fiscal_equipe (se logou como fiscal)
let _isAdmin = false; // role admin/superadmin OU tem dept_permissions.obras (vê tudo + cria como qualquer fiscal)
let _adminProfile = null; // {full_name, email}
let _fiscaisLista = []; // lista de todos fiscais ativos (admin usa pra operar como)
let _operandoComoId = null; // id do fiscal_equipe que admin selecionou pra criar laudos
let _rtChannel = null; // canal realtime ativo (recriado a cada render de Home/Agenda)
let _rtView = null;    // qual view registrou o canal ("home" | "agenda")

// Recria subscription pro Supabase realtime — dispara o callback ao mudar laudos/agenda.
// Re-renderiza a view atual quando algo muda no Space.
function subscribeFiscalRealtime(view, onChange){
  if (_rtChannel){ try { sb.removeChannel(_rtChannel); } catch(_){} _rtChannel = null; }
  _rtView = view;
  _rtChannel = sb.channel("fiscal_rt_" + view)
    .on("postgres_changes", { event: "*", schema: "public", table: "fiscal_laudos" }, () => onChange())
    .on("postgres_changes", { event: "*", schema: "public", table: "fiscal_agenda" }, () => onChange())
    .subscribe();
}

// Cancela canal realtime. Chamado por views que NÃO são Home/Agenda — sem isso
// o callback antigo continua escutando mudanças em fiscal_laudos e dispara
// renderHome() (que joga o usuário de volta pra tela inicial no meio de uma edição).
function unsubscribeFiscalRealtime(){
  if (_rtChannel){ try { sb.removeChannel(_rtChannel); } catch(_){} _rtChannel = null; }
  _rtView = null;
}

// ╔══════════════════════════════════════════════════════════════╗
// ║ Boot — checa sessão                                           ║
// ╚══════════════════════════════════════════════════════════════╝
async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return renderLogin();
  _user = session.user;

  // 1) Tenta como fiscal
  const { data: fiscalRow } = await sb.from("fiscal_equipe").select("*").eq("user_id", _user.id).maybeSingle();
  if (fiscalRow && fiscalRow.ativo){
    _fiscal = fiscalRow;
  }

  // 2) Checa se é admin/superadmin OU tem dept_permissions.obras
  //    Qualquer um deles entra em modo "admin" (vê tudo, cria como qualquer fiscal)
  const { data: profile } = await sb.from("user_profiles")
    .select("full_name, email, role, dept_permissions")
    .eq("id", _user.id)
    .maybeSingle();
  const isRoleAdmin = profile && (profile.role === "admin" || profile.role === "superadmin");
  const hasObras = profile && profile.dept_permissions && profile.dept_permissions.obras != null;
  // Fiscal cadastrado SEMPRE opera em modo fiscal (só vê o dele) — dept_permissions.obras
  // não eleva quem é fiscal; só role admin/superadmin de verdade.
  if (isRoleAdmin || (!_fiscal && hasObras)){
    _isAdmin = true;
    _adminProfile = profile;
  }

  // 3) Se não é fiscal nem tem acesso (admin/obras) → bloqueia
  if (!_fiscal && !_isAdmin){
    await sb.auth.signOut();
    return renderLogin("Sem permissão. Você precisa ser fiscal cadastrado, admin, ou ter acesso ao depto Obras.");
  }

  // 4) Se é admin, carrega lista de fiscais pro dropdown "operando como"
  if (_isAdmin){
    const { data: fis } = await sb.from("fiscal_equipe").select("id, nome, email, ativo").eq("ativo", true).order("nome");
    _fiscaisLista = fis || [];
    // Default: se também é fiscal, opera como ele mesmo. Senão, primeiro da lista.
    _operandoComoId = (_fiscal && _fiscal.id) || (_fiscaisLista[0] && _fiscaisLista[0].id) || null;
  }

  renderUserChip();
  renderBottomNav();
  // Inicializa stack de navegação com home
  _navStack = [{ view: "home" }];
  try { history.replaceState({ view: "home", idx: 0 }, "", "#home"); } catch {}
  renderHome();

  // Captura erros globais pra evitar que o WebView do APK feche por exception
  // não-tratada (era um dos sintomas do "crash ao trocar de aba").
  window.addEventListener("error", (ev) => {
    try {
      console.error("[GLOBAL ERR]", ev.error || ev.message);
      const errEl = document.createElement("div");
      errEl.style.cssText = "position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#dc2626;color:#fff;padding:10px 16px;border-radius:0;font-size:12px;z-index:99999;max-width:90%";
      errEl.textContent = "Erro: " + ((ev.error && ev.error.message) || ev.message || "desconhecido");
      document.body.appendChild(errEl);
      setTimeout(() => errEl.remove(), 6000);
    } catch {}
    ev.preventDefault();
    return true;
  });
  window.addEventListener("unhandledrejection", (ev) => {
    try { console.error("[UNHANDLED PROMISE]", ev.reason); } catch {}
    ev.preventDefault();
  });
}

function renderUserChip(){
  const nome = _fiscal ? _fiscal.nome : (_adminProfile?.full_name || _user.email);
  // Badge: ADMIN se role admin/superadmin, OBRAS se só tem dept_permissions.obras
  let badgeHtml = "";
  if (_isAdmin){
    const isRealAdmin = _adminProfile && (_adminProfile.role === "admin" || _adminProfile.role === "superadmin");
    const labelTag = isRealAdmin ? "ADMIN" : "OBRAS";
    badgeHtml = `<span class="tag" style="background:rgba(150,132,115,0.2);color:var(--pk-accent);margin-right:6px">${labelTag}</span>`;
  }
  userChip.innerHTML = `${badgeHtml}<button class="ghost" id="_logout_btn" style="width:auto;padding:6px 10px;font-size:11px">${esc(nome)} · sair</button>`;
  document.getElementById("_logout_btn").onclick = async () => {
    await sb.auth.signOut();
    location.reload();
  };
}

/** Helper: id do fiscal sendo "operado". Usado pra criar laudos. */
function fiscalAtualId(){
  if (_isAdmin) return _operandoComoId;
  return _fiscal && _fiscal.id;
}
function fiscalAtualNome(){
  if (_isAdmin){
    const f = _fiscaisLista.find(x => x.id === _operandoComoId);
    return f ? f.nome : "—";
  }
  return _fiscal && _fiscal.nome;
}

// ╔══════════════════════════════════════════════════════════════╗
// ║ HISTORY NAVIGATION — botão "voltar" do Android/navegador        ║
// ║ funciona dentro do app em vez de sair. Empurra cada tela ao    ║
// ║ history.state e responde ao popstate.                           ║
// ╚══════════════════════════════════════════════════════════════╝
let _navStack = [];
function navTo(view, params){
  _navStack.push({ view, params });
  try { history.pushState({ view, params, idx: _navStack.length - 1 }, "", "#" + view); } catch {}
  dispatchView(view, params);
}
function dispatchView(view, params){
  switch (view) {
    case "home":         return renderHome();
    case "calendario":   return renderCalendario();
    case "editar":       return renderEditarLaudo(params && params.id);
    case "novo":         return renderNovoLaudo(params && params.preset);
    case "login":        return renderLogin(params && params.msg);
    default:             return renderHome();
  }
}
window.addEventListener("popstate", (ev) => {
  // Botão voltar — vai pra entrada anterior do stack
  if (_navStack.length > 1) {
    _navStack.pop();
    const prev = _navStack[_navStack.length - 1];
    dispatchView(prev.view, prev.params);
  } else {
    // Já estamos na home — mantém o app aberto, não sai
    history.pushState({ view: "home", idx: 0 }, "", "#home");
    if (_navStack.length === 0) _navStack.push({ view: "home" });
    renderHome();
  }
});

      <input id="_pw" type="password" autocomplete="current-password" placeholder="••••••" style="padding-right:92px"/>
      <button type="button" id="_pw_toggle" aria-label="Mostrar senha"
        style="position:absolute;right:6px;top:50%;transform:translateY(-50%);background:transparent;border:1px solid var(--pk-border2);border-radius:0;color:var(--pk-text-dim);font-size:10px;font-weight:700;letter-spacing:0.08em;width:auto;height:28px;padding:0 10px;cursor:pointer;display:flex;align-items:center;justify-content:center">MOSTRAR</button>
    </div>
    <div style="height:14px"></div>
    <button class="primary" id="_login">Entrar</button>
    <div id="_msg"></div>
  </div>`);
  root.appendChild(card);
  // Toggle "olho" pra mostrar/ocultar senha
  const _pwEl = document.getElementById("_pw");
  const _pwBtn = document.getElementById("_pw_toggle");
  _pwBtn.onclick = () => {
    const isPw = _pwEl.type === "password";
    _pwEl.type = isPw ? "text" : "password";
    _pwBtn.textContent = isPw ? "OCULTAR" : "MOSTRAR";
    _pwBtn.setAttribute("aria-label", isPw ? "Ocultar senha" : "Mostrar senha");
  };
  // APK removido — não distribuímos mais via download direto
  document.getElementById("_login").onclick = async () => {
    const email = document.getElementById("_email").value.trim();
    const pw = document.getElementById("_pw").value;
    const msgEl = document.getElementById("_msg");
    if (!email || !pw){ msgEl.innerHTML = `<div class="err">Preencha email e senha.</div>`; return; }
    msgEl.innerHTML = `<div class="small"><span class="spinner"></span> Entrando…</div>`;
    const { error } = await sb.auth.signInWithPassword({ email, password: pw });
    if (error){
      msgEl.innerHTML = `<div class="err">${esc(error.message || "Falha no login")}</div>`;
      return;
    }
    boot();
  };
}

// ║ HOME — agenda do fiscal + obras                               ║
// ╚══════════════════════════════════════════════════════════════╝
async function renderHome(){
  root.innerHTML = `<div class="card center"><span class="spinner"></span><div class="small" style="margin-top:8px">Carregando agenda…</div></div>`;
  subscribeFiscalRealtime("home", () => { if (_rtView === "home") renderHome(); });

  // Pro admin, o dropdown "operando como" também FILTRA o que vê.
  // Pro fiscal, sempre vê só o dele.
  const filtroFiscalId = _isAdmin ? _operandoComoId : (_fiscal && _fiscal.id);

  const hoje = new Date();
  const inicioSemana = new Date(hoje); inicioSemana.setDate(hoje.getDate() - 60);
  const fimSemana = new Date(hoje); fimSemana.setDate(hoje.getDate() + 180);

  let qAgenda = sb.from("fiscal_agenda")
    .select("id, card_id, fiscal_id, tipo, data_inicio, data_fim, obra, cliente, status, notas")
    .gte("data_inicio", inicioSemana.toISOString())
    .lte("data_inicio", fimSemana.toISOString())
    .order("data_inicio", { ascending: true });
  if (filtroFiscalId) qAgenda = qAgenda.eq("fiscal_id", filtroFiscalId);
  const { data: agenda, error: e1 } = await qAgenda;

  if (e1){
    root.innerHTML = `<div class="card"><div class="err">Erro: ${esc(e1.message)}</div></div>`;
    return;
  }

  let qLaudos = sb.from("fiscal_laudos")
    .select("id, card_id, fiscal_id, fiscal_nome, obra, cliente, tipo, status, data_vistoria, updated_at")
    .order("updated_at", { ascending: false })
    .limit(60);
  if (filtroFiscalId) qLaudos = qLaudos.eq("fiscal_id", filtroFiscalId);
  const { data: laudos } = await qLaudos;

  // Obras vinculadas ao fiscal = cards com laudo/agenda dele + cards onde ele
  // é fiscal responsável (kanban_cards.details.fiscais — vínculo do gestão)
  let obras = [];
  if (filtroFiscalId){
    const cardIds = new Set([
      ...(agenda || []).map(a => a.card_id).filter(Boolean),
      ...(laudos || []).map(l => l.card_id).filter(Boolean),
    ]);
    const byId = new Map();
    if (cardIds.size > 0){
      const { data: kc } = await sb.from("kanban_cards")
        .select("id, title, obra, column_id, dept_id, responsavel")
        .in("id", Array.from(cardIds));
      for (const o of (kc || [])) byId.set(o.id, o);
    }
    const { data: kcResp } = await sb.from("kanban_cards")
      .select("id, title, obra, column_id, dept_id, responsavel")
      .contains("details->fiscais", JSON.stringify([{ id: filtroFiscalId }]));
    for (const o of (kcResp || [])) byId.set(o.id, { ...(byId.get(o.id) || o), _resp: true });
    obras = Array.from(byId.values());
  }

  root.innerHTML = "";

  // Admin: seletor "operando como" no topo
  if (_isAdmin){
    const opts = _fiscaisLista.map(f => `<option value="${f.id}" ${f.id===_operandoComoId?"selected":""}>${esc(f.nome)}</option>`).join("");
    root.appendChild(el(`<div class="card" style="padding:10px 12px;margin-top:0">
      <div class="label">Operando como (fiscal)</div>
      <select id="_op_como" style="margin-top:4px">${opts}</select>
    </div>`));
    document.getElementById("_op_como").onchange = (e) => {
      _operandoComoId = e.target.value;
      renderHome();
    };
  }

  // ── Stats row + Novo laudo ──
  const paraFazer = (laudos || []).filter(l => l.status === "pendente" || l.status === "em_andamento");
  const concluidos = (laudos || []).filter(l => l.status === "concluido" || l.status === "cancelado");
  const agora = Date.now();
  const agendaFut = (agenda || []).filter(a => new Date(a.data_inicio).getTime() >= agora - 12*3600*1000);

  const statsEl = el(`<div class="stats-row">
    <div class="stat warn" data-goto="paraFazer" style="cursor:pointer"><div class="n">${paraFazer.length}</div><div class="l">Pendentes</div></div>
    <div class="stat info" data-goto="proximas" style="cursor:pointer"><div class="n">${agendaFut.length}</div><div class="l">Próx. visitas</div></div>
    <div class="stat ok" data-goto="concluidos" style="cursor:pointer"><div class="n">${concluidos.length}</div><div class="l">Concluídos</div></div>
  </div>`);
  statsEl.querySelectorAll(".stat").forEach(s => {
    s.onclick = async () => {
      const key = s.dataset.goto;
      _homeOpen[key] = true;
      await renderHome();
      const head = root.querySelector(`[data-sect="${key}"]`);
      if (head) head.scrollIntoView({ behavior: "smooth", block: "start" });
    };
  });
  root.appendChild(statsEl);

  // Próxima visita (destaque)
  const proxima = agendaFut.slice().sort((a,b) => new Date(a.data_inicio) - new Date(b.data_inicio))[0];
  if (proxima){
    const tipoLabel = (TIPOS[proxima.tipo] && TIPOS[proxima.tipo].label) || proxima.tipo || "Visita";
    const whenLabel = fmtDate(proxima.data_inicio);
    const nv = el(`<div class="next-visit">
      <div class="pre">PRÓXIMA VISITA</div>
      <div class="cli">${esc(proxima.cliente || proxima.obra || "—")}</div>
      ${proxima.obra && proxima.cliente ? `<div class="obra">${esc(proxima.obra)}</div>` : ""}
      <div class="when">${esc(tipoLabel)} · ${whenLabel}</div>
    </div>`);
    nv.onclick = () => renderNovoLaudo({ agenda_id: proxima.id, card_id: proxima.card_id, obra: proxima.obra, cliente: proxima.cliente, tipo: proxima.tipo });
    root.appendChild(nv);
  }

  // Botão "novo laudo" — full width (APK removido a pedido)
  root.appendChild(el(`<div style="margin-bottom:14px">
    <button class="primary" id="_novo">Novo laudo</button>
  </div>`));
  document.getElementById("_novo").onclick = () => renderNovoLaudo(null);

  // ── Helpers de card ──
  function renderLaudoCard(l){
    const tipoLabel = (TIPOS[l.tipo] && TIPOS[l.tipo].label) || l.tipo;
    let color = "#9CA3AF";
    if (l.status === "concluido") color = "#34D399";
    else if (l.status === "em_andamento") color = "#3B82F6";
    else if (l.status === "pendente") color = "#FBBF24";
    const subFiscal = _isAdmin && l.fiscal_nome ? ` · ${esc(l.fiscal_nome)}` : "";
    const when = l.data_vistoria ? fmtDate(l.data_vistoria) : fmtDate(l.updated_at);
    const c = el(`<div class="lcard">
      <div class="ldot" style="background:${color}"></div>
      <div class="lbody">
        <div class="lcli">${esc(l.cliente || l.obra || "—")}</div>
        <div class="lsub">${esc(tipoLabel)} · ${when}${subFiscal}</div>
      </div>
      <div class="larrow">›</div>
    </div>`);
    c.onclick = () => renderEditarLaudo(l.id);
    return c;
  }
  function renderAgendaCard(a){
    const tipoLabel = (TIPOS[a.tipo] && TIPOS[a.tipo].label) || a.tipo || "Visita";
    const c = el(`<div class="lcard">
      <div class="ldot" style="background:var(--pk-accent)"></div>
      <div class="lbody">
        <div class="lcli">${esc(a.cliente || a.obra || "—")}</div>
        <div class="lsub">${esc(tipoLabel)} · ${fmtDate(a.data_inicio)}</div>
      </div>
      <div class="larrow">›</div>
    </div>`);
    c.onclick = () => renderNovoLaudo({ agenda_id: a.id, card_id: a.card_id, obra: a.obra, cliente: a.cliente, tipo: a.tipo });
    return c;
  }
  function renderObraCard(o, lds, ag){
    const ldsFeitos = lds.filter(l => l.status === "concluido").length;
    const ldsPend = lds.filter(l => l.status === "pendente" || l.status === "em_andamento").length;
    const tagsHtml = [
      o._resp ? `<span class="tag" style="background:rgba(52,211,153,0.15);color:#34D399">responsável</span>` : "",
      ag.length ? `<span class="tag" style="background:rgba(150,132,115,0.15);color:var(--pk-accent)">${ag.length} agenda</span>` : "",
      ldsPend > 0 ? `<span class="tag" style="background:rgba(245,158,11,0.18);color:#FBBF24">${ldsPend} pend.</span>` : "",
      ldsFeitos > 0 ? `<span class="tag" style="background:rgba(52,211,153,0.15);color:#34D399">${ldsFeitos} feito${ldsFeitos!==1?"s":""}</span>` : "",
    ].filter(Boolean).join(" ");
    const c = el(`<div class="lcard" style="flex-direction:column;align-items:stretch">
      <div style="display:flex;gap:10px;align-items:center;width:100%">
        <div class="lbody">
          <div class="lcli">${esc(o.title || "—")}</div>
          <div class="lsub">${esc(o.obra || "—")} · ${esc(o.column_id || "")}</div>
        </div>
        <div class="larrow">›</div>
      </div>
      ${tagsHtml ? `<div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:8px">${tagsHtml}</div>` : ""}
    </div>`);
    c.onclick = () => renderObraDetail(o.id);
    return c;
  }

  // ── Helper: seção colapsável (lembra estado por chave em _homeOpen)
  // Click no header → toggle expand/collapse. Default = todas COLAPSADAS pra
  // limpar a Home. State persiste entre re-renders (real-time também).
  function renderSection(key, titulo, count, items, renderItem, titleColor){
    if (!items || items.length === 0) return;
    if (_homeOpen[key] === undefined) _homeOpen[key] = false;
    const open = _homeOpen[key];
    const head = el(`<div class="sect-h" data-sect="${key}" style="cursor:pointer;user-select:none;background:var(--pk-card1);border:1px solid var(--pk-border1);border-radius:0;padding:10px 12px;margin:14px 0 ${open?6:0}px">
      <div class="t" style="color:${titleColor || 'var(--pk-text)'};display:flex;align-items:center;gap:8px;font-size:11px">
        <span style="display:inline-block;width:10px;color:var(--pk-text-muted);font-size:9px">${open ? "▼" : "▶"}</span>
        ${titulo}
      </div>
      <div class="n" style="font-size:11px;color:var(--pk-accent);font-weight:700;background:rgba(150,132,115,0.12);padding:2px 8px;border-radius:0">${count}</div>
    </div>`);
    head.onclick = () => { _homeOpen[key] = !_homeOpen[key]; renderHome(); };
    root.appendChild(head);
    if (open){
      const body = el(`<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px"></div>`);
      for (const it of items) body.appendChild(renderItem(it));
      root.appendChild(body);
    }
  }

  // ── OBRAS vinculadas (colapsável) ──
  if (filtroFiscalId && obras.length){
    const titulo = _isAdmin ? `Obras de ${esc(fiscalAtualNome())}` : "Minhas obras";
    renderSection("obras", titulo, obras.length, obras, (o) => {
      const lds = (laudos || []).filter(l => l.card_id === o.id);
      const ag = (agenda || []).filter(a => a.card_id === o.id);
      return renderObraCard(o, lds, ag);
    });
  }

  // ── AGENDA próxima (colapsável) ──
  if (agendaFut.length){
    const proximas = agendaFut.slice().sort((a,b) => new Date(a.data_inicio) - new Date(b.data_inicio));
    renderSection("proximas", "Próximas visitas", proximas.length, proximas, renderAgendaCard);
  }

  // ── PRA FAZER (colapsável) ──
  if (paraFazer.length){
    const titulo = _isAdmin ? "Para fazer (todos)" : "Para fazer";
    renderSection("paraFazer", titulo, paraFazer.length, paraFazer, renderLaudoCard, "var(--pk-status-warn)");
  }

  // ── CONCLUÍDOS (colapsável) ──
  if (concluidos.length){
    const titulo = _isAdmin ? "Concluídos" : "Meus concluídos";
    renderSection("concluidos", titulo, concluidos.length, concluidos, renderLaudoCard);
  }

  // Empty state
  if (!filtroFiscalId && !agendaFut.length && !paraFazer.length && !concluidos.length){
    root.appendChild(el(`<div class="card center"><div class="small">Nada por aqui ainda. Use "+ Novo laudo" pra criar.</div></div>`));
  }
}

// ╔══════════════════════════════════════════════════════════════╗
// ║ DETALHE DA OBRA — feito / pra fazer / criar novo              ║
// ╚══════════════════════════════════════════════════════════════╝
async function renderObraDetail(cardId){
  unsubscribeFiscalRealtime();
  root.innerHTML = `<div class="card center"><span class="spinner"></span></div>`;

  // Carrega card + laudos + agenda dessa obra (filtrados pelo fiscal atual)
  const filtroFiscalId = _isAdmin ? _operandoComoId : (_fiscal && _fiscal.id);
  const { data: card } = await sb.from("kanban_cards")
    .select("id, title, obra, column_id, dept_id, responsavel, details")
    .eq("id", cardId)
    .maybeSingle();
  if (!card){
    root.innerHTML = `<div class="card"><div class="err">Obra não encontrada.</div></div>`;
    return;
  }

  let qL = sb.from("fiscal_laudos")
    .select("id, fiscal_id, fiscal_nome, tipo, status, servicos_inclusos, data_vistoria, updated_at, created_at, observacoes")
    .eq("card_id", cardId)
    .order("created_at", { ascending: false });
  if (filtroFiscalId) qL = qL.eq("fiscal_id", filtroFiscalId);
  const { data: lds } = await qL;

  let qA = sb.from("fiscal_agenda")
    .select("id, fiscal_id, tipo, data_inicio, status, notas")
    .eq("card_id", cardId)
    .order("data_inicio", { ascending: true });
  if (filtroFiscalId) qA = qA.eq("fiscal_id", filtroFiscalId);
  const { data: ags } = await qA;

  const ldsFeitos = (lds || []).filter(l => l.status === "concluido");
  const ldsPend = (lds || []).filter(l => l.status === "pendente" || l.status === "em_andamento");

  // Quais tipos já foram feitos vs faltam (pra "Próximos passos")
  const tiposFeitos = new Set(ldsFeitos.map(l => l.tipo));
  const tiposPossiveis = ["1vistoria", "2vistoria", "acompanhamento", "entrega", "reparo"];
  const tiposFaltando = tiposPossiveis.filter(t => !tiposFeitos.has(t) && !ldsPend.find(l => l.tipo === t));

  root.innerHTML = "";
  root.appendChild(el(`<div style="margin-bottom:10px">
    <button class="ghost" id="_back" style="width:auto;padding:6px 12px;font-size:12px">← Voltar</button>
  </div>`));
  document.getElementById("_back").onclick = () => renderHome();

  // Header da obra
  root.appendChild(el(`<div class="card" style="background:linear-gradient(135deg,rgba(150,132,115,0.12),rgba(150,132,115,0.04));border-color:rgba(150,132,115,0.3)">
    <div class="label" style="color:var(--pk-accent)">Projeto</div>
    <div style="font-size:18px;font-weight:700;margin:4px 0 2px">${esc(card.title || "—")}</div>
    <div class="small">${esc(card.obra || "—")} · ${esc(card.column_id || "")}${card.responsavel ? " · resp: " + esc(card.responsavel) : ""}</div>
  </div>`));

  // ── GESTÃO: fiscal responsável + modelos da obra (gestao.itens)
  const gestaoWrap = el(`<div></div>`);
  root.appendChild(gestaoWrap);
  renderGestaoObraInfo(gestaoWrap, cardId, card);

  // ── CHECKLIST DE INÍCIO DE OBRAS (etapa 3 do gestão → Central do Cliente)
  {
    const ph = el(`<div class="card" style="cursor:pointer;display:none">
      <div class="row" style="justify-content:space-between;gap:8px">
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:600">Checklist de Início de Obras</div>
          <div class="small" data-role="ck-sub">carregando…</div>
        </div>
        <span class="tag" data-role="ck-tag" style="background:rgba(245,158,11,0.15);color:#F59E0B;flex-shrink:0;font-weight:700">pendente</span>
      </div>
    </div>`);
    ph.onclick = () => renderChecklistInicioObra(cardId, { title: card.title, obra: card.obra });
    root.appendChild(ph);
    (async () => {
      try {
        const r = await fetch(`${GESTAO_API}/api/fiscal/checklist-obra/${cardId}`);
        if (!r.ok) return;
        const d = await r.json();
        if (!d.servicos || !d.servicos.length) return;
        let total = 0, feitos = 0;
        for (const s of d.servicos){
          const perguntas = (CK["1vistoria"] && CK["1vistoria"][s]) || (CK["2vistoria"] && CK["2vistoria"][s]) || [];
          for (const q of perguntas){
            total++;
            const resp = d.checklist && d.checklist[s] && d.checklist[s][q];
            if (resp && resp.valor) feitos++;
          }
        }
        ph.querySelector('[data-role="ck-sub"]').textContent =
          `${feitos}/${total} verificações · ${d.servicos.map(s => s.toUpperCase()).join(", ")}`;
        const tag = ph.querySelector('[data-role="ck-tag"]');
        if (total > 0 && feitos >= total){
          tag.textContent = "concluído";
          tag.style.background = "rgba(52,211,153,0.20)"; tag.style.color = "#34D399";
        } else if (feitos > 0){
          tag.textContent = "em andamento";
          tag.style.background = "rgba(59,130,246,0.15)"; tag.style.color = "#60A5FA";
        }
        ph.style.display = "";
      } catch (_e) { /* gestão fora do ar ou card sem projeto — some silencioso */ }
    })();
  }

  // ── PRA FAZER (pendentes + em_andamento)
  if (ldsPend.length){
    root.appendChild(el(`<div class="card" style="border-color:rgba(245,158,11,0.35);background:rgba(245,158,11,0.06)">
      <div class="h2" style="margin:0">Pra fazer</div>
      <div class="small">${ldsPend.length} laudo(s) aguardando preenchimento</div>
    </div>`));
    for (const l of ldsPend){
      const tipoLabel = (TIPOS[l.tipo] && TIPOS[l.tipo].label) || l.tipo;
      const serv = Array.isArray(l.servicos_inclusos) && l.servicos_inclusos.length
        ? ` · ${l.servicos_inclusos.map(s => s.toUpperCase()).join(", ")}`
        : "";
      const stColor = l.status === "em_andamento" ? "#3B82F6" : "#F59E0B";
      const c = el(`<div class="card" style="cursor:pointer;background:rgba(245,158,11,0.04);border-color:rgba(245,158,11,0.25)">
        <div class="row" style="justify-content:space-between;gap:8px">
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600">${esc(tipoLabel)}${esc(serv)}</div>
            <div class="small">${l.data_vistoria ? fmtDate(l.data_vistoria) : fmtDate(l.created_at)} · ${esc(l.fiscal_nome || "—")}</div>
          </div>
          <span class="tag" style="background:${stColor}25;color:${stColor};flex-shrink:0;font-weight:700">${l.status === "em_andamento" ? "rascunho" : "pendente"}</span>
        </div>
      </div>`);
      c.onclick = () => renderEditarLaudo(l.id);
      root.appendChild(c);
    }
  }

  // ── AGENDA (futura, sem laudo criado ainda)
  if (ags && ags.length){
    root.appendChild(el(`<div class="card"><div class="h2">Agendamentos</div>
      <div class="small">${ags.length} compromisso(s) marcado(s)</div>
    </div>`));
    for (const a of ags){
      const tipoLabel = (TIPOS[a.tipo] && TIPOS[a.tipo].label) || a.tipo;
      const c = el(`<div class="card" style="cursor:pointer">
        <div class="row" style="justify-content:space-between;gap:8px">
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600">${esc(tipoLabel)}</div>
            <div class="small">${fmtDate(a.data_inicio)}${a.notas ? " · " + esc(a.notas) : ""}</div>
          </div>
          <span class="tag" style="background:rgba(150,132,115,0.15);color:var(--pk-accent);flex-shrink:0">${esc(a.status||"agendada")}</span>
        </div>
      </div>`);
      c.onclick = () => renderNovoLaudo({ card_id: cardId, obra: card.obra, cliente: card.title, tipo: a.tipo });
      root.appendChild(c);
    }
  }

  // ── FEITOS (concluídos)
  if (ldsFeitos.length){
    root.appendChild(el(`<div class="card"><div class="h2">Feitos</div>
      <div class="small">${ldsFeitos.length} laudo(s) concluído(s)</div>
    </div>`));
    for (const l of ldsFeitos){
      const tipoLabel = (TIPOS[l.tipo] && TIPOS[l.tipo].label) || l.tipo;
      const serv = Array.isArray(l.servicos_inclusos) && l.servicos_inclusos.length
        ? ` · ${l.servicos_inclusos.map(s => s.toUpperCase()).join(", ")}`
        : "";
      const c = el(`<div class="card" style="cursor:pointer">
        <div class="row" style="justify-content:space-between;gap:8px">
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600">${esc(tipoLabel)}${esc(serv)}</div>
            <div class="small">${l.data_vistoria ? fmtDate(l.data_vistoria) : fmtDate(l.updated_at)} · ${esc(l.fiscal_nome || "—")}</div>
          </div>
          <span class="tag" style="background:rgba(52,211,153,0.20);color:#34D399;flex-shrink:0">concluído</span>
        </div>
      </div>`);
      c.onclick = () => renderEditarLaudo(l.id);
      root.appendChild(c);
    }
  }

  // ── PRÓXIMOS PASSOS (tipos que ainda não existem nessa obra)
  if (tiposFaltando.length){
    root.appendChild(el(`<div class="card" style="border-color:rgba(20,184,166,0.30);background:rgba(20,184,166,0.04)">
      <div class="h2" style="color:#5EEAD4;margin:0">+ Pode fazer</div>
      <div class="small">Tipos de laudo que ainda não foram criados nesta obra</div>
    </div>`));
    for (const t of tiposFaltando){
      const lbl = TIPOS[t].label;
      const b = el(`<button class="ghost" style="margin-top:6px">+ Criar ${esc(lbl)}</button>`);
      b.onclick = () => renderNovoLaudo({ card_id: cardId, obra: card.obra, cliente: card.title, tipo: t });
      root.appendChild(b);
    }
  }
}

// ╔══════════════════════════════════════════════════════════════╗
// ║ GESTÃO NA OBRA — fiscal responsável + modelos (gestao.itens)  ║
// ║ Mesmos itens da página do projeto no gestao.parket.works.     ║
// ╚══════════════════════════════════════════════════════════════╝
const ITEM_ST = {
  pendente:    { label: "pendente",    color: "#FBBF24" },
  em_execucao: { label: "em execução", color: "#60A5FA" },
  entregue:    { label: "entregue",    color: "#34D399" },
};

async function renderGestaoObraInfo(wrap, cardId, card){
  let d = null;
  try {
    const r = await fetch(`${GESTAO_API}/api/fiscal/obra/${cardId}`);
    if (r.ok) d = await r.json();
  } catch (_e) { /* gestão fora do ar — segue sem os dados */ }

  // ── FISCAL RESPONSÁVEL (kanban_cards.details.fiscais — vínculo do gestão)
  const fiscais = (card.details && Array.isArray(card.details.fiscais)) ? card.details.fiscais : [];
  const fx = el(`<div class="card">
    <div class="label" style="color:var(--pk-accent)">Fiscal responsável</div>
    <div data-role="f-lista" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px"></div>
    <div data-role="f-add" style="display:flex;gap:6px;margin-top:8px"></div>
  </div>`);
  wrap.appendChild(fx);
  const flista = fx.querySelector('[data-role="f-lista"]');
  if (fiscais.length){
    for (const f of fiscais){
      const chip = el(`<span class="tag" style="background:rgba(52,211,153,0.15);color:#34D399;display:inline-flex;align-items:center;gap:6px;font-weight:700;padding:5px 10px">${esc(f.nome || "—")}<span data-x style="cursor:pointer;opacity:0.65">✕</span></span>`);
      chip.querySelector("[data-x]").onclick = async () => {
        if (!d || !d.projeto){ alert("Obra sem projeto no gestão — não dá pra desvincular por aqui."); return; }
        if (!confirm(`Remover ${f.nome || "este fiscal"} desta obra?`)) return;
        try {
          const r = await fetch(`${GESTAO_API}/api/fiscal/equipe/${f.id}/projetos/${d.projeto.id}`, {
            method: "DELETE",
            headers: { "X-User-Email": (_user && _user.email) || "" },
          });
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          renderObraDetail(cardId);
        } catch (e){ alert("Erro ao desvincular: " + (e.message || e)); }
      };
      flista.appendChild(chip);
    }
  } else {
    flista.appendChild(el(`<span class="small">Nenhum fiscal vinculado a esta obra ainda.</span>`));
  }
  if (d && d.projeto){
    let fisOpts = _fiscaisLista;
    if (!fisOpts || !fisOpts.length){
      const { data: fis } = await sb.from("fiscal_equipe").select("id, nome").eq("ativo", true).order("nome");
      fisOpts = fis || [];
    }
    const jaIds = new Set(fiscais.map(f => f.id));
    const opts = fisOpts.filter(f => !jaIds.has(f.id));
    if (opts.length){
      const add = fx.querySelector('[data-role="f-add"]');
      const sel = el(`<select style="flex:1"><option value="">+ vincular fiscal…</option>${opts.map(f => `<option value="${f.id}">${esc(f.nome)}</option>`).join("")}</select>`);
      const btn = el(`<button class="ghost" style="width:auto;padding:6px 14px;font-size:12px">Vincular</button>`);
      btn.onclick = async () => {
        const fid = sel.value;
        if (!fid) return;
        btn.disabled = true;
        try {
          const r = await fetch(`${GESTAO_API}/api/fiscal/equipe/${fid}/projetos`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-User-Email": (_user && _user.email) || "" },
            body: JSON.stringify({ projeto_id: d.projeto.id }),
          });
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          renderObraDetail(cardId);
        } catch (e){
          btn.disabled = false;
          alert("Erro ao vincular: " + (e.message || e));
        }
      };
      add.appendChild(sel); add.appendChild(btn);
    }
  }

  // ── MODELOS DA OBRA (mesma organização do gestão: agrupado por raiz do meta.codigo)
  if (!d || !d.itens || !d.itens.length) return;
  const itens = d.itens;
  const codDe = (it) => String((it.meta && it.meta.codigo) || it.ordem || "");
  const cmpCod = (a, b) => {
    const pa = a.split(".").map(Number), pb = b.split(".").map(Number);
    for (let i = 0; i < Math.max(pa.length, pb.length); i++){
      const dd = (pa[i] || 0) - (pb[i] || 0);
      if (dd !== 0) return dd;
    }
    return 0;
  };
  const raizes = new Map();
  for (const it of itens){
    const raiz = codDe(it).split(".")[0];
    if (!raizes.has(raiz)) raizes.set(raiz, []);
    raizes.get(raiz).push(it);
  }
  wrap.appendChild(el(`<div class="card" style="border-color:rgba(150,132,115,0.30)">
    <div class="h2" style="margin:0">Modelos da obra</div>
    <div class="small">${itens.length} item(ns) do projeto no gestão${d.projeto && d.projeto.numero_proposta ? " · proposta " + esc(String(d.projeto.numero_proposta)) : ""}</div>
  </div>`));
  for (const [raiz, grupo] of Array.from(raizes.entries()).sort((a, b) => cmpCod(a[0], b[0]))){
    grupo.sort((x, y) => cmpCod(codDe(x), codDe(y)));
    const m0 = grupo[0].meta || {};
    const catRaiz = String(m0.categoria_raiz || (grupo[0].categoria || "").split("||")[0] || "").toUpperCase();
    const prodRaiz = m0.produto_header || grupo[0].descritivo || "";
    const box = el(`<div class="card">
      <div style="font-size:10px;letter-spacing:0.10em;color:var(--pk-accent);font-weight:700">${esc(catRaiz)}</div>
      <div style="font-size:13px;font-weight:600;margin:2px 0 8px">${esc(prodRaiz)}</div>
      <div data-role="linhas" style="display:flex;flex-direction:column;gap:7px"></div>
    </div>`);
    const linhas = box.querySelector('[data-role="linhas"]');
    for (const it of grupo){
      const st = ITEM_ST[it.status] || { label: it.status || "—", color: "#9CA3AF" };
      const cod = codDe(it);
      const qtd = Number(it.quantidade) || 0;
      const inst = it.meta && it.meta.obra && it.meta.obra.qtd_instalada;
      const instTxt = (inst != null && qtd) ? ` · ${inst}/${qtd} instalado` : "";
      linhas.appendChild(el(`<div style="display:flex;justify-content:space-between;gap:8px;align-items:center">
        <div style="flex:1;min-width:0">
          <div style="font-size:12px">${cod ? esc(cod) + " · " : ""}${esc(it.ambiente || "—")}</div>
          <div class="small">${qtd} ${esc(it.unidade || "")}${esc(instTxt)}</div>
        </div>
        <span class="tag" style="background:${st.color}22;color:${st.color};flex-shrink:0;font-weight:700">${esc(st.label)}</span>
      </div>`));
    }
    wrap.appendChild(box);
  }
}

// ╔══════════════════════════════════════════════════════════════╗
// ║ CHECKLIST DE INÍCIO DE OBRAS (etapa 3 — gestão / Central)      ║
// ║ Serviços vêm dos itens contratados do gestão; respostas gravam ║
// ║ em gestao.projeto_etapas.meta.checklist via API do gestão.     ║
// ╚══════════════════════════════════════════════════════════════╝
const CK_OBRA_LABEL = { piso: "Piso", deck: "Deck", forro: "Forro", painel: "Painel", porta: "Porta", escada: "Escada", bancos: "Bancos" };

async function renderChecklistInicioObra(cardId, info){
  unsubscribeFiscalRealtime();
  root.innerHTML = "";
  root.appendChild(el(`<div style="margin-bottom:10px">
    <button class="ghost" id="_back" style="width:auto;padding:6px 12px;font-size:12px">← Voltar</button>
  </div>`));
  document.getElementById("_back").onclick = () => renderObraDetail(cardId);

  let d;
  try {
    const r = await fetch(`${GESTAO_API}/api/fiscal/checklist-obra/${cardId}`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    d = await r.json();
  } catch (e){
    root.appendChild(el(`<div class="card"><div class="err">Não consegui carregar o checklist do gestão (${esc(String(e.message || e))}).</div></div>`));
    return;
  }
  if (!d.servicos || !d.servicos.length){
    root.appendChild(el(`<div class="card"><div class="small">Nenhum serviço contratado identificado no gestão pra esta obra.</div></div>`));
    return;
  }

  root.appendChild(el(`<div class="card" style="background:linear-gradient(135deg,rgba(150,132,115,0.12),rgba(150,132,115,0.04));border-color:rgba(150,132,115,0.3)">
    <div class="label" style="color:var(--pk-accent)">Checklist de Início de Obras</div>
    <div style="font-size:17px;font-weight:700;margin:4px 0 2px">${esc((info && info.title) || d.cliente || "—")}</div>
    <div class="small">Serviços contratados: ${d.servicos.map(s => s.toUpperCase()).join(", ")}${d.checklist_em ? " · último salvamento " + fmtDate(d.checklist_em) : ""}</div>
    <div class="small" style="margin-top:2px">As respostas aparecem na Central do Cliente (etapa 3).</div>
  </div>`));

  const ck = d.checklist || {};
  const perguntasDe = (s) => (CK["1vistoria"] && CK["1vistoria"][s]) || (CK["2vistoria"] && CK["2vistoria"][s]) || [];

  for (const s of d.servicos){
    const perguntas = perguntasDe(s);
    if (!perguntas.length) continue;
    if (!ck[s]) ck[s] = {};
    const sec = el(`<div class="card"><div class="h2">${esc(CK_OBRA_LABEL[s] || s.toUpperCase())}</div></div>`);
    for (const q of perguntas){
      const state = ck[s][q] || { valor: null, obs: "" };
      ck[s][q] = state;
      const row = document.createElement("div");
      row.className = "ck-row";
      row.innerHTML = `
        <div class="ck-q">${esc(q)}</div>
        <div class="ck-btns">
          <button class="ck-btn sim ${state.valor==="sim"?"on":""}" data-v="sim">Sim</button>
          <button class="ck-btn nao ${state.valor==="nao"?"on":""}" data-v="nao">Não</button>
          <button class="ck-btn na  ${state.valor==="na" ?"on":""}" data-v="na">N/A</button>
        </div>
        <input class="ck-obs" placeholder="Observação (opcional)" value="${esc(state.obs||"")}"/>
      `;
      row.querySelectorAll(".ck-btn").forEach(btn => {
        btn.onclick = (ev) => {
          ev.preventDefault();
          state.valor = btn.dataset.v;
          row.querySelectorAll(".ck-btn").forEach(b => b.classList.toggle("on", b === btn));
        };
      });
      row.querySelector(".ck-obs").oninput = (ev) => { state.obs = ev.target.value; };
      sec.appendChild(row);
    }
    root.appendChild(sec);
  }

  const btn = el(`<button class="primary" style="margin-top:8px">Salvar checklist</button>`);
  const msg = el(`<div></div>`);
  btn.onclick = async () => {
    btn.disabled = true; btn.textContent = "Salvando…";
    let total = 0, feitos = 0;
    for (const s of d.servicos){
      for (const q of perguntasDe(s)){
        total++;
        if (ck[s] && ck[s][q] && ck[s][q].valor) feitos++;
      }
    }
    const status = feitos === 0 ? "pendente" : feitos < total ? "em_andamento" : "concluida";
    try {
      const r = await fetch(`${GESTAO_API}/api/fiscal/checklist-obra/${cardId}`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ checklist: ck, checklist_por: fiscalAtualNome() || null, status }),
      });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      msg.innerHTML = `<div class="ok">✓ Checklist salvo — ${feitos}/${total} verificações. Já visível na Central do Cliente.</div>`;
    } catch (e){
      msg.innerHTML = `<div class="err">Erro ao salvar (${esc(String(e.message || e))}).</div>`;
    } finally {
      btn.disabled = false; btn.textContent = "Salvar checklist";
    }
  };
  root.appendChild(btn);
  root.appendChild(msg);
}

// ╔══════════════════════════════════════════════════════════════╗
// ║ NOVO LAUDO                                                     ║
// ╚══════════════════════════════════════════════════════════════╝
async function renderNovoLaudo(preset){
  unsubscribeFiscalRealtime();
  root.innerHTML = "";
  root.appendChild(el(`<div style="margin-bottom:10px">
    <button class="ghost" id="_back" style="width:auto;padding:6px 12px;font-size:12px">← Voltar</button>
  </div>`));
  document.getElementById("_back").onclick = () => renderHome();

  const tipoInicial = (preset && preset.tipo) || "1vistoria";

  const SERVICOS_OPTS = ["piso","deck","forro","painel","porta","escada","bancos"];

  const card = el(`<div class="card">
    <div class="h1">Novo laudo</div>
    <div style="height:10px"></div>
    <div class="label">Tipo</div>
    <select id="_tipo">${Object.entries(TIPOS).map(([k,v]) => `<option value="${k}" ${k===tipoInicial?"selected":""}>${esc(v.label)}</option>`).join("")}</select>
    <div style="height:10px"></div>
    <div class="label">Obra (código)</div>
    <input id="_obra" placeholder="ex: OBRA-2026-001" value="${esc(preset && preset.obra || "")}"/>
    <div style="height:10px"></div>
    <div class="label">Cliente</div>
    <input id="_cliente" value="${esc(preset && preset.cliente || "")}"/>
    <div style="height:10px"></div>
    <div class="label">Data da vistoria</div>
    <input id="_data" type="datetime-local" value="${new Date().toISOString().slice(0,16)}"/>
    <div style="height:10px"></div>
    <div id="_servicos_wrap" style="display:none">
      <div class="label">Serviços inclusos <span style="color:var(--pk-text-muted);font-size:10px">(marque o que vai vistoriar)</span></div>
      <div id="_servicos" style="margin-top:6px;display:flex;flex-wrap:wrap;gap:6px"></div>
    </div>
    <div style="height:14px"></div>
    <button class="primary" id="_criar">Criar e preencher</button>
    <div id="_msg"></div>
  </div>`);
  root.appendChild(card);

  // Toggle serviços só aparece pra 1ª/2ª vistoria
  let servSelecionados = new Set();
  // Quando vem de um card, restringe a lista de OPÇÕES aos serviços do projeto
  // (não só pré-seleciona, esconde os que não foram contratados). Sem card,
  // permanece null = mostra todos.
  let projetoServicos = null;
  if (preset && preset.card_id){
    (async () => {
      try {
        const { data: card } = await sb.from("kanban_cards")
          .select("details")
          .eq("id", preset.card_id)
          .single();
        const det = (card && card.details) || {};
        // 1) preferência: levantamento_itens.servicos[] — vem do orçamento real
        const sold = new Set();
        const lev = det.levantamento_itens && det.levantamento_itens.servicos;
        if (Array.isArray(lev)){
          for (const s of lev){
            const n = String((s && s.nome) || "").toLowerCase().trim();
            if (!n) continue;
            // Mapeia variações pro nosso vocabulário curto
            if (/^piso/.test(n)) sold.add("piso");
            else if (/^deck/.test(n)) sold.add("deck");
            else if (/^forro/.test(n)) sold.add("forro");
            else if (/^painel/.test(n) || /^revestimento/.test(n)) sold.add("painel");
            else if (/^porta/.test(n)) sold.add("porta");
            else if (/^escada/.test(n)) sold.add("escada");
            else if (/^banco/.test(n) || /^banc/.test(n)) sold.add("bancos");
          }
        }
        // 2) fallback: produto_interesse texto livre
        if (sold.size === 0 && det.produto_interesse){
          const p = String(det.produto_interesse).toLowerCase();
          for (const k of ["piso","deck","forro","painel","porta","escada","banco"]){
            if (p.includes(k)) sold.add(k === "banco" ? "bancos" : k);
          }
        }
        if (sold.size > 0){
          servSelecionados = new Set(sold);  // pré-marca todos
          projetoServicos = sold;            // e tranca a lista exibida
          refreshServicos();
        }
      } catch (_e) { /* silently ignore */ }
    })();
  }
  function refreshServicos(){
    const t = document.getElementById("_tipo").value;
    const wrap = document.getElementById("_servicos_wrap");
    const box = document.getElementById("_servicos");
    if (t === "1vistoria" || t === "2vistoria"){
      wrap.style.display = "block";
      box.innerHTML = "";
      let opts = t === "2vistoria" ? SERVICOS_OPTS : SERVICOS_OPTS.filter(s => s !== "bancos");
      // Se veio de um card e o projeto lista serviços, mostra SÓ esses.
      // Sem card (laudo avulso) ou projeto sem levantamento → mostra tudo.
      if (projetoServicos && projetoServicos.size > 0){
        opts = opts.filter(s => projetoServicos.has(s));
      }
      for (const s of opts){
        const b = document.createElement("button");
        const on = servSelecionados.has(s);
        b.textContent = s.toUpperCase();
        b.style.cssText = `flex:0 0 auto;padding:7px 12px;border-radius:0;font-size:11px;font-weight:700;cursor:pointer;border:1px solid ${on?"var(--pk-accent)":"var(--pk-border2)"};background:${on?"rgba(150,132,115,0.22)":"transparent"};color:${on?"var(--pk-accent)":"var(--pk-text-dim)"};width:auto`;
        b.onclick = (ev) => {
          ev.preventDefault();
          if (servSelecionados.has(s)) servSelecionados.delete(s);
          else servSelecionados.add(s);
          refreshServicos();
        };
        box.appendChild(b);
      }
    } else {
      wrap.style.display = "none";
    }
  }
  refreshServicos();
  document.getElementById("_tipo").onchange = refreshServicos;

  document.getElementById("_criar").onclick = async () => {
    const tipo = document.getElementById("_tipo").value;
    const obra = document.getElementById("_obra").value.trim();
    const cliente = document.getElementById("_cliente").value.trim();
    const data = document.getElementById("_data").value;
    const msgEl = document.getElementById("_msg");
    if (!obra || !cliente){
      msgEl.innerHTML = `<div class="err">Preencha obra e cliente.</div>`;
      return;
    }
    const fId = fiscalAtualId();
    const fNome = fiscalAtualNome();
    if (!fId){
      msgEl.innerHTML = `<div class="err">Selecione um fiscal pra operar como (no topo da Home).</div>`;
      return;
    }
    // Pra 1ª/2ª vistoria: exige pelo menos 1 serviço selecionado
    if ((tipo === "1vistoria" || tipo === "2vistoria") && servSelecionados.size === 0){
      msgEl.innerHTML = `<div class="err">Selecione pelo menos 1 serviço inclusio.</div>`;
      return;
    }
    msgEl.innerHTML = `<div class="small"><span class="spinner"></span> Criando…</div>`;
    const { data: ins, error } = await sb.from("fiscal_laudos").insert({
      card_id: (preset && preset.card_id) || null,
      obra, cliente,
      tipo, status: "em_andamento",
      fiscal_id: fId, fiscal_nome: fNome,
      data_vistoria: data ? new Date(data).toISOString() : new Date().toISOString(),
      servicos_inclusos: (tipo === "1vistoria" || tipo === "2vistoria") ? Array.from(servSelecionados) : null,
    }).select().single();
    if (error){
      msgEl.innerHTML = `<div class="err">${esc(error.message)}</div>`;
      return;
    }
    renderEditarLaudo(ins.id);
  };
}
