<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Guia Parket — Fichas Técnicas</title>
  <meta name="description" content="Fichas técnicas das espécies de madeira Parket — especificações, manuseio e características.">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Guia Parket — Fichas Técnicas">
  <meta property="og:description" content="Fichas técnicas das espécies de madeira Parket — especificações, manuseio e características.">
  <meta property="og:url" content="https://guia.parket.works/">
  <meta property="og:image" content="https://guia.parket.works/apple-touch-icon.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Guia Parket — Fichas Técnicas">
  <meta name="twitter:image" content="https://guia.parket.works/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('guia-parket-theme');
        var prefers = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', saved || (prefers ? 'dark' : 'light'));
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <style>
    :root, [data-theme="light"] {
      --bg: #faf9f5;
      --surface: #fff;
      --surface-2: #f4f2ec;
      --border: #ebe8df;
      --fg: #17130e;
      --fg-soft: #666;
      --muted: #999;
      --accent: #9a6638;
      --accent-soft: #c0bda6;
      --card-shadow: 0 6px 20px rgba(23,19,14,0.05);
      --badge-disp-bg: rgba(154,102,56,0.08);
      --badge-disp-border: rgba(154,102,56,0.25);
    }
    [data-theme="dark"] {
      --bg: #0d0c0a;
      --surface: #17130e;
      --surface-2: #1e1913;
      --border: #2a2520;
      --fg: #f4f2ec;
      --fg-soft: #c0bda6;
      --muted: #7a7268;
      --accent: #c0bda6;
      --accent-soft: #9a6638;
      --card-shadow: 0 6px 20px rgba(0,0,0,0.4);
      --badge-disp-bg: rgba(192,189,166,0.08);
      --badge-disp-border: rgba(192,189,166,0.28);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: var(--bg); color: var(--fg); transition: background .4s, color .4s; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 200;
      font-size: 16px;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    header {
      position: relative;
      padding: 56px 32px 24px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }
    .theme-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--fg-soft);
      border-radius: 999px;
      padding: 8px 12px;
      font: inherit;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color .2s, color .2s, background .2s;
    }
    .theme-toggle:hover { border-color: var(--accent); color: var(--fg); }
    .theme-toggle .icon {
      width: 14px; height: 14px;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .theme-toggle .icon svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.5; }
    [data-theme="light"] .theme-toggle .lbl-light,
    [data-theme="light"] .theme-toggle .icon-sun { display: none; }
    [data-theme="dark"] .theme-toggle .lbl-dark,
    [data-theme="dark"] .theme-toggle .icon-moon { display: none; }
    .brand {
      font-weight: 200;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      font-size: 13px;
      color: var(--fg);
    }
    .brand span { color: var(--accent); }
    h1 {
      margin-top: 20px;
      font-weight: 200;
      font-size: 42px;
      letter-spacing: 0.02em;
      line-height: 1.15;
    }
    .subtitle {
      margin-top: 12px;
      font-size: 13px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--muted);
    }

    main {
      flex: 1;
      padding: 56px 32px 64px;
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
    }
    .section-label {
      font-weight: 300;
      font-size: 11px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .grid {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
    }
    .card {
      position: relative;
      display: block;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 24px 22px 22px;
      text-decoration: none;
      color: inherit;
      transition: border-color .2s, transform .2s, box-shadow .2s, background .4s;
      min-height: 128px;
    }
    .card[data-status="disponivel"]:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
      box-shadow: var(--card-shadow);
    }
    .card[data-status="em-breve"] {
      cursor: default;
      background: transparent;
    }
    .card[data-status="em-breve"] .name { color: var(--fg-soft); }

    .kind {
      font-weight: 300;
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .name {
      margin-top: 10px;
      font-weight: 300;
      font-size: 20px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .badge {
      position: absolute;
      top: 18px;
      right: 18px;
      font-weight: 400;
      font-size: 9px;
      letter-spacing: 0.24em;
      padding: 4px 8px;
      border-radius: 999px;
      text-transform: uppercase;
    }
    .badge.disponivel {
      color: var(--accent);
      background: var(--badge-disp-bg);
      border: 1px solid var(--badge-disp-border);
    }
    .badge.em-breve {
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--border);
    }

    .cta {
      margin-top: 18px;
      font-weight: 400;
      font-size: 11px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .cta::after {
      content: "→";
      transition: transform .2s;
    }
    .card:hover .cta::after { transform: translateX(3px); }

    footer {
      padding: 28px 32px;
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }
    footer a { color: var(--fg-soft); text-decoration: none; }
    footer a:hover { color: var(--accent); }

    @media (max-width: 640px) {
      header { padding: 40px 20px 20px; }
      h1 { font-size: 30px; }
      main { padding: 40px 20px 48px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
      .card { padding: 20px 18px; min-height: 110px; }
      .name { font-size: 17px; }
    }
  </style>
</head>
<body>
  <header>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Alternar tema">
      <span class="icon icon-sun" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
      <span class="icon icon-moon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg></span>
      <span class="lbl lbl-light">Claro</span>
      <span class="lbl lbl-dark">Escuro</span>
    </button>
    <div class="brand">Guia <span>Parket</span></div>
    <h1>Fichas Técnicas</h1>
    <div class="subtitle">Madeiras · Especificações · Manuseio</div>
  </header>

  <main>
    <div class="section-label">Espécies · Pisos e revestimentos</div>
    <ul class="grid" id="grid">
      <!-- items injected by JS -->
    </ul>
  </main>

  <footer>
    guia.parket.works · <a href="https://parket.com.br" target="_blank" rel="noopener">parket.com.br</a>
  </footer>

  <script>
    document.getElementById('themeToggle').addEventListener('click', function () {
      const root = document.documentElement;
      const cur = root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      const next = cur === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('guia-parket-theme', next); } catch (e) {}
    });

    const ESPECIES = [
      { nome: "Bálsamo", slug: "balsamo" },
      { nome: "Bambu", slug: "bambu" },
      { nome: "Cabreúva Branca", slug: "cabreuva-branca" },
      { nome: "Cabreúva Dourada", slug: "cabreuva-dourada" },
      { nome: "Carvalho Europeu", slug: "carvalho-europeu" },
      { nome: "Catuaba", slug: "catuaba" },
      { nome: "Cedro Rosa", slug: "cedro-rosa" },
      { nome: "Cumaru", slug: "cumaru" },
      { nome: "Freijó", slug: "freijo" },
      { nome: "Imbuia", slug: "imbuia" },
      { nome: "Ipê", slug: "ipe" },
      { nome: "Loro Pardo", slug: "loro-pardo" },
      { nome: "Nogueira Walnut", slug: "nogueira-walnut" },
      { nome: "Pau Ferro", slug: "pau-ferro" },
      { nome: "Pau Mulato", slug: "pau-mulato" },
      { nome: "Peroba do Campo", slug: "peroba-do-campo" },
      { nome: "Perobinha Mica", slug: "perobinha-mica" },
      { nome: "Sucupira", slug: "sucupira" },
      { nome: "Sucupira Negra", slug: "sucupira-negra" },
      { nome: "Tauari", slug: "tauari" },
      { nome: "Tauari Marrone", slug: "tauari-marrone" },
      { nome: "Shou Sugi Ban", slug: "shou-sugi-ban" },
    ];

    const DISPONIVEIS = new Set(["cumaru"]);

    const grid = document.getElementById("grid");
    const frag = document.createDocumentFragment();

    ESPECIES.forEach(e => {
      const disp = DISPONIVEIS.has(e.slug);
      const el = document.createElement(disp ? "a" : "div");
      el.className = "card";
      el.dataset.status = disp ? "disponivel" : "em-breve";
      if (disp) el.href = "/" + e.slug + "/";

      el.innerHTML = `
        <span class="badge ${disp ? "disponivel" : "em-breve"}">${disp ? "Disponível" : "Em breve"}</span>
        <div class="kind">Madeira</div>
        <div class="name">${e.nome}</div>
        ${disp ? '<div class="cta">Abrir ficha</div>' : ''}
      `;
      frag.appendChild(el);
    });

    grid.appendChild(frag);
  </script>
</body>
</html>
