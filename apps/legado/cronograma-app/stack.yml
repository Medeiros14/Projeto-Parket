version: "3.9"

networks:
  network_public:
    external: true

services:
  web:
    image: parket-cronograma:latest
    networks: [network_public]
    deploy:
      replicas: 1
      restart_policy: { condition: on-failure, delay: 5s }
      update_config: { parallelism: 1, order: start-first, failure_action: rollback }
      resources:
        limits: { memory: 192M }
        reservations: { memory: 48M }
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_public"
        - "traefik.http.routers.cronograma.rule=Host(`cronograma.parket.works`)"
        - "traefik.http.routers.cronograma.entrypoints=websecure"
        - "traefik.http.routers.cronograma.tls=true"
        - "traefik.http.routers.cronograma.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.cronograma.service=cronograma"
        - "traefik.http.routers.cronograma-http.rule=Host(`cronograma.parket.works`)"
        - "traefik.http.routers.cronograma-http.entrypoints=web"
        - "traefik.http.routers.cronograma-http.middlewares=https-redirect"
        - "traefik.http.routers.cronograma-http.service=cronograma"
        - "traefik.http.services.cronograma.loadbalancer.server.port=80"
        - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
        - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"
