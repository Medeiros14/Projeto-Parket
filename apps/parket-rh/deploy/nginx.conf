server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.svg {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Proxy reverso para a API de Clicksign do RH.
    # O backend roda no service parket-dashboard_backend (rede swarm interna).
    # Externamente, a API aparece como rh.parket.works/api/clicksign/* —
    # mantém o domínio RH coeso e desacopla do parket-draw.
    # API do RH — backend dedicado parket-rh-api_api (stack próprio).
    # NOT proxy_pass http://draw.parket.works — desacoplado completamente.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $rh_api "parket-rh-api_api";
        proxy_pass http://$rh_api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 50M;
    }
}
