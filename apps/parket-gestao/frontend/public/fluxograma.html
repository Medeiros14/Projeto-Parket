<!DOCTYPE html>

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Fluxograma — Sistema Parket</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background:#0d0f12; color:#e8e6e1; font-family:'Inter',system-ui,sans-serif; overflow:hidden; }
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    padding: 12px 18px; background: rgba(13,15,18,.88); backdrop-filter: blur(10px);
    border-bottom: 1px solid #22262e;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  h1 { font-size: 14px; letter-spacing: .08em; font-weight: 600; margin: 0; }
  p.sub { color:#9a968e; font-size: 9px; letter-spacing: .18em; margin: 2px 0 0; }
  .tabs { display: flex; gap: 6px; margin-left: auto; }
  .tabs button {
    padding: 8px 14px; font-size: 10px; letter-spacing: .16em; font-weight: 600;
    background: #1a1e26; color: #9a968e; border: 1px solid #2e3440; cursor: pointer;
  }
  .tabs button.on { background: #e8e6e1; color: #0d0f12; border-color: #e8e6e1; }
  #canvas { position: absolute; inset: 0; padding-top: 62px; }
  #canvas svg { width: 100%; height: 100%; cursor: grab; }
  #canvas svg:active { cursor: grabbing; }
  .controls {
    position: fixed; right: 16px; bottom: 18px; z-index: 20;
    display: flex; flex-direction: column; gap: 8px;
  }
  .controls button {
    width: 44px; height: 44px; border-radius: 999px;
    background: #1a1e26; color: #e8e6e1; border: 1px solid #2e3440;
    font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .controls button:active { background: #2e3440; }
  .controls button.small { font-size: 11px; letter-spacing: .05em; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #9a968e; font-size: 11px; letter-spacing: .25em; z-index: 5; }
  .hint { position: fixed; left: 16px; bottom: 18px; color: #6b675f; font-size: 10px; letter-spacing: .12em; z-index: 20; }
  @media (max-width: 640px) { .hint { display: none; } }
</style>

<script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.2/dist/svg-pan-zoom.min.js"></script>
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  mermaid.initialize({
    startOnLoad: false,
    theme: "dark",
    securityLevel: "loose",
    flowchart: { curve: "basis", useMaxWidth: false, nodeSpacing: 46, rankSpacing: 64 },
  });

  const canvas = document.getElementById("canvas");
  let pz = null;
  let n = 0;

  async function show(which) {
    const src = document.getElementById(`src-${which}`).textContent.trim();
    if (pz) { pz.destroy(); pz = null; }
    const { svg } = await mermaid.render(`fluxo${n++}`, src);
    canvas.innerHTML = svg;
    const el = canvas.querySelector("svg");
    el.removeAttribute("width");
    el.removeAttribute("height");
    el.style.maxWidth = "none";
    pz = svgPanZoom(el, {
      zoomEnabled: true,
      controlIconsEnabled: false,
      fit: true,
      center: true,
      minZoom: 0.2,
      maxZoom: 40,
      zoomScaleSensitivity: 0.35,
      dblClickZoomEnabled: true,
    });

    // Pinça no celular
    let lastDist = null;
    el.addEventListener("touchmove", (e) => {
      if (e.touches.length !== 2) { lastDist = null; return; }
      e.preventDefault();
      const d = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      if (lastDist) {
        const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        pz.zoomAtPointBy(d / lastDist, { x: cx, y: cy });
      }
      lastDist = d;
    }, { passive: false });
    el.addEventListener("touchend", () => { lastDist = null; });

    document.getElementById("tab-simples").classList.toggle("on", which === "simples");
    document.getElementById("tab-completo").classList.toggle("on", which === "completo");
    const loading = document.getElementById("loading");
    if (loading) loading.remove();
  }

  document.getElementById("tab-simples").onclick = () => show("simples");
  document.getElementById("tab-completo").onclick = () => show("completo");
  document.getElementById("zin").onclick = () => pz && pz.zoomBy(1.35);
  document.getElementById("zout").onclick = () => pz && pz.zoomBy(1 / 1.35);
  document.getElementById("fit").onclick = () => { if (pz) { pz.resetZoom(); pz.fit(); pz.center(); } };
  window.addEventListener("resize", () => { if (pz) { pz.resize(); pz.fit(); pz.center(); } });

  await show("simples");
</script>
</body>
