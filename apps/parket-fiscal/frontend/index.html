      <div style="margin-top:14px">
        <div class="label" style="color:var(--pk-accent);margin-bottom:4px">Setor responsável</div>
        <select data-setor style="width:100%;background:var(--pk-card2);color:var(--pk-text);border:1px solid var(--pk-border1);padding:10px;font-size:14px;box-sizing:border-box">
          ${setorOpcoes}
        </select>
      </div>

      <div style="margin-top:14px">
        <div class="label" style="color:var(--pk-accent);margin-bottom:4px">Descreva o problema</div>
        <textarea data-desc style="width:100%;min-height:110px;background:var(--pk-card2);color:var(--pk-text);border:1px solid var(--pk-border1);padding:10px;font-size:14px;box-sizing:border-box;resize:vertical" placeholder="O que aconteceu na obra? Quanto mais detalhes, mais rápido a equipe age."></textarea>
      </div>

      <div style="margin-top:14px">
        <div class="label" style="color:var(--pk-accent);margin-bottom:4px">Anexos (fotos, PDFs, qualquer arquivo)</div>
        <div style="display:flex;gap:6px;margin-top:4px;flex-wrap:wrap">
          <label style="flex:1;min-width:110px;background:rgba(150,132,115,0.10);border:1px dashed rgba(150,132,115,0.35);color:var(--pk-accent);padding:9px 10px;font-size:11px;font-weight:600;text-align:center;cursor:pointer">

  const listaEl = overlay.querySelector("[data-anexos]");

    listaEl.innerHTML = "";
    anexos.forEach((f, i) => {
      const kb = Math.max(1, Math.round(f.size / 1024));
      const size = kb < 1024 ? `${kb}KB` : `${(kb / 1024).toFixed(1)}MB`;

      row.querySelector("[data-rm]").onclick = () => { anexos.splice(i, 1); paintAnexos(); };

    });
  };

      Array.from(e.target.files || []).forEach(f => {
        if (f.size > 50 * 1024 * 1024) {
          _appToast(`${f.name}: acima de 50MB, não anexado.`);
          return;
        }
        anexos.push(f);
      });
      e.target.value = "";
      paintAnexos();
    };
  });

  overlay.querySelector("[data-ok]").onclick = async (ev) => {
    const btn = ev.currentTarget;
    const erro = overlay.querySelector("[data-erro]");
    const desc = overlay.querySelector("[data-desc]").value.trim();
    const setor = overlay.querySelector("[data-setor]").value || null;
    const prazo = overlay.querySelector("[data-prazo]").value || null;
    if (!desc){
      erro.style.display = "block";
      erro.textContent = "Descreva o problema antes de enviar.";
      return;

          setor_responsavel: setor,
          prazo,
        }),
      });
      if (!r.ok) throw new Error(await r.text());
      const crise = await r.json();

      // Sobe anexos (best-effort) e posta como comentário inicial na crise.
      if (anexos.length){
        const uploaded = [];
        for (let i = 0; i < anexos.length; i++){
          const f = anexos[i];
          btn.textContent = `Anexando ${i + 1}/${anexos.length}…`;
          try {
            const fd = new FormData();
            fd.append("file", f);
            const upH = emailFiscal ? { "X-User-Email": emailFiscal } : {};
            const ur = await fetchGestao(`${GESTAO_API}/api/crises/${crise.id}/anexo`,
              { method: "POST", body: fd, headers: upH });
            if (ur.ok) uploaded.push(await ur.json());
          } catch (_) { /* pula anexo que falhou, alerta principal já foi salvo */ }
        }
        if (uploaded.length){
          await fetchGestao(`${GESTAO_API}/api/crises/${crise.id}/comentarios`, {
            method: "POST", headers: H,
            body: JSON.stringify({
              texto: `Anexos enviados junto com o alerta (${uploaded.length}).`,
              anexos: uploaded,
              publicar_chat: true,
            }),
          }).catch(() => {});
        }
      }

      overlay.remove();
      _appToast(anexos.length
        ? `Alerta enviado com ${anexos.length} anexo(s). O setor responsável foi notificado.`
        : "Alerta enviado. O setor responsável foi notificado no gestor de crises.");
    } catch (e){
      btn.disabled = false; btn.textContent = "Enviar alerta";
      erro.style.display = "block";
      erro.textContent = `Não deu pra enviar o alerta (${(e && e.message) || e}). Verifique o sinal e toque em Enviar alerta de novo.`;
    }
  };

// ╔══════════════════════════════════════════════════════════════╗
// ║ DETALHE DA OBRA — feito / pra fazer / criar novo              ║
// ╚══════════════════════════════════════════════════════════════╝
// `opts.realtime` = re-render disparado pelo próprio realtime, não por navegação:
// não mostra spinner (a tela atual fica no ar até o conteúdo novo entrar) e quem
// chamou devolve a rolagem pro lugar.
async function renderObraDetail(cardId, opts){
  const _rt = !!(opts && opts.realtime);
  const _seq = ++_obraRenderSeq;
  unsubscribeFiscalRealtime();
  if (!_rt) root.innerHTML = `<div class="card center"><span class="spinner"></span></div>`;

  // Carrega card + laudos + agenda dessa obra (filtrados pelo fiscal atual)
  const filtroFiscalId = _isAdmin ? _operandoComoId : (_fiscal && _fiscal.id);
  const { data: card } = await sb.from("kanban_cards")
    .select("id, title, obra, column_id, dept_id, responsavel, details, status_mapa_id")
    .eq("id", cardId)
    .maybeSingle();
  if (!card){
    root.innerHTML = `<div class="card"><div class="err">Obra não encontrada.</div></div>`;
    return;
  }

  // Outro render assumiu enquanto este esperava o banco: sai sem tocar na tela.
  if (_seq !== _obraRenderSeq) return;

  // Realtime: só mudança DESTA obra re-renderiza o detalhe. Debounce evita flood
  // quando o instalador registra vários checks em sequência. Assinado depois do
  // fetch porque prestadores_obra_servicos é filtrado pelo código da obra.
  let _rtObraTimer = null;
  const _rtObraRerender = () => {
    if (_rtObraTimer) clearTimeout(_rtObraTimer);
    _rtObraTimer = setTimeout(async () => {
      if (_rtView !== "obra") return;
      const y = window.scrollY || document.documentElement.scrollTop || 0;
      await renderObraDetail(cardId, { realtime: true });
      window.scrollTo(0, y);
      requestAnimationFrame(() => window.scrollTo(0, y));
    }, 900);
  };
  subscribeFiscalRealtime("obra", _rtObraRerender, {
    fiscal_laudos:             `card_id=eq.${cardId}`,
    fiscal_agenda:             `card_id=eq.${cardId}`,
    kanban_cards:              `id=eq.${cardId}`,
    instala_item_checks:       `card_id=eq.${cardId}`,
    instala_checkins:          `card_id=eq.${cardId}`,
    // obra_id é texto livre (código PKT..., id numérico ou às vezes o endereço).
    // Valor com vírgula/espaço quebraria o parser do filtro e derrubaria o canal
    // inteiro, então só assina quando o código é simples.
    prestadores_obra_servicos: /^[\w-]+$/.test(card.obra || "") ? `obra_id=eq.${card.obra}` : false,
  });

  let qL = sb.from("fiscal_laudos")
    .select("id, fiscal_id, fiscal_nome, tipo, status, servicos_inclusos, data_vistoria, updated_at, created_at, observacoes")
    .eq("card_id", cardId)
    .order("created_at", { ascending: false });
  if (filtroFiscalId) qL = qL.eq("fiscal_id", filtroFiscalId);
  const { data: lds } = await qL;

  let qA = sb.from("fiscal_agenda")
    .select("id, fiscal_id, tipo, data_inicio, status, notas, online, tags")
    .eq("card_id", cardId)
    .order("data_inicio", { ascending: true });
  if (filtroFiscalId) qA = qA.eq("fiscal_id", filtroFiscalId);
  const { data: ags } = await qA;

  const ldsFeitos = (lds || []).filter(l => l.status === "concluido");
  // Rascunho/pendente vira "abandonado" quando existe concluído do MESMO tipo criado
  // depois — o fiscal fez outro laudo no lugar deste. Some da lista Pra fazer.
  // Tipos em TIPOS_MULTI (reparo, acompanhamento) ficam de fora: cada laudo é
  // independente, concluir o da semana não pode sumir com rascunho de outra visita.
  const _ts = (l) => new Date(l.updated_at || l.created_at || 0).getTime();
  const ldsPend = (lds || [])
    .filter(l => l.status === "pendente" || l.status === "em_andamento")
    .filter(l => TIPOS_MULTI.includes(l.tipo) || !ldsFeitos.some(f => f.tipo === l.tipo && _ts(f) > _ts(l)));
  // Agendamento cumprido: já existe laudo do mesmo tipo criado >= data agendada.
  const agsCumpridas = new Set((ags || [])
    .filter(a => (lds || []).some(l => l.tipo === a.tipo
      && new Date(l.created_at || 0).getTime() >= new Date(a.data_inicio || 0).getTime()))
    .map(a => a.id));
  const _agsAtivas = (ags || []).filter(a =>
    !agsCumpridas.has(a.id)
    && a.status !== "reagendado" && a.status !== "cancelado" && a.status !== "realizado");
  const _hojeMs = new Date(new Date().setHours(0,0,0,0)).getTime();
  // Agendamento ainda válido (hoje ou futuro).
  const agsFut = _agsAtivas.filter(a => new Date(a.data_inicio).getTime() >= _hojeMs);
  // Vencido: data já passou (antes de hoje 00h) e ninguém entregou laudo.
  const agsVencidas = _agsAtivas.filter(a => new Date(a.data_inicio).getTime() < _hojeMs);

  // Quais tipos já foram feitos vs faltam (pra "Próximos passos").
  // TIPOS_MULTI seguem ofertáveis mesmo com concluídos (acompanhamento é rotina
  // semanal, reparo pode ter vários); somem só enquanto há rascunho aberto do tipo.
  const tiposFeitos = new Set(ldsFeitos.map(l => l.tipo));
  const tiposPossiveis = ["1vistoria", "2vistoria", "acompanhamento", "entrega", "reparo"];
  const tiposFaltando = tiposPossiveis.filter(t =>
    (TIPOS_MULTI.includes(t) || !tiposFeitos.has(t)) && !ldsPend.find(l => l.tipo === t));

  root.innerHTML = "";
  root.appendChild(el(`<div style="margin-bottom:10px">
    <button class="ghost" id="_back" style="width:auto;padding:6px 12px;font-size:12px">← Voltar</button>
  </div>`));
  document.getElementById("_back").onclick = () => voltarPagina();

  // Header da obra + dados do cliente (vindos do gestão / kanban_cards.details)
  const dt = card.details || {};
  const endereco = dt.endereco_obra || dt.endereco || "";
  const cidadeUf = [dt.cidade, dt.estado].filter(Boolean).join(" · ");
  const infoLines = [
    endereco ? `Endereço: ${esc(endereco)}${cidadeUf ? " · " + esc(cidadeUf) : ""}` : (cidadeUf ? `Local: ${esc(cidadeUf)}` : ""),
    dt.celular ? `Contato: ${esc(dt.celular)}` : "",
    (dt.arquiteto || dt.arquitetura) ? `Arquiteto: ${esc(dt.arquiteto || dt.arquitetura)}` : "",
  ].filter(Boolean);
  const projCard = el(`<div class="card" style="background:linear-gradient(135deg,rgba(150,132,115,0.12),rgba(150,132,115,0.04));border-color:rgba(150,132,115,0.3)">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
      <div style="flex:1;min-width:0">
        <div class="label" style="color:var(--pk-accent)">Projeto</div>
        <div style="font-size:18px;font-weight:700;margin:4px 0 2px">${esc(card.title || "-")}</div>
        <div class="small">${esc(card.obra || "-")} · ${esc(card.column_id || "")}${card.responsavel ? " · resp: " + esc(card.responsavel) : ""}</div>
        <div data-role="prest-head" style="display:flex;gap:6px;align-items:center;margin-top:6px;min-width:0"></div>
      </div>
      <button data-alerta title="Alerta de Riscos: abrir crise nesta obra"
              style="flex-shrink:0!important;width:auto!important;background:#B85B4C!important;color:#fff!important;
                     border:none!important;border-radius:3px!important;
                     padding:3px 8px!important;font-size:8px!important;font-weight:600!important;
                     letter-spacing:0.14em!important;text-transform:uppercase!important;
                     font-family:'Inter',sans-serif!important;line-height:1.4!important;
                     cursor:pointer!important;white-space:nowrap!important;align-self:flex-start!important">ALERTA</button>
    </div>
    ${infoLines.length ? `<div class="small" style="margin-top:8px;line-height:1.6">${infoLines.join("<br>")}</div>` : ""}
    ${endAcoesHtml(endereco)}
  </div>`);
  projCard.querySelector("[data-alerta]").onclick = () =>
    abrirAlertaCriseObra({ id: card.id, title: card.title, obra: card.obra });
  // Prestador da obra sempre à vista no topo: com vínculo mostra o principal;
  // sem vínculo já entrega o seletor pra escolher na hora (vincula + principal)
  const prHead = projCard.querySelector('[data-role="prest-head"]');
  const prObra = _prestPrincipalDe(dt.prestadores);
  if (prObra.princ){
    prHead.innerHTML = `<span class="small" style="letter-spacing:0.14em;color:var(--pk-text-muted);text-transform:uppercase;flex-shrink:0">Prestador</span>
      <span style="font-size:13px;font-weight:700;color:var(--pk-accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(prObra.princ.nome)}</span>
      ${prObra.princ.principal ? `<span class="tag" style="background:rgba(150,132,115,0.22);color:var(--pk-accent);flex-shrink:0">PRINCIPAL</span>` : ""}
      ${prObra.total > 1 ? `<span class="small" style="color:var(--pk-text-muted);flex-shrink:0">+${prObra.total - 1}</span>` : ""}`;
  } else {
    prHead.appendChild(el(`<span class="small" style="letter-spacing:0.14em;color:var(--pk-text-muted);text-transform:uppercase;flex-shrink:0">Prestador</span>`));
    const prSlot = el(`<div style="display:flex;gap:6px;align-items:center;flex:1;min-width:0"></div>`);
    prHead.appendChild(prSlot);
    _prestVincInline(prSlot, cardId, () => renderObraDetail(cardId));
  }
  root.appendChild(projCard);

  // ── MAPA DA OBRA (planta publicada pelo Status/draw → details.mapa_status.print)
  const mapaPrint = dt.mapa_status && dt.mapa_status.print;
  if (mapaPrint && Array.isArray(mapaPrint.paginas) && mapaPrint.paginas.length){
    const pags = mapaPrint.paginas;
    const mc = el(`<div class="card">
      <div class="label" style="color:var(--pk-accent)">Mapa da obra${mapaPrint.revisao ? " · " + esc(mapaPrint.revisao) : ""}</div>
      <img data-role="mapa-img" src="${esc(pags[0].url)}" alt="Mapa da obra" loading="lazy"
           style="width:100%;border:1px solid var(--pk-border1);margin-top:8px;display:block;cursor:pointer">
      ${pags.length > 1 ? `<div style="display:flex;gap:6px;margin-top:8px;overflow-x:auto">${pags.map((p, i) =>
        `<button class="ghost" data-pg="${i}" style="width:auto;padding:5px 10px;font-size:11px;flex-shrink:0">Pág. ${p.n || i + 1}</button>`).join("")}</div>` : ""}
      ${mapaPrint.pdf_url ? `<button class="ghost" data-role="mapa-pdf" style="margin-top:8px;font-size:12px">Abrir PDF do mapa</button>` : ""}
      ${dt.draw_mapa_id ? `<button class="ghost" data-role="mapa-live" style="margin-top:8px;font-size:12px">Abrir mapa ao vivo</button>` : ""}
      ${dt.mapa_pdf && dt.mapa_pdf.url ? `<button class="ghost" data-role="mapa-card-pdf" style="margin-top:8px;font-size:12px">Abrir mapa (PDF do card)</button>` : ""}
    </div>`);
    // Tudo abre no visor in-app (regra de campo: NADA em aba nova).
    const mimg = mc.querySelector('[data-role="mapa-img"]');
    mimg.dataset.idx = "0";
    const pagsAnexos = pags.map((p, i) => ({ url: p.url, nome: `Mapa da obra · Pág. ${p.n || i + 1}` }));
    mimg.onclick = () => abrirVisorAnexos(pagsAnexos, Number(mimg.dataset.idx) || 0);
    mc.querySelectorAll("[data-pg]").forEach(b => { b.onclick = () => { const i = Number(b.dataset.pg); mimg.src = pags[i].url; mimg.dataset.idx = String(i); }; });
    const pdfBtn = mc.querySelector('[data-role="mapa-pdf"]');
    if (pdfBtn) pdfBtn.onclick = () => abrirVisorAnexos([{ url: mapaPrint.pdf_url, nome: "PDF do mapa", content_type: "application/pdf" }], 0);
    const liveBtn = mc.querySelector('[data-role="mapa-live"]');
    if (liveBtn) liveBtn.onclick = () => abrirVisorAnexos([{ url: `https://draw.parket.works/status/viewer/${dt.draw_mapa_id}`, nome: "Mapa ao vivo" }], 0);
    const cardPdfBtn = mc.querySelector('[data-role="mapa-card-pdf"]');
    if (cardPdfBtn) cardPdfBtn.onclick = () => abrirVisorAnexos([{ url: dt.mapa_pdf.url, nome: "Mapa (PDF do card)", content_type: "application/pdf" }], 0);
    root.appendChild(mc);
  } else {
    // Sem print publicado: a seção do mapa aparece MESMO ASSIM — busca o mapa
    // vinculado em status_mapas (kanban_card_id ou status_mapa_id do card) e dá
    // a opção de ver (PDF ou planta, carregada só no toque pra não pesar no 4G).
    const mc = el(`<div class="card">
      <div class="label" style="color:var(--pk-accent)">Mapa da obra</div>
      <div class="small" data-role="mapa-info" style="margin-top:4px">Procurando mapa…</div>
    </div>`);
    root.appendChild(mc);
    (async () => {
      const info = mc.querySelector('[data-role="mapa-info"]');
      // PDF do mapa enviado direto no card (Valoria → sync) — mostra sempre que existir
      if (dt.mapa_pdf && dt.mapa_pdf.url){
        const pdfBtn = el(`<button class="ghost" style="margin-top:8px;font-size:12px">Abrir mapa (PDF do card)</button>`);
        pdfBtn.onclick = () => abrirVisorAnexos([{ url: dt.mapa_pdf.url, nome: "Mapa (PDF do card)", content_type: "application/pdf" }], 0);
        mc.appendChild(pdfBtn);
      }
      try {
        let filtro = `kanban_card_id.eq.${cardId}`;
        if (card.status_mapa_id) filtro += `,id.eq.${card.status_mapa_id}`;
        // Mapa vinculado pela Valoria (segue o cliente): details.draw_mapa_id
        if (dt.draw_mapa_id) filtro += `,id.eq.${dt.draw_mapa_id}`;
        const { data: mp } = await sb.from("status_mapas")
          .select("id, revisao_atual, pdf_atual_url")
          .or(filtro).limit(1).maybeSingle();
        if (!mp){
          if (dt.mapa_pdf && dt.mapa_pdf.url) info.remove();
          else info.textContent = "O mapa desta obra ainda não chegou do gestão. Assim que vier com o card, aparece aqui.";
          return;
        }
        info.remove();
        const btn = el(`<button class="ghost" style="margin-top:8px;font-size:12px">Ver mapa${mp.revisao_atual ? " · " + esc(mp.revisao_atual) : ""}</button>`);
        mc.appendChild(btn);
        const live = el(`<button class="ghost" style="margin-top:6px;font-size:12px">Abrir mapa ao vivo</button>`);
        live.onclick = () => abrirVisorAnexos([{ url: `https://draw.parket.works/status/viewer/${mp.id}`, nome: "Mapa ao vivo" }], 0);
        mc.appendChild(live);
        btn.onclick = async () => {
          if (mp.pdf_atual_url) return abrirVisorAnexos([{ url: mp.pdf_atual_url, nome: "Mapa da obra (PDF)", content_type: "application/pdf" }], 0);
          let img = mc.querySelector('[data-role="mapa-img"]');
          if (img){ img.style.display = img.style.display === "none" ? "block" : "none"; return; }
          btn.disabled = true; btn.textContent = "Carregando planta…";
          const { data: full } = await sb.from("status_mapas")
            .select("mascara_arquivo_url").eq("id", mp.id).maybeSingle();
          btn.disabled = false;
          btn.textContent = "Ver mapa" + (mp.revisao_atual ? " · " + mp.revisao_atual : "");
          const src = full && full.mascara_arquivo_url;
          if (!src){ btn.textContent = "Planta ainda não disponível"; btn.disabled = true; return; }
          img = el(`<img data-role="mapa-img" alt="Mapa da obra" style="width:100%;border:1px solid var(--pk-border1);margin-top:8px;display:block;cursor:pointer">`);
          img.onclick = () => { if (/^https?:/.test(img.src)) abrirVisorAnexos([{ url: img.src, nome: "Mapa da obra" }], 0); };
          mc.appendChild(img);
          img.src = src;
        };
      } catch (e) {
        info.textContent = "Não deu pra carregar o mapa agora. Verifique o sinal e reabra esta tela.";
      }
    })();
  }

  // ── DOCUMENTOS DA OBRA (herdados dos setores — card único).
  // Sem proposta/contrato: app de campo não mostra valores.
  // O card agora renderiza SEMPRE (mesmo com 0 docs) porque o próprio fiscal
  // pode adicionar PDF/foto daqui — ex: medição — via grupo "Fiscal (campo)"
  // do gestão (Will 08/09). Upload = POST fiscal-doc do docs-unificados;
  // o arquivo vira gestao.documentos e aparece em todos os setores.
  const docsWrap = el(`<div></div>`);
  root.appendChild(docsWrap);
  async function renderDocsObra(){
    const ORIG = { valor: "VALOR", projetos: "PROJETOS", executivo: "EXECUTIVO", gestao: "GESTÃO", producao: "PRODUÇÃO", fiscal: "FISCAL" };
    let grupos = [], carregou = false;
    try {
      const r = await fetchGestao(`${GESTAO_API}/api/docs-unificados/${encodeURIComponent(cardId)}?vista=campo`);
      if (r.ok){
        const j = await r.json();
        grupos = (j.grupos || []).filter(g => g.docs && g.docs.length);
        carregou = true;
      }
    } catch (e) { /* best-effort: gestão fora do ar não derruba o card */ }
    const total = grupos.reduce((n, g) => n + g.docs.length, 0);
    // Lista achatada na MESMA ordem visual: cada doc vira um índice pro visor
    // in-app (abrirVisorAnexos navega ANTERIOR/PRÓXIMA entre todos os docs).
    const flatDocs = [];
    const dc = el(`<div class="card">
      <div class="row" style="justify-content:space-between;align-items:center;gap:8px">
        <div class="label" style="color:var(--pk-accent);margin:0">Documentos da obra · ${total}</div>
        <button data-role="doc-add" style="width:auto;display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.06em;padding:7px 12px;border:1px solid var(--line,#333);border-radius:6px;background:transparent;color:inherit;flex-shrink:0;cursor:pointer">+ ADICIONAR PDF</button>
      </div>
      <input data-role="doc-file" type="file" accept="application/pdf,image/*" multiple style="display:none">
      <div class="small" data-role="doc-status" style="display:none;margin-top:6px;color:var(--pk-accent)"></div>
      ${!carregou ? `<div class="small" style="margin-top:8px">Sem conexão com o gestão agora. Tente de novo em instantes.</div>` : ""}
      ${carregou && !total ? `<div class="small" style="margin-top:8px">Nenhum documento ainda. Adicione a medição ou outro PDF da obra pelo botão acima.</div>` : ""}
      ${grupos.map(g => `<div style="margin-top:8px">
        <div class="small" style="letter-spacing:0.1em">${esc((g.titulo || g.origem).toUpperCase())} · ${g.docs.length}</div>
        ${g.docs.map(d => {
          const di = flatDocs.push({ url: d.url, nome: d.name || "documento", content_type: d.mime || "" }) - 1;
          // Doc do grupo fiscal traz id: o fiscal pode remover o que o campo subiu.
          const podeRemover = (d.origem || g.origem) === "fiscal" && d.id;
          return `<div style="display:flex;gap:8px;align-items:center;padding:6px 0;font-size:13px;word-break:break-all">
            <span data-doc-idx="${di}" style="flex:1;cursor:pointer">${esc(d.name || "documento")}</span>
            <span class="small" style="flex-shrink:0">${esc(ORIG[d.origem || g.origem] || (d.origem || g.origem).toUpperCase())}</span>
            ${podeRemover ? `<button data-doc-del="${esc(d.id)}" data-doc-nome="${esc(d.name || "documento")}" style="width:auto;flex-shrink:0;font-size:10px;padding:4px 8px;border:1px solid var(--line,#333);border-radius:4px;background:transparent;color:inherit;cursor:pointer">REMOVER</button>` : ""}
          </div>`;
        }).join("")}
      </div>`).join("")}
      <div class="small" style="margin-top:8px">Anexos do Valor, Projetos, Gestão, Produção e do próprio fiscal. O card é único em todos os setores.</div>
    </div>`);
    dc.querySelectorAll("[data-doc-idx]").forEach(row => {
      row.onclick = () => abrirVisorAnexos(flatDocs, Number(row.dataset.docIdx) || 0);
    });
    // Remoção: só docs do grupo fiscal; endpoint restrito a slug='fiscal' no gestão.
    dc.querySelectorAll("[data-doc-del]").forEach(btn => {
      btn.onclick = async () => {
        if (!confirm(`Remover "${btn.dataset.docNome}"?`)) return;
        btn.disabled = true; btn.textContent = "…";
        try {
          const r = await fetchGestao(`${GESTAO_API}/api/docs-unificados/fiscal-doc/${btn.dataset.docDel}`, { method: "DELETE" });
          if (!r.ok) throw new Error("HTTP " + r.status);
          renderDocsObra();
        } catch (e) {
          btn.disabled = false; btn.textContent = "REMOVER";
          alert("Não deu pra remover agora. Confira a internet e tente de novo.");
        }
      };
    });
    // Upload: um arquivo por vez, com contador de progresso no próprio card.
    // fetchGestao NÃO retenta POST sozinho (evita duplicar); erro mostra o
    // próximo passo e mantém o que já subiu.
    const inp = dc.querySelector('[data-role="doc-file"]');
    const stat = dc.querySelector('[data-role="doc-status"]');
    dc.querySelector('[data-role="doc-add"]').onclick = () => inp.click();
    inp.onchange = async () => {
      const files = Array.from(inp.files || []);
      if (!files.length) return;
      stat.style.display = "block";
      let ok = 0;
      for (let i = 0; i < files.length; i++){
        stat.textContent = `Enviando ${i + 1}/${files.length}: ${files[i].name}…`;
        try {
          const fd = new FormData();
          fd.append("file", files[i]);
          fd.append("titulo", files[i].name);
          fd.append("autor", fiscalAtualNome() || (_user && _user.email) || "fiscal");
          const r = await fetchGestao(`${GESTAO_API}/api/docs-unificados/${encodeURIComponent(cardId)}/fiscal-doc`, { method: "POST", body: fd });
          if (!r.ok){
            let msg = "HTTP " + r.status;
            try { msg = (await r.json()).detail || msg; } catch(e){}
            throw new Error(msg);
          }
          ok++;
        } catch (e) {
          stat.textContent = `Falhou em "${files[i].name}": ${e.message || e}. Confira a internet e tente esse arquivo de novo.`;
          if (ok) setTimeout(renderDocsObra, 3500);
          return;
        }
      }
      stat.textContent = `${ok} ${ok === 1 ? "arquivo enviado" : "arquivos enviados"}.`;
      renderDocsObra();
    };
    docsWrap.replaceChildren(dc);
  }
  renderDocsObra();

  // ── GESTÃO: fiscal responsável + modelos da obra (gestao.itens)
  const gestaoWrap = el(`<div></div>`);
  root.appendChild(gestaoWrap);
  renderGestaoObraInfo(gestaoWrap, cardId, card);

  // ── PRESTADORES DA OBRA: fiscal adiciona/remove, marca o principal e atribui itens
  const prestWrap = el(`<div></div>`);
  root.appendChild(prestWrap);
  renderPrestadoresObra(prestWrap, cardId, card);

  // ── VALIDAÇÃO DO PROGRESSO: cada envio do instalador (foto + qtd do dia) entra
  // aqui pro fiscal aprovar ou reprovar. O veredito volta pro app do instalador.
  root.appendChild(renderValidacaoSecao(cardId, { scroll: !!(opts && opts.scrollValidacao) }));

  // ── INFO OPERACIONAL (endereço, arquiteto, área, prazo, vendedor + equipes)
  const opWrap = el(`<div></div>`);
  root.appendChild(opWrap);
  renderInfoOperacional(opWrap, card);

  // ── O QUE FOI VENDIDO (proposta do gestão) — sempre visível no card do cliente
  root.appendChild(renderVendidoSecao(cardId));

  // ── PRA FAZER (checklist início + agendamentos futuros + rascunhos)
  // Checklist é carregado assíncrono e insere o card dele DENTRO desta seção.
  const totalPraFazer = ldsPend.length + agsFut.length; // checklist entra dinâmico depois
  const praFazerContainer = el(`<div></div>`);
  root.appendChild(praFazerContainer);
  const praFazerHead = el(`<div class="card" style="border-color:rgba(245,158,11,0.35);background:rgba(245,158,11,0.06)">
    <div class="h2" style="margin:0">Pra fazer</div>
    <div class="small" data-role="pf-sub">${totalPraFazer} ${totalPraFazer === 1 ? "item" : "itens"} aguardando</div>
  </div>`);
  const praFazerBody = el(`<div></div>`);
  // Só mostra o cabeçalho se tiver algo (checklist pode adicionar depois).
  if (totalPraFazer > 0){
    praFazerContainer.appendChild(praFazerHead);
    praFazerContainer.appendChild(praFazerBody);
  }

  // Checklist de Início de Obras (etapa 3 do gestão) — entra no topo do "Pra fazer".
  {
    const ph = el(`<div class="card" style="cursor:pointer;background:rgba(245,158,11,0.04);border-color:rgba(245,158,11,0.25);display:none">
      <div class="row" style="justify-content:space-between;gap:8px">
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:600">Checklist de Início de Obras</div>
          <div class="small" data-role="ck-sub">carregando…</div>
        </div>
        <span class="tag" data-role="ck-tag" style="background:rgba(245,158,11,0.15);color:#F59E0B;flex-shrink:0;font-weight:700">pendente</span>
      </div>
    </div>`);
    ph.onclick = () => renderChecklistInicioObra(cardId, { title: card.title, obra: card.obra });
    (async () => {
      try {
        const r = await fetchGestao(`${GESTAO_API}/api/fiscal/checklist-obra/${cardId}`);
        if (!r.ok) return;
        const d = await r.json();
        if (!d.servicos || !d.servicos.length) return;
        let total = 0, feitos = 0;
        for (const s of d.servicos){
          const perguntas = (CK["1vistoria"] && CK["1vistoria"][s]) || (CK["2vistoria"] && CK["2vistoria"][s]) || [];
          for (const q of perguntas){
            total++;
            const resp = d.checklist && d.checklist[s] && d.checklist[s][q];
            if (resp && resp.valor) feitos++;
          }
        }
        ph.querySelector('[data-role="ck-sub"]').textContent =
          `${feitos}/${total} verificações · ${d.servicos.map(s => s.toUpperCase()).join(", ")}`;
        const tag = ph.querySelector('[data-role="ck-tag"]');
        const finalizado = total > 0 && feitos >= total;
        if (finalizado){
          tag.textContent = "concluído";
          tag.style.background = "rgba(52,211,153,0.20)"; tag.style.color = "#34D399";
        } else if (feitos > 0){
          tag.textContent = "em andamento";
          tag.style.background = "rgba(59,130,246,0.15)"; tag.style.color = "#60A5FA";
        }
        // Checklist só entra no "Pra fazer" enquanto não terminou.
        if (!finalizado){
          if (!praFazerContainer.contains(praFazerHead)){
            praFazerContainer.appendChild(praFazerHead);
            praFazerContainer.appendChild(praFazerBody);
          }
          praFazerBody.insertBefore(ph, praFazerBody.firstChild);
          const sub = praFazerHead.querySelector('[data-role="pf-sub"]');
          const n = (ldsPend.length + agsFut.length + 1);
          sub.textContent = `${n} ${n === 1 ? "item" : "itens"} aguardando`;
        }
        ph.style.display = "";
      } catch (_e) { /* gestão fora do ar ou card sem projeto — some silencioso */ }
    })();
  }

  // Agendamentos hoje/futuros (dentro do "Pra fazer").
  for (const a of agsFut){
    const tipoLabel = (TIPOS[a.tipo] && TIPOS[a.tipo].label) || a.tipo;
    const c = el(`<div class="card" style="cursor:pointer;background:rgba(245,158,11,0.04);border-color:rgba(245,158,11,0.25)">
      <div class="row" style="justify-content:space-between;gap:8px">
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:600">${esc(tipoLabel)}${a.online ? ` · <span style="color:#3B82F6">ONLINE</span>` : ""}</div>
          <div class="small">${fmtDate(a.data_inicio)}${a.notas ? " · " + esc(a.notas) : ""}</div>
          ${tagChipsHtml(a.tags, 10)}
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0">
          <span class="tag" style="background:rgba(150,132,115,0.15);color:var(--pk-accent)">${esc(a.status||"agendada")}</span>
          <button data-edit-tags style="width:auto;font-size:11px;font-weight:600;padding:3px 8px;border-radius:4px;cursor:pointer;border:1px dashed #8A7350;background:transparent;color:#8A7350">+ tag</button>
        </div>
      </div>
    </div>`);
    c.querySelector("[data-edit-tags]").onclick = (ev) => {
      ev.stopPropagation();
      abrirEditorTags(a, () => renderObraDetail(cardId));
    };
    c.onclick = () => abrirOuCriarLaudo({ card_id: cardId, obra: card.obra, cliente: card.title, tipo: a.tipo, agenda_id: a.id });
    praFazerBody.appendChild(c);
  }

  // Rascunhos em_andamento (dentro do "Pra fazer").
  for (const l of ldsPend){
    const nomeLaudoSuf = (l.relatorio_dados && l.relatorio_dados.nome_laudo) ? ` · ${esc(l.relatorio_dados.nome_laudo)}` : "";
    const tipoLabel = ((TIPOS[l.tipo] && TIPOS[l.tipo].label) || l.tipo) + nomeLaudoSuf;
    const serv = Array.isArray(l.servicos_inclusos) && l.servicos_inclusos.length
      ? ` · ${l.servicos_inclusos.map(s => s.toUpperCase()).join(", ")}`
      : "";
    const stColor = "#F59E0B";
    const c = el(`<div class="card" style="cursor:pointer;background:rgba(245,158,11,0.04);border-color:rgba(245,158,11,0.25)">
      <div class="row" style="justify-content:space-between;gap:8px">
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:600">${esc(tipoLabel)}${esc(serv)}</div>
          <div class="small">${l.data_vistoria ? fmtDate(l.data_vistoria) : fmtDate(l.created_at)} · ${esc(l.fiscal_nome || "-")}</div>
        </div>
        <span class="tag" style="background:${stColor}25;color:${stColor};flex-shrink:0;font-weight:700">pendente</span>
      </div>
    </div>`);
    c.onclick = () => renderEditarLaudo(l.id);
    praFazerBody.appendChild(c);
  }

  // ── AGENDAMENTO VENCIDO (data já passou, sem laudo, precisa justificar+reagendar)
  if (agsVencidas.length){
    root.appendChild(el(`<div class="card" style="border-color:rgba(239,68,68,0.35);background:rgba(239,68,68,0.06)">
      <div class="h2" style="margin:0;color:#F87171">${agsVencidas.length === 1 ? "Visita vencida" : "Visitas vencidas"}</div>
      <div class="small">${agsVencidas.length} ${agsVencidas.length === 1 ? "visita que passou" : "visitas que passaram"} do prazo: justifique e reagende</div>
    </div>`));
    for (const a of agsVencidas){
      const tipoLabel = (TIPOS[a.tipo] && TIPOS[a.tipo].label) || a.tipo;
      const c = el(`<div class="card" style="cursor:pointer;background:rgba(239,68,68,0.04);border-color:rgba(239,68,68,0.25)">
        <div class="row" style="justify-content:space-between;gap:8px">
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600">${esc(tipoLabel)}</div>
            <div class="small">era ${fmtDate(a.data_inicio)}${a.notas ? " · " + esc(a.notas) : ""}</div>
          </div>
          <span class="tag" style="background:rgba(239,68,68,0.20);color:#F87171;flex-shrink:0;font-weight:700">vencido</span>
        </div>
      </div>`);
      c.onclick = () => renderReagendarModal(a, cardId, card);
      root.appendChild(c);
    }
  }

  // ── FEITOS (concluídos)
  if (ldsFeitos.length){
    root.appendChild(el(`<div class="card"><div class="h2">Feitos</div>
      <div class="small">${ldsFeitos.length} ${ldsFeitos.length === 1 ? "laudo concluído" : "laudos concluídos"}</div>
    </div>`));
    for (const l of ldsFeitos){
      const nomeLaudoSuf = (l.relatorio_dados && l.relatorio_dados.nome_laudo) ? ` · ${esc(l.relatorio_dados.nome_laudo)}` : "";
    const tipoLabel = ((TIPOS[l.tipo] && TIPOS[l.tipo].label) || l.tipo) + nomeLaudoSuf;
      const serv = Array.isArray(l.servicos_inclusos) && l.servicos_inclusos.length
        ? ` · ${l.servicos_inclusos.map(s => s.toUpperCase()).join(", ")}`
        : "";
      const c = el(`<div class="card" style="cursor:pointer">
        <div class="row" style="justify-content:space-between;gap:8px">
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600">${esc(tipoLabel)}${esc(serv)}</div>
            <div class="small">${l.data_vistoria ? fmtDate(l.data_vistoria) : fmtDate(l.updated_at)} · ${esc(l.fiscal_nome || "-")}</div>
          </div>
          <span class="tag" style="background:rgba(52,211,153,0.20);color:#34D399;flex-shrink:0">concluído</span>
        </div>
      </div>`);
      c.onclick = () => renderEditarLaudo(l.id);
      root.appendChild(c);
    }
  }

  // ── PRÓXIMOS PASSOS (tipos que ainda não existem nessa obra)
  if (tiposFaltando.length){
    root.appendChild(el(`<div class="card" style="border-color:rgba(20,184,166,0.30);background:rgba(20,184,166,0.04)">
      <div class="h2" style="color:#5EEAD4;margin:0">+ Pode fazer</div>
      <div class="small">Laudos que podem ser criados nesta obra. Acompanhamento é semanal: crie um novo a cada visita</div>
    </div>`));
    for (const t of tiposFaltando){
      const lbl = TIPOS[t].label;
      const b = el(`<button class="ghost" style="margin-top:6px">+ Criar ${esc(lbl)}</button>`);
      b.onclick = () => renderNovoLaudo({ card_id: cardId, obra: card.obra, cliente: card.title, tipo: t });
      root.appendChild(b);
    }
  }
}

// ╔══════════════════════════════════════════════════════════════╗
// ║ INFO OPERACIONAL — puxa do card operacional com mesmo cliente ║
// ║ Renderiza: dados da obra (OS, endereço, arquiteto, área,      ║
// ║ prazo, vendedor) + Equipes. Espelha a mesma info do Space.    ║
// ╚══════════════════════════════════════════════════════════════╝
async function renderInfoOperacional(wrap, card){
  if (!card || !card.title) return;
  try {
    // Busca todos os cards com mesmo título (qualquer setor). Operacional
    // tem prioridade pra ver equipes/OS, mas comercial/financeiro/próprio
    // também trazem endereço/arquiteto/vendedor pra clientes sem obra.
    const { data: allCards } = await sb.from("kanban_cards")
      .select("id, dept_id, details")
      .ilike("title", card.title);
    if (!allCards || !allCards.length) return;
    const rank = { operacional: 0, comercial: 1, financeiro: 2, projetos: 3, orcamento: 4 };
    const priorized = allCards.slice().sort((a,b) => (rank[a.dept_id] ?? 9) - (rank[b.dept_id] ?? 9));
    const opCards = allCards.filter(c => c.dept_id === "operacional");
    // Consolida detalhes (primeiro card com valor vence).
    const merged = {};
    const eqSet = new Map(); // key nome|servico → { nome, servico }
    for (const oc of priorized){
      const det = (oc && oc.details) || {};
      for (const k of ["os","endereco","cidade","estado","area_m2","prazo_fim","vendedor","arquiteto","arquitetura","grupo_wpp","endereco_obra"]){
        if (!merged[k] && det[k]) merged[k] = det[k];
      }
      if (Array.isArray(det.equipes)){
        for (const e of det.equipes){
          const nome = String((e && e.nome) || "").trim();
          if (!nome) continue;
          const serv = String((e && (e.servico || e.tipo)) || "").trim();
          const key = `${nome}|${serv}`.toLowerCase();
          if (!eqSet.has(key)) eqSet.set(key, { nome, servico: serv });
        }
      }
      if (eqSet.size === 0 && Array.isArray(det.equipe)){
        for (const e of det.equipe){
          const nome = String((e && e.nome) || "").trim();
          if (!nome) continue;
          const serv = String((e && (e.funcao || e.servico)) || "").trim();
          const key = `${nome}|${serv}`.toLowerCase();
          if (!eqSet.has(key)) eqSet.set(key, { nome, servico: serv });
        }
      }
    }
    // ── Card "Informações da obra"
    // arquiteto: preferência arquiteto; fallback arquitetura; ignora se for
    // marcação interna tipo "VENDEDOR XYZ" (sem arquiteto de fato).
    let arq = merged.arquiteto || merged.arquitetura || "";
    if (/^vendedor\b/i.test(arq.trim())) arq = "";
    // Endereço: card_details.endereco_obra > endereco (unifica com header).
    // Header do Projeto (fora dessa função) já mostra o endereço curto do card
    // do fiscal — aqui pega o mais completo dos operacionais/comerciais se
    // for diferente do que já apareceu.
    const enderecoFiscal = (card.details && (card.details.endereco_obra || card.details.endereco)) || "";
    const enderecoOp = merged.endereco_obra || merged.endereco || "";
    const enderecoMostrar = enderecoOp && enderecoOp !== enderecoFiscal ? enderecoOp : "";
    const cidadeEstado = [merged.cidade, merged.estado].filter(Boolean).join(" / ");
    const fmtPrazo = (v) => { try { return new Date(v).toLocaleDateString("pt-BR"); } catch { return v; } };
    const linhas = [
      merged.os        ? ["OS",        merged.os] : null,
      enderecoMostrar  ? ["Endereço",  enderecoMostrar] : null,
      cidadeEstado     ? ["Cidade",    cidadeEstado] : null,
      merged.area_m2   ? ["Área",      `${merged.area_m2} m²`] : null,
      merged.prazo_fim ? ["Prazo",     fmtPrazo(merged.prazo_fim)] : null,
      arq              ? ["Arquiteto", arq] : null,
      merged.vendedor  ? ["Vendedor",  merged.vendedor] : null,
    ].filter(Boolean);
    if (linhas.length){
      const infoBox = el(`<div class="card">
        <div class="label" style="color:var(--pk-accent)">Informações da obra</div>
        <div style="display:flex;flex-direction:column;gap:6px;margin-top:8px"></div>
      </div>`);
      const list = infoBox.querySelector("div:last-child");
      for (const [rot, val] of linhas){
        // linha de endereço ganha as ações Maps/Waze/Copiar embaixo do valor
        const acoes = rot === "Endereço" ? endAcoesHtml(val) : "";
        list.appendChild(el(`<div style="display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--pk-border1);align-items:flex-start">
          <div class="small" style="min-width:70px;text-transform:uppercase;letter-spacing:0.5px">${esc(rot)}</div>
          <div style="font-size:13px;text-align:right;flex:1;word-break:break-word">${esc(val)}${acoes ? `<div style="display:flex;justify-content:flex-end">${acoes}</div>` : ""}</div>
        </div>`));
      }
      const items = list.querySelectorAll("div");
      if (items.length) items[items.length-1].style.borderBottom = "none";
      wrap.appendChild(infoBox);
    }
    // ── Card "Equipe(s) na obra"
    if (eqSet.size > 0){
      const equipes = [...eqSet.values()];
      const eqBox = el(`<div class="card">
        <div class="label" style="color:var(--pk-accent)">${equipes.length === 1 ? "Equipe na obra" : "Equipes na obra"}</div>
        <div style="display:flex;flex-direction:column;gap:6px;margin-top:8px"></div>
      </div>`);
      const list = eqBox.querySelector("div:last-child");
      for (const e of equipes){
        list.appendChild(el(`<div style="display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--pk-border1)">
          <div style="font-size:13px;font-weight:600">${esc(e.nome)}</div>
          <div class="small" style="text-align:right;text-transform:uppercase">${esc(e.servico || "-")}</div>
        </div>`));
      }
      const items = list.querySelectorAll("div");
      if (items.length) items[items.length-1].style.borderBottom = "none";
      wrap.appendChild(eqBox);
    }
    // ── Card "Andamento da obra" (do instala.parket.works)
    // Puxa vw_instala_minhas_obras + vw_instala_obra_itens do card operacional.
    if (opCards.length === 0) return;
    const opIds = opCards.map(c => c.id);
    const { data: obras } = await sb.from("vw_instala_minhas_obras")
      .select("card_id, obra_code, progress_atual, presenca_status")
      .in("card_id", opIds);
    // Dedup por obra_code (view retorna 1 linha por atribuição)
    const obrasSet = new Map();
    for (const o of (obras || [])){
      if (!obrasSet.has(o.obra_code)) obrasSet.set(o.obra_code, o);
    }
    if (obrasSet.size === 0) return;
    const obraCodes = [...obrasSet.keys()];
    const { data: itens } = await sb.from("vw_instala_obra_itens")
      .select("obra_id, descricao, contrato_qtd, qtd_instalada, pct_concluido, unidade, ordem")
      .in("obra_id", obraCodes)
      .order("ordem");
    if (!itens || itens.length === 0) return;
    // Progresso agregado (média ponderada pelo contrato_qtd)
    let somaContrato = 0, somaInstalado = 0;
    for (const it of itens){
      const c = Number(it.contrato_qtd || 0);
      const i = Number(it.qtd_instalada || 0);
      somaContrato += c;
      somaInstalado += Math.min(i, c);
    }
    const pctGeral = somaContrato > 0 ? Math.min(100, Math.round(somaInstalado / somaContrato * 100)) : 0;
    const andBox = el(`<div class="card">
      <div class="row" style="justify-content:space-between;align-items:baseline">
        <div class="label" style="color:var(--pk-accent);margin:0">Andamento da obra</div>
        <div style="font-size:14px;font-weight:700;color:${pctGeral>=100?'#34D399':pctGeral>0?'#60A5FA':'var(--pk-text-muted)'}">${pctGeral}%</div>
      </div>
      <div style="background:var(--pk-card2);border:1px solid var(--pk-border1);height:8px;margin-top:8px;position:relative;overflow:hidden">
        <div style="background:${pctGeral>=100?'#34D399':'#60A5FA'};height:100%;width:${pctGeral}%;transition:width 0.3s"></div>
      </div>
      <div class="small" style="margin-top:6px">${itens.length} serviço${itens.length!==1?"s":""} contratado${itens.length!==1?"s":""} · ${somaInstalado.toFixed(0)} / ${somaContrato.toFixed(0)} instalado</div>
      <div style="margin-top:10px;display:flex;flex-direction:column;gap:6px"></div>
    </div>`);
    const list = andBox.querySelector("div:last-child");
    for (const it of itens){
      const p = Number(it.pct_concluido || 0);
      const cor = p >= 100 ? "#34D399" : p > 0 ? "#60A5FA" : "var(--pk-text-muted)";
      list.appendChild(el(`<div style="padding:6px 0;border-bottom:1px solid var(--pk-border1)">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline">
          <div style="font-size:13px;font-weight:600;flex:1;word-break:break-word">${esc(it.descricao || "-")}</div>
          <div style="font-size:12px;font-weight:700;color:${cor}">${p}%</div>
        </div>
        <div class="small" style="margin-top:2px">${Number(it.qtd_instalada||0).toFixed(1)} / ${Number(it.contrato_qtd||0).toFixed(1)} ${esc(it.unidade || "")}</div>
      </div>`));
    }
    const items2 = list.querySelectorAll("div");
    if (items2.length) items2[items2.length-1].style.borderBottom = "none";
    wrap.appendChild(andBox);
  } catch (_e){ /* silencioso — se falhar, some */ }
}

// ╔══════════════════════════════════════════════════════════════╗
// ║ REAGENDAR — modal do agendamento vencido                      ║
// ║ Fiscal justifica por que não foi + escolhe nova data.         ║
// ║ Grava em fiscal_agenda e sinaliza no kanban_cards pra gestão. ║
// ╚══════════════════════════════════════════════════════════════╝
function renderReagendarModal(a, cardId, card){
  const tipoLabel = (TIPOS[a.tipo] && TIPOS[a.tipo].label) || a.tipo;
  const now = new Date();
  const pad = (n) => String(n).padStart(2,"0");
  const localMin = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const overlay = el(`<div style="position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:9999;display:flex;align-items:flex-end;justify-content:center;padding:0">
    <div class="card" style="max-width:520px;width:100%;background:var(--pk-card1);margin:0;border-radius:16px 16px 0 0;max-height:92vh;overflow-y:auto">
      <div class="h2" style="margin:0 0 4px">Justificar visita vencida</div>
      <div class="small" style="margin-bottom:14px">${esc(tipoLabel)} · era ${fmtDate(a.data_inicio)}</div>
      <div style="margin-top:8px">
        <div class="label" style="color:var(--pk-accent);margin-bottom:4px">Por que não foi na data?</div>
        <textarea data-just style="width:100%;min-height:90px;background:var(--pk-card2);color:var(--pk-text);border:1px solid var(--pk-border1);padding:10px;font-size:14px;box-sizing:border-box;resize:vertical" placeholder="Ex: cliente cancelou, chuva forte, obra fechada, sem acesso…"></textarea>
      </div>
      <div style="margin-top:14px">
        <div class="label" style="color:var(--pk-accent);margin-bottom:6px">O que fazer agora?</div>
        <div style="display:flex;gap:8px">
          <label style="flex:1;display:flex;align-items:center;gap:6px;padding:10px;background:var(--pk-card2);border:1px solid var(--pk-border1);cursor:pointer;font-size:13px" data-opt="reagendar">
            <input type="radio" name="reag_acao" value="reagendar" checked style="accent-color:var(--pk-accent)"> Reagendar
          </label>
          <label style="flex:1;display:flex;align-items:center;gap:6px;padding:10px;background:var(--pk-card2);border:1px solid var(--pk-border1);cursor:pointer;font-size:13px" data-opt="agora">
            <input type="radio" name="reag_acao" value="agora" style="accent-color:var(--pk-accent)"> Fazer agora
          </label>
        </div>
      </div>
      <div data-nova-wrap style="margin-top:12px">
        <div class="label" style="color:var(--pk-accent);margin-bottom:4px">Nova data e hora</div>
        <input type="datetime-local" data-nova min="${localMin}" style="width:100%;background:var(--pk-card2);color:var(--pk-text);border:1px solid var(--pk-border1);padding:10px;font-size:14px;box-sizing:border-box">
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:16px">
        <button class="primary" data-save style="width:100%">Reagendar e avisar gestão</button>
        <button class="ghost" data-cancel style="width:100%">Cancelar</button>
      </div>
    </div>
  </div>`);
  document.body.appendChild(overlay);
  _ditadoAnexar(overlay.querySelector('[data-just]'));
  // Empurra o FAB do chat pra fora enquanto o modal estiver aberto.
  const prevFabBottom = document.body.style.getPropertyValue("--pk-fab-bottom");
  document.body.style.setProperty("--pk-fab-bottom", "200vh");
  const closeAndRestore = () => {
    overlay.remove();
    if (prevFabBottom) document.body.style.setProperty("--pk-fab-bottom", prevFabBottom);
    else document.body.style.removeProperty("--pk-fab-bottom");
  };
  overlay.querySelector('[data-cancel]').onclick = closeAndRestore;
  const btnSave = overlay.querySelector('[data-save]');
  const novaWrap = overlay.querySelector('[data-nova-wrap]');
  const getAcao = () => overlay.querySelector('input[name="reag_acao"]:checked').value;
  const refletirAcao = () => {
    const acao = getAcao();
    novaWrap.style.display = acao === "reagendar" ? "" : "none";
    btnSave.textContent = acao === "reagendar" ? "Reagendar e avisar gestão" : "Fazer agora";
  };
  overlay.querySelectorAll('input[name="reag_acao"]').forEach(r => r.onchange = refletirAcao);
  btnSave.onclick = async () => {
    const just = overlay.querySelector('[data-just]').value.trim();
    const acao = getAcao();
    if (!just){ _appToast("Escreve rápido por que não foi. O gestão precisa saber."); return; }
    const agora = new Date();
    let novaIso, statusNovo, notaTag;
    if (acao === "reagendar"){
      const nova = overlay.querySelector('[data-nova]').value;
      if (!nova){ _appToast("Escolhe a nova data."); return; }
      novaIso = new Date(nova).toISOString();
      statusNovo = "reagendado";
      notaTag = `[REAGENDADO ${fmtDate(agora.toISOString())}`;
    } else {
      novaIso = agora.toISOString();
      statusNovo = "realizado";
      notaTag = `[FEITO NA HORA ${fmtDate(agora.toISOString())}`;
    }
    btnSave.disabled = true; btnSave.textContent = "Salvando…";
    const quem = fiscalAtualNome() || (_user && _user.email) || "fiscal";
    const notaLinha = `${notaTag} por ${quem}] ${just}`;
    const notas = a.notas ? `${a.notas}\n${notaLinha}` : notaLinha;
    const { error: e1 } = await sb.from("fiscal_agenda")
      .update({ data_inicio: novaIso, status: statusNovo, notas })
      .eq("id", a.id);
    if (e1){ _appToast("Erro ao salvar: " + e1.message); btnSave.disabled = false; refletirAcao(); return; }
    // Sinaliza no kanban_cards pro pessoal do gestão ver no Space (só reagendamento).
    if (cardId && acao === "reagendar"){
      const prevDetails = (card && card.details) || {};
      const historico = Array.isArray(prevDetails.reagendamentos) ? prevDetails.reagendamentos.slice() : [];
      historico.push({ agenda_id: a.id, por: quem, motivo: just, data_anterior: a.data_inicio, nova_data: novaIso, em: agora.toISOString() });
      const details = { ...prevDetails, reagendamento_pendente: true, reagendamentos: historico };
      await sb.from("kanban_cards").update({ details }).eq("id", cardId);
    }
    closeAndRestore();
    if (acao === "agora"){
      // Se já existe laudo pendente/em andamento pra esse card+tipo, abre pra
      // editar em vez de criar outro. Senão cria novo com data/hora agora.
      await abrirOuCriarLaudo({ agenda_id: a.id, card_id: cardId || null, obra: a.obra || (card && card.title) || "", cliente: a.cliente || (card && card.title) || "", tipo: a.tipo });
      return;
    }
    if (cardId) renderObraDetail(cardId);
    else renderHome();
  };
}

// ║ GESTÃO NA OBRA — fiscal responsável + modelos (gestao.itens)  ║
// ║ Mesmos itens da página do projeto no gestao.parket.works.     ║
// ╚══════════════════════════════════════════════════════════════╝
const ITEM_ST = {
  pendente:     { label: "pendente",    color: "#FBBF24" },
  em_execucao:  { label: "em execução", color: "#60A5FA" },
  em_andamento: { label: "em execução", color: "#60A5FA" },
  entregue:     { label: "concluído",   color: "#34D399" },
  concluido:    { label: "concluído",   color: "#34D399" },
};
const ITEM_DONE = (st) => st === "entregue" || st === "concluido";

async function renderGestaoObraInfo(wrap, cardId, card){
  let d = null;
  try {
    const r = await fetchGestao(`${GESTAO_API}/api/fiscal/obra/${cardId}`);
    if (r.ok) d = await r.json();
  } catch (_e) { /* gestão fora do ar — segue sem os dados */ }

  // ── FISCAL RESPONSÁVEL (kanban_cards.details.fiscais — vínculo do gestão)
  // Só admin vincula/desvincula — o fiscal logado já É o responsável pelas obras dele.
  if (_isAdmin){
  const fiscais = (card.details && Array.isArray(card.details.fiscais)) ? card.details.fiscais : [];
  const fx = el(`<div class="card">
    <div class="label" style="color:var(--pk-accent)">Fiscal responsável</div>
    <div data-role="f-lista" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px"></div>
    <div data-role="f-add" style="display:flex;gap:6px;margin-top:8px"></div>
  </div>`);
  wrap.appendChild(fx);
  const flista = fx.querySelector('[data-role="f-lista"]');
  if (fiscais.length){
    for (const f of fiscais){
      const chip = el(`<span class="tag" style="background:rgba(52,211,153,0.15);color:#34D399;display:inline-flex;align-items:center;gap:6px;font-weight:700;padding:5px 10px">${esc(f.nome || "-")}<span data-x style="cursor:pointer;opacity:0.65">✕</span></span>`);
      chip.querySelector("[data-x]").onclick = async () => {
        if (!d || !d.projeto){ _appToast("Obra sem projeto no gestão, não dá pra desvincular por aqui."); return; }
        if (!(await _appConfirm(`Remover ${f.nome || "este fiscal"} desta obra?`, "Sim, remover", "#ef4444"))) return;
        try {
          const r = await fetchGestao(`${GESTAO_API}/api/fiscal/equipe/${f.id}/projetos/${d.projeto.id}`, {
            method: "DELETE",
            headers: { "X-User-Email": (_user && _user.email) || "" },
          });
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          renderObraDetail(cardId);
        } catch (e){ _appToast("Erro ao desvincular: " + (e.message || e)); }
      };
      flista.appendChild(chip);
    }
  } else {
    flista.appendChild(el(`<span class="small">Nenhum fiscal vinculado a esta obra ainda.</span>`));
  }
  if (d && d.projeto){
    let fisOpts = _fiscaisLista;
    if (!fisOpts || !fisOpts.length){
      const { data: fis } = await sb.from("fiscal_equipe").select("id, nome").eq("ativo", true).order("nome");
      fisOpts = fis || [];
    }
    const jaIds = new Set(fiscais.map(f => f.id));
    const opts = fisOpts.filter(f => !jaIds.has(f.id));
    if (opts.length){
      const add = fx.querySelector('[data-role="f-add"]');
      const sel = el(`<select style="flex:1"><option value="">+ vincular fiscal…</option>${opts.map(f => `<option value="${f.id}">${esc(f.nome)}</option>`).join("")}</select>`);
      const btn = el(`<button class="ghost" style="width:auto;padding:6px 14px;font-size:12px">Vincular</button>`);
      btn.onclick = async () => {
        const fid = sel.value;
        if (!fid) return;
        btn.disabled = true;
        try {
          const r = await fetchGestao(`${GESTAO_API}/api/fiscal/equipe/${fid}/projetos`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-User-Email": (_user && _user.email) || "" },
            body: JSON.stringify({ projeto_id: d.projeto.id }),
          });
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          renderObraDetail(cardId);
        } catch (e){
          btn.disabled = false;
          _appToast("Erro ao vincular: " + (e.message || e));
        }
      };
      add.appendChild(sel); add.appendChild(btn);
    }
  }
  }

  // ── MODELOS DA OBRA — mesma organização do gestão (raiz do meta.codigo).
  // Quando o item veio da importação SEM meta.codigo, o cliente fabrica um código
  // local "N.M" agrupando por (categoria_raiz || categoria || descritivo) —
  // mantém a UI legível e casa com a numeração do instala.
  if (!d || !d.itens || !d.itens.length) return;
  const itens = d.itens;
  const catKey = (it) => String(
    (it.meta && it.meta.categoria_raiz) ||
    (it.categoria || "").split("||")[0] ||
    "GERAL"
  ).toUpperCase().trim();
  const prodKey = (it) => String(
    (it.meta && it.meta.produto_header) ||
    it.descritivo ||
    ""
  ).trim();
  // 1ª passada: fabrica código local pros itens sem meta.codigo, agrupando por (cat, produto).
  const _catIdx = new Map();
  const _catCount = new Map();
  const _bucketIdx = new Map(); // "CAT|PRODUTO" -> "N.M" fixado no 1º item do bucket
  const _bucketNextSub = new Map(); // "N" -> proximo sufixo (raiz N virou "N.1", "N.2"...)
  const codLocal = new Map(); // item.id -> "N.M"
  for (const it of itens){
    if (it.meta && it.meta.codigo) continue;
    const cat = catKey(it);
    const prod = prodKey(it);
    const bkey = `${cat}|${prod}`;
    if (!_bucketIdx.has(bkey)){
      if (!_catIdx.has(cat)) _catIdx.set(cat, _catIdx.size + 1);
      const raiz = String(_catIdx.get(cat));
      const sub = (_bucketNextSub.get(raiz) || 0) + 1;
      _bucketNextSub.set(raiz, sub);
      _bucketIdx.set(bkey, `${raiz}.${sub}`);
    }
    codLocal.set(it.id, _bucketIdx.get(bkey));
  }
  const codDe = (it) => String((it.meta && it.meta.codigo) || codLocal.get(it.id) || it.ordem || "");
  const cmpCod = (a, b) => {
    const pa = String(a).split(".").map(Number), pb = String(b).split(".").map(Number);
    for (let i = 0; i < Math.max(pa.length, pb.length); i++){
      const dd = (pa[i] || 0) - (pb[i] || 0);
      if (dd !== 0) return dd;
    }
    return 0;
  };
  // Agrupamento raiz + filhos (sub-itens 3.6.1 vão pra dentro do 3.6)
  const raizes = new Map();
  for (const it of itens){
    const cod = codDe(it);
    const parts = cod.split(".");
    const raiz = parts[0] || "0";
    const g = raizes.get(raiz) || { direto: [], filhosPor: new Map() };
    if (parts.length >= 3){
      const parentCod = `${parts[0]}.${parts[1]}`;
      const arr = g.filhosPor.get(parentCod) || [];
      arr.push(it);
      g.filhosPor.set(parentCod, arr);
    } else {
      g.direto.push(it);
    }
    raizes.set(raiz, g);
  }
  wrap.appendChild(el(`<div class="card" style="border-color:rgba(150,132,115,0.30)">
    <div class="h2" style="margin:0">Modelos da obra</div>
    <div class="small">${itens.length} item(ns) do projeto no gestão${d.projeto && d.projeto.numero_proposta ? " · proposta " + esc(String(d.projeto.numero_proposta)) : ""}</div>
  </div>`));
  const fmtDataCurta = (s) => {
    if (!s) return "";
    try { const dt = new Date(s + (s.length === 10 ? "T00:00:00" : ""));
      return dt.toLocaleDateString("pt-BR", { day:"2-digit", month:"2-digit" });
    } catch { return s; }
  };
  // Equipes vinculadas ao card (kanban_cards.details.prestadores) — mesmo dado
  // que o gestão usa em /equipes. Mostra todas; se tiver categoria e casar com
  // a categoria_raiz do item, prioriza as que casam.
  const _prestadoresCard = (card && card.details && Array.isArray(card.details.prestadores))
    ? card.details.prestadores.filter(p => p && p.nome) : [];
  const equipesDoItem = (it) => {
    if (!_prestadoresCard.length) return [];
    const cat = catKey(it).toLowerCase();
    const bate = _prestadoresCard.filter(p =>
      cat && (p.categoria || "").toLowerCase().split(/[\/,]/).some(c => c.trim() && cat.includes(c.trim().toLowerCase()))
    );
    const src = bate.length ? bate : _prestadoresCard;
    // Dedup por nome preservando ordem
    const seen = new Set();
    return src.filter(p => { const n = (p.nome || "").trim(); if (!n || seen.has(n)) return false; seen.add(n); return true; });
  };

  const renderLinha = (it, cod) => {
    const st = ITEM_ST[it.status] || { label: it.status || "-", color: "#9CA3AF" };
    const qtd = Number(it.quantidade) || 0;
    const inst = Number((it.meta && it.meta.obra && it.meta.obra.qtd_instalada) || 0);
    const instTxt = qtd ? ` · ${inst}/${qtd} ${esc(it.unidade || "")}` : ` · ${qtd} ${esc(it.unidade || "")}`;
    const prazoIni = fmtDataCurta(it.previsao_inicio);
    const prazoFim = fmtDataCurta(it.previsao_fim);
    const prazo = (prazoIni || prazoFim) ? `${prazoIni || "?"}→${prazoFim || "?"}` : "";
    const equipes = equipesDoItem(it);
    const equipesTxt = equipes.map(p => p.nome).join(" · ");
    const obs  = (it.observacoes || "").trim();
    const catRaiz = catKey(it);
    const linha = el(`<div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start;cursor:pointer;padding:6px 0;border-top:1px dashed var(--pk-border1)" data-item="${esc(it.id || '')}">
      <div style="flex:1;min-width:0">
        <div style="font-size:12px;font-weight:600">${cod ? esc(cod) + " · " : ""}${esc(it.ambiente || "-")}</div>
        <div class="small" style="color:var(--pk-text-dim)">${esc(it.descritivo || "").slice(0,140)}</div>
        <div class="small" style="margin-top:2px">
          <span>${qtd}${esc(instTxt)}</span>
          ${prazo ? `<span style="margin-left:8px;color:var(--pk-text-muted)">Prazo ${esc(prazo)}</span>` : ""}
          ${equipesTxt ? `<span style="margin-left:8px;color:var(--pk-text-muted)">Equipe ${esc(equipesTxt)}</span>` : ""}
        </div>
        ${obs ? `<div class="small" style="margin-top:2px;color:var(--pk-text-muted);font-style:italic">Obs: ${esc(obs.slice(0,180))}</div>` : ""}
      </div>
      <span class="tag" style="background:${st.color}22;color:${st.color};flex-shrink:0;font-weight:700">${esc(st.label)}</span>
    </div>`);
    const labelItem = `${esc(catRaiz)} · ${esc(it.ambiente || "-")}${cod ? " (" + esc(cod) + ")" : ""}`;
    linha.onclick = () => renderItemFotosModal(d.projeto.id, it.id, labelItem);
    return linha;
  };
  for (const [raiz, g] of Array.from(raizes.entries()).sort((a, b) => cmpCod(a[0], b[0]))){
    g.direto.sort((x, y) => cmpCod(codDe(x), codDe(y)));
    for (const [k, arr] of g.filhosPor){
      arr.sort((x, y) => cmpCod(codDe(x), codDe(y)));
      g.filhosPor.set(k, arr);
    }
    const primeiro = g.direto[0] || Array.from(g.filhosPor.values())[0]?.[0];
    if (!primeiro) continue;
    const m0 = primeiro.meta || {};
    const catRaiz = String(m0.categoria_raiz || (primeiro.categoria || "").split("||")[0] || "").toUpperCase();
    const prodRaiz = m0.produto_header || primeiro.descritivo || "";
    const box = el(`<div class="card">
      <div style="font-size:10px;letter-spacing:0.10em;color:var(--pk-accent);font-weight:700">${esc(catRaiz)}</div>
      <div style="font-size:13px;font-weight:600;margin:2px 0 4px">${esc(prodRaiz)}</div>
      <div data-role="linhas" style="display:flex;flex-direction:column;gap:0"></div>
    </div>`);
    const linhas = box.querySelector('[data-role="linhas"]');
    for (const it of g.direto){
      linhas.appendChild(renderLinha(it, codDe(it)));
      const filhos = g.filhosPor.get(codDe(it)) || [];
      for (const f of filhos){
        const l = renderLinha(f, codDe(f));
        l.style.paddingLeft = "16px";
        linhas.appendChild(l);
      }
    }
    // Filhos órfãos (parent não está no direto)
    const idsDireto = new Set(g.direto.map(x => codDe(x)));
    for (const [parentCod, arr] of g.filhosPor){
      if (idsDireto.has(parentCod)) continue;
      for (const f of arr){
        const l = renderLinha(f, codDe(f));
        l.style.paddingLeft = "16px";
        linhas.appendChild(l);
      }
    }
    wrap.appendChild(box);
  }
}

// ║ PRESTADORES DA OBRA — fiscal adiciona/remove prestadores,     ║
// ║ marca QUAL é o principal e atribui itens do projeto a cada    ║
// ║ um. Grava via gestão API nos dois lados (details.prestadores  ║
// ║ do card + prestador_card do instala): mesma fonte da tela     ║
// ║ /equipes do gestão, então tudo fica consistente entre apps.   ║
// ╚══════════════════════════════════════════════════════════════╝

// Prestador "da obra" a partir de details.prestadores do card: o marcado
// como principal manda; sem principal, o primeiro vinculado representa.
function _prestPrincipalDe(prests){
  const ps = Array.isArray(prests) ? prests.filter(p => p && p.nome) : [];
  return { princ: ps.find(p => p.principal) || ps[0] || null, total: ps.length };
}

// Cache da lista de equipes (equipes_parket dedup por nome, ativas): usada
// pelos seletores inline de "escolher prestador" na lista de obras e no topo
// do detalhe, pra não rebuscar a cada card. Promessa compartilhada; erro
// limpa o cache pra próxima tentativa buscar de novo.
let _equipesCacheProm = null;
function _equipesAtivas(){
  if (!_equipesCacheProm){
    _equipesCacheProm = (async () => {
      const r = await fetchGestao(`${GESTAO_API}/api/obras/equipes?ativo=true&limit=300`);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const equipes = (await r.json()) || [];
      const vistos = new Set();
      return equipes.filter(e => {
        const n = (e.nome || "").trim().toLowerCase();
        if (!n || vistos.has(n)) return false;
        vistos.add(n);
        return true;
      });
    })().catch(err => { _equipesCacheProm = null; throw err; });
  }
  return _equipesCacheProm;
}

// Seletor inline "escolher prestador": preenche o slot com select + Vincular.
// Vincular = POST prestadores (grava details.prestadores do card + espelho
// prestador_card do instala) e já marca PRINCIPAL: quem é escolhido direto
// na obra É o prestador da obra. onDone re-renderiza a tela que chamou.
async function _prestVincInline(slot, cardId, onDone){
  slot.onclick = (ev) => ev.stopPropagation();  // slot vive dentro de cards clicáveis
  slot.innerHTML = `<span class="small" style="color:var(--pk-text-muted)">Carregando prestadores…</span>`;
  let opts = [];
  try { opts = await _equipesAtivas(); }
  catch (_e){ slot.innerHTML = `<span class="small" style="color:#F87171">Sem conexão com o gestão. Tente de novo.</span>`; return; }
  slot.innerHTML = "";
  slot.style.display = "flex"; slot.style.gap = "6px"; slot.style.alignItems = "center";
  const sel = el(`<select style="flex:1;min-width:0"><option value="">escolher prestador…</option>${opts.map(e =>
    `<option value="${e.id}">${esc(e.nome)}${e.categoria ? " (" + esc(e.categoria) + ")" : ""}</option>`).join("")}</select>`);
  const btn = el(`<button class="ghost" style="width:auto;padding:6px 12px;font-size:11px;flex-shrink:0">Vincular</button>`);
  btn.onclick = async (ev) => {
    ev.stopPropagation();
    const eid = sel.value;
    if (!eid) return;
    btn.disabled = true;
    const hdrs = { "Content-Type": "application/json", "X-User-Email": (_user && _user.email) || "" };
    try {
      const r1 = await fetchGestao(`${GESTAO_API}/api/obras/${cardId}/prestadores`, {
        method: "POST", headers: hdrs, body: JSON.stringify({ equipe_id: eid }),
      });
      if (!r1.ok) throw new Error(`HTTP ${r1.status}`);
      // principal é exclusivo por obra: o backend desmarca os demais
      const r2 = await fetchGestao(`${GESTAO_API}/api/obras/${cardId}/prestadores/${eid}/principal`, {
        method: "PUT", headers: hdrs, body: JSON.stringify({ principal: true }),
      });
      if (!r2.ok) throw new Error(`HTTP ${r2.status}`);
      onDone();
    } catch (e){ btn.disabled = false; _appToast("Erro ao vincular: " + (e.message || e)); }
  };
  slot.appendChild(sel); slot.appendChild(btn);
}

// onReload opcional: telas fora do detalhe da obra (ex.: menu Prestadores)
// passam o próprio re-render; default mantém o comportamento original.
async function renderPrestadoresObra(wrap, cardId, card, onReload){
  // Projeto + itens do gestão: os itens alimentam o checklist de escopo por
  // prestador. Sem projeto no gestão a seção segue viva (vincular/principal),
  // só o escopo por item fica indisponível (não há gestao.itens pra listar).
  let proj = null, itens = [];
  try {
    const r = await fetchGestao(`${GESTAO_API}/api/fiscal/obra/${cardId}`);
    if (r.ok){ const d = await r.json(); proj = d.projeto || null; itens = d.itens || []; }
  } catch (_e) { /* gestão fora do ar: segue só com o vínculo do card */ }

  // Lista de prestadores: com projeto vem enriquecida (categoria, telefone e
  // escopo_itens_ids do instala); sem projeto usa o details.prestadores cru.
  let prestadores = null;
  if (proj){
    try {
      const r = await fetchGestao(`${GESTAO_API}/api/projetos/${proj.id}/prestadores`);
      if (r.ok) prestadores = (await r.json()) || [];
    } catch (_e) { /* cai pro fallback do card logo abaixo */ }
  }
  if (prestadores === null){
    prestadores = (card.details && Array.isArray(card.details.prestadores))
      ? card.details.prestadores.filter(p => p && typeof p === "object") : [];
  }

  const box = el(`<div class="card" style="border-color:rgba(150,132,115,0.30)">
    <div class="h2" style="margin:0">Prestadores da obra</div>
    <div class="small" style="color:var(--pk-text-dim)">Quem executa esta obra. Marque o principal e, se precisar, atribua itens diferentes pra cada um.</div>
    <div data-role="p-lista" style="display:flex;flex-direction:column;gap:8px;margin-top:8px"></div>
    <div data-role="p-add" style="display:flex;gap:6px;margin-top:10px"></div>
  </div>`);
  wrap.appendChild(box);
  const lista = box.querySelector('[data-role="p-lista"]');

  const hdrs = { "Content-Type": "application/json", "X-User-Email": (_user && _user.email) || "" };
  const reload = onReload || (() => renderObraDetail(cardId));

  // Código legível de um item (mesma regra dos Modelos da obra: meta.codigo manda)
  const codItem = (it) => String((it.meta && it.meta.codigo) || "");
  const cmpCodP = (a, b) => {
    const pa = String(a).split(".").map(Number), pb = String(b).split(".").map(Number);
    for (let i = 0; i < Math.max(pa.length, pb.length); i++){
      const dd = (pa[i] || 0) - (pb[i] || 0);
      if (dd !== 0) return dd;
    }
    return 0;
  };
  const itensOrdenados = (itens || []).slice().sort((x, y) => cmpCodP(codItem(x) || "999", codItem(y) || "999"));
  const itemById = new Map(itensOrdenados.map(it => [String(it.id), it]));

  // ── linha de cada prestador vinculado
  if (!prestadores.length){
    lista.appendChild(el(`<span class="small">Nenhum prestador vinculado a esta obra ainda.</span>`));
  }
  for (const p of prestadores){
    const escopo = Array.isArray(p.escopo_itens_ids) ? p.escopo_itens_ids.map(String) : [];
    // Resumo do escopo: vazio = obra inteira (compat com o instala)
    const escopoCods = escopo.map(id => codItem(itemById.get(id) || {}) || "?").sort(cmpCodP);
    const escopoTxt = escopo.length ? `Itens: ${escopoCods.join(", ")}` : "Itens: obra inteira";
    const row = el(`<div style="border:1px solid var(--pk-border1);border-radius:8px;padding:8px 10px">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:700">${esc(p.nome || "-")}
            ${p.principal ? `<span class="tag" data-chip-principal style="background:rgba(150,132,115,0.22);color:var(--pk-accent);font-weight:700;margin-left:6px;cursor:pointer" title="Toque pra desmarcar">PRINCIPAL</span>` : ""}
          </div>
          <div class="small" style="color:var(--pk-text-dim)">${esc([p.categoria, p.telefone].filter(Boolean).join(" · ") || "sem detalhes")}</div>
          ${proj ? `<div class="small" style="margin-top:2px;color:var(--pk-text-muted)">${esc(escopoTxt)}</div>` : ""}
        </div>
        <span data-remover style="cursor:pointer;opacity:0.6;font-size:14px;flex-shrink:0" title="Remover desta obra">✕</span>
      </div>
      <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
        ${!p.principal ? `<button class="ghost" data-marcar-principal style="width:auto;padding:5px 12px;font-size:11px">Marcar principal</button>` : ""}
        ${proj && itensOrdenados.length ? `<button class="ghost" data-itens style="width:auto;padding:5px 12px;font-size:11px">Atribuir itens</button>` : ""}
      </div>
      <div data-role="escopo-editor" style="display:none;margin-top:8px;border-top:1px dashed var(--pk-border1);padding-top:8px"></div>
    </div>`);
    lista.appendChild(row);

    // principal: exclusivo por obra (o backend desmarca os demais)
    const btnP = row.querySelector("[data-marcar-principal]");
    if (btnP) btnP.onclick = async () => {
      btnP.disabled = true;
      try {
        const r = await fetchGestao(`${GESTAO_API}/api/obras/${cardId}/prestadores/${p.id}/principal`, {
          method: "PUT", headers: hdrs, body: JSON.stringify({ principal: true }),
        });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        reload();
      } catch (e){ btnP.disabled = false; _appToast("Erro ao marcar principal: " + (e.message || e)); }
    };
    const chipP = row.querySelector("[data-chip-principal]");
    if (chipP) chipP.onclick = async () => {
      if (!(await _appConfirm(`${p.nome || "Este prestador"} deixa de ser o principal da obra?`, "Sim, desmarcar", "#ef4444"))) return;
      try {
        const r = await fetchGestao(`${GESTAO_API}/api/obras/${cardId}/prestadores/${p.id}/principal`, {
          method: "PUT", headers: hdrs, body: JSON.stringify({ principal: false }),
        });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        reload();
      } catch (e){ _appToast("Erro ao desmarcar: " + (e.message || e)); }
    };

    // remover da obra (desfaz nos dois lados via gestão API)
    row.querySelector("[data-remover]").onclick = async () => {
      if (!(await _appConfirm(`Remover ${p.nome || "este prestador"} desta obra?`, "Sim, remover", "#ef4444"))) return;
      try {
        const r = await fetchGestao(`${GESTAO_API}/api/obras/${cardId}/prestadores/${p.id}`, {
          method: "DELETE", headers: { "X-User-Email": (_user && _user.email) || "" },
        });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        reload();
      } catch (e){ _appToast("Erro ao remover: " + (e.message || e)); }
    };

    // escopo por item: checklist dos gestao.itens; nada marcado = obra inteira
    const btnI = row.querySelector("[data-itens]");
    if (btnI) btnI.onclick = () => {
      const ed = row.querySelector('[data-role="escopo-editor"]');
      if (ed.style.display !== "none"){ ed.style.display = "none"; return; }
      ed.style.display = "block";
      ed.replaceChildren();
      ed.appendChild(el(`<div class="small" style="margin-bottom:6px;color:var(--pk-text-dim)">Marque o que este prestador executa. Nada marcado = obra inteira.</div>`));
      const marcados = new Set(escopo);
      for (const it of itensOrdenados){
        const cod = codItem(it);
        const lbl = `${cod ? cod + " · " : ""}${it.ambiente || "-"}`;
        const det = String(it.descritivo || "").slice(0, 60);
        const li = el(`<label style="display:flex;gap:8px;align-items:flex-start;padding:4px 0;cursor:pointer">
          <input type="checkbox" ${marcados.has(String(it.id)) ? "checked" : ""} style="margin-top:2px;width:auto">
          <span style="flex:1;min-width:0"><span style="font-size:12px;font-weight:600">${esc(lbl)}</span>
            ${det ? `<span class="small" style="display:block;color:var(--pk-text-muted)">${esc(det)}</span>` : ""}</span>
        </label>`);
        li.querySelector("input").onchange = (ev) => {
          if (ev.target.checked) marcados.add(String(it.id)); else marcados.delete(String(it.id));
        };
        ed.appendChild(li);
      }
      const acts = el(`<div style="display:flex;gap:6px;margin-top:8px">
        <button data-salvar style="flex:1;padding:8px;font-size:12px">Salvar itens</button>
        <button class="ghost" data-inteira style="width:auto;padding:8px 12px;font-size:12px">Obra inteira</button>
      </div>`);
      const salvarEscopo = async (ids, btn) => {
        btn.disabled = true;
        try {
          const r = await fetchGestao(`${GESTAO_API}/api/projetos/${proj.id}/prestadores/${p.id}/escopo`, {
            method: "PUT", headers: hdrs, body: JSON.stringify({ itens_ids: ids }),
          });
          if (!r.ok){
            const err = await r.json().catch(() => ({}));
            throw new Error(err.detail || `HTTP ${r.status}`);
          }
          reload();
        } catch (e){ btn.disabled = false; _appToast("Erro ao salvar itens: " + (e.message || e)); }
      };
      acts.querySelector("[data-salvar]").onclick = (ev) => salvarEscopo(Array.from(marcados), ev.target);
      acts.querySelector("[data-inteira]").onclick = (ev) => salvarEscopo([], ev.target);
      ed.appendChild(acts);
    };
  }

  // ── vincular prestador novo (lista viva de equipes_parket, ativos primeiro)
  try {
    const r = await fetchGestao(`${GESTAO_API}/api/obras/equipes?ativo=true&limit=300`);
    if (r.ok){
      const equipes = (await r.json()) || [];
      // equipes_parket tem linhas repetidas por nome (importações antigas):
      // dedup por nome; ids já vinculados (dos 2 tipos) e nomes iguais ficam fora
      const jaIds = new Set(prestadores.map(p => String(p.id)));
      const jaNomes = new Set(prestadores.map(p => (p.nome || "").trim().toLowerCase()).filter(Boolean));
      const vistos = new Set();
      const opts = equipes.filter(e => {
        const n = (e.nome || "").trim().toLowerCase();
        if (!n || vistos.has(n)) return false;
        vistos.add(n);
        return !jaIds.has(String(e.id)) && !jaIds.has(String(e.prestador_id || "")) && !jaNomes.has(n);
      });
      if (opts.length){
        const add = box.querySelector('[data-role="p-add"]');
        const sel = el(`<select style="flex:1"><option value="">+ adicionar prestador…</option>${opts.map(e =>
          `<option value="${e.id}">${esc(e.nome)}${e.categoria ? " (" + esc(e.categoria) + ")" : ""}</option>`).join("")}</select>`);
        const btn = el(`<button class="ghost" style="width:auto;padding:6px 14px;font-size:12px">Vincular</button>`);
        btn.onclick = async () => {
          const eid = sel.value;
          if (!eid) return;
          btn.disabled = true;
          try {
            const r2 = await fetchGestao(`${GESTAO_API}/api/obras/${cardId}/prestadores`, {
              method: "POST", headers: hdrs, body: JSON.stringify({ equipe_id: eid }),
            });
            if (!r2.ok) throw new Error(`HTTP ${r2.status}`);
            reload();
          } catch (e){ btn.disabled = false; _appToast("Erro ao vincular: " + (e.message || e)); }
        };
        add.appendChild(sel); add.appendChild(btn);
      }
    }
  } catch (_e) { /* sem lista de equipes o fiscal ainda vê/edita os vinculados */ }
}

// ╔══════════════════════════════════════════════════════════════╗
// ║ MODAL DE FOTOS DO ITEM — mostra as fotos que o instalador     ║
// ║ enviou pra esse item específico (gestao.fotos).                ║
// ╚══════════════════════════════════════════════════════════════╝
async function renderItemFotosModal(projetoId, itemId, labelItem){
