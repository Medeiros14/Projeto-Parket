  .empty { display: flex; flex-direction: column; align-items: center; justify-content: center;

  .spinner { display: inline-block; width: 14px; height: 14px;

  /* ── Desktop ── */
  @media (min-width: 769px) {
    #app { max-width: 480px; margin: 0 auto; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
    .info-drawer { left: 50%; right: auto; transform: translate(-50%, 100%); width: 100%; max-width: 480px; }
    .info-overlay.open .info-drawer { transform: translate(-50%, 0); }
  }
</style>

    if (dStr === now.toDateString()) return "Hoje";
    const yest = new Date(now); yest.setDate(yest.getDate() - 1);
    if (dStr === yest.toDateString()) return "Ontem";
    return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "long", year: d.getFullYear() !== now.getFullYear() ? "numeric" : undefined });
  } catch { return ""; }
};
const normT = (s) => {
  if (!s) return "";
  let t = String(s).toLowerCase();
  try { t = t.normalize("NFD").replace(/[̀-ͯ]/g, ""); } catch {}
  return t.replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
};
const COL_LABELS = {"pre-cronograma":"Pré-Cronograma","cronograma-final":"Cronograma","obras-liberadas":"Obra Liberada","projeto":"Projeto","entrega-material":"Entrega","primeira-vistoria":"1ª Vistoria","segunda-vistoria":"2ª Vistoria","acompanhamento":"Acompanhamento","travado":"Travado","pendente":"Pendente","reparos":"Reparos","reparos-concluidos":"Reparos OK","obras-finalizadas":"Finalizada"};

const isUnread = (co) => {
  if ((co.unread_count || 0) > 0) return true;
  if (co.last_msg_from_me) return false;
  if (!co.last_msg_at) return false;
  const last = state.readMap[co.id] || 0;
  try { return new Date(co.last_msg_at).getTime() > last; } catch { return false; }
};
const markRead = (co) => {
  state.readMap[co.id] = Date.now();

};

const nameOf = (co) => {
  const kc = co.kanban_cards || {}; const ag = co.atendimento_grupos || {};
  return kc.title || ag.cliente || ag.subject || "—";
};
const opPhaseOf = (co) => {
  if (!co) return null;
  const kc = co.kanban_cards || {}; const ag = co.atendimento_grupos || {};
  const cands = [kc.title, kc.obra && ("__obra__" + kc.obra), ag.cliente, ag.subject];
  for (const c of cands) {
    if (!c) continue;
    const key = c.startsWith && c.startsWith("__obra__") ? c : normT(c);
    if (state.opPhaseMap[key]) return state.opPhaseMap[key];
  }
  return null;
};

const extractText = (m) => {
  const mm = m.message || {};
  if (mm.conversation) return mm.conversation;
  if (mm.extendedTextMessage) return mm.extendedTextMessage.text || "";
  if (mm.imageMessage) return mm.imageMessage.caption || "[imagem]";
  if (mm.videoMessage) return mm.videoMessage.caption || "[vídeo]";
  if (mm.audioMessage) return "[áudio]";
  if (mm.documentMessage) return "[doc] " + (mm.documentMessage.fileName || "");
  return "";
};
const mimetypeOf = (m) => {
  const mm = m.message || {};
  for (const t of ["imageMessage", "videoMessage", "audioMessage", "documentMessage"]) {
    if (mm[t] && mm[t].mimetype) return mm[t].mimetype;
  }
  return "application/octet-stream";
};
const fileToB64 = (f) => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res((r.result || "").split(",")[1] || "");
  r.onerror = rej;
  r.readAsDataURL(f);
});

async function loadMsgs(jid) {

  try {
    const r = await fetch(EVO_API + "/chat/findMessages/" + INST_ENC, {
      method: "POST",

    });

    list.sort((a, b) => (a.messageTimestamp || 0) - (b.messageTimestamp || 0));
    state.msgs = list;
  } catch (e) {
    console.error(e); toast("Erro ao carregar msgs", false);
    state.msgs = [];
  }
  state.loadingMsgs = false; renderChatMsgs();
  scrollMsgsToBottom();

async function fetchMediaB64(m) {
  const msgId = m.key && m.key.id;
  if (!msgId) return;
  const cur = state.mediaCache[msgId];
  if (cur && (cur.url || cur.loading || cur.error)) return;
  state.mediaCache[msgId] = { loading: true };
  try {
    const r = await fetch(EVO_API + "/chat/getBase64FromMediaMessage/" + INST_ENC, {
      method: "POST",
      headers: { apikey: EVO_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ message: { key: m.key } })
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    const b64 = d.base64 || d.media || "";
    if (!b64) throw new Error("sem base64");
    state.mediaCache[msgId] = { url: "data:" + mimetypeOf(m) + ";base64," + b64 };
    renderChatMsgs(true);
  } catch (e) {
    state.mediaCache[msgId] = { error: e.message || "Falha" };
    renderChatMsgs(true);
  }
}

function fetchAllMedia() {
  for (const m of state.msgs.slice(-50)) {
    const mm = m.message || {};
    if (mm.imageMessage || mm.videoMessage || mm.stickerMessage) fetchMediaB64(m);
  }
}

let _chConvs = null, _chMsgs = null;
function subscribeConvs() {
  if (_chConvs) { try { sb.removeChannel(_chConvs); } catch {} }
  _chConvs = sb.channel("cs_convs_app")
    .on("postgres_changes", { event: "*", schema: "public", table: "atendimento_conversas" }, () => loadConvs())
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "whatsapp_messages" }, () => loadConvs())
    .subscribe();
}
function subscribeMsgs(jid) {
  if (_chMsgs) { try { sb.removeChannel(_chMsgs); } catch {} _chMsgs = null; }
  if (!jid) return;
  _chMsgs = sb.channel("cs_msgs_app_" + jid)
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "whatsapp_messages", filter: "phone=eq." + jid }, () => loadMsgs(jid))
    .subscribe();
}

// ─── Filter ───
function filterConvs() {
  const q = state.q.toLowerCase();
  return state.convs.filter(co => {
    if (state.filt === "unread") { if (!isUnread(co)) return false; }
    else if (state.filt !== "todas" && co.status !== state.filt) return false;
    if (state.opFilt !== "todas") {
      const ph = opPhaseOf(co);
      if (state.opFilt === "_sem_op") { if (ph) return false; }
      else if (ph !== state.opFilt) return false;
    }
    if (q) {
      const subj = (co.atendimento_grupos && co.atendimento_grupos.subject) || "";
      const cli = (co.kanban_cards && co.kanban_cards.title) || (co.atendimento_grupos && co.atendimento_grupos.cliente) || "";
      return subj.toLowerCase().includes(q) || cli.toLowerCase().includes(q);
    }
    return true;
  });
}

  hdr.querySelector("#_back").onclick = () => {
    state.sel = null;
    if (_chMsgs) { try { sb.removeChannel(_chMsgs); } catch {} _chMsgs = null; }
    renderList();
  };
  hdr.querySelector("#_info").onclick = () => { state.drawerOpen = true; renderInfoDrawer(); };
  app.appendChild(hdr);

  const wrap = el(`<div class="chat-wrap">
    <div class="msgs">${renderMsgsHtml()}</div>
    ${renderComposerHtml()}
  </div>`);
  app.appendChild(wrap);
  bindComposer(); bindMediaClicks();
  scrollMsgsToBottom();
}

function renderChatHeader() {
  if (!state.sel) return;
  const old = document.querySelector(".hdr");
  if (!old) return;
  const co = state.sel; const ph = opPhaseOf(co);
  const subEl = old.querySelector(".sub");
  if (subEl) subEl.innerHTML = (ph ? PHASE_EMOJI[ph] + " " + esc(COL_LABELS[ph]) : esc(co.status || "")) + (co.atribuido_a ? " · 👤 " + esc(co.atribuido_a) : "");
}

function renderChatMsgs(preserveScroll) {
  const m = document.querySelector(".msgs");
  if (!m) return;
  const wasAtBottom = (m.scrollHeight - m.scrollTop - m.clientHeight) < 80;
  const prevTop = m.scrollTop;
  m.innerHTML = renderMsgsHtml();
  bindMediaClicks();
  if (preserveScroll && !wasAtBottom) m.scrollTop = prevTop;
  else m.scrollTop = m.scrollHeight;
}

function renderMsgsHtml() {
  if (state.loadingMsgs) return `<div class="loading"><span class="spinner"></span> Carregando mensagens…</div>`;
  if (!state.msgs.length) return `<div class="empty"><div class="emo">💭</div><div>Sem mensagens</div></div>`;
  let html = "";
  let lastDay = "";
  for (const m of state.msgs) {
    const day = fmtDay(m.messageTimestamp);
    if (day !== lastDay) {
      html += `<div class="day-sep"><span>${esc(day)}</span></div>`;
      lastDay = day;
    }
    html += renderMsgBubble(m);
  }
  return html;
}

function renderMsgBubble(m) {
  const out = m.fromMe || (m.key && m.key.fromMe);
  const mm = m.message || {};
  const msgId = m.key && m.key.id;
  const sender = (!out) ? (m.pushName || "") : "";
  let body = "";
  if (mm.conversation) body = `<div class="text">${esc(mm.conversation)}</div>`;
  else if (mm.extendedTextMessage) body = `<div class="text">${esc(mm.extendedTextMessage.text || "")}</div>`;
  else if (mm.imageMessage) {
    const c = state.mediaCache[msgId];
    body = c && c.url ? `<img src="${c.url}" data-zoom="${c.url}" alt="" />`
      : c && c.error ? `<div class="media-ph">⚠ ${esc(c.error)}</div>`
      : c && c.loading ? `<div class="media-ph">⏳ Carregando…</div>`
      : `<div class="media-ph" data-load="${msgId}">📷 Tocar pra carregar</div>`;
    if (mm.imageMessage.caption) body += `<div class="text" style="margin-top:5px">${esc(mm.imageMessage.caption)}</div>`;
  } else if (mm.videoMessage) {
    const c = state.mediaCache[msgId];
    body = c && c.url ? `<video src="${c.url}" controls></video>`
      : c && c.error ? `<div class="media-ph">⚠ ${esc(c.error)}</div>`
      : c && c.loading ? `<div class="media-ph">⏳ Carregando…</div>`
      : `<div class="media-ph" data-load="${msgId}">🎥 Tocar pra carregar</div>`;
    if (mm.videoMessage.caption) body += `<div class="text" style="margin-top:5px">${esc(mm.videoMessage.caption)}</div>`;
  } else if (mm.audioMessage) {
    const c = state.mediaCache[msgId];
    body = c && c.url ? `<audio src="${c.url}" controls></audio>`
      : c && c.error ? `<div class="text">⚠ ${esc(c.error)}</div>`
      : c && c.loading ? `<div class="text">⏳ Carregando…</div>`
      : `<div class="media-ph" data-load="${msgId}">🎤 Tocar pra carregar áudio</div>`;
  } else if (mm.documentMessage) {
    const c = state.mediaCache[msgId];
    const fn = mm.documentMessage.fileName || "documento";
    body = c && c.url
      ? `<div class="doc">📎 <a href="${c.url}" download="${esc(fn)}">${esc(fn)}</a></div>`
      : `<div class="media-ph" data-load="${msgId}">📎 ${esc(fn)}</div>`;
  } else if (mm.stickerMessage) {
    const c = state.mediaCache[msgId];
    body = c && c.url ? `<img src="${c.url}" style="max-width:120px" />` : `<div class="media-ph" data-load="${msgId}">😀 Sticker</div>`;
  } else {
    body = `<div class="text" style="color:var(--muted2);font-style:italic">[tipo não suportado]</div>`;
  }
  const ts = fmtMsgTime(m.messageTimestamp);
  const ack = out
    ? (m.status === "READ" ? `<span class="ack read">✓✓</span>` : m.status === "DELIVERY_ACK" ? `<span class="ack">✓✓</span>` : m.status === "SERVER_ACK" ? `<span class="ack">✓</span>` : `<span class="ack">⏱</span>`)
    : "";
  return `<div class="msg ${out ? "out" : "in"}">
    <div class="bubble">
      ${sender ? `<div class="sender">${esc(sender)}</div>` : ""}
      ${body}
      <div class="footer">${ts} ${ack}</div>
    </div>
  </div>`;
}

function bindMediaClicks() {
  document.querySelectorAll(".media-ph[data-load]").forEach(d => {
    d.onclick = () => {
      const m = state.msgs.find(x => x.key && x.key.id === d.dataset.load);
      if (m) fetchMediaB64(m);
    };
  });
  document.querySelectorAll("img[data-zoom]").forEach(img => {
    img.onclick = () => {
      const overlay = el(`<div class="lightbox"><img src="${img.dataset.zoom}" alt="" /></div>`);
      overlay.onclick = () => overlay.remove();
      document.body.appendChild(overlay);
    };
  });
}

function renderComposerHtml() {
  return `<div class="composer-wrap">
    ${state.recording ? `
      <div class="rec-bar">
        <div class="dot"></div>
        <div class="time" id="_rec_time">0:00</div>
        <button id="_rec_cancel" title="Cancelar">✕</button>
        <button id="_rec_ok" class="ok" title="Enviar">↑</button>
      </div>
    ` : ""}
    <div class="composer">
      <button class="composer-btn" id="_attach" title="Anexar">📎</button>
      <textarea id="_draft" placeholder="Mensagem…" rows="1"></textarea>
      <input type="file" id="_file" accept="image/*,video/*,application/*" style="display:none" />
      ${state.recording
        ? `<button class="composer-btn primary recording" id="_send" disabled>●</button>`
        : `<button class="composer-btn primary" id="_send" ${state.sending ? "disabled" : ""}>${state.sending ? "…" : "➤"}</button>`}
      <button class="composer-btn" id="_mic" title="Gravar áudio">🎤</button>
    </div>
  </div>`;
}

function renderComposer() {
  const old = document.querySelector(".composer-wrap");
  if (!old) return;
  old.outerHTML = renderComposerHtml();
  bindComposer();
}

let _mediaRecorder = null, _recTimer = null, _recChunks = [];
function bindComposer() {
  const ta = document.getElementById("_draft");
  if (ta) {
    ta.oninput = () => { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 120) + "px"; };
    ta.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey && !e.ctrlKey) { e.preventDefault(); doSend(); } };
  }
  const sendBtn = document.getElementById("_send");
  if (sendBtn) sendBtn.onclick = doSend;
  const attachBtn = document.getElementById("_attach");
  if (attachBtn) attachBtn.onclick = () => document.getElementById("_file").click();
  const fileIn = document.getElementById("_file");
  if (fileIn) fileIn.onchange = (ev) => {
    const f = ev.target.files[0]; if (!f) return;
    sendMedia(state.sel.grupo_jid, f, "");
    fileIn.value = "";
  };
  const micBtn = document.getElementById("_mic");
  if (micBtn) micBtn.onclick = toggleRec;
  const cancelBtn = document.getElementById("_rec_cancel");
  if (cancelBtn) cancelBtn.onclick = cancelRec;
  const okBtn = document.getElementById("_rec_ok");
  if (okBtn) okBtn.onclick = stopRec;

  function doSend() {
    if (!ta) return;
    const txt = ta.value.trim();
    if (!txt || state.sending) return;
    ta.value = ""; ta.style.height = "auto";
    sendText(state.sel.grupo_jid, txt);
  }
}

async function toggleRec() {
  if (state.recording) { stopRec(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    _mediaRecorder = new MediaRecorder(stream);
    _recChunks = [];
    _mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size) _recChunks.push(e.data); };
    _mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      if (_recChunks.length > 0) {
        const blob = new Blob(_recChunks, { type: _mediaRecorder.mimeType || "audio/webm" });
        sendAudio(state.sel.grupo_jid, blob);
      }
    };
    _mediaRecorder.start();
    state.recording = true; state.recTime = 0; renderComposer();
    _recTimer = setInterval(() => {
      state.recTime++;
      const m = Math.floor(state.recTime / 60), s = state.recTime % 60;
      const e = document.getElementById("_rec_time");
      if (e) e.textContent = m + ":" + String(s).padStart(2, "0");
    }, 1000);
  } catch (e) {
    toast("Mic: " + e.message, false);
  }
}
function stopRec() {
  if (_mediaRecorder && _mediaRecorder.state !== "inactive") _mediaRecorder.stop();
  if (_recTimer) { clearInterval(_recTimer); _recTimer = null; }
  state.recording = false; renderComposer();
}
function cancelRec() {
  if (_mediaRecorder) {
    _mediaRecorder.ondataavailable = null;
    _mediaRecorder.onstop = () => { try { _mediaRecorder.stream && _mediaRecorder.stream.getTracks().forEach(t => t.stop()); } catch {} };
    try { _mediaRecorder.stop(); } catch {}
  }
  if (_recTimer) { clearInterval(_recTimer); _recTimer = null; }
  _recChunks = [];
  state.recording = false; renderComposer();
}

function renderInfoDrawer() {
  let overlay = document.querySelector(".info-overlay");
  if (!state.drawerOpen) {
    if (overlay) overlay.remove();
    return;
  }
  if (!overlay) {
    overlay = el(`<div class="info-overlay" id="_info_overlay"><div class="info-drawer"><div class="drawer-handle"></div><div class="drawer-content" id="_drawer_content"></div></div></div>`);
    document.body.appendChild(overlay);
    overlay.onclick = (ev) => { if (ev.target === overlay) { state.drawerOpen = false; renderInfoDrawer(); } };
    setTimeout(() => overlay.classList.add("open"), 10);
  }
  const dc = overlay.querySelector("#_drawer_content");
  const co = state.sel; const p = state.projeto;
  const ph = co ? opPhaseOf(co) : null;
  dc.innerHTML = `
    ${p ? `
      <div class="info-section">
        <h3 class="gold">📋 Projeto</h3>
        <div style="font-size:14px;font-weight:700">${esc(p.title || "—")}</div>
        ${p.obra ? `<div style="font-size:12px;color:var(--muted);margin-top:2px">🏗️ ${esc(p.obra)}</div>` : ""}
        ${ph ? `
          <div class="phase-card">
            <div class="emo">${PHASE_EMOJI[ph] || "📍"}</div>
            <div>
              <div class="lbl">${p._opCard ? "Fase atual (Operacional)" : "Fase atual"}</div>
              <div class="nm">${esc(COL_LABELS[ph] || ph)}</div>
            </div>
          </div>
        ` : ""}
        <div class="info-grid">
          ${p.dept_id ? `<div class="info-cell"><div class="k">Setor</div><div class="v">${esc(p.dept_id)}</div></div>` : ""}
          ${p.responsavel ? `<div class="info-cell"><div class="k">Responsável</div><div class="v">${esc(p.responsavel)}</div></div>` : ""}
          ${p.details && (p.details.metragem_estimada || p.details.area_m2) ? `<div class="info-cell"><div class="k">Área</div><div class="v">${esc(p.details.metragem_estimada || p.details.area_m2)} m²</div></div>` : ""}
          ${p.details && p.details.fiscal_responsavel && p.details.fiscal_responsavel !== "NÃO" ? `<div class="info-cell"><div class="k">Fiscal</div><div class="v">${esc(p.details.fiscal_responsavel)}</div></div>` : ""}
        </div>
        ${p.details && p.details.cronograma_pmo && Array.isArray(p.details.cronograma_pmo.itens) ? `
          <div style="margin-top:10px;padding:8px 10px;background:rgba(34,197,94,0.06);border:1px solid rgba(34,197,94,0.25);border-radius:6px">
            <div style="font-size:11px;color:var(--green);font-weight:700;text-transform:uppercase;margin-bottom:6px">🔨 Acompanhamento ${p.details.cronograma_pmo.total_dias_uteis > 0 ? `· ${p.details.cronograma_pmo.total_dias_uteis} dias` : ""}</div>
            ${p.details.cronograma_pmo.previsao_inicio ? `<div style="font-size:12px;color:var(--muted);margin-bottom:4px">📅 Início: ${esc(p.details.cronograma_pmo.previsao_inicio)}</div>` : ""}
            ${p.details.cronograma_pmo.itens.slice(0, 5).map(it => `<div style="font-size:12px;display:flex;justify-content:space-between;gap:6px;margin-top:3px"><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">• ${esc(it.servico || it.categoria)}</span><span style="color:#86efac;font-family:monospace">${Number(it.quantidade || 0).toLocaleString("pt-BR")} ${esc(it.unidade || "")}</span></div>`).join("")}
          </div>
        ` : ""}
      </div>
    ` : ""}

    <div class="info-section">
      <h3 class="purple">✨ IA Copiloto</h3>
      <div class="ai-btns">
        <button class="ai-btn resumir" id="_ai_resumir" ${state.aiLd ? "disabled" : ""}>${state.aiLd ? "…" : "📝 Resumir"}</button>
        <button class="ai-btn sugerir" id="_ai_sugerir" ${state.aiLd ? "disabled" : ""}>${state.aiLd ? "…" : "💡 Sugerir"}</button>
        <button class="ai-btn tom" id="_ai_tom" ${state.aiLd ? "disabled" : ""}>${state.aiLd ? "…" : "🔍 Tom"}</button>
      </div>
      ${state.aiResumo ? `<div class="ai-box">${esc(state.aiResumo)}</div>` : ""}
      ${state.aiSug.length > 0 ? `
        <div style="font-size:11px;color:var(--muted2);text-transform:uppercase;margin-bottom:4px">💡 Sugestões (toque pra usar):</div>
        ${state.aiSug.map((s, i) => {
          const txt = typeof s === "string" ? s : (s.texto || s.text || "");
          return `<div class="ai-sug" data-sug="${i}">${esc(txt)}</div>`;
        }).join("")}
      ` : ""}
      ${state.aiSens ? `
        <div style="font-size:11px;color:var(--muted2);text-transform:uppercase;margin:8px 0 4px">🔍 Tom:</div>
        <div class="ai-box" style="background:rgba(245,158,11,0.06);border-color:rgba(245,158,11,0.3)">${esc(typeof state.aiSens === "string" ? state.aiSens : JSON.stringify(state.aiSens, null, 2))}</div>
      ` : ""}
    </div>

    ${co ? `
      <div class="info-section">
        <h3 class="gold">📌 Status</h3>
        <div class="status-row">
          ${["aberta","pendente","aguardando_cliente","resolvida"].map(s => `<button class="status-btn ${s} ${co.status === s ? "active" : ""}" data-status="${s}">${s === "aberta" ? "Aberta" : s === "pendente" ? "⏳ Pendente" : s === "aguardando_cliente" ? "Aguardando" : "✓ Resolvida"}</button>`).join("")}
        </div>
      </div>

      <div class="info-section">
        <h3 class="gold">👤 Atribuído a</h3>
        <input type="text" id="_atrib" value="${esc(co.atribuido_a || "")}" placeholder="Nome do atendente…" style="width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line2);background:var(--bg);color:var(--text);font-size:13px;outline:none" />
      </div>

      <div class="info-section">
        <h3 class="gold">🏷️ Tags</h3>
        <div>${(co.tags || []).map(t => `<span class="tag-chip">${esc(t)}<button data-tagdel="${esc(t)}">×</button></span>`).join("")}</div>
        <div class="tag-input">
          <input type="text" id="_tag" placeholder="Nova tag…" />
          <button id="_tag_add">+</button>
        </div>
      </div>

      <div class="info-section">
        <h3 class="green">📝 Notas Internas (${state.notas.length})</h3>
        ${state.notas.map(n => `
          <div class="nota-item">
            ${esc(n.conteudo || "")}
            <div class="meta">${esc(n.autor || "")} · ${esc(fmtTime(n.created_at))}</div>
          </div>
        `).join("")}
        <div class="nota-add">
          <textarea id="_nota" placeholder="Nova nota interna…"></textarea>
          <button id="_nota_add">+</button>
        </div>
      </div>

      ${state.scripts.length > 0 ? `
        <div class="info-section">
          <h3 class="gold">📋 Scripts (${state.scripts.length})</h3>
          <div class="scripts-list">
            ${state.scripts.slice(0, 20).map((s, i) => `
              <div class="script-item" data-script="${i}">
                <div class="t">${esc(s.titulo || "")}</div>
                <div class="c">${esc((s.conteudo || "").slice(0, 100))}</div>
              </div>
            `).join("")}
          </div>
        </div>
      ` : ""}
    ` : ""}
  `;

  // Bind events
  const $ = (id) => dc.querySelector("#" + id);
  if ($("_ai_resumir")) $("_ai_resumir").onclick = aiResumir;
  if ($("_ai_sugerir")) $("_ai_sugerir").onclick = aiSugerir;
  if ($("_ai_tom")) $("_ai_tom").onclick = aiTom;
  dc.querySelectorAll(".ai-sug[data-sug]").forEach(s => s.onclick = () => {
    const sug = state.aiSug[parseInt(s.dataset.sug)];
    const txt = typeof sug === "string" ? sug : (sug.texto || sug.text || "");
    state.drawerOpen = false; renderInfoDrawer();
    const ta = document.getElementById("_draft");
    if (ta) { ta.value = txt; ta.focus(); ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 120) + "px"; }
  });
  dc.querySelectorAll(".status-btn[data-status]").forEach(b => b.onclick = () => updateStatus(co, b.dataset.status));
  if ($("_atrib")) $("_atrib").onblur = (ev) => updateAtribuido(co, ev.target.value.trim());
  if ($("_tag_add")) $("_tag_add").onclick = () => {
    const v = $("_tag").value.trim(); if (v) { addTag(co, v); $("_tag").value = ""; }
  };
  dc.querySelectorAll("[data-tagdel]").forEach(b => b.onclick = () => delTag(co, b.dataset.tagdel));
  if ($("_nota_add")) $("_nota_add").onclick = () => {
    const v = $("_nota").value.trim(); if (v) { addNota(co, v); $("_nota").value = ""; }
  };
  dc.querySelectorAll(".script-item[data-script]").forEach(s => s.onclick = () => {
    const sc = state.scripts[parseInt(s.dataset.script)];
    const txt = (sc.conteudo || sc.titulo || "").replace(/\{nome_cliente\}/g, nameOf(co));
    state.drawerOpen = false; renderInfoDrawer();
    const ta = document.getElementById("_draft");
    if (ta) { ta.value = txt; ta.focus(); ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 120) + "px"; }
  });
}

// ─── Boot ───
async function boot() {
  const { data } = await sb.auth.getSession();
  if (!data.session) { renderLogin(); return; }
  state.user = data.session.user;
  state.loadingList = true;
  renderList();
  await Promise.all([loadConvs(), loadOpPhaseMap(), loadScripts()]);
  subscribeConvs();
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") loadConvs();
  });
}
boot();
</script>
