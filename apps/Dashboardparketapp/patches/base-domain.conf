# base.parket.works — plataforma de Gestão + Leitor QR + APK
# Vinculada ao mesmo backend (Supabase) do space.parket.works
server {
    listen 80;
    server_name base.parket.works;
    root /usr/share/nginx/html-gestao;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # APK pra download
    location = /app/parket-base.apk {
        add_header Content-Disposition 'attachment; filename="parket-base.apk"';
        types { application/vnd.android.package-archive apk; }
        default_type application/vnd.android.package-archive;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        etag on;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
