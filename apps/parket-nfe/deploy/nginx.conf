server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Assets fingerprintados do Vite (hash no nome) — cacheáveis pra sempre
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy pros endpoints /api/fiscal/* do parket-gestao_api.
    # Usa DNS interno do Swarm (network_public overlay) pra sair mais rápido
    # e sem sair pra internet. Também evita CORS entre subdomínios.
    location /api/fiscal/ {
        proxy_pass http://parket-gestao_api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        # Upload de XML pode ter dezenas de arquivos; permitimos 50MB por request.
        client_max_body_size 50m;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # SPA fallback — qualquer rota React cai em index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Health check pro Docker/Swarm
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
