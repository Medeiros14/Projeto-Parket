version: "3.8"

services:
  web:
    image: parket-producao:latest
    networks:
      - network_public
    deploy:
      replicas: 1
      restart_policy: { condition: any }
      update_config: { parallelism: 1, delay: 5s, order: start-first }
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_public"
        - "traefik.constraint-label=network_public"

        - "traefik.http.routers.producao.rule=Host(`producao.parket.works`)"
        - "traefik.http.routers.producao.entrypoints=websecure"
        - "traefik.http.routers.producao.tls=true"
        - "traefik.http.routers.producao.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.producao.service=producao"

        - "traefik.http.routers.producao-http.rule=Host(`producao.parket.works`)"
        - "traefik.http.routers.producao-http.entrypoints=web"
        - "traefik.http.routers.producao-http.middlewares=producao-https-redirect"
        - "traefik.http.routers.producao-http.service=producao"

        - "traefik.http.services.producao.loadbalancer.server.port=80"

        - "traefik.http.middlewares.producao-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.middlewares.producao-https-redirect.redirectscheme.permanent=true"

networks:
  network_public:
    external: true
