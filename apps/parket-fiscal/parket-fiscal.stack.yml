version: "3.8"

services:
  web:
    image: parket-fiscal:latest
    networks:
      - network_public
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public

        # HTTPS router
        - traefik.http.routers.parket-fiscal.rule=Host(`verifica.parket.works`)
        - traefik.http.routers.parket-fiscal.entrypoints=websecure
        - traefik.http.routers.parket-fiscal.tls=true
        - traefik.http.routers.parket-fiscal.tls.certresolver=letsencryptresolver

        # HTTP → HTTPS redirect
        - traefik.http.routers.parket-fiscal-http.rule=Host(`verifica.parket.works`)
        - traefik.http.routers.parket-fiscal-http.entrypoints=web
        - traefik.http.routers.parket-fiscal-http.middlewares=https-redirect

        - traefik.http.services.parket-fiscal.loadbalancer.server.port=80

networks:
  network_public:
    external: true
