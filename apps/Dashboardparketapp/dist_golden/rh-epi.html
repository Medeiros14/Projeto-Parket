<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Controle de EPIs — Parket RH</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: -apple-system, "Segoe UI", system-ui, sans-serif; background: #0a0a0a; color: #fff; font-size: 13px; }
  a { color: #34D399; }
  header { background: #111; border-bottom: 2px solid #B8AA9A; padding: 12px 18px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 14px; font-weight: 800; letter-spacing: 0.05em; color: #B8AA9A; text-transform: uppercase; flex: 1; }
  .tabs { display: flex; gap: 4px; padding: 0 16px; background: #111; border-bottom: 1px solid #222; }
  .tab { padding: 10px 14px; cursor: pointer; color: #888; border-bottom: 2px solid transparent; font-weight: 600; font-size: 12px; }
  .tab.active { color: #B8AA9A; border-bottom-color: #B8AA9A; }
  main { padding: 18px; max-width: 1400px; margin: 0 auto; }
  .card { background: #141414; border: 1px solid #222; border-radius: 8px; padding: 16px; margin-bottom: 14px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row > * { flex: 0 0 auto; }
  input, select, textarea { background: #0a0a0a; border: 1px solid #333; border-radius: 4px; color: #fff; padding: 6px 8px; font-size: 12px; outline: none; font-family: inherit; }
  input:focus, select:focus, textarea:focus { border-color: #B8AA9A; }
  button { background: #B8AA9A; color: #000; border: none; border-radius: 4px; padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer; }
  button.ghost { background: transparent; color: #ccc; border: 1px solid #333; }
  button.danger { background: transparent; color: #F87171; border: 1px solid #F87171; }
  button:hover { opacity: 0.9; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { background: #1a1a1a; padding: 8px 10px; text-align: left; font-weight: 700; color: #B8AA9A; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; border-bottom: 1px solid #222; }
  td { padding: 8px 10px; border-bottom: 1px solid #1a1a1a; vertical-align: top; }
  tr:hover td { background: #181818; }
  .badge { display: inline-block; padding: 2px 7px; border-radius: 3px; font-size: 10px; background: #2a2a2a; color: #ccc; font-weight: 600; }
  .badge.ok { background: rgba(16,185,129,0.15); color: #34D399; }
  .badge.warn { background: rgba(245,158,11,0.15); color: #FBBF24; }
  .badge.err { background: rgba(239,68,68,0.15); color: #F87171; }
  .filter-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 100; }
  .modal { background: #141414; border: 1px solid #B8AA9A; border-radius: 10px; padding: 20px; width: min(700px, 100%); max-height: 90vh; overflow-y: auto; }
  .modal h2 { font-size: 14px; color: #B8AA9A; margin-bottom: 14px; letter-spacing: 0.05em; text-transform: uppercase; }
  label { display: block; font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .full { grid-column: 1 / -1; }
  .item-row { display: grid; grid-template-columns: 2fr 1fr 80px 30px; gap: 6px; align-items: center; margin-bottom: 6px; }
  .stock-badge { font-weight: 700; font-size: 13px; }
  .stock-badge.low { color: #F87171; }
  .stock-badge.ok { color: #34D399; }
  small { color: #666; font-size: 10px; }
  .empty { text-align: center; padding: 40px; color: #666; }
</style>
</head>
<body>

  <h1>📋 Controle de EPIs e Uniformes</h1>
  <a href="/rh" style="color:#888;font-size:11px;text-decoration:none;">← Voltar ao RH</a>
</header>
<div class="tabs">
  <div class="tab active" data-tab="solicitacao">Pedidos</div>
  <div class="tab" data-tab="entregas">Entregas</div>
  <div class="tab" data-tab="funcionarios">Funcionários</div>

  <div class="tab" data-tab="estoque">Estoque</div>

</div>
<main id="main"><div class="empty">Carregando…</div></main>

<script>
(function(){

  var SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhieHBpbHJ4bWl0dnplYmx1b29tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5NDI1MjcsImV4cCI6MjA4ODUxODUyN30.ya-G4__-X_xlaA-Pw3qP_uWlvz8KqCsZbN3cLNG7Ohk";
  var SVC_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhieHBpbHJ4bWl0dnplYmx1b29tIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3Mjk0MjUyNywiZXhwIjoyMDg4NTE4NTI3fQ.fTovVTCBFcMrrhVCR6TsneALfMRLLLHZdMmSJH16L4A";
  var BACKEND = "https://draw.parket.works/api/rh/epi";
  var H = { apikey: SVC_KEY, Authorization: "Bearer "+SVC_KEY, "Content-Type": "application/json" };

  function $(id){ return document.getElementById(id); }
  function escape(s){ return (s==null?"":String(s)).replace(/[<>&"]/g,function(c){return {"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c];}); }

  function sb(table, opts){
    opts = opts||{};
    var url = SUPA_URL+"/rest/v1/"+table+(opts.q?("?"+opts.q):"");
    var init = { method: opts.method||"GET", headers: H };
    if(opts.body) init.body = JSON.stringify(opts.body);
    if(opts.method==="POST"||opts.method==="PATCH") init.headers = Object.assign({}, H, {Prefer:"return=representation"});
    return fetch(url, init).then(function(r){ if(!r.ok) return r.text().then(function(t){throw new Error("HTTP "+r.status+" "+t);}); return r.status===204?null:r.json(); });
  }

  // Cache
  var state = {
    empresas: [], funcionarios: [], itens: [], estoque: [], entregas: [], kits: [], pedidos: [],
    activeTab: (function(){
      try {
        var qs = new URLSearchParams(window.location.search);
        var def = qs.get("default");
        if(def && ["solicitacao","entregas","funcionarios","kits","estoque","controle","itens","empresas"].indexOf(def)>=0) return def;
      } catch(e){}
      return "solicitacao";
    })(),
    filters: { local: "", funcao: "", empresa: "", q: "", estoque_empresa: "", estoque_local: "" },
  };

  function loadAll(){
    return Promise.all([
      sb("rh_empresas", {q:"select=*&order=nome.asc"}).then(function(r){state.empresas=r||[];}),
      sb("rh_funcionarios", {q:"select=*&order=nome.asc"}).then(function(r){state.funcionarios=r||[];}),
      sb("rh_epi_itens", {q:"select=*&order=ordem.asc"}).then(function(r){state.itens=r||[];}),
      sb("rh_epi_estoque", {q:"select=*"}).then(function(r){state.estoque=r||[];}),
      sb("rh_epi_entregas", {q:"select=*&order=data_entrega.desc&limit=300"}).then(function(r){state.entregas=r||[];}),
      sb("rh_epi_kits_setor", {q:"select=*&order=setor.asc"}).then(function(r){state.kits=r||[];}).catch(function(){state.kits=[];}),
      sb("rh_epi_pedidos", {q:"select=*&order=created_at.desc&limit=500"}).then(function(r){state.pedidos=r||[];}).catch(function(){state.pedidos=[];}),
    ]);
  }

  // ─── Tabs ───
  document.querySelectorAll(".tab").forEach(function(t){
    t.onclick = function(){
      document.querySelectorAll(".tab").forEach(function(x){x.classList.remove("active");});
      t.classList.add("active");
      state.activeTab = t.dataset.tab;
      render();
    };
  });

  // ─── Render principal ───
  function render(){
    var m = $("main");
    if(state.activeTab==="solicitacao") return renderSolicitacao(m);
    if(state.activeTab==="entregas") return renderEntregas(m);
    if(state.activeTab==="funcionarios") return renderFuncionarios(m);
    if(state.activeTab==="kits") return renderKits(m);
    if(state.activeTab==="estoque") return renderEstoque(m);
    if(state.activeTab==="controle") return renderControle(m);
    if(state.activeTab==="itens") return renderItens(m);
    if(state.activeTab==="empresas") return renderEmpresas(m);
  }

  // ─── SOLICITAÇÃO DE COMPRA ────────────────────────────────────────────
  // Sugere quantidades pra cada (item, tamanho) com base em deficit (necessario - estoque)
  // Permite editar manualmente. Gera PDF "boleta" formatada pra apresentar à gestão.
  state.solicitacao = state.solicitacao || {
    qtds: {},          // chave "itemId__tamanho" → qty solicitada
    solicitante: "",
    aprovador: "",
    obs: "",
    local: "SP"
  };

  function calculaNecessariosPorItem(){
    // Conta funcionarios por (campo, tamanho)
    var fcounts = { tam_camisa:{}, tam_polo:{}, tam_calca:{}, tam_bota:{} };
    state.funcionarios.forEach(function(f){
      if(f.ativo===false) return;
      ["tam_camisa","tam_polo","tam_calca","tam_bota"].forEach(function(k){
        var v = (f[k]||"").toString().trim();
        if(v && v!=="-") fcounts[k][v] = (fcounts[k][v]||0) + 1;
      });
    });
    var totalActive = state.funcionarios.filter(function(f){return f.ativo!==false;}).length;
    return { fcounts: fcounts, totalActive: totalActive };
  }

  function sugestaoQty(it, tamanho, estoqueQty, fcounts, totalActive){
    // NECESSÁRIO = funcionarios × multiplicador (do item)
    // SUGESTÃO = max(0, NECESSÁRIO − ESTOQUE − PEDIDOS_PENDENTES) — assim não duplica compra
    var field = itemFuncField(it);
    var mult = itemMultiplier(it);
    var necess = 0;
    if(it.tipo_tamanho==="unico"){
      necess = totalActive * mult;
    } else if(field){
      necess = (fcounts[field][tamanho] || 0) * mult;
    } else {
      necess = totalActive * mult;
    }
    // Soma pedidos não-recebidos desse item+tamanho
    var t = tamanho || "UNICO";
    var pend = (state.pedidos||[])
      .filter(function(p){return p.item_id===it.id && (p.tamanho||"UNICO")===t && p.status!=="recebido" && p.status!=="cancelado";})
      .reduce(function(s,p){return s + Math.max(0,(p.qty_solicitada||0)-(p.qty_recebida||0));}, 0);
    var sugest = Math.max(0, necess - estoqueQty - pend);
    return { necess: necess, sugest: sugest, pendentes: pend };
  }

  function renderSolicitacao(m){
    var calc = calculaNecessariosPorItem();
    var fcounts = calc.fcounts, totalActive = calc.totalActive;

    // Agrega estoque por (item, tamanho) somando todos os locais
    var estoqueByItem = {};
    state.estoque.forEach(function(e){
      estoqueByItem[e.item_id] = estoqueByItem[e.item_id] || {};
      var t = (e.tamanho||"").toString().trim() || "UNICO";
      estoqueByItem[e.item_id][t] = (estoqueByItem[e.item_id][t]||0) + (e.qty||0);
    });

    // Agrupa por categoria
    var byCat = {};
    state.itens.filter(function(i){return i.ativo!==false;}).forEach(function(it){
      var c = (it.categoria||"outros").toLowerCase();
      (byCat[c]=byCat[c]||[]).push(it);
    });
    var catOrder = ["uniforme","calcado","epi"];
    Object.keys(byCat).forEach(function(c){ if(catOrder.indexOf(c)<0) catOrder.push(c); });

    // Header da página
    var header =
      '<div style="margin-bottom:18px;padding:18px 20px;background:linear-gradient(135deg,#1a1a1a,#0f0f0f);border:1px solid #2a2a2a;border-radius:8px">'+
        '<div style="display:flex;justify-content:space-between;align-items:start;gap:16px;flex-wrap:wrap">'+
          '<div>'+
            '<div style="font-size:10px;letter-spacing:0.08em;color:#888;text-transform:uppercase;margin-bottom:6px">NOVA SOLICITAÇÃO</div>'+
            '<div style="font-size:16px;font-weight:700;color:#fff">Gerar novo pedido de EPIs e Uniformes</div>'+
            '<div style="font-size:11px;color:#888;margin-top:4px">Sugestões: <b style="color:#B8AA9A">necessário</b> − <b style="color:#B8AA9A">estoque atual</b> − <b style="color:#B8AA9A">pedidos em aberto</b>. Ao gerar o PDF, os itens viram pedidos rastreados acima.</div>'+
          '</div>'+
          '<div style="text-align:right">'+
            '<button id="btn-pdf-solicitacao" style="background:#B8AA9A;color:#000;padding:10px 18px;border-radius:5px;font-weight:700;font-size:12px;letter-spacing:0.05em">📄 GERAR PDF</button>'+
            '<div style="margin-top:6px"><button id="btn-aplicar-sugestao" class="ghost" style="font-size:10px">✓ Aplicar sugestão a tudo</button></div>'+
            '<div style="margin-top:4px"><button id="btn-zerar-tudo" class="ghost" style="font-size:10px;color:#F87171;border-color:rgba(248,113,113,0.3)">⟲ Zerar tudo</button></div>'+
          '</div>'+
        '</div>'+
        '<div style="margin-top:14px;padding-top:14px;border-top:1px solid #1a1a1a;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px">'+
          '<div><label style="display:block;font-size:9px;color:#888;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:3px">SOLICITANTE</label><input id="sol-solicitante" value="'+escape(state.solicitacao.solicitante)+'" placeholder="Nome de quem solicita" style="width:100%"/></div>'+
          '<div><label style="display:block;font-size:9px;color:#888;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:3px">APROVADOR</label><input id="sol-aprovador" value="'+escape(state.solicitacao.aprovador)+'" placeholder="Nome do aprovador" style="width:100%"/></div>'+
          '<div><label style="display:block;font-size:9px;color:#888;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:3px">LOCAL ENTREGA</label><input id="sol-local" value="'+escape(state.solicitacao.local)+'" placeholder="Ex: SP" style="width:100%"/></div>'+
          '<div style="grid-column:1/-1"><label style="display:block;font-size:9px;color:#888;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:3px">OBSERVAÇÃO</label><input id="sol-obs" value="'+escape(state.solicitacao.obs)+'" placeholder="Observação geral do pedido" style="width:100%"/></div>'+
        '</div>'+
      '</div>';

    // Totalizador no topo (atualiza dinamicamente)
    var totalGeral = 0, totalItensSolicitados = 0;
    function getQty(itemId, tamanho){
      var key = itemId+"__"+(tamanho||"UNICO");
      return (state.solicitacao.qtds[key] === undefined) ? null : Number(state.solicitacao.qtds[key]);
    }

    // Constroi seções
    var sectionsHtml = "";
    catOrder.forEach(function(cKey){
      var items = byCat[cKey];
      if(!items) return;
      var cor = categoriaCor(cKey);
      var catHdr = '<div style="margin:18px 0 8px 0;display:flex;align-items:center;gap:10px"><div style="height:2px;flex:1;background:linear-gradient(90deg,'+cor+',transparent)"></div><div style="font-size:11px;letter-spacing:0.1em;color:'+cor+';font-weight:700;text-transform:uppercase">'+escape(categoriaLabel(cKey))+'</div><div style="height:2px;flex:1;background:linear-gradient(90deg,transparent,'+cor+')"></div></div>';

      var itemBlocks = items.map(function(it){
        var emoji = itemEmoji(it);
        var estoqueDoItem = estoqueByItem[it.id] || {};

        // Define tamanhos a mostrar
        var sizes;
        if(it.tipo_tamanho==="unico"){
          sizes = ["UNICO"];
        } else {
          var s = {};
          Object.keys(estoqueDoItem).forEach(function(k){s[k]=1;});
          var field = itemFuncField(it);
          if(field) Object.keys(fcounts[field]).forEach(function(k){s[k]=1;});
          sizes = ordenarTamanhos(Object.keys(s));
        }
        if(sizes.length===0) sizes = it.tipo_tamanho==="unico" ? ["UNICO"] : [];

        var rows = sizes.map(function(t){
          var est = estoqueDoItem[t==="UNICO"?"UNICO":t] || 0;
          var calc = sugestaoQty(it, t==="UNICO"?null:t, est, fcounts, totalActive);
          var key = it.id+"__"+t;
          var qty = state.solicitacao.qtds[key];
          if(qty === undefined) qty = calc.sugest;
          qty = Number(qty)||0;
          totalGeral += qty;
          if(qty>0) totalItensSolicitados++;
          var deficit = Math.max(0, calc.necess - est);
          var badgeCor = qty===0 ? "#666" : (qty<deficit?"#F59E0B":(qty===deficit?"#10B981":"#3B82F6"));
          var label = t==="UNICO" ? "—" : t;
          return '<tr>'+
            '<td style="padding:8px 10px;border-bottom:1px solid #1a1a1a;text-align:center;font-weight:700;color:'+cor+'">'+escape(label)+'</td>'+
            '<td style="padding:8px 10px;border-bottom:1px solid #1a1a1a;text-align:center;color:#888">'+est+'</td>'+
            '<td style="padding:8px 10px;border-bottom:1px solid #1a1a1a;text-align:center;color:#888">'+calc.necess+'</td>'+
            '<td style="padding:8px 10px;border-bottom:1px solid #1a1a1a;text-align:center;color:'+(deficit>0?"#F59E0B":"#10B981")+';font-weight:700">'+(deficit>0?"+"+deficit:"OK")+'</td>'+
            '<td style="padding:8px 10px;border-bottom:1px solid #1a1a1a;text-align:center">'+
              '<input type="number" min="0" class="sol-qty" data-key="'+key+'" value="'+qty+'" style="width:64px;text-align:center;font-weight:700;color:'+badgeCor+';border-color:'+badgeCor+'40"/>'+
            '</td>'+
          '</tr>';
        }).join("");

        return '<section style="margin-bottom:12px;background:#111;border:1px solid #222;border-radius:8px;overflow:hidden">'+
          '<div style="padding:10px 14px;background:linear-gradient(180deg,'+cor+'10,transparent);border-bottom:1px solid #1a1a1a;display:flex;align-items:center;gap:10px">'+
            '<div style="font-size:18px">'+emoji+'</div>'+
            '<div style="flex:1"><b style="font-size:12px;color:#fff;letter-spacing:0.02em">'+escape(it.nome)+'</b>'+
              (it.ca_numero&&it.ca_numero!=="NA"?'<span style="font-size:9px;background:rgba(184,170,154,0.15);color:#B8AA9A;padding:2px 5px;border-radius:3px;margin-left:8px">CA '+escape(it.ca_numero)+'</span>':"")+
            '</div>'+
          '</div>'+
          '<table style="width:100%;border-collapse:collapse;font-size:12px">'+
            '<thead><tr style="background:#0f0f0f">'+
              '<th style="padding:8px 10px;text-align:center;color:#888;font-size:10px;letter-spacing:0.05em;width:80px">TAM</th>'+
              '<th style="padding:8px 10px;text-align:center;color:#888;font-size:10px;letter-spacing:0.05em">ESTOQUE</th>'+
              '<th style="padding:8px 10px;text-align:center;color:#888;font-size:10px;letter-spacing:0.05em">NECESS.</th>'+
              '<th style="padding:8px 10px;text-align:center;color:#888;font-size:10px;letter-spacing:0.05em">DÉFICIT</th>'+
              '<th style="padding:8px 10px;text-align:center;color:#B8AA9A;font-size:10px;letter-spacing:0.05em;width:90px">SOLICITAR</th>'+
            '</tr></thead>'+
            '<tbody>'+rows+'</tbody>'+
          '</table>'+
        '</section>';
      }).join("");

      sectionsHtml += catHdr + itemBlocks;
    });

    var totalBar =
      '<div id="sol-total-bar" style="position:sticky;bottom:0;margin-top:18px;padding:14px 18px;background:linear-gradient(180deg,transparent,#0a0a0a 30%);border-top:2px solid #B8AA9A;display:flex;justify-content:space-between;align-items:center;z-index:5">'+
        '<div><span style="font-size:10px;color:#888;letter-spacing:0.06em;text-transform:uppercase">Total a solicitar</span> <b style="font-size:18px;color:#B8AA9A;margin-left:8px" id="sol-total-num">'+totalGeral+'</b> <span style="font-size:11px;color:#666">peças</span> · <span id="sol-total-itens" style="font-size:11px;color:#888">'+totalItensSolicitados+' itens</span></div>'+
        '<button id="btn-pdf-solicitacao-2" style="background:#B8AA9A;color:#000;padding:10px 22px;border-radius:5px;font-weight:700;font-size:12px;letter-spacing:0.05em">📄 GERAR PDF DA BOLETA</button>'+
      '</div>';

    m.innerHTML = renderPedidosAbertos() + header + sectionsHtml + totalBar;
    bindPedidosAbertosHandlers(m);
    bindSolicitacaoHandlers(m);
  }

  function bindSolicitacaoHandlers(m){
    function updateTotal(){
      var tot = 0, itensCnt = 0;
      m.querySelectorAll(".sol-qty").forEach(function(i){
        var v = Number(i.value)||0; tot += v; if(v>0) itensCnt++;
      });
      var n = $("sol-total-num"); if(n) n.textContent = tot;
      var ni = $("sol-total-itens"); if(ni) ni.textContent = itensCnt+" itens";
    }
    m.querySelectorAll(".sol-qty").forEach(function(i){
      i.oninput = function(){
        state.solicitacao.qtds[i.dataset.key] = i.value;
        updateTotal();
      };
    });
    var sSolic = $("sol-solicitante"); if(sSolic) sSolic.oninput = function(){state.solicitacao.solicitante=sSolic.value;};
    var sAprov = $("sol-aprovador"); if(sAprov) sAprov.oninput = function(){state.solicitacao.aprovador=sAprov.value;};
    var sLocal = $("sol-local"); if(sLocal) sLocal.oninput = function(){state.solicitacao.local=sLocal.value;};
    var sObs = $("sol-obs"); if(sObs) sObs.oninput = function(){state.solicitacao.obs=sObs.value;};

    var bAplica = $("btn-aplicar-sugestao");
    if(bAplica) bAplica.onclick = function(){
      // Zera o override pra mostrar a sugestão calculada como atual
      state.solicitacao.qtds = {};
      renderSolicitacao($("main"));
    };
    var bZerar = $("btn-zerar-tudo");
    if(bZerar) bZerar.onclick = function(){
      // Zera todos os inputs (preenche com 0)
      m.querySelectorAll(".sol-qty").forEach(function(i){
        i.value = 0;
        state.solicitacao.qtds[i.dataset.key] = 0;
      });
      updateTotal();
    };
    [$("btn-pdf-solicitacao"), $("btn-pdf-solicitacao-2")].forEach(function(b){
      if(b) b.onclick = gerarPdfSolicitacao;
    });
  }

  function gerarPdfSolicitacao(){
    var calc = calculaNecessariosPorItem();
    var fcounts = calc.fcounts, totalActive = calc.totalActive;
    var estoqueByItem = {};
    state.estoque.forEach(function(e){
      estoqueByItem[e.item_id] = estoqueByItem[e.item_id] || {};
      var t = (e.tamanho||"").toString().trim() || "UNICO";
      estoqueByItem[e.item_id][t] = (estoqueByItem[e.item_id][t]||0) + (e.qty||0);
    });

    var byCat = {};
    state.itens.filter(function(i){return i.ativo!==false;}).forEach(function(it){
      var c = (it.categoria||"outros").toLowerCase();
      (byCat[c]=byCat[c]||[]).push(it);
    });
    var catOrder = ["uniforme","calcado","epi"];
    Object.keys(byCat).forEach(function(c){ if(catOrder.indexOf(c)<0) catOrder.push(c); });

    var totalGeral = 0;
    var dataHoje = new Date();
    var dataStr = dataHoje.toLocaleDateString("pt-BR");
    var horaStr = dataHoje.toLocaleTimeString("pt-BR", {hour:"2-digit",minute:"2-digit"});
    var boletaNum = "PKT-" + dataHoje.getFullYear() + String(dataHoje.getMonth()+1).padStart(2,"0") + String(dataHoje.getDate()).padStart(2,"0") + "-" + String(Math.floor(dataHoje.getTime()/1000)%10000).padStart(4,"0");

    function getEscape(s){return (s==null?"":String(s)).replace(/[<>&"]/g,function(c){return {"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c];});}

    var sectionsHtml = "";
    var totalPorCat = {};
    catOrder.forEach(function(cKey){
      var items = byCat[cKey];
      if(!items) return;
      var catName = categoriaLabel(cKey);
      var catRows = "";
      var hasContent = false;

      items.forEach(function(it){
        var sizes;
        var estoqueDoItem = estoqueByItem[it.id] || {};
        if(it.tipo_tamanho==="unico"){
          sizes = ["UNICO"];
        } else {
          var s = {};
          Object.keys(estoqueDoItem).forEach(function(k){s[k]=1;});
          var field = itemFuncField(it);
          if(field) Object.keys(fcounts[field]).forEach(function(k){s[k]=1;});
          sizes = ordenarTamanhos(Object.keys(s));
        }

        sizes.forEach(function(t){
          var key = it.id+"__"+t;
          var qty = state.solicitacao.qtds[key];
          if(qty === undefined){
            var est = estoqueDoItem[t==="UNICO"?"UNICO":t] || 0;
            var sg = sugestaoQty(it, t==="UNICO"?null:t, est, fcounts, totalActive);
            qty = sg.sugest;
          }
          qty = Number(qty) || 0;
          if(qty <= 0) return; // pula linhas vazias
          hasContent = true;
          totalGeral += qty;
          totalPorCat[cKey] = (totalPorCat[cKey]||0) + qty;
          var est = estoqueDoItem[t==="UNICO"?"UNICO":t] || 0;
          var ca = (it.ca_numero && it.ca_numero!=="NA") ? " (CA "+getEscape(it.ca_numero)+")" : "";
          catRows +=
            '<tr>'+
              '<td style="padding:8px 10px;border-bottom:1px solid #e5e5e5">'+getEscape(it.nome)+ca+'</td>'+
              '<td style="padding:8px 10px;border-bottom:1px solid #e5e5e5;text-align:center;font-weight:600">'+(t==="UNICO"?"—":getEscape(t))+'</td>'+
              '<td style="padding:8px 10px;border-bottom:1px solid #e5e5e5;text-align:center;color:#666">'+est+'</td>'+
              '<td style="padding:8px 10px;border-bottom:1px solid #e5e5e5;text-align:center;font-weight:700;color:#000">'+qty+'</td>'+
            '</tr>';
        });
      });

      if(hasContent){
        sectionsHtml +=
          '<div style="margin-top:18px;break-inside:avoid">'+
            '<h3 style="background:#1a1a1a;color:#fff;padding:8px 12px;font-size:11px;letter-spacing:0.06em;margin:0;text-transform:uppercase">'+getEscape(catName)+'</h3>'+
            '<table style="width:100%;border-collapse:collapse;font-size:11px">'+
              '<thead><tr style="background:#f5f5f5">'+
                '<th style="padding:8px 10px;text-align:left;font-weight:700;color:#333;border-bottom:1px solid #ccc">ITEM</th>'+
                '<th style="padding:8px 10px;text-align:center;font-weight:700;color:#333;border-bottom:1px solid #ccc;width:80px">TAMANHO</th>'+
                '<th style="padding:8px 10px;text-align:center;font-weight:700;color:#333;border-bottom:1px solid #ccc;width:90px">ESTOQUE</th>'+
                '<th style="padding:8px 10px;text-align:center;font-weight:700;color:#333;border-bottom:1px solid #ccc;width:100px">SOLICITAR</th>'+
              '</tr></thead>'+
              '<tbody>'+catRows+'</tbody>'+
              '<tfoot><tr style="background:#fafafa"><td colspan="3" style="padding:6px 10px;text-align:right;font-weight:700;font-size:10px;color:#666;letter-spacing:0.05em">SUBTOTAL '+getEscape(catName)+'</td><td style="padding:6px 10px;text-align:center;font-weight:800;color:#000">'+totalPorCat[cKey]+'</td></tr></tfoot>'+
            '</table>'+
          '</div>';
      }
    });

    if(totalGeral === 0){
      alert("Nenhum item com quantidade > 0 pra solicitar. Edite as quantidades ou clique em \"Aplicar sugestão a tudo\".");
      return;
    }

    var solicitante = getEscape(state.solicitacao.solicitante || "—");
    var aprovador = getEscape(state.solicitacao.aprovador || "—");
    var local = getEscape(state.solicitacao.local || "—");
    var obs = getEscape(state.solicitacao.obs || "");

    var html =
      '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Solicitação de Compra '+boletaNum+'</title>'+
      '<style>'+
        '@page{size:A4;margin:18mm 15mm}'+
        '*{box-sizing:border-box}'+
        'body{font-family:Arial,Helvetica,sans-serif;color:#222;margin:0;font-size:11px;line-height:1.4}'+
        '.cover{padding:0 0 16px 0;border-bottom:3px solid #B8AA9A;margin-bottom:18px}'+
        '.cover-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}'+
        '.brand{font-size:28px;font-weight:300;letter-spacing:0.18em;color:#1a1a1a}'+
        '.brand small{display:block;font-size:10px;letter-spacing:0.2em;color:#999;font-weight:400;margin-top:2px}'+
        '.title-box{text-align:right}'+
        '.title-box h1{margin:0;font-size:15px;font-weight:700;color:#000;text-transform:uppercase;letter-spacing:0.05em}'+
        '.title-box .nr{font-size:10px;color:#888;margin-top:4px;font-family:monospace;letter-spacing:0.04em}'+
        '.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;background:#fafafa;border:1px solid #e5e5e5;padding:12px 14px;border-radius:4px}'+
        '.meta div{font-size:10px}'+
        '.meta label{display:block;color:#888;text-transform:uppercase;letter-spacing:0.05em;font-size:9px;margin-bottom:2px;font-weight:700}'+
        '.meta b{color:#000;font-size:11px}'+
        '.obs{margin-top:10px;padding:8px 12px;border-left:3px solid #B8AA9A;background:#fafafa;font-size:11px;font-style:italic;color:#555}'+
        '.totaisbar{margin:18px 0;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:linear-gradient(135deg,#1a1a1a,#000);color:#fff;border-radius:4px}'+
        '.totaisbar .lbl{font-size:10px;letter-spacing:0.1em;color:#B8AA9A;text-transform:uppercase}'+
        '.totaisbar .v{font-size:22px;font-weight:800;color:#fff;margin-left:10px}'+
        '.totaisbar .units{font-size:11px;color:#aaa;margin-left:6px}'+
        '.assinaturas{margin-top:40px;display:grid;grid-template-columns:1fr 1fr;gap:50px}'+
        '.assinaturas .sig{text-align:center}'+
        '.assinaturas .line{border-top:1px solid #444;padding-top:6px;font-size:10px;color:#666;letter-spacing:0.04em}'+
        '.assinaturas .name{font-size:11px;color:#222;font-weight:700;margin-bottom:2px}'+
        '.foot{margin-top:50px;border-top:1px solid #e5e5e5;padding-top:8px;text-align:center;color:#999;font-size:9px;letter-spacing:0.05em}'+
        '@media print{.no-print{display:none!important}}'+
        '.no-print{position:fixed;top:14px;right:14px;background:#1a1a1a;color:#fff;padding:8px 16px;border-radius:4px;cursor:pointer;font-weight:700;border:none;font-size:11px;letter-spacing:0.05em}'+
      '</style></head><body>'+
        '<button class="no-print" onclick="window.print()">🖨 Imprimir / Salvar PDF</button>'+
        '<div class="cover">'+
          '<div class="cover-top">'+
            '<div class="brand">PARKET<small>BOLETA DE COMPRA · RH/EPI</small></div>'+
            '<div class="title-box">'+
              '<h1>Solicitação de Compra</h1>'+
              '<div class="nr">Nº '+boletaNum+'</div>'+
              '<div class="nr">'+dataStr+' · '+horaStr+'</div>'+
            '</div>'+
          '</div>'+
          '<div class="meta">'+
            '<div><label>SOLICITANTE</label><b>'+solicitante+'</b></div>'+
            '<div><label>APROVADOR</label><b>'+aprovador+'</b></div>'+
            '<div><label>LOCAL ENTREGA</label><b>'+local+'</b></div>'+
            '<div><label>FUNCIONÁRIOS ATIVOS</label><b>'+totalActive+'</b></div>'+
          '</div>'+
          (obs ? '<div class="obs">'+obs+'</div>' : '')+
        '</div>'+
        sectionsHtml +
        '<div class="totaisbar">'+
          '<div><span class="lbl">TOTAL GERAL</span><span class="v">'+totalGeral+'</span><span class="units">peças</span></div>'+
          '<div style="font-size:10px;color:#aaa;text-align:right">Valores sugeridos com base em<br><b style="color:#fff">necessário − estoque</b></div>'+
        '</div>'+
        '<div class="assinaturas">'+
          '<div class="sig"><div class="name">'+solicitante+'</div><div class="line">SOLICITANTE</div></div>'+
          '<div class="sig"><div class="name">'+aprovador+'</div><div class="line">APROVADOR · DIRETORIA</div></div>'+
        '</div>'+
        '<div class="foot">Parket · Gestão de EPIs e Uniformes · '+dataStr+'</div>'+
      '</body></html>';

    var w = window.open("", "_blank", "width=900,height=1100");
    w.document.write(html);
    w.document.close();
    setTimeout(function(){ try{ w.focus(); }catch(e){} }, 200);

    // ── Persistir cada linha qty>0 como Pedido (status=solicitado) ──
    // Assim aparece na seção "Pedidos em aberto" pra acompanhamento,
    // e o cálculo de Kits/Controle desconta esses pedidos pra evitar comprar 2x.
    var pedidoBatch = [];
    catOrder.forEach(function(cKey){
      var items = byCat[cKey]; if(!items) return;
      items.forEach(function(it){
        var sizes;
        var estoqueDoItem = estoqueByItem[it.id] || {};
        if(it.tipo_tamanho==="unico") sizes = ["UNICO"];
        else {
          var s = {};
          Object.keys(estoqueDoItem).forEach(function(k){s[k]=1;});
          var field = itemFuncField(it);
          if(field) Object.keys(fcounts[field]).forEach(function(k){s[k]=1;});
          sizes = ordenarTamanhos(Object.keys(s));
        }
        sizes.forEach(function(t){
          var key = it.id+"__"+t;
          var qty = state.solicitacao.qtds[key];
          if(qty===undefined){
            var est = estoqueDoItem[t==="UNICO"?"UNICO":t] || 0;
            var sg = sugestaoQty(it, t==="UNICO"?null:t, est, fcounts, totalActive);
            qty = sg.sugest;
          }
          qty = Number(qty)||0;
          if(qty<=0) return;
          pedidoBatch.push({
            item_id: it.id, tamanho: t, qty_solicitada: qty,
            status: "solicitado",
            local_destino: state.solicitacao.local || "SP",
            solicitado_por: state.solicitacao.solicitante || "",
            observacao: "Boleta "+boletaNum+(state.solicitacao.obs?" · "+state.solicitacao.obs:""),
          });
        });
      });
    });

    if(pedidoBatch.length>0){
      sb("rh_epi_pedidos", {method:"POST", body: pedidoBatch})
        .then(function(rows){
          (rows||[]).forEach(function(r){state.pedidos.unshift(r);});
          // Re-render se ainda estiver na aba de pedidos
          if(state.activeTab==="solicitacao") renderSolicitacao($("main"));
        })
        .catch(function(err){ console.warn("[pedidos] save falhou:", err); });
    }
  }

  // ─── PEDIDOS EM ABERTO (renderizado no topo da aba Pedidos) ───
  var PEDIDO_STATUS_LABELS = {
    solicitado: { label: "Solicitado", color: "#FBBF24", bg: "rgba(251,191,36,0.15)" },
    em_compra: { label: "Em compra", color: "#A78BFA", bg: "rgba(167,139,250,0.15)" },
    a_caminho: { label: "A caminho", color: "#60A5FA", bg: "rgba(96,165,250,0.15)" },
    recebido: { label: "Recebido", color: "#34D399", bg: "rgba(52,211,153,0.15)" },
    cancelado: { label: "Cancelado", color: "#F87171", bg: "rgba(248,113,113,0.15)" },
  };
  var PEDIDO_NEXT = { solicitado: "em_compra", em_compra: "a_caminho", a_caminho: "recebido" };

  function renderPedidosAbertos(){
    var abertos = state.pedidos.filter(function(p){return p.status!=="recebido" && p.status!=="cancelado";});
    if(abertos.length===0){
      return '<div class="card" style="background:#0e0e0e;text-align:center;color:#666;padding:20px;font-size:12px">'+
        'Sem pedidos em aberto. Use o formulário abaixo pra gerar uma nova solicitação.'+
      '</div>';
    }
    // Agrupa por status na ordem do fluxo
    var byStatus = {solicitado:[], em_compra:[], a_caminho:[]};
    abertos.forEach(function(p){ if(byStatus[p.status]) byStatus[p.status].push(p); });

    function itemNome(itemId){
      var it = state.itens.find(function(x){return x.id===itemId;});
      return it ? it.nome : "(item)";
    }
    function itemCat(itemId){
      var it = state.itens.find(function(x){return x.id===itemId;});
      return it ? (it.categoria||"").toUpperCase() : "";
    }

    var rows = abertos.map(function(p){
      var st = PEDIDO_STATUS_LABELS[p.status] || PEDIDO_STATUS_LABELS.solicitado;
      var qPend = Math.max(0, (p.qty_solicitada||0) - (p.qty_recebida||0));
      var dataSol = p.data_solicitacao ? new Date(p.data_solicitacao).toLocaleDateString("pt-BR") : "—";
      var nextSt = PEDIDO_NEXT[p.status];
      return '<tr data-pid="'+p.id+'">'+
        '<td><div style="font-weight:600;color:#fff">'+escape(itemNome(p.item_id))+'</div><small>'+escape(itemCat(p.item_id))+'</small></td>'+
        '<td style="text-align:center"><span class="badge">'+escape(p.tamanho||"UNICO")+'</span></td>'+
        '<td style="text-align:right;font-weight:700">'+qPend+(p.qty_recebida>0?' <small style="color:#888">('+(p.qty_solicitada||0)+' sol.)</small>':'')+'</td>'+
        '<td><span class="badge" style="background:'+st.bg+';color:'+st.color+'">'+st.label+'</span></td>'+
        '<td style="color:#888;font-size:11px">'+escape(dataSol)+(p.data_prevista_entrega?' · prev. '+new Date(p.data_prevista_entrega).toLocaleDateString("pt-BR"):'')+'</td>'+
        '<td style="text-align:right;white-space:nowrap">'+
          (nextSt ? '<button class="ped-advance" data-pid="'+p.id+'" data-next="'+nextSt+'" style="background:'+PEDIDO_STATUS_LABELS[nextSt].color+';color:#000;padding:4px 10px;font-size:11px;margin-right:4px">→ '+PEDIDO_STATUS_LABELS[nextSt].label+'</button>' : '')+
          '<button class="ped-cancel" data-pid="'+p.id+'" style="background:transparent;color:#F87171;border:1px solid rgba(248,113,113,0.3);padding:4px 8px;font-size:11px" title="Cancelar pedido">✕</button>'+
        '</td>'+
      '</tr>';
    }).join("");

    var totalAbertos = abertos.reduce(function(s,p){return s + Math.max(0,(p.qty_solicitada||0)-(p.qty_recebida||0));}, 0);

    return '<div class="card" style="padding:0;overflow:hidden;margin-bottom:14px">'+
      '<div style="padding:12px 16px;background:linear-gradient(135deg,#1a1a1a,#0f0f0f);border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center">'+
        '<div>'+
          '<div style="font-size:10px;color:#888;letter-spacing:0.06em;text-transform:uppercase">PEDIDOS EM ABERTO</div>'+
          '<div style="font-size:14px;font-weight:700;color:#B8AA9A;margin-top:2px">'+abertos.length+' '+(abertos.length===1?'pedido pendente':'pedidos pendentes')+' · '+totalAbertos+' peças</div>'+
        '</div>'+
        '<div style="display:flex;gap:6px;font-size:10px">'+
          '<span class="badge" style="background:rgba(251,191,36,0.15);color:#FBBF24">'+byStatus.solicitado.length+' solicitados</span>'+
          '<span class="badge" style="background:rgba(167,139,250,0.15);color:#A78BFA">'+byStatus.em_compra.length+' em compra</span>'+
          '<span class="badge" style="background:rgba(96,165,250,0.15);color:#60A5FA">'+byStatus.a_caminho.length+' a caminho</span>'+
        '</div>'+
      '</div>'+
      '<table>'+
        '<thead><tr>'+
          '<th>Item</th>'+
          '<th style="text-align:center;width:80px">Tam</th>'+
          '<th style="text-align:right;width:90px">Qty</th>'+
          '<th style="width:110px">Status</th>'+
          '<th style="width:180px">Datas</th>'+
          '<th style="text-align:right;width:220px"></th>'+
        '</tr></thead>'+
        '<tbody>'+rows+'</tbody>'+
      '</table>'+
    '</div>';
  }

  // Abre modal de confirmação de recebimento — usuário revisa qty real recebida antes de bater no estoque
