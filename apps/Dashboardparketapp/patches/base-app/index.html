async function api(path, opts={}){
  const res = await fetch(SUPABASE_URL + path, {
    ...opts,
    headers: {
      "apikey": SUPABASE_ANON,
      "Authorization": "Bearer " + SUPABASE_ANON,
      "Content-Type": "application/json",
      ...(opts.headers||{}),
    }
  });
  if (!res.ok) throw new Error(`API ${res.status}: ${await res.text()}`);
  if (res.status === 204) return null;
  const txt = await res.text();
  if (!txt) return null;
  try { return JSON.parse(txt); } catch { return null; }
}

// Comprime foto via canvas (lado maior ~1280, JPEG 0.7) e devolve data URL.
// Salvamos como base64 na coluna foto_url — evita RLS do Storage e não precisa login.
async function uploadPhoto(itemId, file){
  const dataUrl = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error("Falha ao ler arquivo"));
    reader.readAsDataURL(file);
  });
  const img = await new Promise((resolve, reject) => {
    const im = new Image();
    im.onload = () => resolve(im);
    im.onerror = () => reject(new Error("Imagem inválida"));
    im.src = dataUrl;
  });
  const MAX = 1280;
  let w = img.naturalWidth, h = img.naturalHeight;
  if (w > MAX || h > MAX) {
    if (w >= h) { h = Math.round(h * MAX / w); w = MAX; }
    else        { w = Math.round(w * MAX / h); h = MAX; }
  }
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(img, 0, 0, w, h);
  // Tenta qualidades decrescentes até ficar abaixo de ~700KB
  let q = 0.72;
  let out = canvas.toDataURL("image/jpeg", q);
  while (out.length > 700_000 && q > 0.35) {
    q -= 0.1;
    out = canvas.toDataURL("image/jpeg", q);
  }
  return out;
}

let _scanner = null;
function _stopScanner(){
  if (_scanner) {
    try { _scanner.stop().then(()=>_scanner.clear()).catch(()=>{}); } catch{}
    _scanner = null;
  }
}

function _extractIdFromQR(text){
  // Aceita formatos: UUID direto, ou URL contendo ?id=<uuid>, ou path /base/?id=
  const uuidRe = /[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i;
  try {
    const u = new URL(text);
    const q = u.searchParams.get("id");
    if (q && uuidRe.test(q)) return q.match(uuidRe)[0];
  } catch {}
  const m = text.match(uuidRe);
  return m ? m[0] : null;
}

async function _startScanner(targetDivId, statusEl){
  if (!window.Html5Qrcode){
    statusEl.innerHTML = `<div class="err">Biblioteca de scanner não carregou. Verifique sua conexão.</div>`;
    return;
  }
  _stopScanner();
  _scanner = new Html5Qrcode(targetDivId);
  try {
    await _scanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 240, height: 240 } },
      (decodedText) => {
        const id = _extractIdFromQR(decodedText);
        if (id) {
          _stopScanner();
          location.search = "?id=" + encodeURIComponent(id);
        }
      },
      () => {} // ignora não-encontrado
    );
    statusEl.innerHTML = `<div class="small">Aponte pra etiqueta · A leitura é automática</div>`;
  } catch(err){
    statusEl.innerHTML = `<div class="err">Não foi possível abrir a câmera: ${esc(err.message||err)}</div>`;
  }
}

async function renderProjeto(cardId){
  _stopScanner();
  root.innerHTML = `<div class="card center"><span class="spinner"></span><div class="small" style="margin-top:8px">Carregando…</div></div>`;
  let card = null, itens = [];
  try {
    const cc = await api(`/rest/v1/kanban_cards?id=eq.${cardId}&select=id,title,obra,column_id,dept_id`);
    card = cc && cc[0];
    if (!card) { renderNoItem("Projeto não encontrado."); return; }
    itens = await api(`/rest/v1/itens_rastreio?card_id=eq.${cardId}&select=*&order=servico,ambiente`) || [];
  } catch(err){
    root.innerHTML = `<div class="card"><div class="err">Erro: ${esc(err.message)}</div></div>`;
    return;

  const pend = itens.filter(i => i.status_atual === "pendente" || i.status_atual === "em-producao");

  const nok = itens.filter(i => i.status_atual === "nao-conforme");

  root.innerHTML = "";

  // Botão voltar
  root.appendChild(el(`<div style="margin-bottom:10px">
    <button class="ghost" id="_back" style="width:auto;padding:6px 12px;font-size:12px">← Projetos</button>
  </div>`));
  document.getElementById("_back").onclick = () => { location.search = ""; };

  // Header projeto
  root.appendChild(el(`<div class="card" style="background:linear-gradient(135deg,rgba(212,168,83,0.12),rgba(212,168,83,0.04));border-color:rgba(212,168,83,0.3)">
    <div class="label" style="color:#D4A853">Projeto · Cliente</div>

      <span style="background:rgba(107,114,128,0.18);color:#9CA3AF;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600">${pend.length} pendente${pend.length===1?"":"s"}</span>
      <span style="background:rgba(16,185,129,0.18);color:#34D399;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600">${ok.length} aprovado${ok.length===1?"":"s"}</span>
      ${nok.length>0 ? `<span style="background:rgba(239,68,68,0.18);color:#F87171;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600">${nok.length} nok</span>` : ""}

  // Scanner

    <div class="small" id="_scan_status">Toque em "Abrir câmera" pra começar.</div>

    startBtn.style.display = "none";

    const SETOR_COLOR = { producao: "#FBBF24", logistica: "#60A5FA", obra: "#C084FC" };
    const fmtDate = (iso) => iso ? new Date(iso).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}) : "";

    const sec = el(`<div class="card">
      <div class="label" style="color:#D4A853">📜 Histórico de leituras (${chks.length})</div>
      <div class="small" style="margin:4px 0 10px">QRs já escaneados neste projeto</div>
    </div>`);
    for (const c of chks) {
      const it = itemMap[c.item_id];
      const stColor = c.status === "aprovado" ? "#34D399" : c.status === "nao-conforme" ? "#F87171" : "#9CA3AF";
      const setorCor = SETOR_COLOR[c.setor] || "#888";
      const row = el(`<div class="tlitem" style="border-left-color:${setorCor};cursor:pointer">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">
          <div style="flex:1;min-width:0">
            <div style="font-size:11px;color:#fff;font-weight:600">${esc(it ? (it.servico + " · " + (it.ambiente||"—")) : c.item_id.slice(0,8))}</div>
            <div class="meta">
              <b style="color:${setorCor}">${esc(SETOR_LABEL[c.setor]||c.setor)}</b> · ${esc(c.acao)} ·
              <span style="color:${stColor}">${esc(c.status)}</span> · ${esc(c.verificado_por||"—")} · ${fmtDate(c.created_at)}
              ${c.obs ? ` · <i style="color:rgba(255,255,255,0.5)">${esc(c.obs)}</i>` : ""}
            </div>
          </div>
          ${(() => {
            const arr = (c.fotos && c.fotos.length) ? c.fotos : (c.foto_url ? [c.foto_url] : []);
            if (!arr.length) return "";
            const first = arr[0];
            const extra = arr.length > 1 ? `<span style="position:absolute;bottom:-2px;right:-2px;background:#0a0a0a;color:#fff;border-radius:9px;padding:1px 5px;font-size:9px;font-weight:700;border:1px solid rgba(255,255,255,0.2)">+${arr.length-1}</span>` : "";
            return `<div style="position:relative;flex-shrink:0"><img class="_chk_foto" data-fotos='${esc(JSON.stringify(arr))}' src="${esc(first)}" style="width:36px;height:36px;border-radius:4px;object-fit:cover;cursor:pointer"/>${extra}</div>`;
          })()}
        </div>
      </div>`);
      if (it) {
        row.onclick = (ev) => {
          if (ev.target.classList && ev.target.classList.contains("_chk_foto")) return;
          location.search = "?id=" + encodeURIComponent(it.id) + "&p=" + encodeURIComponent(cardId);
        };
      }
      const img = row.querySelector("._chk_foto");
      if (img) {
        img.onclick = (ev) => {
          ev.stopPropagation();
          const arr = JSON.parse(img.dataset.fotos || "[]");
          if (!arr.length) return;
          const lb = document.createElement("div");
          lb.style.cssText = "position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,0.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow:auto";
          lb.onclick = () => lb.remove();
          for (const url of arr){
            const im = document.createElement("img");
            im.src = url;
            im.style.cssText = "max-width:92vw;max-height:80vh;border-radius:8px;object-fit:contain;margin:10px 0";
            lb.appendChild(im);
          }
          document.body.appendChild(lb);
        };
      }
      sec.appendChild(row);
    }
    root.appendChild(sec);
  }
}

      btn.textContent = "💾 Marque todos materiais pra salvar";

      btn.textContent = "✅ Salvar como APROVADO";

      btn.style.opacity = "1";

  document.getElementById("_foto").onchange = (ev) => {
    for (const file of ev.target.files){
      fotoFiles.push({ file, legenda: "", status: null });
    }
    ev.target.value = "";
    renderPreviews();
  };

  async function submit(){
    const setor = document.getElementById("_setor").value;
    const acao  = document.getElementById("_acao").value;
    const obs   = document.getElementById("_obs").value.trim();
    const msg   = document.getElementById("_msg");
    msg.innerHTML = "";

    if (!getNome()){ msg.innerHTML = `<div class="err">Identifique-se primeiro.</div>`; return; }

    // Validações (botão único — status do checkpoint é DERIVADO das fotos):
    //  - ≥1 foto
    //  - todas com status (aprovado ou nao-conforme)
    //  - cada material com defeito precisa de legenda explicando o defeito
    if (fotoFiles.length === 0){
      msg.innerHTML = `<div class="err">Pelo menos 1 foto é obrigatória.</div>`;
      return;
    }
    const semStatus = fotoFiles.filter(f => !f.status);
    if (semStatus.length){
      msg.innerHTML = `<div class="err">${semStatus.length} foto(s) sem marcação. Marque cada material como ✅ OK ou ❌ Com defeito.</div>`;
      return;
    }
    const reprovadas = fotoFiles.filter(f => f.status === "nao-conforme");
    const reprovSemLegenda = reprovadas.filter(f => !f.legenda || !f.legenda.trim());
    if (reprovSemLegenda.length){
      msg.innerHTML = `<div class="err">${reprovSemLegenda.length} material(is) com defeito sem descrição. Descreva o defeito em cada um.</div>`;
      return;
    }

    // STATUS DERIVADO: se 1+ material com defeito → reprovado, senão aprovado
    const ok = reprovadas.length === 0;
    const acaoDef = SETOR_ACOES[setor].find(x => x.a === acao);
    const nextStatus = ok ? acaoDef.next_ok : acaoDef.next_nok;
    const status = ok ? "aprovado" : "nao-conforme";

    msg.innerHTML = `<div class="small"><span class="spinner"></span> Salvando ${fotoFiles.length} foto(s)…</div>`;

    let fotosMeta = [];
    for (let i = 0; i < fotoFiles.length; i++){
      msg.innerHTML = `<div class="small"><span class="spinner"></span> Comprimindo foto ${i+1}/${fotoFiles.length}…</div>`;
      try {
        const url = await uploadPhoto(id, fotoFiles[i].file);
        fotosMeta.push({ url, legenda: fotoFiles[i].legenda || "", status: fotoFiles[i].status });
      } catch(err){
        msg.innerHTML = `<div class="err">Falha na foto ${i+1}: ${esc(err.message)}</div>`;
        return;
      }
    }
    // Compat: também salva array simples `fotos` (todas) + foto_url (primeira aprovada ou primeira)
    const fotosArr = fotosMeta.map(m => m.url);
    const firstApprov = fotosMeta.find(m => m.status === "aprovado");
    const fotoUrlCompat = (firstApprov && firstApprov.url) || fotosMeta[0].url;

    // Se este é checkpoint de RE-verificação (item estava nao-conforme antes),
    // linka ao último checkpoint reprovado pra comparação antes/depois.
    let reverificacao_de = null;
    if (item.status_atual === "nao-conforme") {
      const ultReprov = (chks || []).find(c => c.status === "nao-conforme");
      if (ultReprov) reverificacao_de = ultReprov.id;
    }

    try {
      await api(`/rest/v1/itens_checkpoints`, {
        method:"POST",
        headers:{ "Prefer":"return=minimal" },
        body: JSON.stringify({
          item_id: id, setor, acao, status,
          fotos: fotosArr,
          fotos_meta: fotosMeta,
          foto_url: fotoUrlCompat,  // compat
          verificado_por: getNome(), obs: obs || null,
          reverificacao_de,  // null se primeira vez; uuid do checkpoint reprovado anterior se for reverificação
        }),
      });
      await api(`/rest/v1/itens_rastreio?id=eq.${id}`, {
        method:"PATCH",
        headers:{ "Prefer":"return=minimal" },
        body: JSON.stringify({ status_atual: nextStatus, updated_at: new Date().toISOString() }),
      });
      msg.innerHTML = `<div class="ok">✅ Checkpoint salvo. Voltando ao projeto…</div>`;
      setTimeout(() => { location.search = "?p=" + encodeURIComponent(projetoIdParam); }, 800);
    } catch(err){
      msg.innerHTML = `<div class="err">Erro: ${esc(err.message)}</div>`;
    }
  }
  document.getElementById("_save").onclick = (ev) => { ev.preventDefault(); submit(); };

  // Galerias agrupadas por STATUS INDIVIDUAL DE CADA FOTO (não do
  // checkpoint). Cada foto carrega seu próprio status + legenda em
  // `fotos_meta`. Fallback: checkpoints antigos sem `fotos_meta` herdam o
  // status do checkpoint pra cada foto do array `fotos`.
  function _photoEntries(allChks){
    const aprov = [], reprov = [];
    for (const c of (allChks||[])){
      let meta = Array.isArray(c.fotos_meta) ? c.fotos_meta : null;
      if (!meta || meta.length === 0){
        // Compat: monta meta a partir de fotos[] ou foto_url herdando status
        const arr = (c.fotos && c.fotos.length) ? c.fotos : (c.foto_url ? [c.foto_url] : []);
        meta = arr.map(u => ({ url: u, legenda: "", status: c.status }));
      }
      for (const m of meta){
        const entry = { url: m.url, legenda: m.legenda || "", verificado_por: c.verificado_por, created_at: c.created_at };
        if (m.status === "aprovado") aprov.push(entry);
        else if (m.status === "nao-conforme") reprov.push(entry);
      }
    }
    return { aprov, reprov };
  }
  function _photoGallery(title, color, bg, entries){
    if (!entries.length) return null;
    const card = el(`<div class="card" style="border-color:${bg.replace('0.08','0.25')}">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <div style="font-size:13px;font-weight:700;color:${color}">${title}</div>
        <div class="small" style="color:rgba(255,255,255,0.45)">${entries.length} foto(s)</div>
      </div>
      <div id="_gal_${title.replace(/[^A-Za-z0-9]/g,'')}" style="display:flex;flex-wrap:wrap;gap:8px"></div>
    </div>`);
    const grid = card.querySelector("div[id^=_gal_]");
    entries.forEach((e, i) => {
      const wrap = document.createElement("div");
      wrap.style.cssText = "display:flex;flex-direction:column;gap:4px;width:96px;cursor:pointer";
      wrap.title = `${e.verificado_por||"—"} · ${fmtDate(e.created_at)}`;
      const im = document.createElement("img");
      im.src = e.url;
      im.style.cssText = `width:96px;height:96px;border-radius:6px;object-fit:cover;border:1px solid ${bg.replace('0.08','0.35')}`;
      const cap = document.createElement("div");
      cap.style.cssText = "font-size:10px;color:rgba(255,255,255,0.7);line-height:1.25;max-height:28px;overflow:hidden;text-overflow:ellipsis";
      cap.textContent = e.legenda || "(sem legenda)";
      if (!e.legenda) cap.style.color = "rgba(255,255,255,0.35)";
      wrap.appendChild(im); wrap.appendChild(cap);
      wrap.onclick = () => {
        const lb = document.createElement("div");
        lb.style.cssText = "position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,0.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow:auto";
        lb.onclick = () => lb.remove();
        const ordered = [...entries.slice(i), ...entries.slice(0, i)];
        for (const en of ordered){
          const grp = document.createElement("div");
          grp.style.cssText = "display:flex;flex-direction:column;align-items:center;gap:6px;margin:10px 0;max-width:92vw";
          const im2 = document.createElement("img");
          im2.src = en.url;
          im2.style.cssText = "max-width:92vw;max-height:72vh;border-radius:8px;object-fit:contain";
          grp.appendChild(im2);
          const cp = document.createElement("div");
          cp.style.cssText = `background:${bg.replace('0.08','0.20')};color:${color};border-radius:6px;padding:6px 12px;font-size:13px;text-align:center;max-width:92vw`;
          cp.textContent = (en.legenda || "(sem legenda)") + ` · ${en.verificado_por||"—"} · ${fmtDate(en.created_at)}`;
          grp.appendChild(cp);
          lb.appendChild(grp);
        }
        document.body.appendChild(lb);
      };
      grid.appendChild(wrap);
    });
    return card;
  }
  const photoGroups = _photoEntries(chks);
  const galA = _photoGallery("✅ Fotos aprovadas", "#34D399", "rgba(16,185,129,0.08)", photoGroups.aprov);
  const galR = _photoGallery("❌ Fotos reprovadas", "#F87171", "rgba(239,68,68,0.08)", photoGroups.reprov);
  if (galA) root.appendChild(galA);
  if (galR) root.appendChild(galR);

  // Timeline
  const tl = el(`<div class="card"><div class="label">Histórico completo (${(chks||[]).length})</div><div class="timeline" id="_tl"></div></div>`);
  root.appendChild(tl);
  const tlBox = document.getElementById("_tl");
  if (!chks || chks.length === 0){
    tlBox.appendChild(el(`<div class="small" style="padding:8px 0">Nenhum checkpoint ainda. Você pode ser o primeiro.</div>`));
  } else {
    for (const c of chks){
      const stColor = c.status === "aprovado" ? "#34D399" : c.status === "nao-conforme" ? "#F87171" : "#9CA3AF";
      const setorCor = c.setor === "producao" ? "#FBBF24" : c.setor === "logistica" ? "#60A5FA" : "#C084FC";
      const fotosArr = (c.fotos && c.fotos.length) ? c.fotos : (c.foto_url ? [c.foto_url] : []);
      const motivoBlock = c.status === "nao-conforme" && c.obs
        ? `<div style="background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.25);border-radius:6px;padding:8px 10px;margin-top:6px"><div style="font-size:10px;color:#F87171;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:3px">Motivo da reprovação</div><div style="color:#fff;font-size:12px;line-height:1.35">${esc(c.obs)}</div></div>`
        : (c.obs ? `<div class="small" style="margin-top:6px;color:rgba(255,255,255,0.65)">${esc(c.obs)}</div>` : "");
      const fotosBlock = fotosArr.length
        ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">${fotosArr.map((u,i)=>`<img src="${esc(u)}" data-idx="${i}" data-fotos='${esc(JSON.stringify(fotosArr))}' class="_tl_foto" style="width:60px;height:60px;border-radius:6px;object-fit:cover;cursor:pointer;border:1px solid rgba(255,255,255,0.08)"/>`).join("")}</div>`
        : "";
      const item = el(`<div class="tlitem" style="border-left-color:${setorCor}">
        <div><b>${esc(SETOR_LABEL[c.setor]||c.setor)}</b> · ${esc(c.acao)} · <span style="color:${stColor}">${esc(c.status)}</span></div>
        <div class="meta">${esc(c.verificado_por||"—")} · ${fmtDate(c.created_at)}</div>
        ${motivoBlock}
        ${fotosBlock}
      </div>`);
      // Lightbox pra cada foto individual no histórico
      item.querySelectorAll("._tl_foto").forEach(img => {
        img.onclick = (ev) => {
          ev.stopPropagation();
          const arr = JSON.parse(img.dataset.fotos || "[]");
          const startIdx = parseInt(img.dataset.idx) || 0;
          const lb = document.createElement("div");
          lb.style.cssText = "position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,0.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow:auto";
          lb.onclick = () => lb.remove();
          // Mostra todas em sequência, começando pela clicada
          const ordered = [...arr.slice(startIdx), ...arr.slice(0, startIdx)];
          for (const url of ordered){
            const im = document.createElement("img");
            im.src = url;
            im.style.cssText = "max-width:92vw;max-height:80vh;border-radius:8px;object-fit:contain;margin:10px 0";
            lb.appendChild(im);
          }
          document.body.appendChild(lb);
        };
      });
      tlBox.appendChild(item);
    }
  }

  document.getElementById("sub").textContent = `${SETOR_LABEL[Object.keys(SETOR_LABEL)[0]]} · Verificador: ${verif}`;
}

// PWA: registra service worker
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/leitor/sw.js").catch(err => console.warn("[SW] falhou:", err));
  });
}

// PWA: captura evento de install e expõe botão
let _pwaInstallEvent = null;
window.addEventListener("beforeinstallprompt", (ev) => {
  ev.preventDefault();
  _pwaInstallEvent = ev;
  const btn = document.getElementById("_install_btn");
  if (btn) btn.style.display = "block";
});
window.addEventListener("appinstalled", () => {
  _pwaInstallEvent = null;
  const btn = document.getElementById("_install_btn");
  if (btn) btn.style.display = "none";
});
async function _tryInstall(){
  if (!_pwaInstallEvent) {
    alert("No Android Chrome: toque no menu (⋮) → 'Instalar app' ou 'Adicionar à tela inicial'.\nNo iPhone Safari: botão compartilhar → 'Adicionar à Tela de Início'.");
    return;
  }
  _pwaInstallEvent.prompt();
  const { outcome } = await _pwaInstallEvent.userChoice;
  if (outcome === "accepted") _pwaInstallEvent = null;
}
window._tryInstall = _tryInstall;

// Boot
function boot(){
  const params = new URLSearchParams(location.search);
  const id = params.get("id");
  const projetoId = params.get("p");
  if (!getNome()){
    renderNomePrompt(boot);
    return;
  }
  if (id) renderItem(id);
  else if (projetoId) renderProjeto(projetoId);
  else renderProjetos();
}
boot();
</script>
