  const overlay = el(`<div style="position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9999;display:flex;align-items:flex-end;justify-content:center;padding:0">
    <div class="card" style="max-width:520px;width:100%;background:var(--pk-card1);margin:0;border-radius:16px 16px 0 0;max-height:92vh;overflow-y:auto">
      <div class="h2" style="margin:0 0 4px">Fotos do item</div>
      <div class="small" style="margin-bottom:12px" data-role="item-label">${labelItem}</div>
      <div data-role="fotos-body">
        <div class="small center"><span class="spinner"></span> Carregando…</div>
      </div>
      <div style="margin-top:14px">
        <button class="ghost" data-cancel style="width:100%">Fechar</button>
      </div>
    </div>
  </div>`);
  document.body.appendChild(overlay);
  const prevFabBottom = document.body.style.getPropertyValue("--pk-fab-bottom");
  document.body.style.setProperty("--pk-fab-bottom", "200vh");
  const closeAndRestore = () => {
    overlay.remove();
    if (prevFabBottom) document.body.style.setProperty("--pk-fab-bottom", prevFabBottom);
    else document.body.style.removeProperty("--pk-fab-bottom");
  };
  overlay.querySelector('[data-cancel]').onclick = closeAndRestore;
  const body = overlay.querySelector('[data-role="fotos-body"]');
  try {
    const r = await fetchGestao(`${GESTAO_API}/api/projetos/${projetoId}/fotos-obra?item_id=${itemId}`);
    if (!r.ok){ body.innerHTML = `<div class="small err">O gestão não respondeu as fotos agora. Feche e tente de novo em instantes.</div>`; return; }
    const fotos = await r.json();
    if (!fotos || !fotos.length){
      body.innerHTML = `<div class="small">O instalador ainda não enviou fotos deste item.</div>`;
      return;
    }
    body.innerHTML = "";
    for (const f of fotos){
      const tipo = f.tipo || "foto";
      const midiaEl = tipo === "video"
        ? `<video src="${esc(f.url)}" controls playsinline preload="metadata" style="width:100%;background:#000"></video>`
        : `<img src="${esc(f.url)}" alt="foto" data-ver-foto="${esc(f.url)}" style="width:100%;display:block;cursor:zoom-in" />`;
      const card = el(`<div class="card" style="padding:0;overflow:hidden;margin-bottom:10px">
        ${midiaEl}
        <div style="padding:8px 12px">
          <div style="font-size:12px;font-weight:600">${esc(f.legenda || "-")}</div>
          <div class="small">${f.created_at ? fmtDate(f.created_at) : ""}${f.origem ? " · " + esc(f.origem) : ""}</div>
        </div>
      </div>`);
      // Foto amplia no visor fullscreen do app (nunca aba nova)
      const fimg = card.querySelector("[data-ver-foto]");
      if (fimg) fimg.onclick = () => _pvVerMidia(fimg.dataset.verFoto, "foto");
      body.appendChild(card);
    }
  } catch (e){
    body.innerHTML = `<div class="small err">Sem conexão com o gestão agora. Verifique o sinal e toque em Fechar e abra de novo.</div>`;
  }
}

// ╔══════════════════════════════════════════════════════════════╗
// ║ VALIDAÇÃO DO PROGRESSO — envios do instalador (gestao.eventos ║
// ║ tipo instala_progresso). O fiscal aprova ou reprova cada um;   ║
// ║ reprovação exige motivo e aceita foto. Veredito fica em        ║
// ║ payload.fiscal e volta pro app do instalador.                  ║
// ║ Envio legado (anterior à validação) vem com fiscal=null e NÃO  ║
// ║ ganha chip de pendência (aviso só após o evento existir).      ║
// ╚══════════════════════════════════════════════════════════════╝
const PV_ST = {
  pendente:  { label: "AGUARDANDO VALIDAÇÃO", color: "#FBBF24" },
  aprovado:  { label: "APROVADO",  color: "#34D399" },
  reprovado: { label: "REPROVADO", color: "#ef4444" },
};

// Quanto tempo o envio está esperando o veredito do fiscal (texto curto).
function _pvEsperaTxt(dtStr){
  if (!dtStr) return "";
  const min = Math.round((Date.now() - new Date(dtStr).getTime()) / 60000);
  if (min < 1) return "chegou agora";
  if (min < 60) return `esperando há ${min} min`;
  const h = Math.round(min / 60);
  if (h < 24) return `esperando há ${h}h`;
  const dd = Math.round(h / 24);
  return `esperando há ${dd} dia${dd > 1 ? "s" : ""}`;
}

// Visor de mídia em tela cheia dentro do app (regra: app de campo nunca abre aba).
function _pvVerMidia(url, tipo){
  const midiaEl = tipo === "video"
    ? `<video src="${esc(url)}" controls autoplay playsinline style="max-width:100%;max-height:82vh;background:#000"></video>`
    : `<img src="${esc(url)}" alt="foto" style="max-width:100%;max-height:82vh;display:block" />`;
  const overlay = el(`<div style="position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px">
    ${midiaEl}
    <button class="ghost" data-cancel style="width:auto;padding:8px 26px;margin-top:12px">Fechar</button>
  </div>`);
  overlay.querySelector("[data-cancel]").onclick = () => overlay.remove();
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  document.body.appendChild(overlay);
}

function renderValidacaoSecao(cardId, opts){
  const sec = el(`<div class="card" id="_pvSec" style="border-color:rgba(150,132,115,0.30)">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <div class="label" style="color:var(--pk-accent)">Validação do progresso</div>
      <span class="tag" data-role="pv-pend" style="display:none;background:rgba(251,191,36,0.15);color:#FBBF24;font-weight:700;flex-shrink:0"></span>
    </div>
    <div class="small" data-role="pv-sub" style="margin-top:4px">carregando…</div>
    <div data-role="pv-body" style="margin-top:8px;display:flex;flex-direction:column;gap:8px"></div>
  </div>`);
  sec.style.display = "none"; // só aparece quando a obra tem envios do instalador

  const nomeFiscal = (_fiscal && _fiscal.nome) || (_user && _user.email) || "Fiscal";
  const emailFiscal = (_user && _user.email) || null;

  const load = async () => {
    let d = null;
    try {
      const r = await fetchGestao(`${GESTAO_API}/api/fiscal/obra/${cardId}/progresso-validacao`);
      if (r.ok) d = await r.json();
    } catch (_e) { /* gestão fora do ar: seção some, resto da tela segue */ }
    if (!d || !d.envios || !d.envios.length) return;
    sec.style.display = "";
    // Veio do atalho "pra validar" da home: rola direto até esta seção (1x só)
    if (opts && opts.scroll && !sec._jaRolou){
      sec._jaRolou = true;
      setTimeout(() => sec.scrollIntoView({ behavior: "smooth", block: "start" }), 120);
    }
    const sub = sec.querySelector('[data-role="pv-sub"]');
    const pendTag = sec.querySelector('[data-role="pv-pend"]');
    const body = sec.querySelector('[data-role="pv-body"]');
    body.innerHTML = "";
    sub.textContent = `${d.envios.length} envio(s) do instalador`;
    if (d.pendentes > 0){
      pendTag.style.display = "";
      pendTag.textContent = `${d.pendentes} PENDENTE${d.pendentes > 1 ? "S" : ""}`;
    } else {
      pendTag.style.display = "none";
    }

    // Pendentes primeiro. Entre eles, itens FINALIZADOS pelo instalador sobem
    // pro topo (é o veredito que destrava o item); dentro de cada grupo, mais
    // antigo em cima (ordem de chegada da fila). Depois os já decididos/legado
    // (mais recentes primeiro, como histórico).
    const fiscalDe = (e) => (e.fiscal && e.fiscal.status) || null;
    const pend = d.envios.filter(e => fiscalDe(e) === "pendente").reverse();
    pend.sort((a, b) => (b.finalizado ? 1 : 0) - (a.finalizado ? 1 : 0)); // sort estável: mantém a ordem de chegada dentro do grupo
    const resto = d.envios.filter(e => fiscalDe(e) !== "pendente");

    const linhaEnvio = (e) => {
      const st = fiscalDe(e) ? PV_ST[fiscalDe(e)] : null;
      const ehPend = fiscalDe(e) === "pendente";
      const qtdTot = Number(e.quantidade) || 0;
      const qtdInst = Number(e.qtd_instalada) || 0;
      const delta = Number(e.qtd_delta) || 0;
      const und = e.unidade || "";
      const progTxt = e.finalizado
        ? `finalizou o item (${qtdInst}${qtdTot ? "/" + qtdTot : ""} ${esc(und)})`
        : (delta ? `+${delta} ${esc(und)} no dia (total ${qtdInst}${qtdTot ? "/" + qtdTot : ""})` : `foto/vídeo do andamento`);
      // Pendente de item finalizado = decisão que destrava o instalador: borda âmbar
      const row = el(`<div style="border:1px solid ${ehPend && e.finalizado ? "rgba(251,191,36,0.55)" : "var(--pk-border1)"};padding:10px 12px;background:var(--pk-card2)">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">
          <div style="flex:1;min-width:0">
            <div style="font-size:12px;font-weight:600">${esc(e.descritivo || "Item")}${e.ambiente ? " · " + esc(e.ambiente) : ""}</div>
            <div class="small" style="margin-top:2px">${esc(e.prestador_nome || "Instalador")} · ${e.created_at ? fmtDate(e.created_at) : ""}</div>
            <div class="small" style="margin-top:2px;color:var(--pk-text-dim)">${progTxt}</div>
            ${ehPend ? `<div class="small" style="margin-top:2px;color:#FBBF24">${_pvEsperaTxt(e.created_at)}</div>` : ""}
          </div>
          ${st ? `<span class="tag" style="background:${st.color}22;color:${st.color};flex-shrink:0;font-weight:700">${ehPend && e.finalizado ? "FINALIZADO: VALIDAR" : st.label}</span>` : ""}
        </div>
        ${qtdTot ? `<div style="height:2px;background:var(--pk-border1);margin-top:8px"><div style="height:100%;width:${Math.min(100, Math.round(qtdInst / qtdTot * 100))}%;background:var(--pk-text)"></div></div>` : ""}
        <div data-role="pv-extras"></div>
      </div>`);
      const extras = row.querySelector('[data-role="pv-extras"]');

      // Mídia que o instalador mandou junto (abre no visor, nunca em aba nova)
      if (e.midia_url){
        const btnM = el(`<button class="ghost" style="width:auto;padding:6px 12px;font-size:11px;margin-top:8px">${e.midia_tipo === "video" ? "VER VÍDEO" : "VER FOTO"} DO INSTALADOR</button>`);
        btnM.onclick = () => _pvVerMidia(e.midia_url, e.midia_tipo);
        extras.appendChild(btnM);
      }

      // Veredito já dado: mostra quem, quando, motivo e foto do fiscal
      if (st && fiscalDe(e) !== "pendente"){
        const f = e.fiscal;
        const box = el(`<div class="small" style="margin-top:8px;padding:8px 10px;border-left:2px solid ${st.color};background:${st.color}0d">
          <div style="font-weight:600;color:${st.color}">${st.label.charAt(0) + st.label.slice(1).toLowerCase()} por ${esc(f.nome || "fiscal")}${f.em ? " em " + fmtDate(f.em) : ""}</div>
          ${f.motivo ? `<div style="margin-top:4px">${esc(f.motivo)}</div>` : ""}
        </div>`);
        if (f.foto_url){
          const btnF = el(`<button class="ghost" style="width:auto;padding:5px 10px;font-size:11px;margin-top:6px">VER FOTO DO FISCAL</button>`);
          btnF.onclick = () => _pvVerMidia(f.foto_url, "foto");
          box.appendChild(btnF);
        }
        extras.appendChild(box);
      }

      // Pendente: botões de veredito + form de reprovação inline
      if (fiscalDe(e) === "pendente"){
        const acoes = el(`<div style="display:flex;gap:8px;margin-top:10px">
          <button data-ok class="ghost" style="flex:1;padding:10px;font-size:10px;border-color:rgba(52,211,153,0.5);color:#34D399">APROVAR</button>
          <button data-nok class="ghost" style="flex:1;padding:10px;font-size:10px;border-color:rgba(239,68,68,0.5);color:#ef4444">REPROVAR</button>
        </div>`);
        const idBase = `_pv${String(e.id).replace(/-/g, "").slice(0, 12)}`;
        const form = el(`<div style="display:none;margin-top:8px">
          <div style="display:flex;gap:6px;align-items:stretch">
            <textarea id="${idBase}m" rows="2" placeholder="O que precisa ser refeito? O instalador vai ler isso."
              style="flex:1;min-width:0;padding:9px 10px;background:var(--pk-bg);border:1px solid var(--pk-border1);color:var(--pk-text);font-size:13px;font-family:inherit;resize:vertical"></textarea>
            ${_ditadoHtml(`#${idBase}m`)}
          </div>
          <label class="ghost" style="display:block;text-align:center;padding:8px;font-size:11px;margin-top:6px;cursor:pointer">
            ANEXAR FOTO DO PROBLEMA (opcional)
            <input type="file" accept="image/*" capture="environment" style="display:none">
          </label>
          <div class="small" data-role="pv-foto-nome" style="display:none;margin-top:4px;color:var(--pk-text-dim)"></div>
          <button data-confirmar style="width:100%;margin-top:8px;padding:12px;font-size:10px;background:#ef4444;border-color:#ef4444;color:#fff">CONFIRMAR REPROVAÇÃO</button>
          <div class="small" data-role="pv-msg" style="margin-top:6px"></div>
        </div>`);
        let fotoFile = null;
        form.querySelector('input[type="file"]').onchange = (ev) => {
          fotoFile = ev.target.files && ev.target.files[0];
          const nm = form.querySelector('[data-role="pv-foto-nome"]');
          if (fotoFile){ nm.style.display = ""; nm.textContent = `Foto anexada: ${fotoFile.name}`; }
          else { nm.style.display = "none"; }
        };

        const votar = async (aprovado, motivo, fotoUrl, btn, msgEl) => {
          btn.disabled = true;
          try {
            const r = await fetchGestao(`${GESTAO_API}/api/fiscal/obra/${cardId}/progresso-validacao/${e.id}`, {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ aprovado, motivo: motivo || null, foto_url: fotoUrl || null,
                                     fiscal_nome: nomeFiscal, fiscal_email: emailFiscal }),
            });
            if (!r.ok){
              const t = await r.json().catch(() => ({}));
              throw new Error(t.detail || `HTTP ${r.status}`);
            }
            load(); // re-renderiza só esta seção com o veredito gravado
          } catch (err){
            btn.disabled = false;
            if (msgEl) msgEl.innerHTML = `<span class="err">${esc(err.message || err)}</span>`;
            else _appToast("Erro ao validar: " + (err.message || err));
          }
        };

        acoes.querySelector("[data-ok]").onclick = async (ev) => {
          if (!(await _appConfirm("Aprovar este envio do instalador?", "Sim, aprovar", "#34D399"))) return;
          votar(true, null, null, ev.currentTarget || acoes.querySelector("[data-ok]"), null);
        };
        acoes.querySelector("[data-nok]").onclick = () => {
          form.style.display = form.style.display === "none" ? "" : "none";
        };
        form.querySelector("[data-confirmar]").onclick = async (ev) => {
          const btn = form.querySelector("[data-confirmar]");
          const msgEl = form.querySelector('[data-role="pv-msg"]');
          const motivo = (form.querySelector(`#${idBase}m`).value || "").trim();
          if (!motivo){ msgEl.innerHTML = `<span class="err">Escreva o motivo: o instalador precisa saber o que refazer.</span>`; return; }
          btn.disabled = true;
          let fotoUrl = null;
          if (fotoFile){
            try { fotoUrl = await _fiscalUploadFoto("validacao", cardId, fotoFile); }
            catch (err){ btn.disabled = false; msgEl.innerHTML = `<span class="err">Erro ao subir a foto: ${esc(err.message || err)}</span>`; return; }
          }
          votar(false, motivo, fotoUrl, btn, msgEl);
        };
        extras.appendChild(acoes);
        extras.appendChild(form);
      }
      return row;
    };

    for (const e of pend) body.appendChild(linhaEnvio(e));
    // Histórico (decididos + legado): colapsa além dos 5 primeiros
    const LIMITE = 5;
    resto.slice(0, LIMITE).forEach(e => body.appendChild(linhaEnvio(e)));
    if (resto.length > LIMITE){
      const btnMais = el(`<button class="ghost" style="width:100%;padding:8px;font-size:11px">VER MAIS ${resto.length - LIMITE} ENVIO(S)</button>`);
      btnMais.onclick = () => {
        btnMais.remove();
        resto.slice(LIMITE).forEach(e => body.appendChild(linhaEnvio(e)));
      };
      body.appendChild(btnMais);
    }
  };
  load();
  return sec;
}

// ── O QUE FOI VENDIDO (gestao.itens da proposta) — abas Lista | Por ambiente
// `vendido` (opcional) = estado de conferência por item {itemId: {valor, obs}},
// persiste em fiscal_laudos.checklist_extra.vendido no salvar do laudo.
// `titulo` opcional troca o header da seção (o acompanhamento usa "Progresso dos
// itens" porque lá o foco é registrar avanço, não conferir o que foi vendido).
function renderVendidoSecao(cardId, vendido, titulo){
  const sec = el(`<div class="card" style="border-color:rgba(150,132,115,0.30)">
    <div class="label" style="color:var(--pk-accent)">${esc(titulo || "O que foi vendido")}</div>
    <div class="small" data-role="v-sub" style="margin-top:4px">carregando…</div>
    <div data-role="v-tabs" style="display:none;gap:6px;margin-top:8px">
      <button class="ghost" data-modo="lista" style="flex:1;padding:7px;font-size:12px">Lista</button>
      <button class="ghost" data-modo="ambiente" style="flex:1;padding:7px;font-size:12px">Por ambiente</button>
    </div>
    <div data-role="v-body" style="margin-top:8px"></div>
  </div>`);
  // Aba ativa sobrevive ao refresh pós-registro de progresso (a seção inteira
  // recarrega do gestão pra barra/percentual refletirem o que acabou de subir).
  let _vModo = "lista";
  const carregarVendido = async () => {
    const sub = sec.querySelector('[data-role="v-sub"]');
    let d = null;
    try {
      const r = await fetchGestao(`${GESTAO_API}/api/fiscal/obra/${cardId}`);
      if (r.ok) d = await r.json();
    } catch (_e) { /* gestão fora do ar */ }
    if (!d || !d.itens || !d.itens.length){
      sub.textContent = "Os itens vendidos ainda não chegaram do gestão.";
      return;
    }
    const itens = d.itens;
    const nEntregues = itens.filter(x => ITEM_DONE(x.status)).length;
    const nExecutando = itens.filter(x => !ITEM_DONE(x.status) && Number(x?.meta?.obra?.qtd_instalada ?? 0) > 0).length;
    sub.textContent = `${itens.length} item${itens.length === 1 ? "" : "s"} vendido${itens.length === 1 ? "" : "s"} · ${nEntregues} finalizado${nEntregues === 1 ? "" : "s"}${nExecutando ? ` · ${nExecutando} em execução` : ""}${d.projeto && d.projeto.numero_proposta ? " · proposta " + d.projeto.numero_proposta : ""}`;
    const tabs = sec.querySelector('[data-role="v-tabs"]');
    const body = sec.querySelector('[data-role="v-body"]');
    tabs.style.display = "flex";
    // Todos veem a lista completa; a CONFERÊNCIA só aparece nos itens do
    // serviço que o fiscal atende (item sem classificação = liberado).
    const meusServ = meusServicos();
    const podeConferir = (it) => {
      if (!vendido) return false;
      if (!meusServ) return true;
      const sv = servDaCategoria(it);
      return !sv || meusServ.has(sv);
    };
    // PROGRESSO PELO FISCAL: mesmo gate de serviço da conferência, mas sem
    // exigir laudo aberto (vendido) — o fiscal registra quanto foi feito e
    // fotos direto da página da obra, e isso alimenta a MESMA engrenagem do
    // instalador (meta.obra.qtd_instalada + status do item + pct da obra).
    // Item já ENTREGUE também mostra o form (Will 08/09): o fiscal pode
    // CORRIGIR o total instalado — reduzir reabre o item no backend.
    const podeProgredir = (it) => {
      if (!meusServ) return true;
      const sv = servDaCategoria(it);
      return !sv || meusServ.has(sv);
    };
    const porId = new Map(itens.map(it => [String(it.id), it]));
    const linha = (it, comAmb) => {
      const qtd = Number(it.quantidade) || 0;
      const inst = Number(it?.meta?.obra?.qtd_instalada ?? 0);
      const entregue = ITEM_DONE(it.status);
      const pct = entregue ? 100 : (qtd > 0 ? Math.min(100, Math.round((inst / qtd) * 100)) : 0);
      const barCor = entregue || pct >= 100 ? "#34D399" : "var(--pk-accent)";
      const chip = entregue
        ? `<span style="font-size:9px;letter-spacing:0.14em;padding:2px 6px;background:rgba(52,211,153,0.15);color:#34D399;text-transform:uppercase;font-family:'IBM Plex Mono',monospace;flex-shrink:0">FINALIZADO</span>`
        : pct > 0
          ? `<span style="font-size:9px;letter-spacing:0.14em;padding:2px 6px;background:rgba(150,132,115,0.15);color:var(--pk-accent);text-transform:uppercase;font-family:'IBM Plex Mono',monospace;flex-shrink:0">EM EXECUÇÃO</span>`
          : `<span style="font-size:9px;letter-spacing:0.14em;padding:2px 6px;background:rgba(119,115,106,0.1);color:var(--pk-text-muted);text-transform:uppercase;font-family:'IBM Plex Mono',monospace;flex-shrink:0">A FAZER</span>`;
      return `<div data-item="${esc(it.id)}" style="padding:10px 0;border-bottom:1px solid var(--pk-border1)">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">
          <div style="flex:1;min-width:0">
            <div style="font-size:12px">${esc(it.descritivo || it.categoria || "-")}</div>
            ${comAmb ? `<div class="small">${esc((it.ambiente || "Sem ambiente").trim() || "Sem ambiente")}</div>` : ""}
          </div>
          ${chip}
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;font-size:10px;color:var(--pk-text-dim);font-family:'IBM Plex Mono',monospace;letter-spacing:0.06em">
          <span>${inst.toFixed(qtd % 1 || inst % 1 ? 2 : 0)} / ${qtd.toFixed(qtd % 1 ? 2 : 0)} ${esc(it.unidade || "")}</span>
          <span style="color:${barCor};font-weight:600">${pct}%</span>
        </div>
        <div style="height:3px;background:var(--pk-border1);margin-top:4px">
          <div style="height:100%;width:${pct}%;background:${barCor};transition:width .4s"></div>
        </div>
        ${podeConferir(it) ? `<div class="ck-btns" style="margin-top:8px">
          <button class="ck-btn sim" data-v="sim">Medidas OK</button>
          <button class="ck-btn nao" data-v="nao">Não confere</button>
        </div>
        <textarea class="ck-obs" data-obs rows="3" placeholder="O que não confere? (medida real)" style="display:none"></textarea>` : ""}
        ${podeProgredir(it) ? `<button data-prog-btn class="ghost" style="width:100%;margin-top:8px;padding:7px;font-size:10px;letter-spacing:0.14em;font-family:'IBM Plex Mono',monospace">${entregue ? "CORRIGIR PROGRESSO" : "REGISTRAR PROGRESSO"}</button>
        <div data-prog-form style="display:none;margin-top:8px;padding:10px;background:rgba(150,132,115,0.06);border:1px solid var(--pk-border1)">
          <div class="small" style="margin-bottom:8px;color:var(--pk-text-dim)">Instalado: ${inst.toFixed(inst % 1 ? 2 : 0)} de ${qtd.toFixed(qtd % 1 ? 2 : 0)} ${esc(it.unidade || "un")} · faltam ${Math.max(0, qtd - inst).toFixed((qtd - inst) % 1 ? 2 : 0)}</div>
          ${entregue ? "" : `<div class="small" style="margin-bottom:4px">Quanto foi feito agora (${esc(it.unidade || "un")})</div>
          <input data-prog-qtd type="number" min="0" step="any" inputmode="decimal" placeholder="0" style="width:100%">`}
          <div class="small" style="margin:8px 0 4px">Corrigir total instalado (${esc(it.unidade || "un")})${entregue ? "" : " · opcional, substitui o de cima"}</div>
          <input data-prog-total type="number" min="0" step="any" inputmode="decimal" placeholder="Deixe vazio pra não corrigir" style="width:100%">
          <div class="small" style="margin:8px 0 4px">Fotos do que foi feito</div>
          <input data-prog-fotos type="file" accept="image/*" multiple style="width:100%;font-size:11px">
          <div style="display:flex;gap:6px;margin-top:10px">
            <button data-prog-salvar style="flex:1;padding:8px;font-size:10px;letter-spacing:0.12em;font-family:'IBM Plex Mono',monospace;background:var(--pk-accent);color:#fff;border:none;cursor:pointer">SALVAR ${entregue ? "CORREÇÃO" : "PROGRESSO"}</button>
            ${entregue ? "" : `<button data-prog-final class="ghost" style="flex:1;padding:8px;font-size:10px;letter-spacing:0.12em;font-family:'IBM Plex Mono',monospace">FINALIZAR ITEM</button>`}
          </div>
          <div class="small" data-prog-status style="margin-top:6px;display:none"></div>
        </div>` : ""}
      </div>`;
    };
    const bindConfere = () => {
      if (!vendido) return;
      body.querySelectorAll("[data-item]").forEach(row => {
        const id = row.dataset.item;
        const btns = row.querySelectorAll(".ck-btn");
        const obs = row.querySelector("[data-obs]");
        const sync = () => {
          const st = vendido[id] || {};
          btns.forEach(b => b.classList.toggle("on", b.dataset.v === st.valor));
          if (obs){ obs.style.display = st.valor === "nao" ? "block" : "none"; obs.value = st.obs || ""; autoGrowObs(obs); }
        };
        btns.forEach(b => { b.onclick = (ev) => {
          ev.preventDefault();
          const st = vendido[id] || (vendido[id] = { valor: null, obs: "" });
          st.valor = st.valor === b.dataset.v ? null : b.dataset.v;
          sync();
        }; });
        if (obs) obs.oninput = (ev) => { (vendido[id] || (vendido[id] = { valor: null, obs: "" })).obs = ev.target.value; autoGrowObs(ev.target); };
        sync();
      });
    };
    // PROGRESSO PELO FISCAL: mesmo POST que o Instala usa (endpoint /progresso
    // do gestão), com origem:'fiscal' — a foto cai na aba Fiscal do Registro
    // fotográfico e o evento nasce aprovado (o fiscal não valida o próprio
    // envio na fila dele). A ORDEM dos POSTs importa: quantidade primeiro,
    // depois uma foto por POST, e o finalizar POR ÚLTIMO num POST separado,
    // porque a regra de "mínimo 3 fotos pra finalizar" do backend conta as
    // fotos que já estão inseridas no banco.
    const bindProgresso = () => {
      body.querySelectorAll("[data-item]").forEach(row => {
        const btn = row.querySelector("[data-prog-btn]");
        if (!btn) return; // item fora do serviço do fiscal (entregue agora tem botão de correção)
        const form = row.querySelector("[data-prog-form]");
        const it = porId.get(row.dataset.item);
        btn.onclick = () => { form.style.display = form.style.display === "none" ? "block" : "none"; };
        const status = row.querySelector("[data-prog-status]");
        const setStatus = (msg, erro) => {
          status.style.display = "block";
          status.style.color = erro ? "#F87171" : "var(--pk-text-dim)";
          status.textContent = msg;
        };
        const enviar = async (finalizar) => {
          // qtdEl não existe em item entregue (só o campo de correção); o
          // campo de correção (data-prog-total) é ABSOLUTO: preenchido, ele
          // substitui o delta e vira qtd_total no POST (pode reduzir/zerar).
          const qtdEl = row.querySelector("[data-prog-qtd]");
          const qtd = qtdEl ? (parseFloat(String(qtdEl.value).replace(",", ".")) || 0) : 0;
          const totalRaw = String(row.querySelector("[data-prog-total]").value).trim();
          const temCorr = totalRaw !== "";
          const corr = parseFloat(totalRaw.replace(",", "."));
          const files = Array.from(row.querySelector("[data-prog-fotos]").files || []);
          if (temCorr && (!isFinite(corr) || corr < 0)){ setStatus("Correção inválida: informe um número maior ou igual a zero.", true); return; }
          if (!finalizar && qtd <= 0 && !temCorr && !files.length){ setStatus("Informe a quantidade feita, a correção ou anexe fotos.", true); return; }
          if (finalizar && !confirm("Finalizar este item? Ele passa a contar como 100% no progresso da obra.")) return;
          if (temCorr && ITEM_DONE(it.status) && !confirm("Corrigir o total instalado deste item finalizado? Se ficar abaixo do total, ele volta pra EM EXECUÇÃO.")) return;
          const botoes = [row.querySelector("[data-prog-salvar]"), row.querySelector("[data-prog-final]"), btn];
          botoes.forEach(b => { if (b) b.disabled = true; });
          try {
            const nome = fiscalAtualNome() || (_user && _user.email) || "fiscal";
            const url = `${GESTAO_API}/api/fiscal/obra/${cardId}/itens/${it.id}/progresso`;
            // client_key novo por POST = idempotência no backend sem risco de
            // dedup engolir envios distintos (fetchGestao nunca repete POST).
            const post = async (extra) => {
              const r = await fetchGestao(url, {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ origem: "fiscal", prestador_nome: nome, client_key: crypto.randomUUID(), ...extra }),
              });
              if (!r.ok){
                let msg = `HTTP ${r.status}`;
                try { const j = await r.json(); if (j && j.detail) msg = String(j.detail); } catch (_e){}
                throw new Error(msg);
              }
            };
            if (temCorr){ setStatus("Corrigindo total instalado..."); await post({ qtd_total: corr }); }
            else if (qtd > 0){ setStatus("Salvando quantidade..."); await post({ qtd_delta: qtd }); }
            for (let i = 0; i < files.length; i++){
              setStatus(`Enviando foto ${i + 1} de ${files.length}...`);
              // Comprime no aparelho (Blob jpeg <=1280px) e sobe direto pro
              // bucket público; o gestão só guarda a URL em gestao.fotos.
              const blob = await compressPhoto(files[i]);
              const path = `progresso/${cardId}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
              const { error } = await sb.storage.from("fiscal-midias").upload(path, blob, { contentType: "image/jpeg", upsert: false });
              if (error) throw error;
              const pub = sb.storage.from("fiscal-midias").getPublicUrl(path).data.publicUrl;
              await post({ midia_url: pub, midia_tipo: "foto" });
            }
            if (finalizar){ setStatus("Finalizando item..."); await post({ finalizado: true }); }
            setStatus("Progresso registrado.");
            // Recarrega a seção inteira: barra, percentual e chip do item vêm
            // do gestão já com o que acabou de subir (mesma fonte do PCP).
            carregarVendido();
          } catch (e){
            setStatus(`Erro: ${String(e.message || e)}`, true);
            botoes.forEach(b => { if (b) b.disabled = false; });
          }
        };
        row.querySelector("[data-prog-salvar]").onclick = () => enviar(false);
        // Botão FINALIZAR não existe em item já entregue (form vira só correção)
        const btnFinal = row.querySelector("[data-prog-final]");
        if (btnFinal) btnFinal.onclick = () => enviar(true);
      });
    };
    // ADITIVO: separa itens em 2 arrays. Itens marcados com meta.eh_aditivo=true
    // saem num bloco separado embaixo, com header amarelo — fiscal vê claramente
    // o que veio depois da proposta original (não misturado com o que já foi
    // vendido antes).
    const itensOriginais = itens.filter(it => !((it && it.meta && it.meta.eh_aditivo) === true));
    const itensAditivo = itens.filter(it => (it && it.meta && it.meta.eh_aditivo) === true);
    const separadorAditivo = (n) => `<div style="margin:14px 0 8px;padding:8px 12px;background:rgba(199,164,91,0.10);border:1px solid #C7A45B;display:flex;align-items:center;gap:10px">
      <span style="font-size:10px;letter-spacing:0.28em;color:#C7A45B;font-weight:700;font-family:'IBM Plex Mono',monospace">ADITIVO</span>
      <span style="font-size:9px;color:var(--pk-text-muted);letter-spacing:0.08em">${n} item(ns) adicionado(s) após contrato original</span>
    </div>`;
    const render = (modo) => {
      tabs.querySelectorAll("[data-modo]").forEach(b => {
        const on = b.dataset.modo === modo;
        b.style.background = on ? "rgba(150,132,115,0.18)" : "";
        b.style.color = on ? "var(--pk-accent)" : "";
        b.style.fontWeight = on ? "700" : "";
      });
      if (modo === "lista"){
        let html = itensOriginais.map(it => linha(it, true)).join("");
        if (itensAditivo.length > 0) {
          html += separadorAditivo(itensAditivo.length);
          html += itensAditivo.map(it => linha(it, true)).join("");
        }
        body.innerHTML = html;
      } else {
        const gruparPorAmbiente = (arr) => {
          const grupos = new Map();
          for (const it of arr){
            const amb = (it.ambiente || "Sem ambiente").trim() || "Sem ambiente";
            if (!grupos.has(amb)) grupos.set(amb, []);
            grupos.get(amb).push(it);
          }
          return Array.from(grupos.entries()).map(([amb, gs]) => `<div style="margin-bottom:10px">
            <div style="font-size:11px;letter-spacing:0.08em;font-weight:700;color:var(--pk-accent);text-transform:uppercase;padding:4px 0">${esc(amb)} <span style="opacity:0.6;font-weight:400">· ${gs.length}</span></div>
            ${gs.map(it => linha(it, false)).join("")}
          </div>`).join("");
        };
        let html = gruparPorAmbiente(itensOriginais);
        if (itensAditivo.length > 0) {
          html += separadorAditivo(itensAditivo.length);
          html += gruparPorAmbiente(itensAditivo);
        }
        body.innerHTML = html;
      }
      bindConfere();
      bindProgresso();
    };
    tabs.querySelectorAll("[data-modo]").forEach(b => { b.onclick = () => { _vModo = b.dataset.modo; render(b.dataset.modo); }; });
    render(_vModo);
  };
  carregarVendido();
  return sec;
}

// ╔══════════════════════════════════════════════════════════════╗
// ║ CHECKLIST DE INÍCIO DE OBRAS (etapa 3 — gestão / Central)      ║
// ║ Serviços vêm dos itens contratados do gestão; respostas gravam ║
// ║ em gestao.projeto_etapas.meta.checklist via API do gestão.     ║
// ╚══════════════════════════════════════════════════════════════╝
const CK_OBRA_LABEL = { piso: "Piso", deck: "Deck", forro: "Forro", painel: "Painel", porta: "Porta", marcenaria: "Marcenaria", escada: "Escada", bancos: "Bancos" };

async function renderChecklistInicioObra(cardId, info){
  unsubscribeFiscalRealtime();
  root.innerHTML = "";
  root.appendChild(el(`<div style="margin-bottom:10px">
    <button class="ghost" id="_back" style="width:auto;padding:6px 12px;font-size:12px">← Voltar</button>
  </div>`));
  document.getElementById("_back").onclick = () => voltarPagina();

  let d;
  try {
    const r = await fetchGestao(`${GESTAO_API}/api/fiscal/checklist-obra/${cardId}`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    d = await r.json();
  } catch (e){
    root.appendChild(el(`<div class="card"><div class="err">Não consegui carregar o checklist do gestão (${esc(String(e.message || e))}).</div></div>`));
    return;
  }
  if (!d.servicos || !d.servicos.length){
    root.appendChild(el(`<div class="card"><div class="small">Nenhum serviço contratado identificado no gestão pra esta obra.</div></div>`));
    return;
  }

  root.appendChild(el(`<div class="card" style="background:linear-gradient(135deg,rgba(150,132,115,0.12),rgba(150,132,115,0.04));border-color:rgba(150,132,115,0.3)">
    <div class="label" style="color:var(--pk-accent)">Checklist de Início de Obras</div>
    <div style="font-size:17px;font-weight:700;margin:4px 0 2px">${esc((info && info.title) || d.cliente || "-")}</div>
    <div class="small">Serviços contratados: ${d.servicos.map(s => s.toUpperCase()).join(", ")}${d.checklist_em ? " · último salvamento " + fmtDate(d.checklist_em) : ""}</div>
    <div class="small" style="margin-top:2px">As respostas aparecem na Central do Cliente (etapa 3).</div>
  </div>`));

  const ck = d.checklist || {};
  const perguntasDe = (s) => (CK["1vistoria"] && CK["1vistoria"][s]) || (CK["2vistoria"] && CK["2vistoria"][s]) || [];

  for (const s of d.servicos){
    const perguntas = perguntasDe(s);
    if (!perguntas.length) continue;
    if (!ck[s]) ck[s] = {};
    const sec = el(`<div class="card"><div class="h2">${esc(CK_OBRA_LABEL[s] || s.toUpperCase())}</div></div>`);
    for (const q of perguntas){
      const state = ck[s][q] || { valor: null, obs: "" };
      ck[s][q] = state;
      const row = document.createElement("div");
      row.className = "ck-row";
      // Pergunta aberta: sem Sim/Não/N-A, a resposta vai na própria textarea (state.obs).
      // Pergunta fechada: botões + obs com placeholder contextual quando houver.
      const aberta = CK_ABERTAS.has(q);
      const ph = aberta ? "Resposta" : (CK_OBS_PLACEHOLDER[q] || "Observação (opcional)");
      row.innerHTML = `
        <div class="ck-q">${esc(q)}</div>
        ${aberta ? "" : `<div class="ck-btns">
          <button class="ck-btn sim ${state.valor==="sim"?"on":""}" data-v="sim">Sim</button>
          <button class="ck-btn nao ${state.valor==="nao"?"on":""}" data-v="nao">Não</button>
          <button class="ck-btn na  ${state.valor==="na" ?"on":""}" data-v="na">N/A</button>
        </div>`}
        <textarea class="ck-obs" rows="3" placeholder="${esc(ph)}">${esc(state.obs||"")}</textarea>
      `;
      row.querySelectorAll(".ck-btn").forEach(btn => {
        btn.onclick = (ev) => {
          ev.preventDefault();
          state.valor = btn.dataset.v;
          row.querySelectorAll(".ck-btn").forEach(b => b.classList.toggle("on", b === btn));
        };
      });
      const obsEl = row.querySelector(".ck-obs");
      obsEl.oninput = (ev) => { state.obs = ev.target.value; autoGrowObs(ev.target); };
      _ditadoAnexar(obsEl); // ditado por voz, igual aos demais campos de texto do laudo
      requestAnimationFrame(() => autoGrowObs(obsEl));
      sec.appendChild(row);
    }
    root.appendChild(sec);
  }

  const btn = el(`<button class="primary" style="margin-top:8px">Salvar checklist</button>`);
  const msg = el(`<div></div>`);
  btn.onclick = async () => {
    btn.disabled = true; btn.textContent = "Salvando…";
    let total = 0, feitos = 0;
    for (const s of d.servicos){
      for (const q of perguntasDe(s)){
        total++;
        const st = ck[s] && ck[s][q];
        // Pergunta aberta conta como feita pelo texto (valor fica null nelas)
        if (st && (st.valor || (CK_ABERTAS.has(q) && (st.obs||"").trim()))) feitos++;
      }
    }
    const status = feitos === 0 ? "pendente" : feitos < total ? "em_andamento" : "concluida";
    try {
      const r = await fetchGestao(`${GESTAO_API}/api/fiscal/checklist-obra/${cardId}`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ checklist: ck, checklist_por: fiscalAtualNome() || null, status }),
      });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      msg.innerHTML = `<div class="ok">Checklist salvo: ${feitos}/${total} verificações. Já visível na Central do Cliente.</div>`;
    } catch (e){
      msg.innerHTML = `<div class="err">Não deu pra salvar o checklist (${esc(String(e.message || e))}). Suas marcações continuam na tela: verifique o sinal e toque em Salvar checklist de novo.</div>`;
    } finally {
      btn.disabled = false; btn.textContent = "Salvar checklist";
    }
  };
  root.appendChild(btn);
  root.appendChild(msg);
}

// ╔══════════════════════════════════════════════════════════════╗
// ║ NOVO LAUDO                                                     ║
// ╚══════════════════════════════════════════════════════════════╝
// Will 08/09: o fiscal PODE criar sempre mais de um laudo de vistoria e escolher
// qual vistoria está fazendo — então não força mais a reabertura do laudo aberto
// do mesmo card+tipo. A tela Novo laudo avisa (sem bloquear) quando já existe um
// em aberto, com link pra abrir, evitando duplicar sem querer o que o gestão mandou.
async function abrirOuCriarLaudo(preset){
  return renderNovoLaudo(preset);
}

async function renderNovoLaudo(preset){
  unsubscribeFiscalRealtime();
  root.innerHTML = "";
  root.appendChild(el(`<div style="margin-bottom:10px">
    <button class="ghost" id="_back" style="width:auto;padding:6px 12px;font-size:12px">← Voltar</button>
  </div>`));
  document.getElementById("_back").onclick = () => voltarPagina();

  const tipoInicial = (preset && preset.tipo) || "1vistoria";

  const SERVICOS_OPTS = ["piso","deck","forro","painel","porta","marcenaria","escada","bancos"];

  // Will 08/09: NADA travado aqui — o preset (agenda/card do gestão) só
  // pré-seleciona tipo e cliente; o fiscal pode trocar os dois à vontade
  // ("nunca o campo tipo devera ficar travado"). Cliente virou SELEÇÃO de um
  // projeto real do gestão (gestao.projetos via API) em vez de texto livre.
  const card = el(`<div class="card">
    <div class="h1">Novo laudo</div>
    <div style="height:10px"></div>
    <div class="label">Tipo</div>
    <select id="_tipo">${Object.entries(TIPOS).map(([k,v]) => `<option value="${k}" ${k===tipoInicial?"selected":""}>${esc(v.label)}</option>`).join("")}</select>
    <div style="height:10px"></div>
    <div class="label">Cliente <span style="color:var(--pk-text-muted);font-size:10px">(projeto do gestão)</span></div>
    <input id="_cliente_filtro" placeholder="Digite pra filtrar por nome…" style="margin-bottom:6px"/>
    <select id="_cliente_sel"><option value="">Carregando projetos do gestão…</option></select>
    <div id="_existente"></div>
    <div style="height:10px"></div>
    <div class="label">Data da vistoria</div>
    <input id="_data" type="datetime-local" value="${new Date().toISOString().slice(0,16)}"/>
    <div style="height:10px"></div>
    <div id="_servicos_wrap" style="display:none">
      <div class="label">Serviços inclusos <span style="color:var(--pk-text-muted);font-size:10px">(marque o que vai vistoriar)</span></div>
      <div id="_servicos" style="margin-top:6px;display:flex;flex-wrap:wrap;gap:6px"></div>
    </div>
    <div id="_nome_wrap" style="display:none">
      <div class="label">Nome do laudo <span id="_nome_hint" style="color:var(--pk-text-muted);font-size:10px">(ex: Reparo Parket, Reparo Cliente)</span></div>
      <input id="_nome" placeholder="Nome pra diferenciar dos outros laudos desta obra"/>
      <div style="height:10px"></div>
    </div>
    <div style="height:14px"></div>
    <button class="primary" id="_criar">Criar e preencher</button>
    <div id="_msg"></div>
  </div>`);
  root.appendChild(card);

  // ── Seletor de cliente: lista de projetos vivos do gestão ──
  let _projetos = [];  // [{id, card_id, cliente, obra_code, endereco, numero_proposta, column_id}]
  function projetoSelecionado(){
    const s = document.getElementById("_cliente_sel");
    return _projetos.find(p => p.id === (s && s.value)) || null;
  }
  // numero_proposta às vezes carrega UUID legado do backfill; só mostra número "de gente"
  function propostaLegivel(num){
    const t = String(num || "").trim();
    return (t && !t.includes("-") && t.length <= 12) ? t : "";
  }
  function preencherSelect(filtro){
    const s = document.getElementById("_cliente_sel");
    if (!s) return;
    const atual = s.value;
    const f = String(filtro || "").trim().toLowerCase();
    const vis = f ? _projetos.filter(p => (p.cliente || "").toLowerCase().includes(f)) : _projetos;
    s.innerHTML = `<option value="">Selecione o cliente…</option>` + vis.map(p =>
      `<option value="${p.id}">${esc(p.cliente || "(sem nome)")}${propostaLegivel(p.numero_proposta) ? ` · prop ${esc(propostaLegivel(p.numero_proposta))}` : ""}</option>`).join("");
    // Mantém a seleção se o projeto continua visível com o filtro atual
    if (atual && vis.some(p => p.id === atual)) s.value = atual;
  }
  (async () => {
    try {
      // Endpoint já existente do gestão: array cru de projetos vivos ordenado por cliente
      const r = await fetchGestao(`${GESTAO_API}/api/fiscal/projetos-lista`);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      _projetos = (await r.json()) || [];
      preencherSelect("");
      // Pré-seleção pelo preset (agenda/card): SÓ sugere, nunca trava.
      const pre = preset && (
        (preset.card_id && _projetos.find(p => p.card_id === preset.card_id)) ||
        (preset.cliente && _projetos.find(p => (p.cliente || "").trim().toLowerCase() === String(preset.cliente).trim().toLowerCase())));
      if (pre){
        const s = document.getElementById("_cliente_sel");
        if (s) s.value = pre.id;
      }
      aoTrocarCliente();
    } catch (e){
      const s = document.getElementById("_cliente_sel");
      if (s) s.innerHTML = `<option value="">Falha ao carregar projetos (${esc(String(e.message || e))}), verifique o sinal e recarregue</option>`;
    }
  })();
  const filtroEl = document.getElementById("_cliente_filtro");
  if (filtroEl) filtroEl.oninput = (ev) => preencherSelect(ev.target.value);

  // Toggle serviços só aparece pra 1ª/2ª vistoria
  let servSelecionados = new Set();
  // Quando o projeto tem card, restringe a lista de OPÇÕES aos serviços dele
  // (não só pré-seleciona, esconde os que não foram contratados). Sem card,
  // permanece null = mostra todos.
  let projetoServicos = null;
  // Recarrega os serviços do card sempre que o fiscal troca o cliente
  // (antes só carregava 1x do preset; agora o cliente é escolhível).
  async function carregarServicosDoCard(cardId){
    servSelecionados = new Set();
    projetoServicos = null;
    if (!cardId){ refreshServicos(); return; }
    try {
        const { data: card } = await sb.from("kanban_cards")
          .select("details")
          .eq("id", cardId)
          .single();
        const det = (card && card.details) || {};
        // 1) preferência: levantamento_itens.servicos[] — vem do orçamento real
        const sold = new Set();
        const lev = det.levantamento_itens && det.levantamento_itens.servicos;
        if (Array.isArray(lev)){
          for (const s of lev){
            const n = String((s && s.nome) || "").toLowerCase().trim();
            if (!n) continue;
            // Mapeia variações pro nosso vocabulário curto
            if (/^piso/.test(n)) sold.add("piso");
            else if (/^deck/.test(n)) sold.add("deck");
            else if (/^forro/.test(n)) sold.add("forro");
            else if (/^painel/.test(n) || /^revestimento/.test(n)) sold.add("painel");
            else if (/^porta/.test(n)) sold.add("porta");
            else if (/^marcenaria|^m[oó]vel/.test(n)) sold.add("marcenaria");
            else if (/^escada/.test(n)) sold.add("escada");
            else if (/^banco/.test(n) || /^banc/.test(n)) sold.add("bancos");
          }
        }
        // 2) fallback: produto_interesse texto livre
        if (sold.size === 0 && det.produto_interesse){
          const p = String(det.produto_interesse).toLowerCase();
          for (const k of ["piso","deck","forro","painel","porta","marcenaria","escada","banco"]){
            if (p.includes(k)) sold.add(k === "banco" ? "bancos" : k);
          }
        }
        if (sold.size > 0){
          servSelecionados = new Set(sold);  // pré-marca todos
          projetoServicos = sold;            // e tranca a lista exibida
        }
    } catch (_e) { /* silently ignore: sem details, mostra todos os serviços */ }
    refreshServicos();
  }

  // Aviso NÃO bloqueante quando já existe laudo aberto do mesmo card+tipo:
  // o fiscal PODE criar mais de um (Will 08/09), o link só evita duplicar
  // sem querer um laudo que o gestão já mandou.
  async function avisarLaudoExistente(){
    const box = document.getElementById("_existente");
    if (!box) return;
    box.innerHTML = "";
    const p = projetoSelecionado();
    const tipo = document.getElementById("_tipo").value;
    if (!p || !p.card_id) return;
    try {
      const { data: abertos } = await sb.from("fiscal_laudos")
        .select("id, relatorio_dados, data_vistoria")
        .eq("card_id", p.card_id)
        .eq("tipo", tipo)
        .in("status", ["pendente", "em_andamento"])
        .order("updated_at", { ascending: false, nullsFirst: false })
        .limit(1);
      // Guarda contra corrida: só mostra se a seleção não mudou no meio do fetch
      const ainda = projetoSelecionado();
      if (!ainda || ainda.card_id !== p.card_id || document.getElementById("_tipo").value !== tipo) return;
      if (abertos && abertos.length){
        const l = abertos[0];
        const nomeL = l.relatorio_dados && l.relatorio_dados.nome_laudo;
        box.innerHTML = `<div class="small" style="margin-top:6px">Já existe um laudo deste tipo em aberto nesta obra${nomeL ? ` (${esc(nomeL)})` : ""}${l.data_vistoria ? ` de ${fmtDate(l.data_vistoria)}` : ""}. <a href="#" id="_abrir_existente" style="color:var(--pk-accent)">Abrir esse laudo</a> ou siga e crie um novo.</div>`;
        document.getElementById("_abrir_existente").onclick = (ev) => { ev.preventDefault(); renderEditarLaudo(l.id); };
      }
    } catch (_e) { /* aviso é cortesia; falha não atrapalha a criação */ }
  }

  async function aoTrocarCliente(){
    const p = projetoSelecionado();
    avisarLaudoExistente();
    await carregarServicosDoCard(p && p.card_id);
  }
  {
    const s = document.getElementById("_cliente_sel");
    if (s) s.onchange = aoTrocarCliente;
  }
  function refreshServicos(){
    const t = document.getElementById("_tipo").value;
    const wrap = document.getElementById("_servicos_wrap");
    const box = document.getElementById("_servicos");
    if (t === "1vistoria" || t === "2vistoria"){
      wrap.style.display = "block";
      box.innerHTML = "";
      let opts = t === "2vistoria" ? SERVICOS_OPTS : SERVICOS_OPTS.filter(s => s !== "bancos");
      // Especialidade do fiscal: só oferece os serviços que ele atende
      const meus = meusServicos();
      if (meus) opts = opts.filter(s => meus.has(s));
      // Se veio de um card e o projeto lista serviços, mostra SÓ esses.
      // Sem card (laudo avulso) ou projeto sem levantamento → mostra tudo.
      if (projetoServicos && projetoServicos.size > 0){
        opts = opts.filter(s => projetoServicos.has(s));
      }
      for (const s of opts){
        const b = document.createElement("button");
        const on = servSelecionados.has(s);
        b.textContent = s.toUpperCase();
        b.style.cssText = `flex:0 0 auto;padding:7px 12px;border-radius:0;font-size:11px;font-weight:700;cursor:pointer;border:1px solid ${on?"var(--pk-accent)":"var(--pk-border2)"};background:${on?"rgba(150,132,115,0.22)":"transparent"};color:${on?"var(--pk-accent)":"var(--pk-text-dim)"};width:auto`;
        b.onclick = (ev) => {
          ev.preventDefault();
          if (servSelecionados.has(s)) servSelecionados.delete(s);
          else servSelecionados.add(s);
          refreshServicos();
        };
        box.appendChild(b);
      }
    } else {
      wrap.style.display = "none";
    }
    // Nome do laudo em TODOS os tipos: qualquer tipo pode ter N laudos por obra
    // agora (Will 08/09), e o nome é o que distingue um do outro nas listagens.
    // Obrigatório só em reparo; nos demais é opcional (a data já ajuda).
    const nomeWrap = document.getElementById("_nome_wrap");
    if (nomeWrap) nomeWrap.style.display = "block";
    const nomeHint = document.getElementById("_nome_hint");
    if (nomeHint) nomeHint.textContent = (t === "reparo")
      ? "(ex: Reparo Parket, Reparo Cliente)"
      : "(opcional, ex: Semana 1, Visita 12/09)";
  }
  refreshServicos();
  document.getElementById("_tipo").onchange = () => { refreshServicos(); avisarLaudoExistente(); };

  document.getElementById("_criar").onclick = async () => {
    const tipo = document.getElementById("_tipo").value;
    // Cliente = projeto do gestão selecionado (Will 08/09): nome e card_id vêm
    // direto do projeto, sem texto livre nem match frágil por título.
    const proj = projetoSelecionado();
    const cliente = proj ? String(proj.cliente || "").trim() : "";
    // Campo "Obra (código)" removido (20/08): laudo já é vinculado ao card do gestão.
    // obra da coluna segue preenchida pra listagens antigas: código do preset
    // (se o fiscal manteve o mesmo projeto) ou nome do cliente.
    const obra = (preset && preset.obra && proj && preset.card_id === proj.card_id) ? preset.obra : cliente;
    const data = document.getElementById("_data").value;
    const msgEl = document.getElementById("_msg");
    if (!proj || !cliente){
      msgEl.innerHTML = `<div class="err">Selecione o cliente (projeto do gestão).</div>`;
      return;
    }
    const fId = fiscalAtualId();
    const fNome = fiscalAtualNome();
    if (!fId){
      msgEl.innerHTML = `<div class="err">Selecione um fiscal pra operar como (no topo da Home).</div>`;
      return;
    }
    // Pra 1ª/2ª vistoria: exige pelo menos 1 serviço selecionado
    if ((tipo === "1vistoria" || tipo === "2vistoria") && servSelecionados.size === 0){
      msgEl.innerHTML = `<div class="err">Selecione pelo menos 1 serviço inclusio.</div>`;
      return;
    }
    // Nome do laudo vale pra TODOS os tipos (distingue N laudos da mesma obra).
    // Obrigatório só em reparo; nos demais é opcional (a data já diferencia).
    const nomeLaudo = (document.getElementById("_nome")?.value || "").trim();
    if (tipo === "reparo" && !nomeLaudo){
      msgEl.innerHTML = `<div class="err">Dê um nome ao laudo (ex: Reparo Parket, Reparo Cliente).</div>`;
      return;
    }
    msgEl.innerHTML = `<div class="small"><span class="spinner"></span> Criando…</div>`;
    // card_id vem direto do projeto do gestão selecionado — acabou o match por
    // ilike no título (deixava laudo órfão quando o nome não batia exato).
    // Projeto sem card no Cloud = NULL, laudo segue válido nas listagens locais.
    const cardIdResolvido = proj.card_id || null;
    const { data: ins, error } = await sb.from("fiscal_laudos").insert({
      card_id: cardIdResolvido,
      obra, cliente,
      tipo, status: "em_andamento",
      fiscal_id: fId, fiscal_nome: fNome,
      data_vistoria: data ? new Date(data).toISOString() : new Date().toISOString(),
      servicos_inclusos: (tipo === "1vistoria" || tipo === "2vistoria") ? Array.from(servSelecionados) : null,
      relatorio_dados: nomeLaudo ? { nome_laudo: nomeLaudo } : {},
    }).select().single();
    if (error){
      msgEl.innerHTML = `<div class="err">${esc(error.message)}</div>`;
      return;
    }
    renderEditarLaudo(ins.id);
  };
}

// ╔══════════════════════════════════════════════════════════════╗
// ║ EDITAR LAUDO                                                   ║
// ╚══════════════════════════════════════════════════════════════╝
async function renderEditarLaudo(laudoId){
  unsubscribeFiscalRealtime();
  root.innerHTML = `<div class="card center"><span class="spinner"></span></div>`;
  const { data: laudo, error } = await sb.from("fiscal_laudos").select("*").eq("id", laudoId).single();
  if (error || !laudo){
    root.innerHTML = `<div class="card"><div class="err">Laudo não encontrado: ${esc(error?.message||"")}</div></div>`;
    return;
  }

  root.innerHTML = "";
  root.appendChild(el(`<div style="margin-bottom:10px">
    <button class="ghost" id="_back" style="width:auto;padding:6px 12px;font-size:12px">← Voltar</button>
  </div>`));
  document.getElementById("_back").onclick = () => voltarPagina();

  // Header laudo
  const tipoDef = TIPOS[laudo.tipo];
  const laudoHeader = el(`<div class="card" style="background:linear-gradient(135deg,rgba(150,132,115,0.12),rgba(150,132,115,0.04));border-color:rgba(150,132,115,0.3)">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
      <div style="flex:1;min-width:0">
        <div class="label" style="color:var(--pk-accent)">${esc((tipoDef && tipoDef.label) || laudo.tipo)}${(laudo.relatorio_dados && laudo.relatorio_dados.nome_laudo) ? ` · ${esc(laudo.relatorio_dados.nome_laudo)}` : ""}</div>
        <div style="font-size:17px;font-weight:700;margin:4px 0 2px">${esc(laudo.obra || "-")}</div>
        <div class="small">${esc(laudo.cliente || "-")} · ${laudo.data_vistoria ? fmtDate(laudo.data_vistoria) : ""}</div>
      </div>
      ${laudo.card_id ? `<button data-alerta title="Ocorrência: abrir crise nesta obra"
        style="flex-shrink:0!important;width:auto!important;background:#B85B4C!important;color:#fff!important;
               border:none!important;border-radius:3px!important;
               padding:3px 8px!important;font-size:8px!important;font-weight:600!important;
               letter-spacing:0.14em!important;text-transform:uppercase!important;
               font-family:'Inter',sans-serif!important;line-height:1.4!important;
               cursor:pointer!important;white-space:nowrap!important;align-self:flex-start!important">OCORRÊNCIA</button>` : ""}
    </div>
  </div>`);
  const btnAlertaLaudo = laudoHeader.querySelector("[data-alerta]");
  if (btnAlertaLaudo){
    btnAlertaLaudo.onclick = () =>
      abrirAlertaCriseObra({ id: laudo.card_id, title: laudo.cliente || laudo.obra, obra: laudo.obra });
  }
  root.appendChild(laudoHeader);

  // ── Estado local dos checklists (carregado do laudo) ──
  const ck = {};  // ck[serviço][pergunta] = { valor, obs }
  const textFields = {};  // textFields[campo] = valor
  for (const k of ["piso","deck","forro","painel","porta","escada","bancos","liberacao","equipe","produtividade"]){
    const col = `checklist_${k}`;
    const v = laudo[col];
    if (v && typeof v === "object" && !Array.isArray(v)) ck[k] = v;
  }
  // Campos texto
  for (const k of ["tipo_laje","reforco_necessario","insumos_necessarios","materiais_falta","insumos_falta","metragem_areas","ocorrencias","descritivo_sistema","descritivo_material","descritivo_reparo","sistema_instalacao","obs_solucao","observacoes"]){
    if (laudo[k]) textFields[k] = laudo[k];
  }
  // Checklist extra (entrega.qualidade, reparo.tipo, reparo.materiais, etc)
  const extra = (laudo.checklist_extra && typeof laudo.checklist_extra === "object" && !Array.isArray(laudo.checklist_extra)) ? laudo.checklist_extra : {};

  // ── O que foi vendido (aba Lista | Por ambiente) — vistorias + acompanhamento.
  // Nas vistorias cada item pede a conferência de medidas do fiscal (Medidas OK /
  // Não confere; estado persiste em checklist_extra.vendido no salvar).
  // No acompanhamento a seção entra SEM a conferência (vendido=null desliga os
  // botões de medida): fica só o registro de progresso por item (qtd + fotos +
  // finalizar), o mesmo fluxo do instalador — alimenta meta.obra.qtd_instalada
  // e o pct da obra via o endpoint /progresso do gestão (Will 08/09).
  if ((laudo.tipo === "1vistoria" || laudo.tipo === "2vistoria") && laudo.card_id){
    if (!extra.vendido || typeof extra.vendido !== "object" || Array.isArray(extra.vendido)) extra.vendido = {};
    root.appendChild(renderVendidoSecao(laudo.card_id, extra.vendido));
  } else if (laudo.tipo === "acompanhamento" && laudo.card_id){
    root.appendChild(renderVendidoSecao(laudo.card_id, null, "Progresso dos itens"));
  }

  // Função pra renderizar checklist + fotos de UM serviço.
  // `key` é o servicoKey (piso/deck/forro/painel/porta/escada/bancos/liberacao/equipe/produtividade)
  function renderCkSecao(titulo, key, perguntas){
    if (!ck[key] || Array.isArray(ck[key])) ck[key] = {};
    const sec = el(`<div class="card"><div class="h2">${esc(titulo)}</div></div>`);
    for (const q of perguntas){
      const state = ck[key][q] || { valor: null, obs: "" };
      ck[key][q] = state;
      const row = document.createElement("div");
      row.className = "ck-row";
      // Pergunta aberta: sem Sim/Não/N-A, a resposta vai na própria textarea (state.obs).
      // Pergunta fechada: botões + obs com placeholder contextual quando houver.
      const aberta = CK_ABERTAS.has(q);
      const ph = aberta ? "Resposta" : (CK_OBS_PLACEHOLDER[q] || "Observação (opcional)");
      row.innerHTML = `
        <div class="ck-q">${esc(q)}</div>
        ${aberta ? "" : `<div class="ck-btns">
          <button class="ck-btn sim ${state.valor==="sim"?"on":""}" data-v="sim">Sim</button>
          <button class="ck-btn nao ${state.valor==="nao"?"on":""}" data-v="nao">Não</button>
          <button class="ck-btn na  ${state.valor==="na" ?"on":""}" data-v="na">N/A</button>
        </div>`}
        <textarea class="ck-obs" rows="3" placeholder="${esc(ph)}">${esc(state.obs||"")}</textarea>
      `;
      row.querySelectorAll(".ck-btn").forEach(btn => {
        btn.onclick = (ev) => {
          ev.preventDefault();
          state.valor = btn.dataset.v;
          row.querySelectorAll(".ck-btn").forEach(b => b.classList.toggle("on", b === btn));
        };
      });
      const obsEl = row.querySelector(".ck-obs");
      obsEl.oninput = (ev) => { state.obs = ev.target.value; autoGrowObs(ev.target); };
      _ditadoAnexar(obsEl); // ditado por voz, igual aos demais campos de texto do laudo
      requestAnimationFrame(() => autoGrowObs(obsEl));
      sec.appendChild(row);
    }

    // ── Fotos/Vídeos vinculadas a este serviço ──
    const fotosArea = document.createElement("div");
    fotosArea.style.cssText = "margin-top:14px;padding-top:14px;border-top:1px solid var(--pk-border1)";
    fotosArea.innerHTML = `
      <div class="label">Mídias de ${esc(titulo)} <span style="color:var(--pk-text-muted);font-size:10px">(fotos ou vídeos)</span></div>
      <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap">
        <label style="flex:1;min-width:120px;background:rgba(150,132,115,0.10);border:1px dashed rgba(150,132,115,0.35);color:var(--pk-accent);border-radius:0;padding:10px;font-size:12px;font-weight:600;text-align:center;cursor:pointer">
          Tirar foto
          <input type="file" accept="image/*" capture="environment" data-servico="${esc(key)}" class="_foto_servico" style="display:none"/>
        </label>
        <label style="flex:1;min-width:120px;background:rgba(150,132,115,0.10);border:1px dashed rgba(150,132,115,0.35);color:var(--pk-accent);border-radius:0;padding:10px;font-size:12px;font-weight:600;text-align:center;cursor:pointer">
          Da galeria
          <input type="file" accept="image/*" multiple data-servico="${esc(key)}" class="_foto_servico" style="display:none"/>
        </label>
        <label style="flex:1;min-width:140px;background:rgba(150,132,115,0.10);border:1px dashed rgba(150,132,115,0.35);color:var(--pk-accent);border-radius:0;padding:10px;font-size:12px;font-weight:600;text-align:center;cursor:pointer">
          Vídeo
          <input type="file" accept="video/*" data-servico="${esc(key)}" class="_video_servico" style="display:none"/>
        </label>
      </div>
      <div class="_fotos_box" data-servico="${esc(key)}" style="display:flex;flex-direction:column;gap:6px;margin-top:8px"></div>
    `;
    sec.appendChild(fotosArea);
    return sec;
  }

  // Helper: injeta área de fotos+vídeos no fim de uma seção (pra tipos sem renderCkSecao)
  function appendFotosArea(sec, servicoKey, tituloFotos){
    const fotosArea = document.createElement("div");
    fotosArea.style.cssText = "margin-top:14px;padding-top:14px;border-top:1px solid var(--pk-border1)";
    fotosArea.innerHTML = `
      <div class="label">${esc(tituloFotos)} <span style="color:var(--pk-text-muted);font-size:10px">(fotos ou vídeos)</span></div>
      <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap">
        <label style="flex:1;min-width:120px;background:rgba(150,132,115,0.10);border:1px dashed rgba(150,132,115,0.35);color:var(--pk-accent);border-radius:0;padding:10px;font-size:12px;font-weight:600;text-align:center;cursor:pointer">
          Tirar foto
          <input type="file" accept="image/*" capture="environment" data-servico="${esc(servicoKey)}" class="_foto_servico" style="display:none"/>
        </label>
        <label style="flex:1;min-width:120px;background:rgba(150,132,115,0.10);border:1px dashed rgba(150,132,115,0.35);color:var(--pk-accent);border-radius:0;padding:10px;font-size:12px;font-weight:600;text-align:center;cursor:pointer">
          Da galeria
          <input type="file" accept="image/*" multiple data-servico="${esc(servicoKey)}" class="_foto_servico" style="display:none"/>
        </label>
        <label style="flex:1;min-width:140px;background:rgba(150,132,115,0.10);border:1px dashed rgba(150,132,115,0.35);color:var(--pk-accent);border-radius:0;padding:10px;font-size:12px;font-weight:600;text-align:center;cursor:pointer">
          Vídeo
          <input type="file" accept="video/*" data-servico="${esc(servicoKey)}" class="_video_servico" style="display:none"/>
        </label>
      </div>
      <div class="_fotos_box" data-servico="${esc(servicoKey)}" style="display:flex;flex-direction:column;gap:6px;margin-top:8px"></div>
    `;
    sec.appendChild(fotosArea);
  }

  // Função pra renderizar campo texto livre
  function renderTextField(key, label, multiline = true){
    const v = textFields[key] || "";
    const wrap = el(`<div class="card">
      <div class="label">${esc(label)}</div>
      ${multiline ? `<textarea rows="3" style="margin-top:6px"></textarea>` : `<input style="margin-top:6px"/>`}
    </div>`);
    const inp = wrap.querySelector("textarea, input");
    inp.value = v;
    inp.oninput = (ev) => { textFields[key] = ev.target.value; };
    _ditadoAnexar(inp);
    return wrap;
  }

  // Filtro: só mostra serviços que foram selecionados em "novo laudo".
  // Se servicos_inclusos vazio → mostra TODOS (compat com laudos antigos).
  const servSel = Array.isArray(laudo.servicos_inclusos) && laudo.servicos_inclusos.length > 0
    ? new Set(laudo.servicos_inclusos.map(s => String(s).toLowerCase().trim()))
    : null;
  // Especialidade: fiscal só faz a checagem dos serviços dele (a lista de itens
  // continua visível pra todos — só o checklist é restrito).
  const meusServ = meusServicos();
  const showServ = (key) => (!servSel || servSel.has(key)) && (!meusServ || meusServ.has(key));

  // ── Render por tipo ──
  if (laudo.tipo === "1vistoria"){
    if (servSel){
      root.appendChild(el(`<div class="card" style="background:rgba(150,132,115,0.06);border-color:rgba(150,132,115,0.25)">
        <div class="label" style="color:var(--pk-accent)">Serviços inclusos</div>
        <div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:6px">
          ${[...servSel].map(s => `<span class="tag" style="background:rgba(150,132,115,0.18);color:var(--pk-accent);text-transform:capitalize">${esc(s)}</span>`).join("")}
        </div>
      </div>`));
    }
    // As verificações Sim/Não/N-A moram no Checklist de Início de Obras (doc
    // separado que chega junto com a 1ª vistoria). Aqui fica só a conferência
    // de medidas (seção "O que foi vendido" acima) + fotos por serviço.
    if (laudo.card_id){
      const ckDoc = el(`<div class="card" style="cursor:pointer">
        <div class="row" style="justify-content:space-between;gap:8px;align-items:center">
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600">Checklist de Início de Obras</div>
            <div class="small">As verificações da obra ficam nesse documento. Toque pra abrir.</div>
          </div>
          <span class="tag" style="background:rgba(150,132,115,0.18);color:var(--pk-accent);flex-shrink:0;font-weight:700">abrir →</span>
        </div>
      </div>`);
      ckDoc.onclick = () => renderChecklistInicioObra(laudo.card_id, { title: laudo.obra, obra: laudo.obra });
      root.appendChild(ckDoc);
    }
    for (const s of ["piso","deck","forro","painel","porta","marcenaria","escada"]){
      if (showServ(s)) root.appendChild(renderCkSecao(CK_OBRA_LABEL[s] || s, s, []));
    }
  } else if (laudo.tipo === "2vistoria"){
    const def = CK["2vistoria"];
    if (servSel){
      root.appendChild(el(`<div class="card" style="background:rgba(150,132,115,0.06);border-color:rgba(150,132,115,0.25)">
        <div class="label" style="color:var(--pk-accent)">Serviços inclusos</div>
        <div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:6px">
          ${[...servSel].map(s => `<span class="tag" style="background:rgba(150,132,115,0.18);color:var(--pk-accent);text-transform:capitalize">${esc(s)}</span>`).join("")}
        </div>
      </div>`));
    }
    // Liberação sempre aparece (não é serviço, é checklist geral da 2ª vistoria)
    root.appendChild(renderCkSecao("Liberação", "liberacao", def.liberacao));
    if (showServ("piso"))    root.appendChild(renderCkSecao("Piso",   "piso",   def.piso));
    if (showServ("deck"))    root.appendChild(renderCkSecao("Deck",   "deck",   def.deck));
    if (showServ("forro")) root.appendChild(renderCkSecao("Forro", "forro", def.forro));
    if (showServ("painel"))  root.appendChild(renderCkSecao("Painel", "painel", def.painel));
    if (showServ("porta"))   root.appendChild(renderCkSecao("Porta",  "porta",  def.porta));
    if (showServ("escada"))  root.appendChild(renderCkSecao("Escada", "escada", def.escada));
    if (showServ("bancos"))  root.appendChild(renderCkSecao("Bancos", "bancos", def.bancos));
  } else if (laudo.tipo === "acompanhamento"){
    const def = CK.acompanhamento;
    root.appendChild(renderCkSecao("Equipe", "equipe", def.equipe));
    root.appendChild(renderCkSecao("Produtividade", "produtividade", def.produtividade));
    for (const f of ACOMP_TEXT) root.appendChild(renderTextField(f.key, f.label));
  } else if (laudo.tipo === "entrega"){
    if (!extra.qualidade) extra.qualidade = {};
    const sec = el(`<div class="card"><div class="h2">Qualidade da entrega</div></div>`);
    for (const q of CK.entrega.qualidade){
      const state = extra.qualidade[q] || { valor: null, obs: "" };
      extra.qualidade[q] = state;
      const row = document.createElement("div");
      row.className = "ck-row";
      row.innerHTML = `<div class="ck-q">${esc(q)}</div>
        <div class="ck-btns">
          <button class="ck-btn sim ${state.valor==="sim"?"on":""}" data-v="sim">Sim</button>
          <button class="ck-btn nao ${state.valor==="nao"?"on":""}" data-v="nao">Não</button>
          <button class="ck-btn na  ${state.valor==="na" ?"on":""}" data-v="na">N/A</button>
        </div>
        <textarea class="ck-obs" rows="3" placeholder="Observação (opcional)">${esc(state.obs||"")}</textarea>`;
      row.querySelectorAll(".ck-btn").forEach(btn => {
        btn.onclick = (ev) => { ev.preventDefault(); state.valor = btn.dataset.v; row.querySelectorAll(".ck-btn").forEach(b => b.classList.toggle("on", b === btn)); };
      });
      const obsEl = row.querySelector(".ck-obs");
      obsEl.oninput = (ev) => { state.obs = ev.target.value; autoGrowObs(ev.target); };
      _ditadoAnexar(obsEl); // ditado por voz, igual aos demais campos de texto do laudo
      requestAnimationFrame(() => autoGrowObs(obsEl));
      sec.appendChild(row);
    }
    appendFotosArea(sec, "entrega", "Fotos da Entrega");
    root.appendChild(sec);
    for (const f of ENTREGA_TEXT) root.appendChild(renderTextField(f.key, f.label));
  } else if (laudo.tipo === "reparo"){
    if (!extra.tipo) extra.tipo = {};
    if (!extra.materiais) extra.materiais = {};
    const renderSec = (titulo, obj, list) => {
      const sec = el(`<div class="card"><div class="h2">${esc(titulo)}</div></div>`);
      for (const q of list){
        const state = obj[q] || { valor: null, obs: "" };
        obj[q] = state;
        const row = document.createElement("div");
        row.className = "ck-row";
        row.innerHTML = `<div class="ck-q">${esc(q)}</div>
          <div class="ck-btns">
            <button class="ck-btn sim ${state.valor==="sim"?"on":""}" data-v="sim">Sim</button>
            <button class="ck-btn nao ${state.valor==="nao"?"on":""}" data-v="nao">Não</button>
          </div>
          <textarea class="ck-obs" rows="3" placeholder="Observação (opcional)">${esc(state.obs||"")}</textarea>`;
        row.querySelectorAll(".ck-btn").forEach(btn => {
          btn.onclick = (ev) => { ev.preventDefault(); state.valor = btn.dataset.v; row.querySelectorAll(".ck-btn").forEach(b => b.classList.toggle("on", b === btn)); };
        });
        const obsEl = row.querySelector(".ck-obs");
        obsEl.oninput = (ev) => { state.obs = ev.target.value; autoGrowObs(ev.target); };
        _ditadoAnexar(obsEl); // ditado por voz, igual aos demais campos de texto do laudo
        requestAnimationFrame(() => autoGrowObs(obsEl));
        sec.appendChild(row);
      }
      return sec;
    };
    const secTipo = renderSec("Tipo de reparo", extra.tipo, CK.reparo.tipo);
    appendFotosArea(secTipo, "reparo", "Fotos do Reparo");
    root.appendChild(secTipo);
    root.appendChild(renderSec("Materiais em obra", extra.materiais, CK.reparo.materiais));
    for (const f of REPARO_TEXT) root.appendChild(renderTextField(f.key, f.label));
  }

  // ── FOTOS por serviço ──
  // Cada `renderCkSecao` cria seu próprio `<input class="_foto_servico" data-servico="<key>">`
  // + `<div class="_fotos_box" data-servico="<key>">` pra mostrar as fotos.
  // Aqui setamos os handlers que ligam tudo a um state compartilhado.
  let novasFotos = [];  // {file, servico, descricao}
  let fotosExistentes = [];
  const { data: fx } = await sb.from("fiscal_fotos").select("*").eq("laudo_id", laudoId).order("created_at");
  fotosExistentes = fx || [];

  function renderFotosDoServico(servicoKey){
    const box = root.querySelector(`._fotos_box[data-servico="${CSS.escape(servicoKey)}"]`);
    if (!box) return;
    box.innerHTML = "";
    // Existentes
    const existsDoServ = fotosExistentes.filter(f => (f.servico || "outros") === servicoKey);
    for (const f of existsDoServ){
      const isVideo = f.tipo === "video";
      const row = document.createElement("div");
      row.style.cssText = "display:flex;gap:8px;padding:6px;background:var(--pk-card1);border-radius:0";
      const anotN = (f.anotacoes && Array.isArray(f.anotacoes.strokes)) ? f.anotacoes.strokes.length : 0;
      const badge = anotN > 0
        ? `<span style="position:absolute;bottom:2px;left:2px;background:#8A7350;color:#fff;font-size:9px;font-weight:700;padding:1px 4px;border-radius:2px;line-height:1">${anotN} anot.</span>`
        : "";
      // Foto: a miniatura inteira abre o editor. Como as fotos agora sobem em massa
      // sem passar por tela nenhuma, esta lista é onde o fiscal escreve o comentário e
      // desenha, então a chamada pra editar precisa ser visível (faixa "EDITAR" na
      // miniatura + o texto do lado também clicável).
      const thumb = isVideo
        ? `<video src="${esc(f.url)}" style="width:56px;height:56px;border-radius:0;object-fit:cover;flex-shrink:0;background:#000" muted playsinline preload="metadata"></video>`
        : `<div style="position:relative;width:56px;height:56px;flex-shrink:0;cursor:pointer" title="Toque para editar: comentário e desenho" data-annot-id="${esc(f.id)}" data-annot-url="${esc(f.url)}"><img src="${esc(f.url)}" style="width:56px;height:56px;border-radius:0;object-fit:cover;pointer-events:none"/>${badge}<span style="position:absolute;top:0;right:0;background:rgba(0,0,0,.7);color:#fff;font-size:8px;font-weight:700;letter-spacing:.04em;padding:1px 3px;line-height:1;pointer-events:none">EDITAR</span></div>`;
      row.innerHTML = `${thumb}
        <div ${isVideo ? "" : 'data-annot-txt="1"'} style="flex:1;min-width:0;font-size:11px;color:var(--pk-text-dim)${isVideo ? "" : ";cursor:pointer"}">
          <div>${isVideo ? "[VÍDEO] " : ""}${esc(f.descricao || "(toque para comentar)")}</div>
          <div style="color:var(--pk-text-muted);font-size:10px;margin-top:2px">${fmtDate(f.created_at)}</div>
        </div>
        <button data-del-id="${esc(f.id)}" title="Remover ${isVideo ? 'vídeo' : 'foto'}" style="background:transparent;border:1px solid var(--pk-border2);color:var(--pk-status-err);width:24px;height:24px;padding:0;font-size:14px;border-radius:0;cursor:pointer;flex-shrink:0;align-self:flex-start">×</button>`;
      if (!isVideo){
        // Editor devolve (anotações, comentário): grava os dois no cache local antes
        // de redesenhar, senão a lista voltaria a mostrar o texto antigo.
        const abrirEditor = () => {
          window.pfOpenAnnotator(f.id, f.url, f.anotacoes || null, (novoAnot, novaDesc) => {
            const idx = fotosExistentes.findIndex(x => x.id === f.id);
            if (idx >= 0){
              fotosExistentes[idx].anotacoes = novoAnot;
              fotosExistentes[idx].descricao = novaDesc;
            }
            renderFotosDoServico(servicoKey);
          }, f.descricao || "");
        };
        row.querySelector('[data-annot-id]').addEventListener('click', abrirEditor);
        const txtEl = row.querySelector('[data-annot-txt]');
        if (txtEl) txtEl.addEventListener('click', abrirEditor);
      }
      row.querySelector('[data-del-id]').addEventListener('click', async (ev) => {
        ev.preventDefault();
        if (!confirm(`Remover ${isVideo ? 'este vídeo' : 'esta foto'}?`)) return;
        const btn = ev.currentTarget;
        btn.disabled = true; btn.textContent = "…";
        try {
          if (f.storage_path) {
            await sb.storage.from("fiscal-midias").remove([f.storage_path]).catch(() => {});
          }
          const { error } = await sb.from("fiscal_fotos").delete().eq("id", f.id);
          if (error) throw error;
          fotosExistentes = fotosExistentes.filter(x => x.id !== f.id);
          renderFotosDoServico(servicoKey);
        } catch (e) {
          alert("Erro ao remover: " + (e.message || e));
          btn.disabled = false; btn.textContent = "×";
        }
      });
      box.appendChild(row);
    }
    // Novas (foto ou vídeo)
    novasFotos.forEach((nf, idx) => {
      if (nf.servico !== servicoKey) return;
      const isVideo = nf.tipo === "video";
      const row = document.createElement("div");
      row.style.cssText = "display:flex;gap:8px;padding:6px;background:rgba(150,132,115,0.06);border:1px solid rgba(150,132,115,0.25);border-radius:0";
      let thumb;
      if (isVideo){
        thumb = document.createElement("video");
        thumb.muted = true; thumb.playsInline = true; thumb.preload = "metadata";
        thumb.style.cssText = "width:56px;height:56px;border-radius:0;object-fit:cover;flex-shrink:0;background:#000";
      } else {
        thumb = document.createElement("img");
        thumb.style.cssText = "width:56px;height:56px;border-radius:0;object-fit:cover;flex-shrink:0";
      }
      // objectURL criado 1x por arquivo e guardado no próprio nf: cada re-render
      // criava um novo sem revogar o anterior e a memória do celular só crescia.
      if (!nf._objUrl) nf._objUrl = URL.createObjectURL(nf.file);
      thumb.src = nf._objUrl;
      const right = document.createElement("div");
      right.style.cssText = "flex:1;min-width:0;display:flex;flex-direction:column;gap:4px";
      const tipoLbl = document.createElement("div");
      tipoLbl.style.cssText = "font-size:10px;color:var(--pk-accent);font-weight:700;text-transform:uppercase";
      tipoLbl.textContent = isVideo ? "Vídeo" : "Foto";
      const desc = document.createElement("input");
      desc.placeholder = "Comentário (opcional)";
      desc.value = nf.descricao || "";
      desc.style.cssText = "padding:5px 7px;font-size:11px;background:var(--pk-card2);border:1px solid var(--pk-border1);color:var(--pk-text);border-radius:0";
      desc.oninput = (e) => { novasFotos[idx].descricao = e.target.value; };
      const del = document.createElement("button");
      del.textContent = "×";
      del.style.cssText = "background:transparent;border:1px solid var(--pk-border2);color:var(--pk-status-err);width:24px;height:24px;padding:0;font-size:14px;border-radius:0;cursor:pointer";
      del.onclick = (e) => {
        e.preventDefault();
        if (nf._objUrl){ try { URL.revokeObjectURL(nf._objUrl); } catch(_){} }
        novasFotos.splice(idx,1); renderFotosDoServico(servicoKey);
      };
      right.appendChild(tipoLbl); right.appendChild(desc);
      const wr = document.createElement("div");
      wr.style.cssText = "display:flex;gap:6px;align-items:flex-start;width:100%";
      wr.appendChild(thumb); wr.appendChild(right); wr.appendChild(del);
      box.appendChild(wr);
    });
  }
