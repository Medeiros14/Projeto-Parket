<!doctype html>
<html lang="pt-BR">
  <head>
    <script>
      // Aplica tema salvo ANTES de qualquer render pra evitar flash escuro em quem
      // salvou preferência clara (e vice-versa). Sincronizado com Layout.tsx.
      (function(){
        try {
          var t = localStorage.getItem("parket-nfe-theme");
          document.documentElement.classList.add(t === "light" ? "light" : "dark");
          if (t === "light") {
            // Ajusta bg do skeleton pra não piscar preto sobre fundo bege
            document.documentElement.style.background = "#D8D3C7";
          }
        } catch { document.documentElement.classList.add("dark"); }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <title>Parket · Fiscal NF-e</title>
    <meta name="description" content="Plataforma fiscal Parket — upload e gestão de notas fiscais eletrônicas" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      html, body, input, button, textarea, select {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
                     Roboto, Helvetica, Arial, sans-serif;
        font-feature-settings: "cv11", "ss01", "ss03";
      }
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      * { scrollbar-width: thin; scrollbar-color: rgba(127,127,127,0.35) transparent; }
      *::-webkit-scrollbar { width: 8px; height: 8px; }
      *::-webkit-scrollbar-track { background: transparent; }
      *::-webkit-scrollbar-thumb {
        background: rgba(127,127,127,0.35);
        border-radius: 8px;
        border: 2px solid transparent;
        background-clip: padding-box;
      }
      *::-webkit-scrollbar-thumb:hover { background: rgba(127,127,127,0.55); background-clip: padding-box; }
    </style>
  </head>
  <body>
    <style>
      /* Skeleton usa cores do tema (dark ou light) via CSS vars do Sistema OP Parket.
         Fallback pro dark caso a stylesheet ainda esteja carregando. */
      .boot-skel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgb(var(--hb-bg, 5 5 5));color:rgb(var(--hb-textDim, 119 115 106));flex-direction:column;gap:14px;z-index:9999;font-family:Inter,system-ui,sans-serif}
      .boot-skel .ring{width:34px;height:34px;border-radius:50%;border:2px solid rgba(150,132,115,0.15);border-top-color:rgb(var(--hb-accent, 150 132 115));animation:bootspin .9s linear infinite}
      @keyframes bootspin{to{transform:rotate(360deg)}}
      .boot-skel .lbl{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.20em;text-transform:uppercase;color:rgb(var(--hb-text, 216 211 199))}
    </style>
    <div id="root"></div>
    <div id="boot-skeleton" class="boot-skel">
      <div class="ring"></div>
      <div class="lbl">Parket · Fiscal NF-e</div>
    </div>
    <script>
      // Remove o skeleton assim que React renderizar
      (function(){
        var obs = new MutationObserver(function(){
          var root = document.getElementById('root');
          if (root && root.children.length > 0) {
            var s = document.getElementById('boot-skeleton');
            if (s) { s.remove(); obs.disconnect(); }
          }
        });
        var root = document.getElementById('root');
        if (root) obs.observe(root, { childList: true });
        setTimeout(function(){
          var s = document.getElementById('boot-skeleton');
          if (s) s.remove();
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script src="https://server.parket.works/app.js" data-parket-chat data-api="https://server.parket.works" defer></script>
  </body>
</html>
