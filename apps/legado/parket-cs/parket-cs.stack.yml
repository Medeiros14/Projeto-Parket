version: "3.8"

services:
  web:
    image: parket-cs:latest
    networks:
      - network_public
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public

        # HTTPS
        - traefik.http.routers.parket-cs.rule=Host(`cs.parket.works`)
        - traefik.http.routers.parket-cs.entrypoints=websecure
        - traefik.http.routers.parket-cs.tls=true
        - traefik.http.routers.parket-cs.tls.certresolver=letsencryptresolver

        # HTTP → HTTPS
        - traefik.http.routers.parket-cs-http.rule=Host(`cs.parket.works`)
        - traefik.http.routers.parket-cs-http.entrypoints=web
        - traefik.http.routers.parket-cs-http.middlewares=https-redirect

        - traefik.http.services.parket-cs.loadbalancer.server.port=80

networks:
  network_public:
    external: true
