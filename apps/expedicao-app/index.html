<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Expedição — Parket</title>
    <meta name="description" content="Setor de Expedição Parket" />
    <link rel="icon" href="/icon/icon-192.png" />
    <!-- PWA Configuration -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#050505" />
    <style>
      html, body { height: 100%; margin: 0; background: #050505; color: #d8d3c7; }
      html.light, html.light body { background: #d8d3c7; color: #141210; }
      #root { height: 100%; }
    </style>
    <script>
      (function () {
        var light = localStorage.getItem("theme") === "light";
        document.documentElement.classList.add(light ? "light" : "dark");
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Expedição Parket" />
    <link rel="apple-touch-icon" href="/icon/icon-192.png" />

    <meta property="og:title" content="Expedição Parket" />
    <meta property="og:description" content="Setor de Expedição Parket" />
    <meta property="og:type" content="website" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
      crossorigin
    />

    <link href="/src/index.css" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="https://server.parket.works/app.js" data-parket-chat data-api="https://server.parket.works" defer></script>
  </body>
</html>
