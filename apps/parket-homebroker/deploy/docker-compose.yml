version: "3.8"

services:
  web:
    image: parket-homebroker:latest
    networks:
      - network_public
    deploy:
      resources:
        limits:
          memory: 128M
      mode: replicated
      replicas: 1
      restart_policy: { condition: on-failure }
      update_config: { parallelism: 1, order: start-first, failure_action: rollback }
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public
        - traefik.http.routers.parket-homebroker-http.rule=Host(`homebroker.parket.works`)
        - traefik.http.routers.parket-homebroker-http.entrypoints=web
        - traefik.http.routers.parket-homebroker-http.middlewares=https-redirect
        - traefik.http.routers.parket-homebroker.rule=Host(`homebroker.parket.works`)
        - traefik.http.routers.parket-homebroker.entrypoints=websecure
        - traefik.http.routers.parket-homebroker.tls=true
        - traefik.http.routers.parket-homebroker.tls.certresolver=letsencryptresolver
        - traefik.http.services.parket-homebroker.loadbalancer.server.port=80

networks:
  network_public:
    external: true
