<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <title>Parket Chat</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* Identidade Parket (padrão Valoria — mesmo de producao/suprimentos/compras) */
    :root {
      --bg: #050505;
      --side: #040404;
      --panel: #0a0a0a;
      --border: #161515;
      --border-h: #2b2a28;
      --input: #0d0d0d;
      --text: #d8d3c7;
      --dim: #777766;
      --muted: #383732;
      --accent: #968473;
      --accent15: rgba(150, 132, 115, .15);
      --accent40: rgba(150, 132, 115, .4);
      --cream: #c8bdb1;
      --red: #b25050;
      --green: #7aa07a;
      --blue: #5e7f9e;
      --gold: #c7a45b;
      --strong: #ffffff;
      --overlay: rgba(0, 0, 0, .6);
      --shadow: rgba(0, 0, 0, .55);
    }
    :root[data-theme="light"] {
      --bg: #f6f4f0;
      --side: #efece6;
      --panel: #ffffff;
      --border: #e2ddd3;
      --border-h: #c8c1b2;
      --input: #ffffff;
      --text: #33302a;
      --dim: #8a8474;
      --muted: #b8b2a4;
      --accent: #8a765f;
      --accent15: rgba(150, 132, 115, .14);
      --accent40: rgba(138, 118, 95, .45);
      --cream: #4d4438;
      --red: #a34747;
      --green: #5d8a5d;
      --blue: #4a6d8c;
      --gold: #a8843c;
      --strong: #17140f;
      --overlay: rgba(35, 30, 22, .35);
      --shadow: rgba(70, 58, 44, .2);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text); background: var(--bg); overflow: hidden;
      text-rendering: geometricPrecision;
      -webkit-tap-highlight-color: transparent;
    }
    #root { height: 100%; height: 100dvh; }
    button { font-family: inherit; }
    input, textarea { font-family: inherit; }
    .ck-display { font-family: "Cinzel", serif; }

    .ck-app { display: flex; height: 100%; height: 100dvh; }

    /* ---------------- Sidebar ---------------- */
    .ck-side {
      width: 280px; min-width: 280px; background: var(--side); color: var(--text);
      display: flex; flex-direction: column; height: 100%; border-right: 1px solid var(--border);
    }
    .ck-side-head {
      padding: 14px 16px; display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .ck-brandava {
      width: 32px; height: 32px; flex: none; background: var(--accent15); border: 1px solid var(--accent40);
      display: flex; align-items: center; justify-content: center;
      font-family: "Cinzel", serif; font-size: 13px; color: var(--accent); line-height: 1;
    }
    .ck-logo { flex: 1; min-width: 0; }
    .ck-brand {
      font-family: "Cinzel", serif; font-weight: 500; font-size: 13px; letter-spacing: .16em;
      color: var(--text); line-height: 1.2;
    }
    .ck-brandsub {
      font-size: 8px; text-transform: uppercase; letter-spacing: .22em; color: var(--dim); margin-top: 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .ck-side-search { padding: 10px 12px; }
    .ck-side-search input {
      width: 100%; background: var(--input); border: 1px solid var(--border); color: var(--text);
      border-radius: 0; padding: 8px 10px; font-size: 13px; outline: none;
    }
    .ck-side-search input:focus { border-color: var(--border-h); }
    .ck-side-search input::placeholder { color: var(--dim); }
    .ck-side-body { flex: 1; overflow-y: auto; padding-bottom: 12px; }
    .ck-side-body::-webkit-scrollbar { width: 8px; }
    .ck-side-body::-webkit-scrollbar-thumb { background: var(--border-h); }
    .ck-sec {
      display: flex; align-items: center; padding: 16px 16px 6px;
      font-family: "Cinzel", serif; font-size: 10px;
      text-transform: uppercase; letter-spacing: .22em; color: var(--dim);
    }
    .ck-sec .ck-plus {
      margin-left: auto; background: none; border: none; color: var(--dim); cursor: pointer;
      font-size: 15px; line-height: 1; padding: 2px 6px; border-radius: 0;
    }
    .ck-sec .ck-plus:hover { background: var(--accent15); color: var(--text); }
    .ck-secbtn {
      display: inline-flex; align-items: center; gap: 5px; background: none; border: none; padding: 0;
      cursor: pointer; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit;
    }
    .ck-secbtn:hover { color: var(--text); }
    .ck-caret { display: inline-flex; transform: rotate(180deg); transition: transform .15s; }
    .ck-caret.open { transform: rotate(-90deg); }
    .ck-item {
      display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
      background: none; border: none; border-left: 2px solid transparent; color: var(--text); cursor: pointer;
      padding: 6px 16px 6px 14px; font-size: 14px; border-radius: 0;
    }
    .ck-item:hover { background: var(--panel); }
    .ck-item.on { background: var(--accent15); border-left-color: var(--accent); color: var(--cream); }
    .ck-item .ck-hash { color: var(--dim); width: 14px; text-align: center; }
    .ck-item.on .ck-hash { color: var(--accent); }
    .ck-item .ck-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ck-item.unread .ck-name { color: var(--strong); font-weight: 700; }
    .ck-badge {
      background: var(--accent); color: var(--bg); font-size: 11px; font-weight: 700;
      border-radius: 0; min-width: 18px; height: 18px; display: inline-flex;
      align-items: center; justify-content: center; padding: 0 5px;
    }
    .ck-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
    .ck-dot.on { background: var(--green); }
    .ck-ava {
      width: 22px; height: 22px; border-radius: 0; flex: none; display: inline-flex;
      align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: #efe9df;
    }
    .ck-sub { font-size: 11px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ck-me {
      padding: 10px 16px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 10px;
    }
    .ck-me .ck-name { flex: 1; font-size: 13px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ck-me button {
      background: none; border: 1px solid var(--border); color: var(--dim); border-radius: 0;
      font-size: 11px; padding: 4px 8px; cursor: pointer; text-transform: uppercase; letter-spacing: .08em;
    }
    .ck-me button:hover { color: var(--text); border-color: var(--accent); }

    /* ---------------- Main ---------------- */
    .ck-main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
    .ck-head {
      display: flex; align-items: center; gap: 10px; padding: 10px 16px;
      border-bottom: 1px solid var(--border); min-height: 54px; background: var(--side);
    }
    .ck-head-title { font-weight: 700; font-size: 15px; color: var(--cream); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ck-head-sub { font-size: 12px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ck-head .ck-grow { flex: 1; min-width: 0; }
    .ck-iconbtn {
      background: none; border: 1px solid var(--border); border-radius: 0; cursor: pointer;
      font-size: 15px; padding: 0; width: 30px; height: 30px; color: var(--dim);
      display: inline-flex; align-items: center; justify-content: center; flex: none;
    }
    .ck-iconbtn svg { display: block; }
    .ck-iconbtn:hover { border-color: var(--accent); color: var(--text); }
    .ck-iconbtn.on { background: var(--accent15); border-color: var(--accent); color: var(--accent); }
    .ck-burger { display: none; }

    .ck-msgs { flex: 1; overflow-y: auto; padding: 12px 0 8px; }
    .ck-msgs::-webkit-scrollbar { width: 8px; }
    .ck-msgs::-webkit-scrollbar-thumb { background: var(--border-h); }
    .ck-day {
      display: flex; align-items: center; gap: 10px; margin: 14px 16px 6px; color: var(--dim);
      font-family: "Cinzel", serif; font-size: 10px; text-transform: uppercase; letter-spacing: .22em;
    }
    .ck-day::before, .ck-day::after { content: ""; flex: 1; height: 1px; background: var(--border); }
    .ck-msg { display: flex; gap: 10px; padding: 3px 16px; position: relative; }
    .ck-msg:hover { background: var(--panel); }
    .ck-msg .ck-ava2 {
      width: 34px; height: 34px; border-radius: 0; flex: none; display: flex;
      align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #efe9df; margin-top: 2px;
    }
    .ck-msg.cont { padding-top: 0; }
    .ck-msg.cont .ck-ava2 { visibility: hidden; height: 0; margin: 0; }
    .ck-msg-body { flex: 1; min-width: 0; }
    .ck-msg-top { display: flex; align-items: baseline; gap: 8px; }
    .ck-msg-author { font-weight: 700; font-size: 14px; color: var(--cream); }
    .ck-msg-time { font-size: 11px; color: var(--dim); }
    .ck-msg-text { font-size: 14px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
    .ck-msg-text a { color: var(--blue); }
    .ck-msg-text code {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px;
      background: var(--accent15); border: 1px solid var(--border); padding: 1px 5px; color: var(--cream);
    }
    .ck-pre {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px;
      background: var(--input); border: 1px solid var(--border); border-left: 2px solid var(--accent);
      padding: 8px 12px; margin: 6px 0; white-space: pre-wrap; overflow-x: auto; color: var(--text);
    }
    .ck-edited { font-size: 11px; color: var(--muted); margin-left: 5px; }
    .ck-deleted { color: var(--muted); font-style: italic; }
    .ck-pinnedtag {
      display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--gold);
      text-transform: uppercase; letter-spacing: .08em; margin: 2px 0;
    }
    .ck-pinnedtag svg { flex: none; }
    .ck-msg-quote {
      display: flex; flex-direction: column; align-items: flex-start; gap: 1px; max-width: 480px;
      background: var(--input); border: 1px solid var(--border); border-left: 2px solid var(--accent);
      padding: 5px 10px; margin: 3px 0 4px; cursor: pointer; text-align: left; font: inherit;
    }
    .ck-msg-quote:hover { border-color: var(--accent); }
    .ck-quote-author { font-size: 12px; font-weight: 700; color: var(--accent); }
    .ck-quote-text {
      font-size: 12.5px; color: var(--dim); overflow: hidden; text-overflow: ellipsis;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word;
    }
    .ck-replybar {
      display: flex; align-items: center; gap: 8px; margin: 0 0 6px;
      background: var(--input); border: 1px solid var(--border); border-left: 2px solid var(--accent);
      padding: 6px 10px; color: var(--dim);
    }
    .ck-replybar svg { flex: none; color: var(--accent); }
    .ck-replybar-body { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }
    .ck-replybar-body .ck-quote-text { -webkit-line-clamp: 1; }
    .ck-replybar-x {
      background: none; border: none; color: var(--dim); cursor: pointer; padding: 4px; display: flex; flex: none;
    }
    .ck-replybar-x:hover { color: var(--text); }
    .ck-tag {
      display: inline-flex; align-items: center; gap: 4px; border: 1px solid; padding: 1px 7px;
      font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap;
    }
    .ck-tag button { background: none; border: none; color: inherit; cursor: pointer; padding: 0; display: flex; }
    .ck-tag.sm { font-size: 9px; padding: 0 5px; flex: none; }
    .ck-tagrow { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
    .ck-tagrow.sm { display: flex; gap: 4px; margin: 2px 0 0; overflow: hidden; }
    .ck-tagadd { background: none; border: 1px dashed var(--border); color: var(--dim); font-size: 11px; padding: 2px 8px; cursor: pointer; }
    .ck-tagadd:hover { border-color: var(--accent); color: var(--text); }
    .ck-tagnew { display: flex; gap: 6px; margin-bottom: 14px; }
    .ck-tagnew input {
      flex: 1; background: var(--input); border: 1px solid var(--border); color: var(--text);
      padding: 6px 10px; font-size: 13px; outline: none;
    }
    .ck-head-title .ck-tag { margin-left: 6px; vertical-align: 2px; }
    /* relative: a lista de @menção da edição ancora dentro desta caixa */
    .ck-editwrap { margin: 4px 0; position: relative; }
    .ck-editwrap textarea {
      width: 100%; background: var(--input); border: 1px solid var(--accent40); color: var(--text);
      border-radius: 0; padding: 8px 10px; font-size: 14px; line-height: 1.4; resize: vertical; outline: none;
    }
    .ck-editactions { display: flex; gap: 6px; margin-top: 6px; }
    .ck-editactions button {
      background: none; border: 1px solid var(--border); color: var(--dim); border-radius: 0;
      font-size: 12px; padding: 4px 12px; cursor: pointer;
    }
    .ck-editactions button:hover { border-color: var(--accent); color: var(--text); }
    .ck-editactions .ck-editsave { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
    /* botão "@" da edição: só o ícone, mesma altura dos outros */
    .ck-editactions .ck-editat { display: inline-flex; align-items: center; padding: 4px 8px; }
    .ck-typing { padding: 0 20px 4px; font-size: 12px; color: var(--dim); font-style: italic; }
    .ck-pushbanner {
      display: flex; align-items: center; gap: 10px; padding: 9px 20px;
      background: var(--accent15); border-bottom: 1px solid var(--border);
      color: var(--text); font-size: 13px;
    }
    .ck-pushbanner svg { color: var(--accent); flex-shrink: 0; }
    .ck-pushbanner span { flex: 1; min-width: 0; }
    .ck-pushbanner .ck-pushbanner-cta {
      background: var(--accent); border: 1px solid var(--accent); color: var(--bg);
      border-radius: 0; font-weight: 600; font-size: 12px; padding: 5px 14px; cursor: pointer;
      font-family: inherit; flex-shrink: 0;
    }
    .ck-pushbanner .ck-pushbanner-cta:hover { opacity: .85; }
    @keyframes ck-hl-fade { 0%, 55% { background: var(--accent15); } 100% { background: transparent; } }
    .ck-msg.hl { animation: ck-hl-fade 2.5s ease-out; }
    .ck-mention { background: var(--accent15); color: var(--accent); font-weight: 700; border-radius: 0; padding: 0 3px; }
    .ck-msg-img { max-width: 340px; max-height: 260px; border-radius: 0; display: block; margin-top: 6px; border: 1px solid var(--border); }
    .ck-audio {
      display: flex; align-items: center; gap: 10px; margin-top: 6px;
      width: 300px; max-width: 100%; padding: 8px 12px;
      background: var(--input); border: 1px solid var(--border);
    }
    .ck-audio-btn {
      width: 28px; height: 28px; flex: none; display: flex; align-items: center; justify-content: center;
      background: var(--accent); border: 1px solid var(--accent); color: var(--bg);
      cursor: pointer; padding: 0; border-radius: 0;
    }
    .ck-audio-btn:hover { opacity: .85; }
    .ck-audio-track { flex: 1; height: 16px; display: flex; align-items: center; cursor: pointer; position: relative; }
    .ck-audio-track::before { content: ""; position: absolute; left: 0; right: 0; height: 3px; background: var(--muted); }
    .ck-audio-fill { position: relative; height: 3px; background: var(--accent); z-index: 1; }
    .ck-audio-time { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; flex: none; min-width: 30px; text-align: right; }
    @keyframes ck-recblink { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    .ck-recdot { width: 10px; height: 10px; border-radius: 50%; background: #d64545; animation: ck-recblink 1.1s ease-in-out infinite; flex-shrink: 0; }
    .ck-rectime { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--text); }
    .ck-msg-file {
      display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; padding: 7px 12px;
      background: var(--input); border: 1px solid var(--border); border-radius: 0;
      color: var(--text); text-decoration: none; font-size: 13px;
    }
    .ck-msg-file:hover { border-color: var(--border-h); }
    .ck-hoveracts {
      position: absolute; top: -14px; right: 16px; display: none; background: var(--panel);
      border: 1px solid var(--border-h); border-radius: 0; box-shadow: 0 2px 8px var(--shadow);
      z-index: 5;
    }
    .ck-msg:hover .ck-hoveracts { display: flex; }
    .ck-hoveracts button {
      background: none; border: none; cursor: pointer; font-size: 15px; padding: 6px 8px; border-radius: 0;
      color: var(--dim); display: flex; align-items: center;
    }
    .ck-hoveracts button:hover { background: var(--accent15); color: var(--text); }
    .ck-reacts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .ck-react {
      display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--border);
      background: var(--input); border-radius: 0; padding: 2px 8px; font-size: 12px; cursor: pointer; color: var(--text);
    }
    .ck-react:hover { border-color: var(--border-h); }
    .ck-react.mine { background: var(--accent15); border-color: var(--accent); }
    .ck-react b { font-size: 11px; color: var(--dim); }
    .ck-threadlink {
      display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; border: none; background: none;
      color: var(--accent); font-size: 12.5px; font-weight: 600; cursor: pointer; padding: 2px 0;
    }
    .ck-threadlink:hover { text-decoration: underline; }

    .ck-emojipick {
      position: absolute; top: 14px; right: 16px; background: var(--panel); border: 1px solid var(--border-h);
      border-radius: 0; box-shadow: 0 6px 20px var(--shadow); padding: 6px; display: flex;
      flex-wrap: wrap; width: 216px; z-index: 30;
    }
    .ck-emojipick button { background: none; border: none; font-size: 19px; padding: 6px; cursor: pointer; border-radius: 0; }
    .ck-emojipick button:hover { background: var(--accent15); }

    /* ---------------- Composer ---------------- */
    .ck-composer { padding: 8px 16px 14px; position: relative; }
    .ck-composer-box {
      border: 1px solid var(--border); border-radius: 0; padding: 8px 10px;
      display: flex; flex-direction: column; gap: 6px; background: var(--input);
    }
    .ck-composer-box:focus-within { border-color: var(--border-h); }
    .ck-composer textarea {
      border: none; outline: none; resize: none; font-size: 14px; line-height: 1.4;
      max-height: 140px; min-height: 22px; background: transparent; color: var(--text);
    }
    .ck-composer textarea::placeholder { color: var(--dim); }
    .ck-composer-actions { display: flex; align-items: center; gap: 8px; }
    .ck-composer-actions .ck-grow { flex: 1; }
    .ck-send {
      background: var(--accent); border: none; color: var(--bg); font-weight: 600; font-size: 13px;
      padding: 7px 16px; border-radius: 0; cursor: pointer;
    }
    .ck-send:disabled { opacity: .45; cursor: default; }
    .ck-filechip {
      display: inline-flex; align-items: center; gap: 8px; background: var(--panel);
      border: 1px solid var(--border); border-radius: 0; padding: 5px 10px; font-size: 12.5px;
    }
    .ck-filechip button { background: none; border: none; cursor: pointer; color: var(--dim); font-size: 14px; }
    .ck-mentionpop {
      position: absolute; bottom: calc(100% - 2px); left: 16px; right: 16px; background: var(--panel);
      border: 1px solid var(--border-h); border-radius: 0; box-shadow: 0 -4px 20px var(--shadow);
      max-height: 240px; overflow-y: auto; z-index: 20;
    }
    .ck-mentionpop button {
      display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none;
      border: none; padding: 8px 12px; cursor: pointer; font-size: 13.5px; color: var(--text);
    }
    .ck-mentionpop button:hover, .ck-mentionpop button.sel { background: var(--accent15); }
    /* na edição a caixa é estreita: a lista ocupa a largura toda dela */
    .ck-mentionpop.ck-mentionpop-edit { left: 0; right: 0; }

    /* ---------------- Thread panel ---------------- */
    .ck-thread {
      width: 380px; min-width: 320px; border-left: 1px solid var(--border); display: flex;
      flex-direction: column; background: var(--bg);
    }
    .ck-thread .ck-head { min-height: 54px; }
    .ck-thread-root { border-bottom: 1px solid var(--border); padding: 8px 0; max-height: 40%; overflow-y: auto; }
    .ck-thread-replies { flex: 1; overflow-y: auto; padding: 8px 0; }

    /* ---------------- Teca (copiloto) ---------------- */
    .ck-teca .ck-head-title { display: flex; align-items: center; gap: 6px; }
    .ck-teca .ck-head-title svg { color: var(--accent); }
    .ck-teca-body { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }
    .ck-teca-hint { font-size: 13px; color: var(--dim); line-height: 1.5; }
    .ck-teca-qa { display: flex; flex-direction: column; gap: 8px; }
    .ck-teca-q {
      align-self: flex-end; max-width: 90%; background: var(--accent15); color: var(--text);
      padding: 8px 12px; font-size: 13px; white-space: pre-wrap;
    }
    .ck-teca-a {
      align-self: flex-start; max-width: 100%; background: var(--input); border: 1px solid var(--border);
      color: var(--text); padding: 10px 12px; font-size: 13.5px; line-height: 1.55; white-space: pre-wrap;
    }
    .ck-teca-err { color: #d64545; }
    .ck-teca-wait { color: var(--dim); font-style: italic; }
    .ck-teca-quick { display: flex; gap: 8px; padding: 0 16px 10px; }
    .ck-teca-quick button {
      background: none; border: 1px solid var(--border); color: var(--dim); font-size: 12px;
      padding: 5px 10px; cursor: pointer; border-radius: 0;
    }
    .ck-teca-quick button:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); }
    .ck-teca-quick button:disabled { opacity: .5; cursor: default; }
    .ck-teca-form { display: flex; gap: 8px; padding: 0 16px 16px; }
    .ck-teca-form input {
      flex: 1; background: var(--input); border: 1px solid var(--border); color: var(--text);
      padding: 9px 12px; font-size: 13.5px; outline: none; border-radius: 0; font-family: inherit;
    }
    .ck-teca-form input:focus { border-color: var(--accent); }
    .ck-teca-form button {
      background: var(--accent); border: 1px solid var(--accent); color: var(--bg);
      padding: 9px 14px; font-size: 13px; cursor: pointer; border-radius: 0;
    }
    .ck-teca-form button:disabled { opacity: .5; cursor: default; }

    /* ---------------- Overlays ---------------- */
    .ck-modalbg {
      position: fixed; inset: 0; background: var(--overlay); z-index: 50;
      display: flex; align-items: flex-start; justify-content: center; padding: 80px 16px 16px;
    }
    .ck-modal {
      background: var(--panel); border: 1px solid var(--border-h); border-radius: 0; width: 560px; max-width: 100%;
      max-height: 70vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 60px var(--shadow);
    }
    .ck-modal input {
      background: var(--input); color: var(--text); border: none; border-bottom: 1px solid var(--border);
      padding: 14px 16px; font-size: 15px; outline: none;
    }
    .ck-modal input::placeholder { color: var(--dim); }
    .ck-modal-list { overflow-y: auto; padding: 6px 0; }
    .ck-modal-list button {
      display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none;
      border: none; padding: 9px 16px; cursor: pointer; font-size: 14px; color: var(--text);
    }
    .ck-modal-list button:hover { background: var(--accent15); }
    .ck-modal-list .ck-hit-snip { font-size: 12.5px; color: var(--dim); display: block; margin-top: 2px; }
    .ck-modal-list .ck-hit-snip b { color: var(--accent); }
    .ck-modal-empty { padding: 24px 16px; color: var(--dim); font-size: 13.5px; text-align: center; }
    .ck-modal-title {
      display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--border);
      font-family: "Cinzel", serif; font-size: 12px; text-transform: uppercase; letter-spacing: .18em; color: var(--cream);
    }
    .ck-pinrow {
      display: flex; align-items: flex-start; gap: 10px; padding: 10px 16px; font-size: 14px; color: var(--text);
      border-bottom: 1px solid var(--border);
    }
    .ck-pinrow:last-child { border-bottom: none; }
    .ck-pinrow .ck-hit-snip { font-size: 12.5px; color: var(--dim); display: block; margin-top: 2px; }
    .ck-pinrow button.ck-iconbtn { width: auto; flex: none; padding: 4px; }
    .ck-pinrow button.ck-pinjump { width: auto; flex: 1; min-width: 0; text-align: left; padding: 0; background: none; border: none; cursor: pointer; color: var(--text); font-size: 14px; }
    .ck-pinrow button.ck-pinjump:hover { background: none; }
    .ck-pinrow button.ck-pinjump:hover .ck-hit-snip { color: var(--text); }

    /* ---------------- Fixar por tempo (popover) ---------------- */
    .ck-pinpickpop {
      position: absolute; top: 14px; right: 16px; background: var(--panel); border: 1px solid var(--border-h);
      border-radius: 0; box-shadow: 0 6px 20px var(--shadow); width: 180px; z-index: 30;
      display: flex; flex-direction: column;
    }
    .ck-pinpick-title { padding: 8px 12px 6px; font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; border-bottom: 1px solid var(--border); }
    .ck-pinpickpop button {
      background: none; border: none; text-align: left; padding: 8px 12px; font-size: 13px;
      color: var(--text); cursor: pointer; border-radius: 0;
    }
    .ck-pinpickpop button:hover { background: var(--accent15); }
    .ck-hoveracts button.on { color: var(--accent); }

    /* ---------------- Nova conversa (setores → pessoas) ---------------- */
    .ck-secava {
      width: 32px; height: 32px; flex: none; display: inline-flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: #efe9df; border-radius: 0;
    }
    .ck-dmback {
      display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--dim) !important;
      border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: .06em;
    }
    .ck-dmback b { color: var(--text); letter-spacing: 0; text-transform: none; }
    .ck-modal-list .ck-dmrow .ck-dot.on { width: 7px; height: 7px; margin-left: 4px; }

    /* ---------------- Geral da obra ---------------- */
    .ck-headclick {
      background: none; border: none; padding: 0; cursor: pointer; text-align: left; min-width: 0;
      color: inherit; font: inherit; display: block;
    }
    .ck-modal.ck-obrainfo { width: 720px; max-height: 80vh; }
    .ck-obrainfo-tabs { display: flex; gap: 2px; padding: 0 16px; border-bottom: 1px solid var(--border); }
    .ck-obrainfo-tabs button {
      background: none; border: none; border-bottom: 2px solid transparent; color: var(--dim);
      font-size: 13px; padding: 10px 10px 8px; cursor: pointer; border-radius: 0;
    }
    .ck-obrainfo-tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
    .ck-obrainfo-tabs button:hover { color: var(--text); }
    .ck-obrainfo-body { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .ck-obrainfo-label { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .1em; }
    .ck-obrainfo-desc {
      background: var(--input); border: 1px solid var(--border); color: var(--text); font-family: inherit;
      font-size: 13.5px; line-height: 1.5; padding: 10px 12px; min-height: 90px; resize: vertical; outline: none; border-radius: 0;
    }
    .ck-obrainfo-desc:focus { border-color: var(--accent); }
    .ck-obrainfo-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .ck-obrainfo-actions button {
      background: var(--accent); border: 1px solid var(--accent); color: var(--bg); font-size: 13px;
      padding: 7px 14px; cursor: pointer; border-radius: 0;
    }
    .ck-obrainfo-actions button:disabled { opacity: .5; cursor: default; }
    .ck-obrainfo-members { display: flex; flex-wrap: wrap; gap: 6px; }
    .ck-memberchip {
      display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border);
      padding: 4px 10px 4px 4px; font-size: 12.5px; color: var(--text); background: var(--input);
    }
    .ck-memberchip.sec { padding: 4px 10px; color: var(--accent); border-color: var(--accent); background: none; font-weight: 600; }
    .ck-ava.sm { width: 22px; height: 22px; font-size: 10px; }
    img.ck-avaimg.sm { width: 22px; height: 22px; }
    .ck-mediagrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .ck-mediagrid.vid { grid-template-columns: repeat(2, 1fr); }
    .ck-mediagrid a { display: block; aspect-ratio: 1; overflow: hidden; border: 1px solid var(--border); }
    .ck-mediagrid a img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .ck-mediagrid video { width: 100%; max-height: 200px; background: #000; border: 1px solid var(--border); }
    .ck-mediadoc {
      display: flex; align-items: center; gap: 10px; border: 1px solid var(--border); background: var(--input);
      padding: 9px 12px; font-size: 13px; color: var(--text); text-decoration: none; min-width: 0;
    }
    .ck-mediadoc:hover { border-color: var(--border-h); }
    .ck-mediadoc svg { flex: none; color: var(--dim); }
    .ck-mediadoc .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .ck-mediadoc .dt { margin-left: auto; flex: none; font-size: 11.5px; color: var(--dim); }

    /* ---------------- Avatar com foto ---------------- */
    img.ck-avaimg { object-fit: cover; flex: none; display: block; }
    .ck-me .ck-mebtn {
      flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; background: none;
      border: none; padding: 0; cursor: pointer; text-align: left; text-transform: none; letter-spacing: 0;
    }
    .ck-me .ck-mebtn:hover .ck-name { color: var(--accent); }

    /* ---------------- Perfil ---------------- */
    .ck-profile-body { display: flex; gap: 16px; padding: 16px; align-items: flex-start; }
    .ck-profile-ava {
      position: relative; width: 72px; height: 72px; flex: none; border: 1px solid var(--border);
      background: none; padding: 0; cursor: pointer;
    }
    .ck-profile-ava > img.ck-avaimg { width: 100%; height: 100%; }
    .ck-profile-ava > span:first-child {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 700; color: #efe9df;
    }
    .ck-profile-cam {
      position: absolute; right: -1px; bottom: -1px; width: 22px; height: 22px; background: var(--accent);
      color: var(--bg); display: flex; align-items: center; justify-content: center;
    }
    .ck-profile-fields { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
    .ck-profile-fields label {
      display: flex; flex-direction: column; gap: 6px; font-size: 11px; color: var(--dim);
      text-transform: uppercase; letter-spacing: .1em;
    }
    .ck-profile-fields input {
      padding: 9px 10px; font-size: 14px; border: 1px solid var(--border); background: var(--input);
    }
    .ck-profile-mail { font-size: 12px; color: var(--dim); }
    .ck-profile-actions { display: flex; align-items: center; gap: 8px; padding: 0 16px 16px; }
    .ck-profile-actions .ck-grow { flex: 1; }
    .ck-profile-actions button:not(.ck-send) {
      background: none; border: 1px solid var(--border); color: var(--dim); font-size: 12px;
      padding: 7px 12px; cursor: pointer; border-radius: 0;
    }
    .ck-profile-actions button:not(.ck-send):hover { color: var(--text); border-color: var(--accent); }

    /* ---------------- Mensagens agendadas ---------------- */
    .ck-schedpop {
      position: absolute; bottom: calc(100% - 2px); right: 16px; width: 360px; max-width: calc(100% - 32px);
      background: var(--panel); border: 1px solid var(--border-h); box-shadow: 0 -4px 20px var(--shadow);
      padding: 12px; z-index: 25;
    }
    .ck-sched-title {
      display: flex; align-items: center; gap: 8px; font-family: "Cinzel", serif; font-size: 10px;
      text-transform: uppercase; letter-spacing: .18em; color: var(--cream); margin-bottom: 10px;
    }
    .ck-sched-form { display: flex; gap: 8px; }
    .ck-sched-form input {
      flex: 1; min-width: 0; background: var(--input); border: 1px solid var(--border); color: var(--text);
      padding: 6px 8px; font-size: 13px; outline: none;
    }
    .ck-sched-list { margin-top: 10px; }
    .ck-schedrow {
      display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--border);
      font-size: 12.5px; color: var(--dim);
    }
    .ck-sched-when { flex: none; color: var(--cream); }
    .ck-sched-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
    .ck-schedrow button.ck-iconbtn { width: auto; height: auto; flex: none; padding: 3px; border: none; }

    /* ---------------- Tarefas da obra ---------------- */
    .ck-taskform { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
    .ck-taskform input, .ck-taskform select {
      background: var(--input); border: 1px solid var(--border); color: var(--text);
      padding: 8px 10px; font-size: 13.5px; outline: none; border-radius: 0;
    }
    .ck-taskform-row { display: flex; gap: 8px; }
    .ck-taskform-row select { flex: 1; min-width: 0; }
    .ck-taskform-row input[type="date"] { width: 140px; flex: none; }
    .ck-taskrow {
      display: flex; align-items: flex-start; gap: 10px; padding: 10px 16px; font-size: 14px;
      color: var(--text); border-bottom: 1px solid var(--border);
    }
    .ck-taskrow:last-child { border-bottom: none; }
    .ck-modal-list .ck-taskrow button { width: auto; flex: none; padding: 2px; display: inline-flex; }
    .ck-taskcheck { background: none; border: none; cursor: pointer; color: var(--accent); margin-top: 1px; }
    .ck-taskbox { display: block; width: 14px; height: 14px; border: 1.5px solid var(--dim); }
    .ck-taskcheck:hover .ck-taskbox { border-color: var(--accent); }
    .ck-tasktitle { display: block; word-break: break-word; }
    .ck-taskrow.done .ck-tasktitle { text-decoration: line-through; color: var(--dim); }
    .ck-taskmeta { display: flex; gap: 10px; font-size: 12px; color: var(--dim); margin-top: 2px; }
    .ck-overdue { color: #c0564a; font-weight: 600; }

    .ck-empty {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--dim); gap: 8px;
    }
    .ck-empty .big { font-size: 40px; color: var(--muted); }
    .ck-empty .big svg { display: block; }

    .ck-spin {
      width: 14px; height: 14px; border: 2px solid var(--border-h); border-top-color: var(--accent);
      border-radius: 50%; animation: ckspin .8s linear infinite; display: inline-block;
    }
    @keyframes ckspin { to { transform: rotate(360deg); } }
    .ck-threadlink svg, .ck-msg-file svg, .ck-filechip svg { flex: none; }

    /* ---------------- Login ---------------- */
    .ck-login {
      min-height: 100dvh; display: grid; place-items: center;
      background: var(--bg); color: var(--text); padding: 24px;
    }
    .ck-login-card {
      width: 360px; max-width: 100%; padding: 32px; background: var(--panel);
      border: 1px solid var(--border); display: flex; flex-direction: column; gap: 14px;
    }
    .ck-login-title {
      font-family: "Cinzel", serif; font-size: 32px; font-weight: 400; letter-spacing: .22em;
      text-align: center; color: var(--text);
    }
    .ck-login-sub {
      font-size: 10px; letter-spacing: .4em; color: var(--muted); text-align: center;
      text-transform: uppercase; margin-bottom: 8px;
    }
    .ck-login label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--dim); }
    .ck-login input {
      background: var(--input); border: 1px solid var(--border); color: var(--text); border-radius: 0;
      padding: 10px 12px; font-size: 14px; outline: none;
    }
    .ck-login input:focus { border-color: var(--border-h); }
    .ck-login button {
      background: var(--accent); color: var(--bg); border: none; border-radius: 0;
      padding: 12px 18px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 6px;
    }
    .ck-login button:disabled { opacity: .6; cursor: default; }
    .ck-login-error {
      color: var(--red); font-size: 12px; padding: 6px 10px; background: rgba(178,80,80,.08);
    }
    .ck-login-note { text-align: center; color: var(--muted); font-size: 11px; margin-top: 4px; }

    /* ---------------- Mobile ---------------- */
    @media (max-width: 900px) {
      .ck-side {
        position: fixed; inset: 0 auto 0 0; z-index: 60; transform: translateX(-100%);
        transition: transform .2s ease; width: 300px;
      }
      .ck-side.open { transform: none; box-shadow: 20px 0 60px var(--shadow); }
      .ck-sidebg { position: fixed; inset: 0; background: var(--overlay); z-index: 55; }
      .ck-burger { display: inline-block; }
      .ck-thread {
        position: fixed; inset: 0; width: auto; min-width: 0; z-index: 40;
      }
      .ck-msg-img { max-width: 240px; }
    }
  </style>
</head>
<body>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('parket_chat_theme') === 'light' ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.content = t === 'light' ? '#efece6' : '#050505';
      } catch (e) {}
    })();
  </script>
  <div id="root"></div>
  <script src="/chat.js"></script>
</body>
</html>
