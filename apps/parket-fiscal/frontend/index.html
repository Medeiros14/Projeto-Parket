async function fetchCardsDoFiscal(){
  const meId = _isAdmin ? _operandoComoId : (_fiscal && _fiscal.id);
  if (!meId) return [];
  const meuNome = ((_isAdmin ? fiscalAtualNome() : (_fiscal && _fiscal.nome)) || "").trim();
  const firstName = meuNome.split(/\s+/)[0] || "";
  const [{ data: kcA }, { data: kcB }] = await Promise.all([
    sb.from("kanban_cards").select("id, title, obra, details").contains("details->fiscais", JSON.stringify([{ id: meId }])),
    firstName
      ? sb.from("kanban_cards").select("id, title, obra, details").ilike("details->>fiscal", `%${firstName}%`)
      : Promise.resolve({ data: [] }),
  ]);
  const seen = new Map();
  [...(kcA || []), ...(kcB || [])].forEach(c => { if (!seen.has(c.id)) seen.set(c.id, c); });
  let cards = Array.from(seen.values());
  // Mesmo filtro da lista Minhas Obras: só obras que já entraram no gestão.
  try {
    const r = await fetchGestao(`${GESTAO_API}/api/fiscal/obras-no-gestao`, {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ card_ids: cards.map(c => c.id) }),
    });
    if (r.ok){
      const byCard = await r.json();
      cards = cards.filter(c => byCard[c.id]);
    }
  } catch(_) {}
  return cards;
}

async function _fiscalUploadFoto(prefix, cardId, file){
  const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
  const path = `${prefix}/${cardId}/${Date.now()}.${ext}`;
  const { error } = await sb.storage.from("fiscal-midias").upload(path, file, {
    contentType: file.type || "application/octet-stream", upsert: false,
  });
  if (error) throw error;
  return sb.storage.from("fiscal-midias").getPublicUrl(path).data.publicUrl;
}

// instaladores e gera/reseta na hora, pra passar pro instalador na obra sem

let _acessosCache = null; // linhas da última carga; POST atualiza in-place e repinta
async function renderAcessosInstala(container){
  container.dataset.carregado = "1";
  container.innerHTML = `<div class="center" style="padding:8px 0"><span class="spinner"></span></div>`;
  const email = (_user && _user.email) || (_fiscal && _fiscal.email) || "";
  try {

      container.innerHTML = `<div class="small" style="color:#FBBF24;">Seu login não tem permissão pra ver os acessos. Chame a gestão pra liberar seu e-mail.</div>`;
      return;

    const rows = await r.json();
    _acessosCache = (Array.isArray(rows) ? rows : []).filter(p => p.ativo !== false);

    container.dataset.carregado = ""; // permite tentar de novo fechando e abrindo
    container.innerHTML = `<div class="small" style="color:#FBBF24;">Não deu pra carregar os acessos (${esc(String(e && e.message || e))}). Feche e abra de novo pra tentar outra vez.</div>`;

// Pinta a lista com filtro client-side (a lista toda já veio; buscar no
// navegador responde na hora mesmo com sinal ruim de obra)
function pintarAcessosInstala(container, filtro){
  const f = String(filtro || "").trim().toLowerCase();
  const rows = (_acessosCache || []).filter(p => !f
    || String(p.nome || "").toLowerCase().includes(f)
    || String(p.login || "").toLowerCase().includes(f));
  container.innerHTML = `
    <input data-role="ac-busca" type="text" placeholder="Buscar instalador..." value="${esc(filtro || "")}"
      style="width:100%; box-sizing:border-box; background:transparent; border:1px solid var(--pk-border1); color:inherit; padding:8px 10px; font-size:13px; margin-bottom:10px;">
    <div data-role="ac-lista" style="display:flex; flex-direction:column; gap:8px; max-height:50vh; overflow-y:auto;"></div>
    ${rows.length ? "" : `<div class="small" style="color:var(--pk-text-dim);">Nenhum instalador encontrado.</div>`}`;
  const busca = container.querySelector('[data-role="ac-busca"]');
  // Guarda o foco: repintar a lista inteira a cada tecla perderia o cursor,
  // então só a div ac-lista é reconstruída no input
  busca.oninput = () => {
    const posic = busca.selectionStart;
    pintarAcessosInstala(container, busca.value);
    const b2 = container.querySelector('[data-role="ac-busca"]');
    b2.focus(); b2.setSelectionRange(posic, posic);
  };
  const listaEl = container.querySelector('[data-role="ac-lista"]');
  rows.forEach(p => {
    const temAcesso = !!(p.login && p.senha);
    const linha = el(`
      <div style="border:1px solid var(--pk-border1); padding:10px 12px;">
        <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
          <span style="font-size:13px; font-weight:600;">${esc(p.nome || "-")}</span>
          ${p.categoria ? `<span class="tag" style="color:var(--pk-text-dim)">${esc(p.categoria)}</span>` : ""}
        </div>
        ${temAcesso
          ? `<div class="small" style="margin-top:6px;">Login: <b>${esc(p.login)}</b></div>
             <div class="small">Senha: <b>${esc(p.senha)}</b></div>`
          : `<div class="small" style="margin-top:6px; color:#FBBF24;">sem acesso gerado</div>`}
        <div style="display:flex; gap:8px; margin-top:8px;">
          ${temAcesso ? `<button data-role="ac-copiar" style="background:transparent; border:1px solid var(--pk-border1); color:inherit; padding:6px 12px; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; cursor:pointer;">COPIAR</button>` : ""}
          <button data-role="ac-gerar" style="background:transparent; border:1px solid var(--pk-border1); color:inherit; padding:6px 12px; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; cursor:pointer;">${temAcesso ? "RESETAR SENHA" : "GERAR ACESSO"}</button>
        </div>
      </div>`);
    const btnCopiar = linha.querySelector('[data-role="ac-copiar"]');
    if (btnCopiar){
      // Reusa copiarEndereco: copia o pacote pronto pra colar no WhatsApp do instalador
      btnCopiar.setAttribute("data-end",
        `Instala Parket\nhttps://instala.parket.works\nLogin: ${p.login}\nSenha: ${p.senha}`);
      btnCopiar.onclick = () => copiarEndereco(btnCopiar);
    }
    const btnGerar = linha.querySelector('[data-role="ac-gerar"]');
    btnGerar.onclick = async () => {
      if (temAcesso && !confirm(`Resetar a senha de ${p.nome}? A senha atual deixa de funcionar.`)) return;
      btnGerar.disabled = true; btnGerar.textContent = "AGUARDE...";
      const email = (_user && _user.email) || (_fiscal && _fiscal.email) || "";
      try {
        // Sem body = o gestão API aplica o padrão (slug.instalador@ / slug@parket2026)
        const r = await fetchGestao(`${GESTAO_API}/api/prestadores/${p.prestador_id}/acesso`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-User-Email": email } });
        if (!r.ok) throw new Error("HTTP " + r.status);
        const novo = await r.json();
        p.login = novo.login || p.login;
        p.senha = novo.senha || p.senha;
        pintarAcessosInstala(container, f);
      } catch (e){
        btnGerar.disabled = false;
        btnGerar.textContent = "ERRO, TENTAR DE NOVO";
      }
    };
    listaEl.appendChild(linha);
  });
}

      .select("id, card_id, fiscal_id, fiscal_nome, obra, cliente, tipo, status, data_vistoria, updated_at, created_at, relatorio_dados")
      .in("status", ["concluido", "cancelado"])

      .order("updated_at", { ascending: false })

        ${chip("2vistoria", "2ª Vistoria")}

// ── Meus custos: lançamentos de despesas do fiscal no módulo Custos de
// Terceiros do gestão (mesma tela que o instalador tem no Instala).
// O gestão resolve fiscal_id → ficha de prestador; aqui só consumimos.
const CUSTOS_ST = {
  rascunho:   { label: "RASCUNHO",   cor: "#9CA3AF" },
  enviado:    { label: "ENVIADO",    cor: "#60A5FA" },
  em_analise: { label: "EM ANÁLISE", cor: "#60A5FA" },
  aprovado:   { label: "APROVADO",   cor: "#FBBF24" },
  devolvido:  { label: "DEVOLVIDO",  cor: "#F87171" },
  pago:       { label: "PAGO",       cor: "#34D399" },
};
async function renderFiscalCustos(){
  try { if (_rtChannel){ sb.removeChannel(_rtChannel); _rtChannel = null; } } catch(_){}
  const root = document.getElementById("root");
  if (!root) return;
  const meId = _isAdmin ? _operandoComoId : (_fiscal && _fiscal.id);
  root.innerHTML = `<div class="card center"><span class="spinner"></span></div>`;
  renderBottomNav(); setActiveNav("mais");
  // Valores vêm em centavos (int) do gestão; formata só na exibição.
  const brl = (c) => (Number(c || 0) / 100).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  // Datas de ida/volta chegam como YYYY-MM-DD: fixa meio-dia pra não voltar um dia por fuso.
  const dtBR = (v) => { if (!v) return ""; const s = String(v); return new Date(s.length <= 10 ? s + "T12:00:00" : s).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" }); };
  let lancs = [], erro = "";
  if (meId){
    try {
      const r = await fetchGestao(`${GESTAO_API}/api/custos/app/lancamentos?fiscal_id=${encodeURIComponent(meId)}`);
      if (r.ok){ const j = await r.json(); lancs = j.items || []; }
      else erro = "Não foi possível carregar seus lançamentos. Tente de novo em instantes.";
    } catch(_){ erro = "Sem conexão com o gestão. Verifique a internet e tente de novo."; }
  }
  // Somatórios do topo: em análise = lançado ainda não decidido; aprovado = saldo
  // a receber; pago = o que já foi aprovado e quitado com comprovante.
  const somaAnalise  = lancs.filter(l => l.status === "enviado" || l.status === "em_analise").reduce((a, l) => a + Number(l.total_lancado_cent || 0), 0);
  const somaAprovado = lancs.filter(l => l.status === "aprovado").reduce((a, l) => a + Number(l.saldo_cent || 0), 0);
  const somaPago     = lancs.filter(l => l.status === "pago").reduce((a, l) => a + Number(l.total_aprovado_cent || 0), 0);
  const stat = (lbl, val, cor) => `<div style="flex:1; min-width:0; background:var(--pk-card1); border:1px solid var(--pk-border1); padding:10px 8px; text-align:center;">
    <div class="small" style="color:var(--pk-text-muted); letter-spacing:0.14em; margin-bottom:4px;">${lbl}</div>
    <div style="font-size:12.5px; font-weight:600; color:${cor}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${esc(val)}</div>
  </div>`;
  root.innerHTML = `
    <div style="padding:18px 16px 24px;">
      ${_btnVoltarMais}
      <h2 style="font-family:'Cinzel',serif; font-size:20px; letter-spacing:0.08em; margin:0 0 4px;">Meus custos</h2>
      <p class="small" style="color:var(--pk-text-dim); letter-spacing:0.14em; text-transform:uppercase; margin:0 0 14px;">Lançamentos de despesas e reembolsos</p>
      <div style="display:flex; gap:8px; margin-bottom:14px;">
        ${stat("EM ANÁLISE", brl(somaAnalise), "#60A5FA")}
        ${stat("APROVADO", brl(somaAprovado), "#FBBF24")}
        ${stat("PAGO", brl(somaPago), "#34D399")}
      </div>
      <div id="_fcLista"></div>
      <p class="small" style="color:var(--pk-text-muted); line-height:1.6; margin-top:16px;">Cada lançamento junta as despesas de uma viagem ou período. A gestão analisa item a item: o que for aprovado entra pra pagamento e o comprovante aparece aqui assim que sair.</p>
    </div>`;
  const box = document.getElementById("_fcLista");
  if (!box) return;
  if (erro){ box.innerHTML = `<div class="card center" style="color:var(--pk-text-muted); padding:24px 16px;">${esc(erro)}</div>`; return; }
  if (!lancs.length){ box.innerHTML = `<div class="card center" style="color:var(--pk-text-muted); padding:24px 16px;">Nenhum lançamento por enquanto. Quando a gestão registrar despesas suas, elas aparecem aqui.</div>`; return; }
  // Detalhe (despesas + histórico) só é buscado ao expandir, com cache local.
  const abertos = new Set();
  const detalhes = {};
  const paint = () => {
    box.innerHTML = `<div style="display:flex; flex-direction:column; gap:8px;">${lancs.map(l => {
      const st = CUSTOS_ST[l.status] || { label: String(l.status || "").toUpperCase(), cor: "var(--pk-text-dim)" };
      // Valor de destaque acompanha o momento: pago mostra o quitado, aprovado o
      // saldo a receber, o resto mostra o total lançado.
      const valor = l.status === "pago" ? l.total_aprovado_cent : l.status === "aprovado" ? l.saldo_cent : l.total_lancado_cent;
      const aberto = abertos.has(l.id);
      const det = detalhes[l.id];
      return `<div style="padding:12px 14px; background:var(--pk-card1); border:1px solid var(--pk-border1);">
        <div style="display:flex; justify-content:space-between; gap:8px; margin-bottom:4px;">
          <span class="small" style="letter-spacing:0.1em; color:var(--pk-text-muted);">${esc(l.numero || "")} · ${esc(dtBR(l.created_at))}</span>
          <span class="small" style="letter-spacing:0.12em; font-weight:600; white-space:nowrap; color:${st.cor};">${esc(st.label)}</span>
        </div>
        ${l.cliente ? `<div style="font-size:13px; color:var(--pk-text);">${esc(l.cliente)}</div>` : ""}
        ${l.motivo ? `<div class="small" style="color:var(--pk-text-dim); margin-top:2px;">${esc(l.motivo)}</div>` : ""}
        ${l.data_ida || l.data_volta ? `<div class="small" style="color:var(--pk-text-dim); margin-top:2px;">${esc(dtBR(l.data_ida))}${l.data_volta ? " a " + esc(dtBR(l.data_volta)) : ""}</div>` : ""}
        <div style="display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-top:8px;">
          <span class="small" style="color:var(--pk-text-muted);">${l.n_despesas || 0} despesa${(l.n_despesas || 0) === 1 ? "" : "s"}${l.n_glosadas ? ` <span style="color:#F87171;">(${l.n_glosadas} glosada${l.n_glosadas === 1 ? "" : "s"})</span>` : ""}</span>
          <span style="font-size:15px; font-weight:600; color:var(--pk-text);">${esc(brl(valor))}</span>
        </div>
        ${Number(l.adiantamento_cent || 0) > 0 ? `<div class="small" style="color:var(--pk-text-dim); text-align:right; margin-top:2px;">adiantamento de ${esc(brl(l.adiantamento_cent))} descontado</div>` : ""}
        ${l.status === "pago" && l.comprovante_url ? `<button data-comp="${l.id}" style="width:100%; background:transparent; border:1px solid #34D399; color:#34D399; padding:8px 12px; margin-top:8px; cursor:pointer; font-size:10.5px; letter-spacing:0.12em; font-family:'IBM Plex Mono',monospace;">VER COMPROVANTE${l.pago_em ? " · PAGO EM " + esc(dtBR(l.pago_em)) : ""}</button>` : ""}
        <button data-exp="${l.id}" style="width:100%; background:transparent; border:1px solid var(--pk-border1); color:var(--pk-text-dim); padding:6px 12px; margin-top:8px; cursor:pointer; font-size:10px; letter-spacing:0.14em; font-family:'IBM Plex Mono',monospace;">${aberto ? "OCULTAR DETALHES" : "VER DETALHES"}</button>
        ${aberto ? (det ? `<div style="margin-top:10px; padding-top:10px; border-top:1px solid var(--pk-border1); display:flex; flex-direction:column; gap:8px;">
          ${(det.despesas || []).map(d => {
            const glosada = d.status === "glosado";
            return `<div style="background:var(--pk-bg); border:1px solid var(--pk-border1); padding:8px 10px;">
              <div style="display:flex; justify-content:space-between; gap:8px;">
                <span style="font-size:12px; color:var(--pk-text); ${glosada ? "text-decoration:line-through; color:#F87171;" : ""}">${esc(d.categoria || "")}${d.subcategoria ? " · " + esc(d.subcategoria) : ""}</span>
                <span style="font-size:12px; white-space:nowrap; color:${glosada ? "#F87171" : "var(--pk-text)"}; ${glosada ? "text-decoration:line-through;" : ""}">${esc(brl(d.valor_total_cent))}</span>
              </div>
              ${d.descricao ? `<div class="small" style="color:var(--pk-text-dim); margin-top:2px;">${esc(d.descricao)}</div>` : ""}
              ${d.data ? `<div class="small" style="color:var(--pk-text-muted); margin-top:2px;">${esc(dtBR(d.data))}</div>` : ""}
              ${glosada && d.glosa_motivo ? `<div class="small" style="color:#F87171; margin-top:2px;">Glosada: ${esc(d.glosa_motivo)}</div>` : ""}
            </div>`;
          }).join("")}
          ${(det.historico || []).length ? `<div>
            <div class="small" style="color:var(--pk-text-muted); letter-spacing:0.18em; margin-bottom:6px;">HISTÓRICO</div>
            ${det.historico.map(h => `<div class="small" style="color:var(--pk-text-dim); margin-bottom:4px;">${esc(dtBR(h.created_at))} · ${esc((CUSTOS_ST[h.para] || {}).label || h.para || "")}${h.usuario_nome ? " por " + esc(h.usuario_nome) : ""}${h.observacao ? ": " + esc(h.observacao) : ""}</div>`).join("")}
          </div>` : ""}
        </div>` : `<div class="small" style="color:var(--pk-text-muted); margin-top:8px;">Carregando detalhes...</div>`) : ""}
      </div>`;
    }).join("")}</div>`;
    // Comprovante abre no visor in-app (app de campo nunca abre aba nova).
    box.querySelectorAll("[data-comp]").forEach(b => {
      b.onclick = () => {
        const l = lancs.find(x => x.id === b.dataset.comp);
        if (l && l.comprovante_url) abrirVisorAnexos([{ url: l.comprovante_url, nome: l.comprovante_nome || ("Comprovante " + (l.numero || "")) }], 0);
      };
    });
    box.querySelectorAll("[data-exp]").forEach(b => {
      b.onclick = async () => {
        const id = b.dataset.exp;
        if (abertos.has(id)){ abertos.delete(id); paint(); return; }
        abertos.add(id); paint();
        if (!detalhes[id]){
          try {
            const r = await fetchGestao(`${GESTAO_API}/api/custos/app/lancamentos/${encodeURIComponent(id)}?fiscal_id=${encodeURIComponent(meId)}`);
            if (r.ok) detalhes[id] = await r.json();
            else detalhes[id] = { despesas: [], historico: [] };
          } catch(_){ detalhes[id] = { despesas: [], historico: [] }; }
          if (abertos.has(id)) paint();
        }
      };
    });
  };
  paint();
}

// ── Ditado por voz: campo de texto ganha botão de gravação (SpeechRecognition pt-BR) ──
// Ícones em SVG inline (o padrão Parket é SVG, não emoji): microfone quando parado,
// quadrado cheio quando gravando.
const _ICO_MIC = `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><line x1="12" y1="18" x2="12" y2="22"></line></svg>`;
const _ICO_STOP = `<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"></rect></svg>`;
let _ditadoSr = null;
let _ditadoBtnAtivo = null;
document.addEventListener("click", (ev) => {
  const b = ev.target.closest(".pk-ditado");
  if (!b) return;
  ev.preventDefault();
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){ _appToast("Ditado por voz não funciona nesse navegador, use o Chrome."); return; }
  if (_ditadoBtnAtivo === b){ try { _ditadoSr && _ditadoSr.stop(); } catch(_){} return; }
  try { _ditadoSr && _ditadoSr.stop(); } catch(_){}
  const alvo = b.dataset.alvo ? document.querySelector(b.dataset.alvo) : b.previousElementSibling;
  if (!alvo) return;
  const sr = new SR();
  sr.lang = "pt-BR"; sr.continuous = true; sr.interimResults = false;
  sr.onresult = (e) => {
    for (let i = e.resultIndex; i < e.results.length; i++){
      if (e.results[i].isFinal){
        const t = ((e.results[i][0] && e.results[i][0].transcript) || "").trim();
        if (t){
          alvo.value = (alvo.value ? alvo.value + " " : "") + t;
          alvo.dispatchEvent(new Event("input", { bubbles: true }));
        }
      }
    }
  };
  sr.onend = () => {
    _ditadoSr = null;
    if (_ditadoBtnAtivo){
      _ditadoBtnAtivo.classList.remove("rec");
      _ditadoBtnAtivo.innerHTML = _ICO_MIC;
      _ditadoBtnAtivo.title = "Falar em vez de escrever";
      _ditadoBtnAtivo = null;
    }
  };
  sr.onerror = () => {};
  try {
    sr.start(); _ditadoSr = sr; _ditadoBtnAtivo = b;
    b.classList.add("rec"); b.innerHTML = _ICO_STOP; b.title = "Parar gravação";
  } catch(_){}
});
function _ditadoHtml(alvoSel){
  return `<button type="button" class="pk-ditado"${alvoSel ? ` data-alvo="${alvoSel}"` : ""} title="Falar em vez de escrever" aria-label="Gravar por voz">${_ICO_MIC}</button>`;
}
function _ditadoAnexar(inp){
  if (!inp || !inp.parentElement) return;
  if (!(window.SpeechRecognition || window.webkitSpeechRecognition)) return;
  const wrap = document.createElement("div");
  wrap.style.cssText = "display:flex; gap:6px; align-items:stretch;";
  const mt = inp.style.marginTop;
  if (mt){ wrap.style.marginTop = mt; inp.style.marginTop = "0"; }
  inp.parentElement.insertBefore(wrap, inp);
  wrap.appendChild(inp);
  inp.style.flex = "1"; inp.style.minWidth = "0"; inp.style.width = "auto";
  wrap.insertAdjacentHTML("beforeend", _ditadoHtml());
}

async function renderFiscalConferencia(){
  try { if (_rtChannel){ sb.removeChannel(_rtChannel); _rtChannel = null; } } catch(_){}
  const root = document.getElementById("root");
  if (!root) return;
  root.innerHTML = `<div class="card center"><span class="spinner"></span></div>`;
  renderBottomNav(); setActiveNav("mais");
  const cards = await fetchCardsDoFiscal();
  const cardIds = cards.map(c => c.id);
  const cardById = new Map(cards.map(c => [c.id, c]));
  const obraLbl = (cid) => { const c = cardById.get(cid); const oLeg = c ? obraSemUuid(c.obra, c.title) : ""; return c ? `${oLeg ? oLeg + " · " : ""}${c.title || ""}` : "-"; };
  const { data: hist } = cardIds.length
    ? await sb.from("instala_conferencias")
        .select("id, card_id, volume, status, obs, item_nome, prestador_nome, fiscal_nome, origem, created_at")
        .in("card_id", cardIds)
        .order("created_at", { ascending: false }).limit(40)
    : { data: [] };
  const STC = { ok: ["OK", "#34D399"], avaria: ["AVARIA", "#FBBF24"], falta: ["FALTA", "#ef4444"] };
  const labelItem = (it) => {
    const cat = String((it.meta && it.meta.categoria_raiz) || (it.categoria || "").split("||")[0] || "").trim();
    const prod = String((it.meta && it.meta.produto_header) || (it.descritivo || "").split("\n")[0] || "").trim();
    return [it.ordem, cat, prod].filter(Boolean).join(" · ") || "Item";
  };
  let rows = [];
  let modoItens = false;
  root.innerHTML = `
    <div style="padding:18px 16px 24px;">
      ${_btnVoltarMais}
      <h2 style="font-family:'Cinzel',serif; font-size:20px; letter-spacing:0.08em; margin:0 0 4px;">Conferência de material</h2>
      <p class="small" style="color:var(--pk-text-dim); letter-spacing:0.14em; text-transform:uppercase; margin:0 0 16px;">Confira item a item o que chegou na obra</p>
      <div style="background:var(--pk-card1); border:1px solid var(--pk-border1); padding:14px 14px; margin-bottom:20px;">
        <select id="_fcObra" style="width:100%; box-sizing:border-box; padding:11px 12px; background:var(--pk-bg); border:1px solid var(--pk-border1); color:var(--pk-text); font-size:13px; font-family:inherit;">
          <option value="">Qual obra?</option>
          ${cards.map(c => `<option value="${c.id}">${esc(`${obraSemUuid(c.obra, c.title) ? obraSemUuid(c.obra, c.title) + " " : ""}${c.title || ""}`.trim())}</option>`).join("")}
        </select>
        <div id="_fcObraInfo"></div>
        <div id="_fcCarregando" style="display:none; padding:12px; text-align:center;" class="small">Buscando a lista de material da obra…</div>
        <div id="_fcFallback" style="display:none;">
          <div class="small" style="color:var(--pk-text-dim); margin-top:10px; line-height:1.5;">Essa obra ainda não tem lista de material no gestão, confira por volume.</div>
          <input id="_fcQtd" type="number" inputmode="numeric" min="1" max="60" placeholder="Quantos volumes chegaram?" style="width:100%; box-sizing:border-box; padding:11px 12px; margin-top:8px; background:var(--pk-bg); border:1px solid var(--pk-border1); color:var(--pk-text); font-size:13px; font-family:inherit;">
        </div>
        <div id="_fcItens" style="display:flex; flex-direction:column; gap:8px; margin-top:12px;"></div>
        <div id="_fcMsg"></div>
        <button id="_fcEnviar" class="primary" style="display:none; width:100%; margin-top:12px; padding:13px 16px; font-size:11px; letter-spacing:0.16em;">REGISTRAR CONFERÊNCIA</button>
      </div>
      <p class="small" style="color:var(--pk-text-muted); letter-spacing:0.22em; margin:0 0 10px;">ÚLTIMAS CONFERÊNCIAS</p>
      <div id="_fcHist"></div>
    </div>`;
  const paintRows = () => {
    const box = document.getElementById("_fcItens");
    const btn = document.getElementById("_fcEnviar");
    if (!box) return;
    btn.style.display = rows.length ? "block" : "none";
    box.innerHTML = rows.map((r, i) => {
      const nTipo = rows.filter(x => x.tipo === r.tipo).length;
      const secao = (i === 0 || rows[i - 1].tipo !== r.tipo)
        ? (r.tipo === "produto" ? `MATERIAL DA OBRA (${nTipo})` : r.tipo === "insumo" ? `INSUMOS QUE VÃO PRA OBRA (${nTipo})` : null)
        : null;
      return `${secao ? `<div class="small" style="letter-spacing:0.16em; font-weight:700; color:var(--pk-text-muted); margin:8px 0 0 2px;">${secao}</div>` : ""}
      <div style="padding:10px 12px; background:var(--pk-bg); border:1px solid var(--pk-border1);">
        ${r.item_nome
          ? `<div style="font-size:12px; color:var(--pk-text); line-height:1.4; margin-bottom:8px;">${esc(r.item_nome)}${r.ambiente ? `<span class="small" style="display:block; color:var(--pk-text-muted); margin-top:2px;">${esc(r.ambiente)}</span>` : ""}</div>`
          : `<div style="font-size:11px; font-weight:700; margin-bottom:8px;">VOL ${i + 1}</div>`}
        <div style="display:flex; gap:8px;">
          ${Object.entries(STC).map(([v, [l, c]]) => `
            <button class="fc-st" data-i="${i}" data-v="${v}" style="flex:1; padding:7px 4px; font-size:9.5px; letter-spacing:0.08em; font-weight:600; cursor:pointer; font-family:'IBM Plex Mono',monospace; background:${r.status === v ? c : "transparent"}; color:${r.status === v ? "#0a0a0a" : "var(--pk-text-dim)"}; border:1px solid ${r.status === v ? c : "var(--pk-border1)"};">${l}</button>`).join("")}
        </div>
        ${r.status !== "ok" ? `
          <label style="display:flex; align-items:center; justify-content:center; gap:8px; padding:9px 12px; margin-top:8px; cursor:pointer; border:1px dashed ${r.foto ? "#34D399" : "#ef4444"}; color:${r.foto ? "#34D399" : "#ef4444"}; font-size:10px; letter-spacing:0.12em; font-family:'IBM Plex Mono',monospace;">
            ${r.foto ? "FOTO ANEXADA" : "FOTO OBRIGATÓRIA"}
            <input class="fc-foto" data-i="${i}" type="file" accept="image/*" capture="environment" style="display:none;">
          </label>
          <div style="display:flex; gap:6px; margin-top:6px;">
            <input id="_fcObs${i}" class="fc-obs" data-i="${i}" value="${esc(r.obs || "")}" placeholder="O que aconteceu com esse material?" style="flex:1; min-width:0; box-sizing:border-box; padding:9px 12px; background:var(--pk-card1); border:1px solid var(--pk-border1); color:var(--pk-text); font-size:12px; font-family:inherit;">
            ${_ditadoHtml(`#_fcObs${i}`)}
          </div>` : ""}
      </div>`;}).join("");
    box.querySelectorAll(".fc-st").forEach(b => { b.onclick = () => { rows[+b.dataset.i].status = b.dataset.v; paintRows(); }; });
    box.querySelectorAll(".fc-foto").forEach(f => { f.onchange = () => { rows[+f.dataset.i].foto = f.files && f.files[0] ? f.files[0] : null; paintRows(); }; });
    box.querySelectorAll(".fc-obs").forEach(o => { o.oninput = () => { rows[+o.dataset.i].obs = o.value; }; });
  };
  _obraPickerMount(document.getElementById("_fcObra"), cards);
  document.getElementById("_fcObra").onchange = async (ev) => {
    const cid = ev.target.value;
    rows = []; modoItens = false;
    document.getElementById("_fcFallback").style.display = "none";
    document.getElementById("_fcObraInfo").innerHTML = "";
    document.getElementById("_fcMsg").innerHTML = "";
    paintRows();
    if (!cid) return;
    document.getElementById("_fcCarregando").style.display = "block";
    let its = [], insumos = [], obra = null;
    try {
      const r = await fetchGestao(`${GESTAO_API}/api/instala/conferencia-lista/${cid}`);
      if (r.ok){
        const j = await r.json();
        obra = j.obra || null;
        insumos = j.insumos || [];
        its = (j.itens || []).filter(it => !String((it.meta && it.meta.categoria_raiz) || it.categoria || "").toUpperCase().includes("INSUMO"));
      }
    } catch(_){}
    document.getElementById("_fcCarregando").style.display = "none";
    if (obra){
      document.getElementById("_fcObraInfo").innerHTML = `
        <div style="margin-top:12px; padding:12px 14px; background:var(--pk-bg); border:2px solid var(--pk-text);">
          <div style="font-size:14px; font-weight:700; line-height:1.35;">${esc([obra.obra_code, obra.cliente].filter(Boolean).join(" · ") || "Obra")}</div>
          ${obra.endereco ? `<div class="small" style="color:var(--pk-text-dim); margin-top:4px; line-height:1.4;">${esc(obra.endereco)}</div>${endAcoesHtml(obra.endereco)}` : ""}
          ${obra.numero_proposta != null ? `<div class="small" style="color:var(--pk-text-muted); letter-spacing:0.1em; margin-top:4px;">PROPOSTA ${esc(String(obra.numero_proposta))}</div>` : ""}
        </div>`;
    }
    if (its.length || insumos.length){
      modoItens = true;
      rows = its.map(it => ({ item_id: String(it.id), item_nome: labelItem(it), ambiente: it.ambiente || null, status: "ok", foto: null, obs: "", tipo: "produto" }));
      for (const ins of insumos){
        rows.push({ item_id: `insumo:${ins.codigo || ins.descricao}`, item_nome: `${ins.descricao} · ${ins.qtd} ${String(ins.und || "UND").toUpperCase()}`, ambiente: null, status: "ok", foto: null, obs: "", tipo: "insumo" });
      }
    } else {
      document.getElementById("_fcFallback").style.display = "block";
      const qtdInp = document.getElementById("_fcQtd");
      qtdInp.value = "";
      qtdInp.oninput = () => {
        const n = Math.max(0, Math.min(60, parseInt(qtdInp.value || "0", 10) || 0));
        rows = Array.from({ length: n }, (_, i) => rows[i] || { item_id: null, item_nome: null, ambiente: null, status: "ok", foto: null, obs: "", tipo: "volume" });
        paintRows();
      };
    }
    paintRows();
  };
  const paintHist = () => {
    const box = document.getElementById("_fcHist");
    const lst = hist || [];
    if (!lst.length){ box.innerHTML = `<div class="card center" style="color:var(--pk-text-muted); padding:24px 16px;">Nenhuma conferência registrada.</div>`; return; }
    box.innerHTML = `<div style="display:flex; flex-direction:column; gap:6px;">${lst.map(c => {
      const [l, cor] = STC[c.status] || STC.ok;
      const quem = c.origem === "fiscal" ? `fiscal ${c.fiscal_nome || ""}`.trim() : (c.prestador_nome || "instalador");
      return `<div style="display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--pk-card1); border:1px solid var(--pk-border1);">
        <span style="color:${cor}; flex-shrink:0;">▣</span>
        <span style="flex:1; min-width:0; font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(c.item_nome || `VOL ${c.volume}`)} · ${esc(obraLbl(c.card_id))} <span class="small" style="color:var(--pk-text-muted);">(${esc(quem)})</span></span>
        <span style="font-size:9px; letter-spacing:0.1em; font-weight:700; color:${cor};">${l}</span>
        <span class="small" style="color:var(--pk-text-muted); white-space:nowrap;">${new Date(c.created_at).toLocaleDateString("pt-BR", { day:"2-digit", month:"2-digit" })}</span>
      </div>`;
    }).join("")}</div>`;
  };
  paintHist();
  document.getElementById("_fcEnviar").onclick = async () => {
    const btn = document.getElementById("_fcEnviar");
    const msg = document.getElementById("_fcMsg");
    const cid = document.getElementById("_fcObra").value;
    if (!cid){ msg.innerHTML = `<div class="err" style="margin-top:8px;">Escolha a obra.</div>`; return; }
    if (!rows.length){ msg.innerHTML = `<div class="err" style="margin-top:8px;">${modoItens ? "Nenhum item pra conferir." : "Informe quantos volumes chegaram."}</div>`; return; }
    const semFoto = rows.findIndex(r => r.status !== "ok" && !r.foto);
    if (semFoto >= 0){ msg.innerHTML = `<div class="err" style="margin-top:8px;">${esc(rows[semFoto].item_nome || `Volume ${semFoto + 1}`)}: foto é obrigatória pra avaria/falta.</div>`; return; }
    btn.disabled = true; btn.textContent = "ENVIANDO…"; msg.innerHTML = "";
    try {
      const volumes = [];
      for (let i = 0; i < rows.length; i++){
        const r = rows[i];
        let foto_url = null;
        if (r.foto) foto_url = await _fiscalUploadFoto("conferencia", cid, r.foto);
        volumes.push({ volume: i + 1, status: r.status, foto_url, obs: (r.obs || "").trim() || null, item_id: r.item_id, item_nome: r.item_nome });
      }
      const resp = await fetchGestao(`${GESTAO_API}/api/instala/conferencia`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          card_id: cid, prestador_id: null, prestador_nome: null,
          volumes, client_key: crypto.randomUUID(),
          origem: "fiscal", fiscal_nome: fiscalAtualNome() || "fiscal",
        }),
      });
      if (!resp.ok){ const j = await resp.json().catch(() => ({})); throw new Error(j.detail || "Falha ao registrar"); }
      const problemas = rows.filter(r => r.status !== "ok").length;
      msg.innerHTML = `<div class="ok" style="margin-top:8px; color:#34D399; font-size:12px;">Conferência registrada${problemas ? `: ${problemas} com problema ${problemas === 1 ? "virou" : "viraram"} ocorrência automática` : ": tudo OK"}.</div>`;
      const novos = rows.map((r, i) => ({
        id: `novo-${Date.now()}-${i}`, card_id: cid, volume: i + 1, status: r.status,
        obs: (r.obs || "").trim() || null, item_nome: r.item_nome, prestador_nome: null,
        fiscal_nome: fiscalAtualNome() || "fiscal", origem: "fiscal", created_at: new Date().toISOString(),
      }));
      (hist || []).unshift(...novos);
      rows = [];
      const _selFc = document.getElementById("_fcObra");
      _selFc.value = ""; if (_selFc._pickerPaint) _selFc._pickerPaint();
      const _infoFc = document.getElementById("_fcObraInfo"); if (_infoFc) _infoFc.innerHTML = "";
      document.getElementById("_fcFallback").style.display = "none";
      paintRows(); paintHist();
    } catch(e){
      msg.innerHTML = `<div class="err" style="margin-top:8px;">Não deu pra registrar (${esc(e.message || "sem detalhe")}). O que você marcou continua na tela: verifique o sinal e toque em Registrar conferência de novo.</div>`;
    } finally {
      btn.disabled = false; btn.textContent = "REGISTRAR CONFERÊNCIA";
    }
  };
}

/* ── Modal "Solicitar Compras" (paridade com gestao.parket.works/compras) ──
 * Will 03/09: o formulário da solicitação de material tem que ser exatamente o
 * do gestão, com todas as características — checkbox Ferramentas (sem projeto),
 * seletor de projeto com busca, linhas de material (item / qtd / justificativa
 * obrigatória por item), solicitante travado no perfil logado, pedido por,
 * setor, observações, e a MESMA ordem de validação do SolicitarComprasModal.
 * PKT-MAT-MODAL-COMPRAS-20260903. */

// Departamentos de destino (espelho de DEPT_OPTS do gestão; "·" no lugar do
// travessão porque texto visível da Parket não usa "-").
const COMPRAS_DEPT_OPTS = [
  { value: "marcenaria-ronaldo", label: "Marcenaria · Ronaldo" },
  { value: "lalamove-ronaldo",   label: "Lalamove / Frete · Ronaldo" },
  { value: "instalacao-taiara",  label: "Instalação · Taiara" },
  { value: "amostras-marco",     label: "Amostras · Marco Antônio" },
];

/* Status da solicitação de compras, espelho de SolicitacoesCompras.tsx do gestão
 * (COLUNA_LABEL / COLUNA_COR / statusBadge). O fiscal precisa ver na lista dele
 * exatamente o mesmo estágio que aparece no gestao.parket.works (Will 03/09).
 * PKT-MAT-STATUS-VIVO-20260903. */
const COMPRAS_COLUNA_LABEL = {
  "compras": { "entrada": "Solicitações", "cotacao": "Em Cotação",
    "aguarda-aprovacao": "Aguardando Liberação", "emissao-pedido": "Liberação ao Fornecedor",
    "em-transito": "Em Rota de Entrega", "recebimento-auditoria": "Recebido e Conferido",
    "concluido": "Finalizado" },
  "compras-taiara": { "entrada": "Entrada de Demandas", "cotacao": "Cotação e Priorização",
    "aguarda-aprovacao": "Interface Financeira", "emissao-pedido": "Emissão do Pedido",
    "em-transito": "Logística e Acompanhamento", "recebimento-auditoria": "Recebimento e Conferência",
    "concluido": "Finalizado", "amostras": "Amostras em Execução" },
  "compras-marco": { "solicitacao": "Solicitação", "em-execucao": "Em Execução",
    "amostra-pronta": "Amostra Pronta", "em-rota-entrega": "Em Rota de Entrega", "finalizado": "Finalizado" },
};
const COMPRAS_COLUNA_COR = {
  "entrada": "#6B7280", "cotacao": "#3B82F6", "aguarda-aprovacao": "#F59E0B",
  "emissao-pedido": "#8B5CF6", "em-transito": "#14B8A6", "recebimento-auditoria": "#F97316",
  "concluido": "#10B981", "amostras": "#EC4899",
  "solicitacao": "#6B7280", "em-execucao": "#3B82F6", "amostra-pronta": "#F59E0B",
  "em-rota-entrega": "#14B8A6", "finalizado": "#10B981",
};
/* Ordem real das colunas do kanban de compras, por departamento. O badge diz só
 * onde o pedido está agora; o fluxo diz quanto falta pra chegar no fim. */
const COMPRAS_FLUXO = {
  "compras": ["entrada", "cotacao", "aguarda-aprovacao", "emissao-pedido", "em-transito", "recebimento-auditoria", "concluido"],
  "compras-taiara": ["entrada", "cotacao", "aguarda-aprovacao", "emissao-pedido", "em-transito", "recebimento-auditoria", "concluido"],
  "compras-marco": ["solicitacao", "em-execucao", "amostra-pronta", "em-rota-entrega", "finalizado"],
};
/** Posição do card no fluxo do seu departamento; null quando a coluna está fora
 *  do caminho normal (ex: "amostras" da Taiara) ou o card saiu do kanban. */
function comprasProgresso(c){
  const fluxo = COMPRAS_FLUXO[c.dept_id || ""] || [];
  const idx = fluxo.indexOf(c.column_id || "");
  if (idx < 0) return null;
  const labels = COMPRAS_COLUNA_LABEL[c.dept_id] || {};
  return { idx, total: fluxo.length, etapas: fluxo.map(k => labels[k] || k) };
}
function comprasStatusBadge(c){
  if (c.column_id === null) return { label: "Removido do kanban", color: "#B85B4C" };
  const stt = String(c.status || "pendente").toLowerCase();
  if (stt === "rejeitado") return { label: "Rejeitado", color: "#EF4444" };
  const col = c.column_id || "";
  const lbl = (COMPRAS_COLUNA_LABEL[c.dept_id || ""] || {})[col];
  if (stt === "pendente" && (!col || col === "entrada" || col === "solicitacao"))
    return { label: "Pendente", color: "#F59E0B" };
  if (lbl) return { label: lbl, color: COMPRAS_COLUNA_COR[col] || "#10B981" };
  return { label: stt === "pendente" ? "Pendente" : "Aceito", color: stt === "pendente" ? "#F59E0B" : "#10B981" };
}

// Estilos equivalentes aos helpers do gestão (inputStyle/btnGhost/btnAccent).
// Input em 13px (e não 11px) porque aqui é celular em obra: fonte menor faz o
// iOS dar zoom no foco e afasta o dedo do alvo.
const _mcInput  = "padding:9px 10px; background:var(--pk-card2); border:1px solid var(--pk-border1); color:var(--pk-text); outline:none; font-family:inherit; font-size:13px; letter-spacing:0.04em; width:100%; box-sizing:border-box; min-width:0;";
const _mcLbl    = "font-family:'Cinzel',serif; font-size:8px; letter-spacing:0.22em; text-transform:uppercase; color:var(--pk-text-muted); display:block; margin-bottom:4px;";
const _mcGhost  = "background:transparent; color:var(--pk-text-dim); border:1px solid var(--pk-border1); padding:8px 14px; font-family:'Cinzel',serif; font-size:9px; letter-spacing:0.18em; text-transform:uppercase; cursor:pointer;";
const _mcAccent = "background:var(--pk-card2); color:var(--pk-accent); border:1px solid var(--pk-accent); padding:8px 14px; font-family:'Cinzel',serif; font-size:9px; letter-spacing:0.18em; text-transform:uppercase; cursor:pointer;";

// Lista de projetos do gestão (fonte do seletor). Cacheada: são ~2000 linhas e
// o modal pode abrir várias vezes na mesma sessão.
let _projGestaoCache = null;
async function _projetosGestao(){
  if (_projGestaoCache) return _projGestaoCache;
  const r = await fetchGestao(`${GESTAO_API}/api/projetos?limit=2000`);
  if (!r.ok) throw new Error(`Falha ao carregar projetos (${r.status})`);
  _projGestaoCache = (await r.json()).map(p => ({
    id: p.id, card_id: p.card_id, cliente: p.cliente || "",
    obra_code: p.obra_code || "", endereco: p.endereco || "",
    gestor_email: p.gestor_email || "",
  }));
  return _projGestaoCache;
}

/** Núcleo do formulário de compras, usado nos dois modos:
 *  - modal  : quem assume um pedido do time converte em solicitação de compras;
 *  - inline : o próprio fiscal pede material na página #material e o pedido vai
 *             DIRETO pro setor de compras (Will 03/09), sem passar por assumir.
 *  Os dois modos usam o mesmo estado, os mesmos campos e a mesma ordem de
 *  validação do SolicitarComprasModal do gestão; muda só o endpoint (cfg.rota)
 *  e a moldura (overlay x bloco na página). */
async function montarFormCompras(cfg){
  const inline = !!cfg.inline;
  let projetos = [];
  try { projetos = await _projetosGestao(); } catch(_) { projetos = []; }
  // Estado do form (equivalente aos useState do modal React).
  // cfg.preset (Will 08/09): form completo que o INSTALADOR preencheu no app
  // (payload jsonb da solicitação em análise). Quando presente, o fiscal abre
  // o modal já pré-preenchido pra aprovar sem redigitar; pedidos antigos sem
  // payload caem no fallback por cfg.itens (linhas de texto).
  const novoEstado = () => {
    const pre = cfg.preset || null;
    return {
    ferramentas: !!(pre && pre.ferramentas),
    // Projeto: o que o instalador escolheu (preset) ou, sem ele, o vinculado à obra
    selId: (pre && pre.projeto_id && (projetos.find(p => p.id === pre.projeto_id) || {}).id)
           || (projetos.find(p => p.card_id === (cfg.cardId || "")) || {}).id || "",
    departamento: (pre && pre.departamento) || "",
    // Solicitante = quem pediu em obra. Quem assume no verifica não entra no
    // nome do card (Will 03/09): o comprador precisa ver o autor do pedido.
    solicitante: (pre && pre.solicitante) || cfg.autor || "",
    pedidoPor: (pre && pre.pedido_por) || cfg.autor || "",
    setor: (pre && pre.setor) || "",
    prazo: (pre && pre.prazo) || "",
    obs: (pre && pre.obs) || cfg.obs || "",
    materiais: (pre && Array.isArray(pre.materiais) && pre.materiais.length)
      ? pre.materiais.map(m => ({ tipo: m.tipo || "", quantidade: m.quantidade || "", justificativa: m.justificativa || "" }))
      : String(cfg.itens || "").split("\n").map(l => l.trim()).filter(Boolean)
          .map(l => ({ tipo: l, quantidade: "", justificativa: `Pedido em obra por ${cfg.autor || "time"}` })),
    erro: "",
    ok: "",
    enviando: false,
    pickerOpen: false,
    pickerQ: "",
    };
  };
  let st = novoEstado();
  if (!st.materiais.length) st.materiais = [{ tipo: "", quantidade: "", justificativa: "" }];

  // Moldura: overlay no modo modal, bloco na própria página no modo inline
  let ov = cfg.host;
  if (!inline){
    ov = document.createElement("div");
    // Backdrop SEM click de fechar — modal com formulário não fecha em click-fora
    ov.style.cssText = "position:fixed; inset:0; z-index:300; background:rgba(0,0,0,0.55); display:flex; align-items:center; justify-content:center; padding:16px;";
    document.body.appendChild(ov);
  }
  const fechar = (v) => {
    if (inline){
      // Inline não some da tela: volta a ficar em branco pro próximo pedido
      st = novoEstado();
      if (!st.materiais.length) st.materiais = [{ tipo: "", quantidade: "", justificativa: "" }];
      if (v) st.ok = "Solicitação enviada pro setor de compras.";
      paint();
    } else {
      ov.remove();
    }
    if (cfg.onDone) cfg.onDone(v || null);
  };

  const projetoSel = () => projetos.find(p => p.id === st.selId) || null;
  const projetoLabel = (p) => `${p.obra_code ? p.obra_code + " · " : ""}${p.cliente}`;

  // Lista filtrada do seletor: alfabética por cliente, busca em cliente/código/endereço
  const filtrados = () => {
    const base = [...projetos].sort((a, b) =>
      (a.cliente || "").localeCompare(b.cliente || "", "pt-BR", { sensitivity: "base" }));
    const k = st.pickerQ.trim().toLowerCase();
    if (!k) return base;
    return base.filter(p => [p.cliente, p.obra_code, p.endereco].filter(Boolean).join(" ").toLowerCase().includes(k));
  };

  const paintPickerList = () => {
    const el = ov.querySelector("#_mcPickList");
    if (!el) return;
    const fl = filtrados();
    el.innerHTML = fl.length === 0
      ? `<div style="padding:12px 10px; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:var(--pk-text-muted); text-align:center;">Nenhum projeto</div>`
      : fl.slice(0, 400).map(p => `<button type="button" data-pick="${p.id}" style="display:block; width:100%; text-align:left; padding:8px 10px; cursor:pointer; background:${p.id === st.selId ? "rgba(150,132,115,0.13)" : "transparent"}; border:none; border-bottom:1px solid var(--pk-border1); color:var(--pk-text);">
          <div style="font-family:'Cinzel',serif; font-size:9px; letter-spacing:0.18em; text-transform:uppercase; color:${p.id === st.selId ? "var(--pk-accent)" : "var(--pk-text-muted)"};">${esc(p.obra_code || "sem código")}</div>
          <div style="font-size:11px; color:var(--pk-text); margin-top:2px;">${esc(p.cliente)}</div>
        </button>`).join("");
    el.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => {
      st.selId = b.dataset.pick; st.pickerOpen = false; st.pickerQ = ""; paint();
    });
  };

  const paint = () => {
    const p = projetoSel();
    // Corpo idêntico nos dois modos; só o cabeçalho (título + ×) é do modal
    const corpo = `
          ${inline ? "" : `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
            <div style="font-family:'Cinzel',serif; font-size:12px; letter-spacing:0.24em; text-transform:uppercase; color:var(--pk-text);">Solicitar Compras</div>
            <button id="_mcX" style="background:transparent; color:var(--pk-text-dim); border:1px solid var(--pk-border1); padding:3px 10px; font-family:'Cinzel',serif; font-size:12px; cursor:pointer;">×</button>
          </div>`}

          <label style="display:flex; align-items:center; gap:8px; margin-bottom:14px; cursor:pointer; padding:8px 10px; border:1px solid ${st.ferramentas ? "var(--pk-accent)" : "var(--pk-border1)"}; background:${st.ferramentas ? "rgba(150,132,115,0.08)" : "transparent"};">
            <input id="_mcFerr" type="checkbox" ${st.ferramentas ? "checked" : ""}>
            <span style="font-family:'Cinzel',serif; font-size:9px; letter-spacing:0.22em; text-transform:uppercase; color:${st.ferramentas ? "var(--pk-accent)" : "var(--pk-text-dim)"};">Ferramentas · sem projeto vinculado</span>
          </label>

          ${st.ferramentas
            ? `<div style="font-size:10px; color:var(--pk-text-muted); margin-bottom:14px; letter-spacing:0.04em;">Solicitação de <b style="color:var(--pk-text);">ferramentas</b>: vai pro kanban de compras sem vinculação a obra/projeto.</div>`
            : `<div style="margin-bottom:14px;">
                 <span style="${_mcLbl}">Projeto *</span>
                 <div style="position:relative;">
                   <button id="_mcPickBtn" type="button" style="${_mcInput} text-align:left; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:8px;">
                     <span style="color:${p ? "var(--pk-text)" : "var(--pk-text-muted)"}; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${p ? esc(projetoLabel(p)) : "Selecionar projeto…"}</span>
                     <span style="color:var(--pk-text-muted); font-size:10px;">${st.pickerOpen ? "▲" : "▼"}</span>
                   </button>
                   ${st.pickerOpen ? `<div style="position:absolute; top:100%; left:0; right:0; margin-top:4px; background:var(--pk-bg); border:1px solid var(--pk-border2); z-index:400; max-height:320px; display:flex; flex-direction:column; box-shadow:0 8px 24px rgba(0,0,0,0.35);">
                     <div style="padding:8px; border-bottom:1px solid var(--pk-border1);">
                       <input id="_mcPickQ" value="${esc(st.pickerQ)}" placeholder="Buscar por obra ou cliente…" style="${_mcInput}">
                     </div>
                     <div id="_mcPickList" style="overflow-y:auto; flex:1;"></div>
                   </div>` : ""}
                 </div>
               </div>`}

          <div class="mc-grid">
            <div>
              <span style="${_mcLbl}">Departamento de destino *</span>
              <select id="_mcDep" style="${_mcInput}">
                <option value="">selecionar</option>
                ${COMPRAS_DEPT_OPTS.map(o => `<option value="${o.value}" ${st.departamento === o.value ? "selected" : ""}>${esc(o.label)}</option>`).join("")}
              </select>
            </div>
            <div>
              <span style="${_mcLbl}">Prazo estimado de entrega *</span>
              <input id="_mcPrazo" type="date" value="${esc(st.prazo)}" style="${_mcInput}">
            </div>
            <div>
              <span style="${_mcLbl}">Solicitante *</span>
              <input id="_mcSolic" value="${esc(st.solicitante)}" style="${_mcInput}">
            </div>
            <div>
              <span style="${_mcLbl}">Pedido por *</span>
              <input id="_mcPedido" value="${esc(st.pedidoPor)}" placeholder="quem vai usar o material" style="${_mcInput}">
            </div>
            <div>
              <span style="${_mcLbl}">Setor</span>
              <input id="_mcSetor" value="${esc(st.setor)}" style="${_mcInput}">
            </div>
          </div>

          <span style="${_mcLbl}">Materiais *</span>
          <div id="_mcMats">
            ${st.materiais.map((m, i) => `<div class="mc-mat">
              <input data-mat="${i}" data-k="tipo" value="${esc(m.tipo)}" placeholder="Material / serviço" style="${_mcInput}">
              <input data-mat="${i}" data-k="quantidade" value="${esc(m.quantidade)}" placeholder="Qtd" style="${_mcInput}">
              <input data-mat="${i}" data-k="justificativa" value="${esc(m.justificativa)}" placeholder="Justificativa * (por quê / obra)" style="${_mcInput}">
              ${st.materiais.length > 1 ? `<button data-del="${i}" style="background:transparent; color:var(--pk-text-dim); border:1px solid var(--pk-border1); padding:4px 9px; font-family:'Cinzel',serif; font-size:11px; cursor:pointer;">×</button>` : ""}
            </div>`).join("")}
          </div>
          <button id="_mcAdd" style="${_mcGhost} margin-bottom:12px;">+ Material</button>

          <div style="margin-bottom:14px;">
            <span style="${_mcLbl}">Observações</span>
            <textarea id="_mcObs" rows="2" placeholder="opcional" style="${_mcInput} resize:vertical;">${esc(st.obs)}</textarea>
          </div>

          ${st.erro ? `<div style="font-size:11px; color:#B85B4C; margin-bottom:10px; letter-spacing:0.04em;">${esc(st.erro)}</div>` : ""}
          ${st.ok ? `<div style="font-size:11px; color:#4a7c59; margin-bottom:10px; letter-spacing:0.04em;">${esc(st.ok)}</div>` : ""}

          <div class="mc-acoes">
            <button id="_mcCancel" style="${_mcGhost}">${inline ? "Limpar" : "Cancelar"}</button>
            <button id="_mcOk" style="${_mcAccent} opacity:${st.enviando ? "0.5" : "1"}" ${st.enviando ? "disabled" : ""}>${st.enviando ? "Enviando…" : "Enviar solicitação"}</button>
          </div>`;
    ov.innerHTML = inline
      ? `<div class="mc-form" style="background:var(--pk-card1); border:1px solid var(--pk-border1); padding:14px;">${corpo}</div>`
      : `<div class="mc-form" style="background:var(--pk-bg); border:1px solid var(--pk-border2); width:640px; max-width:100%; max-height:90vh; overflow-y:auto; padding:20px;">${corpo}</div>`;
    bind();
    paintPickerList();
  };

  // Campos de texto escrevem direto no estado (sem repaint, pra não perder o foco);
  // só mudança estrutural (checkbox, +/- material, seletor) redesenha o form.
  const bind = () => {
    const q = (id) => ov.querySelector(id);
    const x = q("#_mcX"); if (x) x.onclick = () => fechar(null);
    q("#_mcCancel").onclick = () => fechar(null);
    q("#_mcFerr").onchange = (e) => { st.ferramentas = e.target.checked; if (e.target.checked) st.selId = ""; paint(); };
    const pb = q("#_mcPickBtn");
    if (pb) pb.onclick = () => { st.pickerOpen = !st.pickerOpen; paint(); };
    const pq = q("#_mcPickQ");
    if (pq){ pq.oninput = () => { st.pickerQ = pq.value; paintPickerList(); }; setTimeout(() => pq.focus(), 20); }
    q("#_mcDep").onchange = (e) => { st.departamento = e.target.value; };
    q("#_mcPrazo").oninput = (e) => { st.prazo = e.target.value; };
    const sl = q("#_mcSolic"); if (sl) sl.oninput = (e) => { st.solicitante = e.target.value; };
    q("#_mcPedido").oninput = (e) => { st.pedidoPor = e.target.value; };
    q("#_mcSetor").oninput = (e) => { st.setor = e.target.value; };
    q("#_mcObs").oninput = (e) => { st.obs = e.target.value; };
    _ditadoAnexar(q("#_mcObs")); // ditado por voz nas Observações, igual aos campos do laudo
    ov.querySelectorAll("[data-mat]").forEach(inp => {
      inp.oninput = () => { st.materiais[+inp.dataset.mat][inp.dataset.k] = inp.value; };
    });
    ov.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
      st.materiais = st.materiais.filter((_, j) => j !== +b.dataset.del); paint();
    });
    q("#_mcAdd").onclick = () => { st.materiais.push({ tipo: "", quantidade: "", justificativa: "" }); paint(); };
    q("#_mcOk").onclick = enviar;
  };

  // Mesma ordem de validação do gestão (mensagens idênticas)
  const enviar = async () => {
    const mats = st.materiais.filter(m => m.tipo.trim());
    const quem = st.solicitante.trim();
    const p = projetoSel();
    if (!st.ferramentas && !p){ st.erro = "Selecione o projeto ou marque Ferramentas."; paint(); return; }
    if (!st.departamento){ st.erro = "Selecione o departamento de destino."; paint(); return; }
    if (!quem){ st.erro = "Informe o solicitante."; paint(); return; }
    if (!st.pedidoPor.trim()){ st.erro = "Informe quem pediu o material (Pedido por)."; paint(); return; }
    if (mats.length === 0){ st.erro = "Informe ao menos um material."; paint(); return; }
    const semJust = mats.findIndex(m => !m.justificativa.trim());
    if (semJust >= 0){ st.erro = `Informe a justificativa do material ${semJust + 1} (por que precisa, obra/aplicação).`; paint(); return; }
    if (!st.prazo){ st.erro = "Informe o prazo estimado de entrega."; paint(); return; }
    st.erro = ""; st.ok = ""; st.enviando = true; paint();
    try {
      const r = await fetchGestao(cfg.rota, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(Object.assign({
          departamento: st.departamento,
          materiais: mats,
          prazo: st.prazo,
          solicitante: quem,
          pedido_por: st.pedidoPor.trim(),
          setor: st.setor.trim(),
          obs: st.obs,
          ferramentas: st.ferramentas,
          projeto_id: st.ferramentas ? null : p.id,
        }, cfg.extra || {}))
      });
      if (!r.ok){ const j = await r.json().catch(() => ({})); throw new Error(typeof j.detail === "string" ? j.detail : `Falha (${r.status})`); }
      fechar(await r.json());
    } catch(e){
      st.erro = `Não deu pra enviar (${e.message || e}). O pedido continua preenchido: verifique o sinal e toque em Enviar de novo.`; st.enviando = false; paint();
    }
  };

  paint();
}

async function renderFiscalMaterial(){
  try { if (_rtChannel){ sb.removeChannel(_rtChannel); _rtChannel = null; } } catch(_){}
  const root = document.getElementById("root");
  if (!root) return;
  const meId = _isAdmin ? _operandoComoId : (_fiscal && _fiscal.id);
  root.innerHTML = `<div class="card center"><span class="spinner"></span></div>`;
  renderBottomNav(); setActiveNav("mais");
  const cards = await fetchCardsDoFiscal();
  const cardById = new Map(cards.map(c => [c.id, c]));
  const obraLbl = (cid) => { const c = cardById.get(cid); const oLeg = c ? obraSemUuid(c.obra, c.title) : ""; return c ? `${oLeg ? oLeg + " · " : ""}${c.title || ""}` : "-"; };
  // Minhas solicitações vêm pelo gestão (e não direto do Cloud) porque a junção
  // com o card de compras precisa ler kanban_cards, bloqueado pro anon aqui.
  let lista = [];
  if (meId){
    try {
      const r = await fetchGestao(`${GESTAO_API}/api/instala/material/minhas?fiscal_id=${encodeURIComponent(meId)}&limit=30`);
      if (r.ok) lista = await r.json();
    } catch(_){}
    if (!lista.length){
      const { data } = await sb.from("instala_material_solicitacoes")
        .select("id, card_id, itens, status, created_at, foto_url")
        .eq("fiscal_id", meId)
        .order("created_at", { ascending: false }).limit(30);
      lista = data || [];
    }
  }
  // Fila de análise (Will 08/09): pedidos de INSTALADOR pendentes das obras
  // deste fiscal. O fiscal aprova (abre o form oficial pré-preenchido) ou
  // recusa (motivo volta pro instalador no app).
  let fila = [];
  if (meId){
    try {
      const rf = await fetchGestao(`${GESTAO_API}/api/instala/material/analise?fiscal_id=${encodeURIComponent(meId)}&limit=60`);
      if (rf.ok) fila = await rf.json();
    } catch(_){}
  }
  // Título das obras que não estão na carteira do fiscal logado
  const semTitulo = [...new Set((lista || []).map(s => s.card_id).filter(cid => cid && !cardById.has(cid)))];
  if (semTitulo.length){
    const { data: extras } = await sb.from("kanban_cards").select("id, title, obra").in("id", semTitulo);
    (extras || []).forEach(c => cardById.set(c.id, c));
  }
  root.innerHTML = `
    <div style="padding:18px 16px 24px;">
      ${_btnVoltarMais}
      <h2 style="font-family:'Cinzel',serif; font-size:20px; letter-spacing:0.08em; margin:0 0 4px;">Solicitar material</h2>
      <p class="small" style="color:var(--pk-text-dim); letter-spacing:0.14em; text-transform:uppercase; margin:0 0 16px;">Vai direto pro setor de compras</p>
      <div id="_fmForm" style="margin-bottom:20px;"></div>
      <div id="_fmFila"></div>
      <p class="small" style="color:var(--pk-text-muted); letter-spacing:0.22em; margin:0 0 10px;">SUAS SOLICITAÇÕES</p>
      <div id="_fmLista"></div>
    </div>`;
  let sols = lista || [];
  // Uma solicitação sem card de compras vinculado é das antigas (ou nasceu no
  // Instala e ainda não foi convertida): cai no status simples da tabela.
  const stInfo = (s) => s === "atendida" ? ["ATENDIDA", "#4a7c59"] : s === "recusada" ? ["RECUSADA", "#ef4444"] : ["PENDENTE", "#FBBF24"];
  const _dtBR = (v) => v ? new Date(v).toLocaleDateString("pt-BR", { day:"2-digit", month:"2-digit", year:"numeric" }) : "";
  let abertas = new Set();
  const paintLista = () => {
    const box = document.getElementById("_fmLista");
    if (!box) return;
    if (!sols.length){ box.innerHTML = `<div class="card center" style="color:var(--pk-text-muted); padding:24px 16px;">Nenhuma solicitação enviada.</div>`; return; }
    box.innerHTML = `<div style="display:flex; flex-direction:column; gap:8px;">${sols.map(s => {
      const cp = s.compra || null;
      // Status ao vivo do card de compras (igual gestao.parket.works); sem card
      // vinculado, o badge continua sendo o da própria solicitação de material.
      const bd = cp ? comprasStatusBadge(cp) : (() => { const [l, c] = stInfo(s.status); return { label: l, color: c }; })();
      // Posição no fluxo do kanban de compras: o badge diz onde está, a trilha diz quanto falta.
      const pg = cp ? comprasProgresso(cp) : null;
      const dt = new Date(s.created_at).toLocaleDateString("pt-BR", { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" });
      const obra = cp && (cp.cliente || cp.obra) ? (cp.obra_code ? cp.obra_code + " · " : "") + (cp.cliente || cp.obra) : obraLbl(s.card_id);
      const aberta = abertas.has(s.id);
      return `<div style="padding:12px 14px; background:var(--pk-card1); border:1px solid ${cp ? "var(--pk-border2)" : "var(--pk-border1)"};">
        <div style="display:flex; justify-content:space-between; gap:8px; margin-bottom:4px;">
          <span class="small" style="letter-spacing:0.1em; color:var(--pk-text-muted); text-transform:uppercase; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(obra)}</span>
          <span class="small" style="letter-spacing:0.12em; font-weight:600; white-space:nowrap; color:${bd.color};">${esc(bd.label.toUpperCase())}</span>
        </div>
        <div style="font-size:13px; color:var(--pk-text); line-height:1.5; white-space:pre-wrap;">${esc(s.itens)}</div>
        <div class="small" style="color:var(--pk-text-dim); margin-top:4px;">${dt}${cp && cp.responsavel ? ` · com ${esc(cp.responsavel)}` : ""}</div>
        ${pg ? `<div style="display:flex; gap:3px; margin-top:8px;">${pg.etapas.map((_, i) => `<div style="flex:1; height:4px; background:${i <= pg.idx ? bd.color : "var(--pk-border1)"};"></div>`).join("")}</div>
        <div class="small" style="color:var(--pk-text-dim); margin-top:4px;">Etapa ${pg.idx + 1} de ${pg.total}</div>` : ""}
        ${cp ? `<button data-det="${s.id}" style="background:transparent; border:1px solid var(--pk-border1); color:var(--pk-text-dim); padding:6px 12px; margin-top:8px; cursor:pointer; font-size:10px; letter-spacing:0.14em; font-family:'IBM Plex Mono',monospace;">${aberta ? "OCULTAR DETALHES" : "VER DETALHES"}</button>` : ""}
        ${cp && aberta ? `<div style="margin-top:10px; padding-top:10px; border-top:1px solid var(--pk-border1); display:flex; flex-direction:column; gap:8px;">
          <div class="small" style="color:var(--pk-text-dim);">Destino: ${esc(cp.departamento || "")} · Prazo: ${esc(_dtBR(cp.prazo)) || "sem prazo"}</div>
          ${pg ? `<div style="display:flex; flex-direction:column; gap:6px;">${pg.etapas.map((et, i) => {
            // Etapa cumprida ganha a cor do status; a atual fica em destaque; as futuras ficam apagadas.
            const feito = i < pg.idx, agora = i === pg.idx;
            return `<div style="display:flex; align-items:center; gap:8px;">
              <span style="width:8px; height:8px; flex:none; border-radius:50%; background:${feito || agora ? bd.color : "transparent"}; border:1px solid ${feito || agora ? bd.color : "var(--pk-border1)"};"></span>
              <span class="small" style="color:${agora ? "var(--pk-text)" : feito ? "var(--pk-text-dim)" : "var(--pk-text-muted)"}; font-weight:${agora ? "600" : "400"}; letter-spacing:0.06em;">${esc(et)}</span>
            </div>`;
          }).join("")}</div>` : ""}
          ${(cp.materiais || []).map(m => `<div style="background:var(--pk-bg); border:1px solid var(--pk-border1); padding:8px 10px;">
            <div style="font-size:12px; color:var(--pk-text);"><b>${esc(m.quantidade || "")}${m.quantidade ? " · " : ""}</b>${esc(m.tipo || "")}</div>
            ${m.justificativa ? `<div class="small" style="color:var(--pk-text-dim); font-style:italic; margin-top:2px;">${esc(m.justificativa)}</div>` : ""}
          </div>`).join("")}
          ${cp.obs ? `<div class="small" style="color:var(--pk-text-dim);">Observações: ${esc(cp.obs)}</div>` : ""}
          ${cp.motivo ? `<div class="small" style="color:#B85B4C;">Motivo: ${esc(cp.motivo)}</div>` : ""}
        </div>` : ""}
      </div>`;
    }).join("")}</div>`;
    box.querySelectorAll("[data-det]").forEach(b => b.onclick = () => {
      const id = b.dataset.det;
      if (abertas.has(id)) abertas.delete(id); else abertas.add(id);
      paintLista();
    });
  };
  paintLista();

  // ── Fila "PEDIDOS DOS INSTALADORES": aprovar abre o form oficial de compras
  // pré-preenchido com o payload que o instalador mandou; enviar converte a
  // pendência em compra oficial (com aprovado_por = fiscal). Recusar pede o
  // motivo, que aparece na lista do instalador. Seção some quando não há fila. ──
  const aprovarPedido = (sid) => {
    const s = fila.find(x => x.id === sid);
    if (!s) return;
    montarFormCompras({
      inline: false,
      autor: s.prestador_nome || "instalador",
      cardId: s.card_id || "",
      preset: s.payload || null,
      itens: s.itens || "",
      rota: `${GESTAO_API}/api/instala/material/${sid}/criar-compra`,
      extra: { aprovado_por: fiscalAtualNome() || "" },
      onDone: (res) => {
        if (!res) return;
        fila = fila.filter(x => x.id !== sid);
        paintFila();
      },
    });
  };
  const recusarPedido = async (sid) => {
    const motivo = prompt("Motivo da recusa (o instalador vai ver no app):");
    if (motivo === null) return;
    try {
      const r = await fetchGestao(`${GESTAO_API}/api/instala/material/${sid}/recusar`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ motivo: motivo.trim(), fiscal_nome: fiscalAtualNome() || "" }),
      });
      if (!r.ok){ const j = await r.json().catch(() => ({})); throw new Error(typeof j.detail === "string" ? j.detail : `Falha (${r.status})`); }
      fila = fila.filter(x => x.id !== sid);
      paintFila();
    } catch(e){ alert(`Não deu pra recusar (${e.message || e}). Verifique o sinal e tente de novo.`); }
  };
  const paintFila = () => {
    const box = document.getElementById("_fmFila");
    if (!box) return;
    if (!fila.length){ box.innerHTML = ""; return; }
    box.innerHTML = `
      <p class="small" style="color:#FBBF24; letter-spacing:0.22em; margin:0 0 10px;">PEDIDOS DOS INSTALADORES · ANALISAR</p>
      <div style="display:flex; flex-direction:column; gap:8px; margin-bottom:20px;">${fila.map(s => {
        const dt = new Date(s.created_at).toLocaleDateString("pt-BR", { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" });
        // Título vem junto do endpoint; sem obra (ferramentas) o card diz o modo
        const obra = s.obra_titulo ? `${s.obra_code ? s.obra_code + " · " : ""}${s.obra_titulo}` : (s.card_id ? obraLbl(s.card_id) : "Ferramentas");
        return `<div style="padding:12px 14px; background:var(--pk-card1); border:1px solid #FBBF24;">
          <div style="display:flex; justify-content:space-between; gap:8px; margin-bottom:4px;">
            <span class="small" style="letter-spacing:0.1em; color:var(--pk-text-muted); text-transform:uppercase; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(obra)}</span>
            <span class="small" style="letter-spacing:0.12em; font-weight:600; white-space:nowrap; color:#FBBF24;">AGUARDA ANÁLISE</span>
          </div>
          <div class="small" style="color:var(--pk-text-dim); margin-bottom:4px;">Pedido por ${esc(s.prestador_nome || "instalador")} · ${dt}</div>
          <div style="font-size:13px; color:var(--pk-text); line-height:1.5; white-space:pre-wrap;">${esc(s.itens || "")}</div>
          <div style="display:flex; gap:8px; margin-top:10px;">
            <button data-aprovar="${s.id}" style="${_mcAccent}">Aprovar e enviar</button>
            <button data-recusar="${s.id}" style="${_mcGhost}">Recusar</button>
          </div>
        </div>`;
      }).join("")}</div>`;
    box.querySelectorAll("[data-aprovar]").forEach(b => b.onclick = () => aprovarPedido(b.dataset.aprovar));
    box.querySelectorAll("[data-recusar]").forEach(b => b.onclick = () => recusarPedido(b.dataset.recusar));
  };
  paintFila();

  // Formulário do fiscal: mesma estrutura do "Solicitar Compras" do gestão e o
  // pedido segue direto pro setor de compras (Will 03/09), sem etapa de assumir.
  montarFormCompras({
    host: document.getElementById("_fmForm"), inline: true,
    autor: fiscalAtualNome() || "",
    rota: `${GESTAO_API}/api/instala/material/compra-direta`,
    extra: { fiscal_id: meId, fiscal_nome: fiscalAtualNome() || "" },
    onDone: (res) => {
      if (!res || !res.solicitacao) return;
      sols = [Object.assign({}, res.solicitacao, { compra: res.compra }), ...sols];
      paintLista();
    },
  });

}

// Dashboard clássico foi aposentado: qualquer refer interna a renderHome
// (menu/history) cai em renderHoje = painel OBRAS. Assim o botão voltar
// sempre volta pra OBRAS em vez de misturar duas telas iniciais.
const _dashboardOrig = renderHome;  // guarda referência caso precise algum dia
renderHome = function(){ return renderHoje(); };

// pushHist já definido acima (versão que usa history.state como fonte da verdade)

const _origRenderObraDetail = renderObraDetail;
renderObraDetail = async function(cardId){ await _origRenderObraDetail.apply(this, arguments); pushHist("obra", { id: cardId }); };

const _origRenderEditarLaudo = renderEditarLaudo;
renderEditarLaudo = async function(laudoId){ await _origRenderEditarLaudo.apply(this, arguments); pushHist("editar", { id: laudoId }); };

const _origRenderNovoLaudo = renderNovoLaudo;
renderNovoLaudo = async function(preset){ await _origRenderNovoLaudo.apply(this, arguments); pushHist("novo", { preset: preset || null }); };

const _origRenderCalendario = renderCalendario;
renderCalendario = async function(){ await _origRenderCalendario.apply(this, arguments); pushHist("calendario"); };
// Novas telas do bnav: cada troca de aba precisa empilhar pra o back voltar direito.
const _origRenderHoje = renderHoje;
renderHoje = async function(){ await _origRenderHoje.apply(this, arguments); pushHist("hoje"); };
const _origRenderIniciar = renderIniciarPlaceholder;
renderIniciarPlaceholder = async function(){ await _origRenderIniciar.apply(this, arguments); pushHist("iniciar"); };
const _origRenderRanking = renderRankingPlaceholder;
renderRankingPlaceholder = async function(){ await _origRenderRanking.apply(this, arguments); pushHist("ranking"); };
const _origRenderMaisMenu = renderMaisMenu;
renderMaisMenu = function(){ _origRenderMaisMenu.apply(this, arguments); pushHist("mais"); };
const _origRenderFiscalOcorr = renderFiscalOcorrencias;
renderFiscalOcorrencias = async function(){ await _origRenderFiscalOcorr.apply(this, arguments); pushHist("focc"); };

const _origRenderFiscalConf = renderFiscalConferencia;
renderFiscalConferencia = async function(){ await _origRenderFiscalConf.apply(this, arguments); pushHist("fconf"); };
const _origRenderFiscalMat = renderFiscalMaterial;
renderFiscalMaterial = async function(){ await _origRenderFiscalMat.apply(this, arguments); pushHist("fmat"); };
// Meus custos entra no histórico como as demais telas do menu (#custos).
const _origRenderFiscalCustos = renderFiscalCustos;
renderFiscalCustos = async function(){ await _origRenderFiscalCustos.apply(this, arguments); pushHist("fcst"); };
// Prestadores do menu entra no histórico como as demais telas (#prestadores).
const _origRenderFiscalPrest = renderFiscalPrestadores;
renderFiscalPrestadores = async function(){ await _origRenderFiscalPrest.apply(this, arguments); pushHist("fprest"); };
// Histórico do fiscal entra no back-stack (#historico) igual as outras telas do menu Mais.
const _origRenderFiscalHist = renderFiscalHistorico;
renderFiscalHistorico = async function(){ await _origRenderFiscalHist.apply(this, arguments); pushHist("fhist"); };

const _origRenderChecklistInicioObra = renderChecklistInicioObra;
renderChecklistInicioObra = async function(cardId, info){ await _origRenderChecklistInicioObra.apply(this, arguments); pushHist("checklist", { id: cardId, info: info || null }); };

// ╔══════════════════════════════════════════════════════════════╗
// ║ PWA service worker                                            ║
// ╚══════════════════════════════════════════════════════════════╝
if ("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch(err => console.warn("[SW]", err));
  });
}

boot();
</script>
