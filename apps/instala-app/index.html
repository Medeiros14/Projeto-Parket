<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <title>Parket Instala</title>
  <meta name="description" content="App de instaladores Parket — check-in, fotos e progresso da obra." />
  <meta name="robots" content="noindex, nofollow" />
  <style>
    html, body { height: 100%; margin: 0; background: #050505; }
    #root { height: 100%; }
    /* FAB do chat sempre acima da BottomNav (~96px + safe-area).
       Em mobile o widget força "top" inline (ignora bottom) — o seletor
       .pk-popover:not(.pk-open) ~ .pk-fab força top:auto e bottom fixo
       quando o painel está fechado, vencendo o cálculo inline. */
    .pk-fab {
      --pk-fab-bottom: calc(128px + env(safe-area-inset-bottom, 0px)) !important;
      --pk-fab-right: 16px !important;
    }
    .pk-popover:not(.pk-open) ~ .pk-fab {
      top: auto !important;
      left: auto !important;
      right: 16px !important;
      bottom: calc(128px + env(safe-area-inset-bottom, 0px)) !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script src="https://server.parket.works/app.js" data-parket-chat data-api="https://server.parket.works" defer></script>
</body>
</html>
