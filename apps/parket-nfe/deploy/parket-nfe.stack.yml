version: "3.8"

# Stack Swarm do parket-nfe (fiscal.parket.works)
# Deploy: docker stack deploy -c deploy/parket-nfe.stack.yml parket-nfe
# Build:  docker build -t parket-nfe:latest -f deploy/Dockerfile .

services:
  web:
    image: parket-nfe:latest
    networks:
      - network_public
    deploy:
      resources:
        limits:
          memory: 128M
      mode: replicated
      replicas: 1
      restart_policy: { condition: on-failure }
      update_config: { parallelism: 1, order: start-first, failure_action: rollback }
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public
        # HTTP -> redirect pra HTTPS
        - traefik.http.routers.parket-nfe-http.rule=Host(`fiscal.parket.works`)
        - traefik.http.routers.parket-nfe-http.entrypoints=web
        - traefik.http.routers.parket-nfe-http.middlewares=https-redirect
        # HTTPS
        - traefik.http.routers.parket-nfe.rule=Host(`fiscal.parket.works`)
        - traefik.http.routers.parket-nfe.entrypoints=websecure
        - traefik.http.routers.parket-nfe.tls=true
        - traefik.http.routers.parket-nfe.tls.certresolver=letsencryptresolver
        - traefik.http.services.parket-nfe.loadbalancer.server.port=80

networks:
  network_public:
    external: true
