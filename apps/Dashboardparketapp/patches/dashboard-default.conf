server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html;
    }

    # .js/.css: NUNCA cachear no browser — hotpatches reusam filenames, evita
    # versões stale travadas no disk cache do navegador
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        etag on;
    }

    # Assets binários que não mudam: cache longo
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Vídeo (proposta-publica/link): habilita range requests p/ streaming
    location ~* \.(mp4|webm|mov|m4v)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Accept-Ranges "bytes";
    }
}
