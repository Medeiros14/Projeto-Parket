proxy_cache_path /tmp/nginx-cache levels=1:2 keys_zone=rest_cache:10m max_size=100m inactive=10m use_temp_path=off;

# Gateway: roteia api.parket.works → diferentes backends.
# /rest/v1/*     → PostgREST self-host (conecta no Postgres compartilhado)
# /auth/v1/*     → proxy reverso pro Supabase (passa pelo Hetzner DE, evita problema ISP BR)
# /realtime/v1/* → proxy reverso pro Supabase Realtime
# /storage/v1/*  → proxy reverso pro Supabase Storage
# /valoria/rest/v1/* → proxy reverso pro Supabase da VALORIA (banco skbjmlzgaeupflujomzw)

map $http_origin $cors_origin {
  default "";
  "~^https?://([a-z0-9-]+\.)*parket\.(works|com\.br)$" $http_origin;
}

server {
  listen 80 default_server;
  server_name _;

  resolver 127.0.0.11 valid=30s ipv6=off;

  # Gzip — JSON do PostgREST comprime ~10x (2.3MB simulacao_itens → ~250KB).
  # Crítico pra reduzir tempo de transferência (banco já é rápido, gargalo é rede).
  gzip on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_vary on;
  gzip_types application/json text/plain text/css application/javascript application/vnd.pgrst.object+json application/vnd.pgrst.array+json;

  # Buffers grandes pra cabeçalhos de request/resposta — necessário pra queries com
  # IN(...) gigante: o request header passa do 8KB padrão e o PostgREST devolve
  # `Content-Location:` com a URL inteira no response, estourando proxy_buffer_size.
  large_client_header_buffers 8 32k;
  proxy_buffer_size 32k;
  proxy_buffers 8 32k;
  proxy_busy_buffers_size 64k;

  # Esconde CORS headers do upstream (PostgREST/GoTrue adicionam '*')
  # pra evitar duplo Access-Control-Allow-Origin que o browser rejeita.
  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Access-Control-Allow-Methods;
  proxy_hide_header Access-Control-Allow-Headers;
  proxy_hide_header Access-Control-Expose-Headers;
  proxy_hide_header Access-Control-Allow-Credentials;
  proxy_hide_header Access-Control-Max-Age;

  add_header Access-Control-Allow-Origin  $cors_origin always;
  add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD" always;
  add_header Access-Control-Allow-Headers "authorization,apikey,content-type,x-client-info,x-supabase-api-version,prefer,range,accept-profile,content-profile,x-upsert,cache-control,x-requested-with,x-wa-secret,x-retry-count" always;
  add_header Access-Control-Expose-Headers "content-range,x-total-count" always;
  add_header Access-Control-Allow-Credentials "true" always;
  add_header Access-Control-Max-Age "3600" always;

  if ($request_method = "OPTIONS") {
    return 204;
  }

  # ─── REST: PostgREST self-host (rede interna do stack) ─────────────────
  # Cache GETs em endpoints "públicos" (sem RLS por user): preços, KPIs, snapshots.
  # Authorization é incluído na cache_key pra anon vs authenticated não misturarem.
  # Cache 10s em simulacao_* — orçamentos não mudam por segundo, mas evita
  # repuxar 2.2 MB de simulacao_itens em cada navegação/re-render.
  # Não está em realtime publication → seguro cachear.
  # simulacao_itens: payload grande (até 2 MB) — mantém cache 2s pra evitar
  # re-pull em re-renders rápidos. Em <2s o user não percebe stale.
  location ~ ^/rest/v1/simulacao_itens$ {
    set $rest_upstream "http://rest-local:3000";
    rewrite ^/rest/v1/(.*)$ /$1 break;
    proxy_pass $rest_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;

    proxy_cache rest_cache;
    proxy_cache_methods GET HEAD;
    proxy_cache_key "$request_method$request_uri$http_authorization";
    proxy_cache_valid 200 2s;
    proxy_cache_use_stale updating error timeout;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;

    add_header Access-Control-Allow-Origin  $cors_origin always;
    add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD" always;
    add_header Access-Control-Allow-Headers "authorization,apikey,content-type,x-client-info,x-supabase-api-version,prefer,range,accept-profile,content-profile,x-upsert,cache-control,x-requested-with,x-wa-secret,x-retry-count" always;
    add_header Access-Control-Expose-Headers "content-range,x-total-count" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Max-Age "3600" always;
    add_header X-Cache-Status $upstream_cache_status always;
  }

  # simulacao_projetos: cache REMOVIDO (11/06) — quando user salvava CONDIÇÕES
  # DE PAGAMENTO / GARANTIA / PRAZOS e gerava PDF/link <10s depois, o PDF
  # mostrava valores antigos. Payload é pequeno (1 row), rest-local responde em ~10ms,
  # cache não compensa.

  location ~ ^/rest/v1/(orcamento_tabela_precos|dept_kpis_live|kpi_snapshots|catalogo_especies|catalogo_acabamentos|catalogo_reguas|catalogo_paredes|catalogo_substratos|empresas|departamentos|prestadores_categorias|orcamento_perfis|status_propostas)$ {
    set $rest_upstream "http://rest-local:3000";
    rewrite ^/rest/v1/(.*)$ /$1 break;
    proxy_pass $rest_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;

    proxy_cache rest_cache;
    proxy_cache_methods GET HEAD;
    proxy_cache_key "$request_method$request_uri$http_authorization";
    proxy_cache_valid 200 60s;
    proxy_cache_use_stale updating error timeout;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;

    # Replica CORS (add_header no location descarta os herdados do server)
    add_header Access-Control-Allow-Origin  $cors_origin always;
    add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD" always;
    add_header Access-Control-Allow-Headers "authorization,apikey,content-type,x-client-info,x-supabase-api-version,prefer,range,accept-profile,content-profile,x-upsert,cache-control,x-requested-with,x-wa-secret,x-retry-count" always;
    add_header Access-Control-Expose-Headers "content-range,x-total-count" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Max-Age "3600" always;
    add_header X-Cache-Status $upstream_cache_status always;
  }

  # NOTA: cache em /rest/v1/kanban_cards foi REMOVIDO (8/jun 21h) porque:
  # - Sala ao Vivo cria card, frontend lê e o cache de 3s servia stale (parecia que não criou).
  # - 504 timeouts apareceram em queries grandes (dept_id=in.(comercial,comercial-entrada)),
  #   provavelmente por interação com proxy_cache_lock.
  # Realtime via WS continua dando atualizações instantâneas — sem cache não há prejuízo
  # significativo de performance pra essa rota (queries vão direto no PostgREST).

  location /rest/v1/ {
    set $rest_upstream "http://rest-local:3000";
    rewrite ^/rest/v1/(.*)$ /$1 break;
    proxy_pass $rest_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
  }

  # ─── AUTH: GoTrue self-host (postgres local, sem restrição) ─────────────
  location /auth/v1/ {
    set $auth_upstream "http://auth:9999";
    rewrite ^/auth/v1/(.*)$ /$1 break;
    proxy_pass $auth_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
  }

  # ─── REALTIME: proxy WebSocket pro Realtime LOCAL ──────────────────────
  # /rest aponta pro rest-local (parket-pg-local); o realtime PRECISA escutar
  # o mesmo banco, senão writes locais nunca geram evento (bug kanban 06/08).
  # Host = realtime-dev.* resolve o tenant seedado (_realtime.tenants).
  location /realtime/v1/ {
    set $rt_upstream "http://realtime-local:4000";
    rewrite ^/realtime/v1/(.*)$ /socket/$1 break;
    proxy_pass $rt_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host realtime-dev.supabase-realtime;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
  }

  # ─── STORAGE: proxy pro Supabase Storage ───────────────────────────────
  location /storage/v1/ {
    set $supa_storage "https://hbxpilrxmitvzebluoom.supabase.co";
    proxy_pass $supa_storage;
    proxy_ssl_server_name on;
    proxy_ssl_name hbxpilrxmitvzebluoom.supabase.co;
    proxy_http_version 1.1;
    proxy_set_header Host hbxpilrxmitvzebluoom.supabase.co;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    client_max_body_size 500M;
  }

  # ─── VALORIA: proxy REST pro Supabase da Valoria ───────────────────────
  # O Home Broker le cards_solicitacao/simulacoes da Valoria pra mostrar o
  # valor real das propostas no Pipeline. Direto do navegador, o Supabase
  # falha em ISPs BR com roteamento quebrado (mesmo motivo deste gateway
  # existir) e o supabase-js falha SILENCIOSO (retorna .error, nao lanca),
  # entao o board aparecia sem valores. Passando por aqui, a rota sai do
  # Hetzner DE e sempre chega.
  location /valoria/rest/v1/ {
    set $valoria "https://skbjmlzgaeupflujomzw.supabase.co";
    rewrite ^/valoria/(.*)$ /$1 break;
    proxy_pass $valoria;
    proxy_ssl_server_name on;
    proxy_ssl_name skbjmlzgaeupflujomzw.supabase.co;
    proxy_http_version 1.1;
    proxy_set_header Host skbjmlzgaeupflujomzw.supabase.co;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # ─── FUNCTIONS: proxy pro Supabase Edge Functions ──────────────────────
  location /functions/v1/ {
    set $supa_func "https://hbxpilrxmitvzebluoom.supabase.co";
    proxy_pass $supa_func;
    proxy_ssl_server_name on;
    proxy_ssl_name hbxpilrxmitvzebluoom.supabase.co;
    proxy_http_version 1.1;
    proxy_set_header Host hbxpilrxmitvzebluoom.supabase.co;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    client_max_body_size 25M;
  }

  location /healthz {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location / {
    return 404 "{\"message\":\"Use /auth/v1, /rest/v1, /realtime/v1, /storage/v1 ou /functions/v1\"}";
    default_type application/json;
  }
}
