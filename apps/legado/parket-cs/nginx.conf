server {
    listen 80 default_server;
    server_name verifica.parket.works _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # APK pra download em /app/parket-fiscal.apk
    location = /app/parket-fiscal.apk {
        add_header Content-Disposition 'attachment; filename="parket-fiscal.apk"';
        types { application/vnd.android.package-archive apk; }
        default_type application/vnd.android.package-archive;
    }

    # index.html — NUNCA cachear (SPA, atualizações via deploy)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # SW: nunca cachear, sempre buscar versão nova
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # SPA fallback
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Assets binários: cache longo (icones/imagens)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Android App Links / TWA
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
    }
}
