version: "3.9"
networks:
  network_public:
    external: true
  internal:
    driver: overlay
    attachable: false

# Stack híbrida:
# - rest: PostgREST self-host (conecta direto no Postgres do Supabase)
# - gateway: nginx que serve REST localmente + proxy pra Supabase em Auth/Realtime/Storage
#
# Vantagem: bypass do problema do ISP brasileiro pra TUDO, porque cliente sempre
# acessa api.parket.works (no Hetzner DE), nunca os IPs do Supabase diretamente.

services:
  # GoTrue self-host apontando pro Postgres LOCAL (parket-pg_pg).
  # Schema auth original (sem restrição de permissão, como Supabase).
  auth:
    image: gotrue-patched:local
    networks: [internal]
    environment:
      GOTRUE_API_HOST: "0.0.0.0"
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: "https://api.parket.works"
      GOTRUE_SITE_URL: "https://space.parket.works"
      GOTRUE_URI_ALLOW_LIST: "https://space.parket.works,https://erp.parket.works,https://homebroker.parket.works,https://rh.parket.works,https://fiscal.parket.works,https://comercial.parket.works,https://core.parket.works,https://docusign.parket.works,https://auditoria.parket.works,https://devportal.parket.works,https://proposta.parket.works,https://draw.parket.works"
      GOTRUE_DB_DRIVER: "postgres"
      GOTRUE_DB_DATABASE_URL: "postgres://postgres:${LOCAL_PG_PASSWORD}@pg:5432/postgres?search_path=auth"
      GOTRUE_JWT_SECRET: "${JWT_SECRET}"
      GOTRUE_JWT_EXP: "604800"
      GOTRUE_JWT_DEFAULT_GROUP_NAME: "authenticated"
      GOTRUE_JWT_ADMIN_ROLES: "service_role"
      GOTRUE_JWT_AUD: "authenticated"
      GOTRUE_JWT_ISSUER: "https://hbxpilrxmitvzebluoom.supabase.co/auth/v1"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_LOG_LEVEL: "info"
      GOTRUE_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: "10"
    deploy:
      replicas: 1
      restart_policy: { condition: on-failure }
      resources: { limits: { memory: 256M } }

  rest:
    image: postgrest/postgrest:v12.2.3
    networks: [internal]
    environment:
      PGRST_DB_URI: "${DB_URL_TX}"
      PGRST_DB_SCHEMAS: "public,graphql_public,core,rh,signer,erp"
      PGRST_DB_EXTRA_SEARCH_PATH: "public,extensions,core,rh,signer,erp"
      PGRST_DB_ANON_ROLE: "anon"
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_JWT_SECRET: "${JWT_SECRET}"
      PGRST_JWT_AUD: "authenticated"
      PGRST_DB_MAX_ROWS: "5000"
      PGRST_SERVER_PORT: "3000"
      PGRST_ADMIN_SERVER_PORT: "3001"
      # Pooler em transaction mode (6543) não suporta prepared statements
      PGRST_DB_PREPARED_STATEMENTS: "false"
    deploy:
      replicas: 1
      restart_policy: { condition: on-failure }
      resources: { limits: { memory: 256M } }

  gateway:
    image: nginx:1.27-alpine
    networks: [internal, network_public]
    configs:
      - source: gateway_conf
        target: /etc/nginx/conf.d/default.conf
    deploy:
      replicas: 1
      restart_policy: { condition: on-failure }
      resources: { limits: { memory: 64M } }
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_public"
        - "traefik.http.routers.parket-api.rule=Host(`api.parket.works`)"
        - "traefik.http.routers.parket-api.entrypoints=websecure"
        - "traefik.http.routers.parket-api.tls=true"
        - "traefik.http.routers.parket-api.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.parket-api.loadbalancer.server.port=80"
        - "traefik.http.routers.parket-api-http.rule=Host(`api.parket.works`)"
        - "traefik.http.routers.parket-api-http.entrypoints=web"
        - "traefik.http.routers.parket-api-http.middlewares=https-redirect"

configs:
  gateway_conf:
    external: true
    name: parket_api_gateway_conf_v25
