server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.svg {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy EAS — Teca IA (valoria_assistant). Auth injetada server-side.
    location /api/eas/ {
        rewrite ^/api/eas/(.*)$ /$1 break;
        client_max_body_size 25m;
        proxy_pass https://os.parket.works;
        proxy_set_header Host os.parket.works;
        proxy_set_header Authorization "Bearer 2890733a7f12013eabe4d94813796e4f6bf4414b609ed35eead9b05a12a99387";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
