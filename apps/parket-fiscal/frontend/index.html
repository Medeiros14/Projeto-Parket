<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#050505" id="_pk_theme_color">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Parket Fiscal">
<title>Parket Fiscal · Laudos</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<script>
  /* Pré-hidratação — evita flash de tema no carregamento. */
  (function(){
    try {
      var t = localStorage.getItem("parket-fiscal-theme");
      var mode = (t === "light" ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", mode);
      var m = document.getElementById("_pk_theme_color");
      if (m) m.setAttribute("content", mode === "light" ? "#D8D3C7" : "#050505");
    } catch(e){}
  })();
</script>

<style>
  /* ═════════════════════════════════════════════════════════════════════════
     Parket Fiscal (verifica.parket.works)
     Design alinhado ao PARKET_DESIGN_SYSTEM.md (SO Parket / Manual Navona)
       → src/app/components/parket/ParketClientHub.tsx (DARK/LIGHT scheme)

     Tipografia:
       - Cinzel (400-600) → títulos (SEMPRE uppercase, PARKET_DESIGN_SYSTEM.md)
       - Cinzel (400-600) → labels uppercase micro (categoria, tabs, badges)
       - Inter (300-600) → body

     Structural: cards sólidos, cantos retos, status badges tinted+border/44 alpha
     ═════════════════════════════════════════════════════════════════════════ */
  :root, :root[data-theme="dark"] {
    --pk-bg:#050505;
    --pk-panel:#030303;
    --pk-card1:#0B0B0B;
    --pk-card2:#101010;
    --pk-border1:#1F1F1F;
    --pk-border2:#2A2A2A;
    --pk-text:#D8D3C7;
    --pk-text-dim:#77736A;
    --pk-text-muted:#5F5D58;
    --pk-accent:#968473;
    --pk-accent-dim:#7A6B5C;
    --pk-status-ok:#968473;    --pk-status-ok-bg:rgba(150,132,115,0.09);
    --pk-status-run:#C8BDB1;   --pk-status-run-bg:rgba(216,211,199,0.05);
    --pk-status-warn:#C8922A;  --pk-status-warn-bg:rgba(185,130,42,0.10);
    --pk-status-mut:#5F5D58;   --pk-status-mut-bg:rgba(95,93,88,0.10);
    --pk-status-err:#9B4A5A;   --pk-status-err-bg:rgba(120,50,60,0.10);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    /* LIGHT alinhado ao Homebroker / valor / gestao / contrato — Sistema
       Operacional Parket (Manual de Marca Navona). Valores pré-misturados
       das opacidades canônicas sobre Bege Travertino pra garantir visual
       idêntico ao das outras apps Parket.
       bg #D8D3C7 · sidebar #CBC6BA · card #E7E3D9 · text #050505 · accent Walnut */
    --pk-bg:#D8D3C7;              /* Bege Travertino */
    --pk-panel:#CBC6BA;            /* Bege Travertino -15 lumens */
    --pk-card1:#E7E3D9;            /* cardBg = Off White Mineral @ 0.55 sobre bg */
    --pk-card2:#EFECE3;            /* cardHover = Off White Mineral @ 0.85 sobre bg */
    --pk-border1:#C3BEB4;          /* border = Preto Navona @ 0.10 sobre bg */
    --pk-border2:#A5A298;          /* borderHover = Preto Navona @ 0.24 sobre bg */
    --pk-text:#050505;             /* Preto Navona */
    --pk-text-dim:#77736A;         /* Cinza Pedra */
    --pk-text-muted:#8E8B83;       /* Preto Navona @ 0.35 sobre bg */
    --pk-accent:#60544D;           /* Walnut — accent light (mais contraste em bege) */
    --pk-accent-dim:#40362F;       /* Walnut escurecido */
    --pk-status-ok:#60544D;    --pk-status-ok-bg:rgba(96,84,77,0.10);
    --pk-status-run:#77736A;   --pk-status-run-bg:rgba(119,115,106,0.10);
    --pk-status-warn:#9E7238;  --pk-status-warn-bg:rgba(158,114,56,0.12);
    --pk-status-mut:#8E8B83;   --pk-status-mut-bg:rgba(5,5,5,0.05);
    --pk-status-err:#8E3D3D;   --pk-status-err-bg:rgba(142,61,61,0.10);
    color-scheme: light;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-synthesis-weight:none; }
  html, body {
    margin:0; padding:0;
    background:var(--pk-bg); color:var(--pk-text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    min-height:100vh; min-height:100dvh; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    letter-spacing:0.02em;
  }

  /* Chat widget: FAB sempre acima da bnav Tripos (~108px). Regra forte
     porque o widget força "top" inline em mobile — vence via seletor sibling. */
  :root { --pk-fab-bottom: calc(128px + env(safe-area-inset-bottom, 0px)); }
  .pk-fab {
    --pk-fab-bottom: calc(128px + env(safe-area-inset-bottom, 0px)) !important;
    --pk-fab-right: 16px !important;
  }
  .pk-popover:not(.pk-open) ~ .pk-fab {
    top: auto !important; left: auto !important;
    right: 16px !important;
    bottom: calc(128px + env(safe-area-inset-bottom, 0px)) !important;
  }

  /* ─── Header fixo ─────────────────── */
  #_pkHeader {
    position:sticky; top:0; z-index:100; background:var(--pk-panel);
    border-bottom:1px solid var(--pk-border1);
    padding:14px 20px 10px; display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  #_pkHeaderLeft { display:flex; flex-direction:column; gap:2px; }
  #_pkBrand { font-family:'Cinzel',serif; font-size:13px; font-weight:300; color:var(--pk-text); letter-spacing:0.42em; text-transform:uppercase; }
  #_pkSubtitle { font-family:'Cinzel',serif; font-size:9px; color:var(--pk-text-muted); letter-spacing:0.28em; text-transform:uppercase; margin-top:4px; }
  #_pkHeaderRight { display:flex; align-items:center; gap:8px; }
  #_pkThemeBtn {
    background:transparent; border:1px solid var(--pk-border1); color:var(--pk-text-dim);
    padding:7px 12px; font-family:'Cinzel',serif; font-size:9px; letter-spacing:0.22em; text-transform:uppercase;
    cursor:pointer; display:inline-flex; align-items:center; gap:6px; border-radius:0;
    width:auto;
  }
  #_pkThemeBtn:hover { color:var(--pk-text); border-color:var(--pk-border2); }
  #_pkThemeBtn svg { width:11px; height:11px; }
  /* Alturas iguais no header (chip do user × botão tema) */
  #_pkThemeBtn, #user_chip button { height:30px; box-sizing:border-box; }
  #user_chip { display:flex; align-items:center; }
  #user_chip .tag { display:inline-flex; align-items:center; height:22px; box-sizing:border-box; }
  @media (max-width:720px){
    #_pkHeader { padding:10px 12px 8px; gap:6px 8px; flex-wrap:wrap; }
    #_pkBrand { font-size:11px; letter-spacing:0.3em; }
    #_pkSubtitle { font-size:7.5px; letter-spacing:0.16em; margin-top:3px; }
    #_pkHeaderRight { gap:6px; flex:1; justify-content:flex-end; min-width:0; }
    #user_chip { min-width:0; }
    #user_chip .tag { font-size:8px; padding:2px 6px; margin-right:4px !important; flex-shrink:0; }
    #user_chip button { font-size:10px !important; padding:6px 8px !important; height:28px; white-space:nowrap; }
    #_pkThemeBtn { width:28px; height:28px; padding:0; justify-content:center; gap:0; flex-shrink:0; }
    #_pkThemeLabel { display:none; }

    /* Stats sem estourar o card */
    .wrap { padding:12px; }
    .stats-row { gap:6px; }
    .stat { padding:12px 4px; }
    .stat .n { font-size:22px; }
    .stat .l { font-size:8px; letter-spacing:0.08em; margin-top:6px; white-space:normal; line-height:1.4; }

    /* Nomes nos cards: quebra linha em vez de cortar */
    .lcard { padding:12px; gap:10px; }
    .lcard .lcli { white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
    .lcard .lsub { white-space:normal; letter-spacing:0.12em; }
  }

  /* .wrap agora só é wrapper interno */
  .wrap { max-width: 620px; margin: 0 auto; padding: 16px 20px; }
  .logo { display:none; }  /* legacy — Header agora é o #_pkHeader */
  .sub  { display:none; }

  /* ─── Tipografia hero (Cinzel serif — SO Parket) ───────────── */
  .h1 { font-family:'Cinzel','Georgia',serif; font-size:21px; font-weight:400; color:var(--pk-text); margin: 16px 0 8px; line-height:1.15; letter-spacing:0.10em;text-transform:uppercase; }
  .h2 { font-family:'Cinzel','Georgia',serif; font-size:15px; font-weight:400; color:var(--pk-text); margin: 16px 0 8px; line-height:1.2; letter-spacing:0.12em;text-transform:uppercase; }
  .sect-title, .sect-h .t, .label {
    font-family:'Cinzel',serif; font-size:10px; color:var(--pk-text-muted);
    letter-spacing:0.24em; text-transform:uppercase; font-weight:500;
  }
  .sect-title { margin:18px 0 10px; }
  .value { font-size: 14px; color:var(--pk-text); font-weight:400; margin-top:5px; letter-spacing:0.005em; }

  /* ─── Cards sólidos estilo Command Center ───────────────────────────── */
  .card { background:var(--pk-card1); border:1px solid var(--pk-border1); border-radius:0; padding:20px; margin-top:12px; }
  .scard { background:var(--pk-card1); border:1px solid var(--pk-border1); border-radius:0; padding:16px 18px; margin-bottom:8px; }
  .scard h3 { font-family:'Cinzel',serif; font-size:11px; margin:0 0 12px; color:var(--pk-text-muted); letter-spacing:0.24em; text-transform:uppercase; font-weight:500; }
  .scard .rowi { display:flex; justify-content:space-between; padding:10px 0; border-top:1px solid var(--pk-border1); font-size:13px; gap:8px; }
  .scard .rowi:first-of-type { border-top:none; padding-top:0; }
  .scard .rowi .k { color:var(--pk-text-dim); letter-spacing:0.02em; }
  .scard .rowi .v { color:var(--pk-text); font-weight:400; text-align:right; max-width:60%; letter-spacing:0.005em; }

  /* ─── Botões ─────────────────────────────────────────────────────────── */
  button, .btn {
    background:transparent; border:1px solid var(--pk-border1); color:var(--pk-text-dim);
    border-radius:0; padding:13px 18px; font-size:11px; font-weight:500; cursor:pointer; width:100%;
    text-align:center; letter-spacing:0.18em; text-transform:uppercase;
    font-family:'Inter',sans-serif; transition:border-color 120ms, color 120ms, background 120ms;
  }
  button:active { transform: scale(0.98); }
  button:hover { color:var(--pk-text); border-color:var(--pk-border2); }
  button.primary { background:var(--pk-accent); border-color:var(--pk-accent); color:var(--pk-bg); font-weight:500; letter-spacing:0.22em; font-size:12px; }
  button.primary:hover { background:var(--pk-accent-dim); border-color:var(--pk-accent-dim); color:var(--pk-bg); }
  button.danger  { background:transparent; border-color:var(--pk-status-err); color:var(--pk-status-err); }
  button.ghost   { background:transparent; border-color:var(--pk-border1); color:var(--pk-text-dim); }

  input, select, textarea {
    width:100%; background:var(--pk-card2); border:1px solid var(--pk-border1); color:var(--pk-text);
    border-radius:0; padding:12px 14px; font-size:14px; font-family:'Inter',sans-serif; letter-spacing:0.005em;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color:var(--pk-accent); background:var(--pk-card1); }

  .err { color:var(--pk-status-err); font-size:12px; margin-top:10px; letter-spacing:0.02em; }
  .ok  { color:var(--pk-status-ok); font-size:12px; margin-top:10px; letter-spacing:0.02em; }
  .small { font-size: 11px; color: var(--pk-text-dim); letter-spacing:0.02em; }
  .center { text-align:center; }

  .spinner { display:inline-block; width:18px; height:18px; border:2px solid var(--pk-border1); border-top-color:var(--pk-accent); border-radius:50%; animation:spin 700ms linear infinite; }
  @keyframes spin { to{ transform: rotate(360deg); } }
  hr { border:none; border-top: 1px solid var(--pk-border1); margin: 14px 0; }

  /* ─── Status badges — pattern exato do Command Center Obra ──────────── */
  .pill, .tag, .stage-pill, .badge-warn {
    display:inline-flex; align-items:center; gap:6px;
    padding:4px 10px; border-radius:0;
    font-family:'Cinzel',serif; font-size:10px; font-weight:500;
    letter-spacing:0.18em; text-transform:uppercase;
    border:1px solid transparent;
  }
  .pill { border-color:var(--pk-border1); color:var(--pk-text-dim); background:transparent; }
  .badge-warn { background:var(--pk-status-warn-bg); border-color:rgba(200,146,42,0.28); color:var(--pk-status-warn); }

  /* ─── Checklist / Rows ───────────────────────────────────────────────── */
  .ck-row { display:flex; flex-direction:column; gap:6px; padding:12px 0; border-top:1px solid var(--pk-border1); }
  .ck-row:first-child { border-top:none; padding-top:0; }
  .ck-q { font-size:14px; color:var(--pk-text); line-height:1.5; letter-spacing:0.005em; }
  .ck-btns { display:flex; gap:6px; }
  .ck-btn {
    flex:1; padding:10px 8px; border-radius:0; font-family:'Cinzel',serif; font-size:11px; font-weight:500; cursor:pointer;
    border:1px solid var(--pk-border1); background:transparent; color:var(--pk-text-dim);
    letter-spacing:0.20em; text-transform:uppercase;
  }
  .ck-btn.sim.on { background:var(--pk-status-ok-bg); border-color:rgba(150,132,115,0.36); color:var(--pk-status-ok); }
  .ck-btn.nao.on { background:var(--pk-status-err-bg); border-color:rgba(155,74,90,0.36); color:var(--pk-status-err); }
  .ck-btn.na.on  { background:var(--pk-status-mut-bg); border-color:rgba(95,93,88,0.36); color:var(--pk-status-mut); }
  /* Observação do checklist: textarea (não input) pra o fiscal escrever em várias
     linhas. Começa com 3 linhas e cresce sozinha conforme ele digita (autoGrowObs). */
  .ck-obs {
    font-size: 13px; line-height:1.5; background:var(--pk-card2); border:1px solid var(--pk-border1);
    color:var(--pk-text); border-radius:0; padding:9px 12px;
    width:100%; box-sizing:border-box; font-family:inherit;
    min-height:64px; resize:vertical; overflow:hidden;
  }

  /* Botão de gravação do ditado por voz: quadrado ao lado do campo, com ícone de
     microfone em SVG (sem emoji). Em gravação ganha .rec: fica vermelho, troca o
     ícone pro quadrado de parar e pulsa pro fiscal ver de longe que está ouvindo. */
  .pk-ditado {
    flex-shrink:0; width:44px; align-self:stretch; min-height:40px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; background:var(--pk-card2);
    border:1px solid var(--pk-border1); color:var(--pk-text-dim);
    border-radius:0; padding:0; transition:color .15s, border-color .15s, background .15s;
  }
  .pk-ditado:active { background:var(--pk-card); }
  .pk-ditado svg { display:block; }
  .pk-ditado.rec {
    color:#ef4444; border-color:#ef4444; background:rgba(239,68,68,0.10);
    animation:pkRecPulse 1.4s ease-out infinite;
  }
  @keyframes pkRecPulse {
    0%   { box-shadow:0 0 0 0 rgba(239,68,68,0.45); }
    70%  { box-shadow:0 0 0 7px rgba(239,68,68,0); }
    100% { box-shadow:0 0 0 0 rgba(239,68,68,0); }
  }

  .banner { padding:12px 14px; border-radius:0; font-family:'Cinzel',serif; font-size:10px; font-weight:500; text-align:center; margin-top:14px; letter-spacing:0.18em; text-transform:uppercase; border:1px solid; }
  .banner.warn { background:var(--pk-status-warn-bg); border-color:rgba(200,146,42,0.28); color:var(--pk-status-warn); }
  .banner.ok   { background:var(--pk-status-ok-bg); border-color:rgba(150,132,115,0.36); color:var(--pk-status-ok); }
  .banner.err  { background:var(--pk-status-err-bg); border-color:rgba(155,74,90,0.36); color:var(--pk-status-err); }

  /* ─── Bottom nav estilo Tripos ────────────────────────────────────────── */
  body { padding-bottom: 108px; }
  .bnav {
    position:fixed; bottom:0; left:0; right:0; z-index:90;
    background:var(--pk-bg); border-top:3px solid var(--pk-text);
    display:flex; align-items:flex-end; justify-content:space-around;
    padding:12px 6px calc(12px + env(safe-area-inset-bottom, 0px));
    font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .bnav-item {
    flex:1 1 0%; display:flex; flex-direction:column; align-items:center; gap:6px;
    background:transparent; border:none; padding:0; cursor:pointer;
    color:var(--pk-text); opacity:0.42;
  }
  .bnav-item.on { opacity:1; }
  .bnav-item .lbl { font-size:8.5px; letter-spacing:0.1em; }
  .bnav-item svg { width:25px; height:25px; }
  .bnav-item.center { opacity:1; }
  .bnav-item.center .orb {
    width:58px; height:58px; border-radius:50%; margin-top:-22px;
    background:var(--pk-text); color:var(--pk-bg);
    box-shadow: var(--pk-text) 4px 4px 0px;
    border:3px solid var(--pk-text);
    display:flex; align-items:center; justify-content:center;
  }
  .bnav-item.center .orb svg { width:26px; height:26px; }

  /* ─── Jornada ────────────────────────────────────────────────────────── */
  .jh-tabs {
    display:flex; gap:0; margin-bottom:14px; background:transparent;
    border-bottom:1px solid var(--pk-border1); padding:0;
  }
  .jh-tab {
    flex:1; padding:13px 10px; text-align:center; font-family:'Cinzel',serif;
    font-size:11px; font-weight:500; color:var(--pk-text-muted); border-radius:0;
    cursor:pointer; border:none; background:transparent; width:auto;
    letter-spacing:0.22em; text-transform:uppercase;
    border-bottom:1px solid transparent; margin-bottom:-1px;
  }
  .jh-tab.on { color:var(--pk-accent); border-bottom-color:var(--pk-accent); }

  .obracard {
    background:var(--pk-card1); border:1px solid var(--pk-border1); border-radius:0;
    padding:14px 16px; margin-bottom:8px; cursor:pointer;
    display:flex; gap:12px; align-items:flex-start;
    transition:background 120ms, border-color 120ms;
  }
  .obracard:hover { background:var(--pk-card2); border-color:var(--pk-border2); }
  .obracard:active { background:var(--pk-card2); }
  .stage-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; margin-top:8px; }
  .obracard .info { flex:1; min-width:0; }
  .obracard .code { font-family:'Cinzel',serif; font-size:10px; color:var(--pk-accent); font-weight:500; letter-spacing:0.24em; text-transform:uppercase; }
  .obracard .cli  { font-family:'Cinzel',serif; font-size:13px; color:var(--pk-text); font-weight:400; margin-top:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; line-height:1.2; letter-spacing:0.08em;text-transform:uppercase; }
  .obracard .meta { font-size:12px; color:var(--pk-text-dim); margin-top:8px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; letter-spacing:0.005em; }

  .jheader {
    background:var(--pk-card1); border:1px solid var(--pk-border1); border-radius:0;
    padding:22px 20px; margin-bottom:16px;
  }
  .jheader .jh-code { font-family:'Cinzel',serif; font-size:10px; color:var(--pk-accent); font-weight:500; letter-spacing:0.28em; text-transform:uppercase; }
  .jheader .jh-cli  { font-family:'Cinzel',serif; font-size:19px; color:var(--pk-text); font-weight:400; margin-top:8px; letter-spacing:0.10em;text-transform:uppercase; line-height:1.15; }
  .jheader .jh-addr { font-size:12px; color:var(--pk-text-dim); margin-top:8px; letter-spacing:0.02em; line-height:1.5; }
  .jh-progress { margin-top:16px; }
  .jh-progress .lbl { display:flex; justify-content:space-between; font-family:'Cinzel',serif; font-size:10px; color:var(--pk-text-muted); margin-bottom:8px; text-transform:uppercase; letter-spacing:0.22em; }
  .jh-progress .bar  { height:2px; background:var(--pk-border1); border-radius:0; overflow:hidden; }
  .jh-progress .fill { height:100%; background:var(--pk-accent); border-radius:0; transition:width 0.5s; }

  .now-card, .next-visit {
    background:var(--pk-card1); border:1px solid var(--pk-border1); border-radius:0;
    padding:20px; margin-bottom:14px; cursor:pointer;
    transition:background 120ms;
  }
  .now-card:hover, .next-visit:hover { background:var(--pk-card2); }
  .now-card .pre, .next-visit .pre { font-family:'Cinzel',serif; font-size:10px; color:var(--pk-accent); letter-spacing:0.28em; text-transform:uppercase; font-weight:500; }
  .now-card .title, .next-visit .cli { font-family:'Cinzel',serif; font-size:16px; color:var(--pk-text); font-weight:400; margin-top:10px; letter-spacing:0.10em;text-transform:uppercase; line-height:1.2; }
  .next-visit .obra { font-size:12px; color:var(--pk-text-dim); margin-top:5px; letter-spacing:0.02em; }

<header id="_pkHeader">

  </div>
  <div id="_pkHeaderRight">

    <button id="_pkThemeBtn" type="button" title="Alternar tema" aria-label="Alternar tema">
      <svg id="_pkThemeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>

<script>
  /* Toggle Sun/Moon — persiste em localStorage e reflete no <html data-theme>. */
  (function(){
    var btn   = document.getElementById("_pkThemeBtn");
    var icon  = document.getElementById("_pkThemeIcon");
    var label = document.getElementById("_pkThemeLabel");
    var meta  = document.getElementById("_pk_theme_color");
    var SUN  = '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>';
    var MOON = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
    function paint(){
      var mode = document.documentElement.getAttribute("data-theme") || "dark";
      if (icon)  icon.innerHTML   = mode === "dark" ? SUN : MOON;
      if (label) label.textContent = mode === "dark" ? "Claro" : "Escuro";
      if (meta)  meta.setAttribute("content", mode === "light" ? "#D8D3C7" : "#050505");
    }
    if (btn) btn.onclick = function(){
      var cur = document.documentElement.getAttribute("data-theme") || "dark";
      var next = cur === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem("parket-fiscal-theme", next); } catch(e){}
      paint();
    };
    paint();
  })();
</script>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2.45.0";

const SUPABASE_URL = "https://hbxpilrxmitvzebluoom.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhieHBpbHJ4bWl0dnplYmx1b29tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5NDI1MjcsImV4cCI6MjA4ODUxODUyN30.ciZA1H-UvlYG2OPWqrFChj-_ttiFD5W5BmrST-gUJ-0";

const sb = createClient(SUPABASE_URL, SUPABASE_ANON, {
  auth: { persistSession: true, storageKey: "parket-fiscal-auth", autoRefreshToken: true },
});

// ═══ Editor de anotações sobre foto (canvas overlay) ═══
// Salva {strokes:[{color,size,points:[[nx,ny],...]}]} em fiscal_fotos.anotacoes.
// A imagem original NUNCA é tocada; anotações são camada re-editável.
// `descricaoInit` liga o comentário da foto ao mesmo editor: como as fotos agora
// sobem em massa sem passar por tela nenhuma, este é o único lugar onde o fiscal
// escreve o comentário depois. Salvar grava anotações e comentário de uma vez.
window.pfOpenAnnotator = function(fotoId, url, anotacoesInit, onSaved, descricaoInit){
  const COLORS = ["#ff2d2d","#ffd400","#00c853","#2979ff","#ffffff","#000000"];
  const SIZES = [3,6,12];
  let strokes = (anotacoesInit && Array.isArray(anotacoesInit.strokes)) ? JSON.parse(JSON.stringify(anotacoesInit.strokes)) : [];
  let color = COLORS[0], size = SIZES[1];
  let drawing = false, cur = null;

  const overlay = document.createElement("div");
  overlay.style.cssText = "position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;box-sizing:border-box";
  const shell = document.createElement("div");
  shell.style.cssText = "background:#0e0e0e;border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;max-width:100%;max-height:100%";
  overlay.appendChild(shell);

  const bar = document.createElement("div");
  bar.style.cssText = "display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:#aaa;font-size:11px";
  shell.appendChild(bar);

  function mkColorBtn(c){
    const b = document.createElement("button");
    b.style.cssText = `width:22px;height:22px;border-radius:50%;background:${c};border:2px solid ${color===c?'#fff':'rgba(255,255,255,0.2)'};cursor:pointer;padding:0`;
    b.onclick = () => { color = c; refreshBar(); };
    b.dataset.color = c;
    return b;
  }
  function mkSizeBtn(s){
    const b = document.createElement("button");
    b.style.cssText = `width:30px;height:22px;border-radius:6px;border:1px solid ${size===s?'#fff':'#333'};background:${size===s?'rgba(255,255,255,0.15)':'rgba(255,255,255,0.04)'};color:#fff;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center`;
    b.innerHTML = `<span style="width:${s}px;height:${s}px;background:#fff;border-radius:50%;display:block"></span>`;
    b.onclick = () => { size = s; refreshBar(); };
    b.dataset.size = String(s);
    return b;
  }
  const label1 = document.createElement("span"); label1.textContent = "Cor";
  const label2 = document.createElement("span"); label2.textContent = "Espessura"; label2.style.marginLeft = "8px";
  const spacer = document.createElement("div"); spacer.style.flex = "1";
  const btnUndo = document.createElement("button");
  btnUndo.textContent = "Desfazer";
  btnUndo.style.cssText = "padding:6px 10px;border-radius:6px;background:rgba(255,255,255,0.06);border:1px solid #333;color:#fff;cursor:pointer";
  btnUndo.onclick = () => { strokes.pop(); repaint(); };
  const btnClear = document.createElement("button");
  btnClear.textContent = "Limpar";
  btnClear.style.cssText = "padding:6px 10px;border-radius:6px;background:rgba(255,255,255,0.06);border:1px solid #333;color:#ff5252;cursor:pointer";
  btnClear.onclick = () => { strokes = []; repaint(); };
  const btnSave = document.createElement("button");
  btnSave.textContent = "Salvar";
  btnSave.style.cssText = "padding:6px 12px;border-radius:6px;background:#00c853;color:#000;font-weight:700;border:none;cursor:pointer";
  const btnClose = document.createElement("button");
  btnClose.textContent = "Fechar";
  btnClose.style.cssText = "padding:6px 10px;border-radius:6px;background:rgba(255,255,255,0.06);border:1px solid #333;color:#fff;cursor:pointer";
  btnClose.onclick = closeIt;

  bar.appendChild(label1);
  COLORS.forEach(c => bar.appendChild(mkColorBtn(c)));
  bar.appendChild(label2);
  SIZES.forEach(s => bar.appendChild(mkSizeBtn(s)));
  bar.appendChild(spacer);
  bar.appendChild(btnUndo); bar.appendChild(btnClear); bar.appendChild(btnSave); bar.appendChild(btnClose);

  function refreshBar(){
    bar.querySelectorAll('[data-color]').forEach(b => b.style.border = `2px solid ${b.dataset.color===color?'#fff':'rgba(255,255,255,0.2)'}`);
    bar.querySelectorAll('[data-size]').forEach(b => { b.style.border = `1px solid ${Number(b.dataset.size)===size?'#fff':'#333'}`; b.style.background = Number(b.dataset.size)===size?'rgba(255,255,255,0.15)':'rgba(255,255,255,0.04)'; });
  }

  const stage = document.createElement("div");
  stage.style.cssText = "position:relative;background:#000;border-radius:8px;overflow:hidden;align-self:center";
  shell.appendChild(stage);
  const info = document.createElement("div");
  info.style.cssText = "font-size:10px;color:#888;text-align:center";
  shell.appendChild(info);

  const descLbl = document.createElement("div");
  descLbl.textContent = "Comentário da foto";
  descLbl.style.cssText = "font-size:10px;color:#888;letter-spacing:0.06em;text-transform:uppercase";
  const descEl = document.createElement("textarea");
  descEl.rows = 2;
  descEl.placeholder = "O que essa foto mostra (opcional)";
  descEl.value = descricaoInit || "";
  descEl.style.cssText = "width:100%;box-sizing:border-box;padding:8px 10px;font-size:14px;line-height:1.4;background:#191919;border:1px solid #333;color:#fff;border-radius:6px;resize:vertical;font-family:inherit";
  shell.appendChild(descLbl); shell.appendChild(descEl);

  const img = new Image();
  const canvas = document.createElement("canvas");
  canvas.style.cssText = "position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair";
  const imgEl = document.createElement("img");
  imgEl.style.cssText = "position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none";
  imgEl.src = url; imgEl.draggable = false;
  stage.appendChild(imgEl); stage.appendChild(canvas);

  let layout = null;
  function computeLayout(w,h){
    const maxW = Math.min(window.innerWidth - 32, 1280);
    const maxH = window.innerHeight - 160;
    const r = w/h;
    let W = maxW, H = W/r;
    if (H > maxH) { H = maxH; W = H*r; }
    return { w: Math.floor(W), h: Math.floor(H) };
  }
  function repaint(){
    if (!layout) return;
    canvas.width = layout.w; canvas.height = layout.h;
    stage.style.width = layout.w+"px"; stage.style.height = layout.h+"px";
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0,0,layout.w,layout.h);
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    for (const s of strokes) {
      if (!s.points.length) continue;
      ctx.strokeStyle = s.color; ctx.lineWidth = s.size;
      ctx.beginPath();
      ctx.moveTo(s.points[0][0]*layout.w, s.points[0][1]*layout.h);
      for (let i=1;i<s.points.length;i++) ctx.lineTo(s.points[i][0]*layout.w, s.points[i][1]*layout.h);
      if (s.points.length === 1) { ctx.fillStyle = s.color; ctx.beginPath(); ctx.arc(s.points[0][0]*layout.w, s.points[0][1]*layout.h, Math.max(1,s.size/2), 0, Math.PI*2); ctx.fill(); }
      else ctx.stroke();
    }
    info.textContent = strokes.length + " traço" + (strokes.length===1?"":"s") + " · desenhe direto na foto · toque/arraste";
  }
  img.onload = () => {
    layout = computeLayout(img.naturalWidth || 800, img.naturalHeight || 600);
    repaint();
  };
  img.onerror = () => { layout = computeLayout(800, 600); repaint(); };
  img.src = url;

  function ptNorm(ev){
    const r = canvas.getBoundingClientRect();
    return [Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width)), Math.max(0,Math.min(1,(ev.clientY-r.top)/r.height))];
  }
  canvas.addEventListener("pointerdown", ev => {
    ev.preventDefault();
    canvas.setPointerCapture(ev.pointerId);
    drawing = true;
    cur = { color, size, points: [ptNorm(ev)] };
    strokes.push(cur);
    repaint();
  });
  canvas.addEventListener("pointermove", ev => {
    if (!drawing) return;
    cur.points.push(ptNorm(ev));
    repaint();
  });
  const stopDraw = ev => { if (!drawing) return; drawing = false; cur = null; try{canvas.releasePointerCapture(ev.pointerId);}catch(e){} };
  canvas.addEventListener("pointerup", stopDraw);
  canvas.addEventListener("pointercancel", stopDraw);

  btnSave.onclick = async () => {
    btnSave.textContent = "Salvando...";
    btnSave.disabled = true;
    try {
      const anot = { strokes };
      const desc = descEl.value.trim() || null;
      const { error } = await sb.from("fiscal_fotos").update({ anotacoes: anot, descricao: desc }).eq("id", fotoId);
      if (error) throw error;
      if (typeof onSaved === "function") onSaved(anot, desc);
      closeIt();
    } catch (e) {
      alert("Erro ao salvar: " + (e.message||e));
      btnSave.textContent = "Salvar";
      btnSave.disabled = false;
    }
  };

  function closeIt(){ document.body.removeChild(overlay); }
  overlay.addEventListener("mousedown", ev => { if (ev.target === overlay) closeIt(); });
  document.body.appendChild(overlay);
};

// fetch pro gestão com timeout de 15s (AbortController). Em 4G fraco o fetch
// cru fica pendurado por minutos e a seção some da tela sem explicação.
// GET ganha 1 retentativa automática (1,2s depois); POST/PATCH NÃO retenta
// sozinho: se o request chegou no servidor e só a resposta se perdeu, retentar
// duplicaria o registro. Erro de servidor (4xx/5xx) volta pro chamador decidir.
async function fetchGestao(url, opts){
  const metodo = ((opts && opts.method) || "GET").toUpperCase();
  const podeRetentar = metodo === "GET";
  for (let tent = 0; ; tent++){
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 15000);
    try {
      return await fetch(url, { ...(opts || {}), signal: ctrl.signal });
    } catch (e) {
      if (!podeRetentar || tent >= 1) throw e;
      await new Promise(r => setTimeout(r, 1200));
    } finally {
      clearTimeout(t);
    }
  }
}

// ── Anexos do agendamento (fiscal_agenda.attachments) ─────────────
// Visor fullscreen no padrão dos apps de campo: documento NUNCA abre em aba
// nova. Imagem = tap alterna zoom 1<->2.6; PDF = iframe. Fecha pelo botão
// FECHAR, pelo voltar do celular (popstate) ou Esc; setas navegam.
function abrirVisorAnexos(anexos, startIdx){
  const lista = (anexos || []).filter(a => a && a.url);
  if (!lista.length) return;
  let idx = Math.min(Math.max(startIdx || 0, 0), lista.length - 1);
  let zoom = 1;
  const overlay = el(`<div style="position:fixed;inset:0;z-index:9000;background:#0a0a0a;display:flex;flex-direction:column">
    <div style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,0.12);flex-shrink:0">
      <div data-nome style="flex:1;color:#fff;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></div>
      <div data-cont style="color:#9CA3AF;font-size:12px;flex-shrink:0"></div>
      <button data-fechar style="width:auto;background:transparent;border:1px solid rgba(255,255,255,0.3);color:#fff;font-size:11px;font-weight:700;letter-spacing:0.08em;padding:6px 12px;border-radius:4px;cursor:pointer">FECHAR</button>
    </div>
    <div data-corpo style="flex:1;overflow:auto;display:flex;-webkit-overflow-scrolling:touch"></div>
    <div style="display:flex;gap:1px;flex-shrink:0;border-top:1px solid rgba(255,255,255,0.12)">
      <button data-ant style="flex:1;background:#161616;border:none;color:#fff;font-size:12px;font-weight:700;letter-spacing:0.08em;padding:14px;cursor:pointer">ANTERIOR</button>
      <button data-prox style="flex:1;background:#161616;border:none;color:#fff;font-size:12px;font-weight:700;letter-spacing:0.08em;padding:14px;cursor:pointer">PRÓXIMA</button>
    </div>
  </div>`);
  document.body.appendChild(overlay);
  const prevOverflow = document.body.style.overflow;
  document.body.style.overflow = "hidden";
  const corpo = overlay.querySelector("[data-corpo]");
  // Imagem = tap-zoom; QUALQUER outra coisa (PDF, vídeo, página web, Drive) = iframe.
  // Antes o teste era "é PDF?"; invertemos pra "é imagem?" pra cobrir docs, laudos
  // e o viewer do mapa ao vivo sem cair no <img> quebrado.
  const isImg = (a) => /^image\//i.test(a.content_type || "") || /\.(png|jpe?g|webp|gif|heic|avif)(\?|$)/i.test(a.url || "");
  const isVideo = (a) => /^video\//i.test(a.content_type || "") || /\.(mp4|webm|mov)(\?|$)/i.test(a.url || "");
  // Google Drive bloqueia iframe em /view, mas o /preview do MESMO arquivo embeda.
  const iframeUrl = (u) => u.replace(/^(https:\/\/drive\.google\.com\/file\/d\/[^/]+)\/view.*$/, "$1/preview");
  function render(){
    const a = lista[idx];
    overlay.querySelector("[data-nome]").textContent = a.nome || "Anexo";
    overlay.querySelector("[data-cont]").textContent = `${idx + 1} de ${lista.length}`;
    overlay.querySelector("[data-ant]").style.opacity = idx === 0 ? "0.35" : "1";
    overlay.querySelector("[data-prox]").style.opacity = idx === lista.length - 1 ? "0.35" : "1";
    zoom = 1;
    corpo.innerHTML = "";
    if (isImg(a)){
      const img = document.createElement("img");
      img.src = a.url;
      img.alt = a.nome || "";
      img.style.cssText = "width:100%;height:auto;margin:auto;display:block;transition:width 0.15s";
      img.onclick = () => { zoom = zoom === 1 ? 2.6 : 1; img.style.width = (zoom * 100) + "%"; };
      corpo.appendChild(img);
    } else if (isVideo(a)){
      const v = document.createElement("video");
      v.src = a.url;
      v.controls = true; v.playsInline = true;
      v.style.cssText = "width:100%;max-height:100%;margin:auto;display:block;background:#000";
      corpo.appendChild(v);
    } else {
      const f = document.createElement("iframe");
      f.src = iframeUrl(a.url);
      f.setAttribute("allow", "fullscreen");
      f.style.cssText = "flex:1;border:none;background:#fff;width:100%";
      corpo.appendChild(f);
    }
  }
  const nav = (d) => { const n = idx + d; if (n < 0 || n >= lista.length) return; idx = n; render(); };
  overlay.querySelector("[data-ant]").onclick = () => nav(-1);
  overlay.querySelector("[data-prox]").onclick = () => nav(1);
  // Entrada no histórico: o voltar do celular fecha o visor em vez de sair do app.
  history.pushState({ visorAnexos: 1 }, "");
  let fechado = false;
  function fechar(viaPop){
    if (fechado) return; fechado = true;
    overlay.remove();
    document.body.style.overflow = prevOverflow;
    window.removeEventListener("popstate", onPop);
    document.removeEventListener("keydown", onKey);
    if (!viaPop) history.back();
  }
  function onPop(){ fechar(true); }
  function onKey(e){
    if (e.key === "Escape") fechar(false);
    else if (e.key === "ArrowLeft") nav(-1);
    else if (e.key === "ArrowRight") nav(1);
  }
  window.addEventListener("popstate", onPop);
  document.addEventListener("keydown", onKey);
  overlay.querySelector("[data-fechar]").onclick = () => fechar(false);
  render();
}

      </div>

        <button class="ghost" data-cancel style="width:100%">Cancelar</button>
      </div>
    </div>
  </div>`);
  document.body.appendChild(overlay);
  const prevFabBottom = document.body.style.getPropertyValue("--pk-fab-bottom");
  document.body.style.setProperty("--pk-fab-bottom", "200vh");
  const closeAndRestore = () => {
    overlay.remove();
    if (prevFabBottom) document.body.style.setProperty("--pk-fab-bottom", prevFabBottom);
    else document.body.style.removeProperty("--pk-fab-bottom");
  };
  const chipsBox = overlay.querySelector("[data-chips]");
  const renderChips = () => {
    const todas = [...AGENDA_TAGS_PADRAO, ...tags.filter(t => !AGENDA_TAGS_PADRAO.includes(t))];
    chipsBox.innerHTML = "";
    for (const t of todas){
      const on = tags.includes(t);
      const b = el(`<button style="width:auto;font-size:13px;font-weight:600;padding:7px 12px;border-radius:6px;cursor:pointer;border:1px solid ${on ? "var(--pk-accent)" : "var(--pk-border1)"};background:${on ? "var(--pk-accent)" : "var(--pk-card2)"};color:${on ? "#fff" : "var(--pk-text)"}">${esc(t)}</button>`);
      b.onclick = () => { tags = on ? tags.filter(x => x !== t) : [...tags, t]; renderChips(); };
      chipsBox.appendChild(b);
    }
  };
  renderChips();
  const inputNova = overlay.querySelector("[data-nova]");
  const addNova = () => {
    const v = inputNova.value.trim();
    if (!v) return;
    if (!tags.some(t => t.toLowerCase() === v.toLowerCase())) tags = [...tags, v];
    inputNova.value = "";
    renderChips();
  };
  overlay.querySelector("[data-add]").onclick = addNova;
  inputNova.onkeydown = (ev) => { if (ev.key === "Enter"){ ev.preventDefault(); addNova(); } };
  overlay.querySelector("[data-cancel]").onclick = closeAndRestore;
  const btnSave = overlay.querySelector("[data-save]");
  btnSave.onclick = async () => {
    btnSave.disabled = true; btnSave.textContent = "Salvando…";
    const { error } = await sb.from("fiscal_agenda").update({ tags }).eq("id", agenda.id);
    if (error){ _appToast("Erro ao salvar tags: " + error.message); btnSave.disabled = false; btnSave.textContent = "Salvar tags"; return; }
    agenda.tags = tags;
    closeAndRestore();
    if (onSaved) onSaved(tags);
  };
}

// ║ Editor de foto — desenhar (estilo WhatsApp) + texto           ║
// ║ Retorna File (jpeg comprimido) com a foto + desenhos          ║
// ╚══════════════════════════════════════════════════════════════╝
async function openPhotoEditor(file){
  return new Promise(async (resolve) => {
    // Carrega imagem
    const dataUrl = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result); r.onerror = () => rej(new Error("Falha ao ler"));
      r.readAsDataURL(file);
    });
    const img = await new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => res(im); im.onerror = () => rej(new Error("Img inválida"));
      im.src = dataUrl;
    });

    // Modal fullscreen
    const overlay = document.createElement("div");
    overlay.style.cssText = "position:fixed;inset:0;z-index:10000;background:#000;display:flex;flex-direction:column";

    // Top bar — cores + ferramentas
    const top = document.createElement("div");
    top.style.cssText = "background:rgba(0,0,0,0.6);padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap";
    const COLORS = ["#FF3B30","#FFCC00","#34C759","#FFFFFF","#000000","#0A84FF"];
    let curColor = "#FF3B30";
    let curWidth = 4;
    let mode = "pen"; // "pen" | "text"

    const colorBtns = COLORS.map(c => {
      const b = document.createElement("button");
      b.style.cssText = `width:28px;height:28px;border-radius:50%;background:${c};border:2px solid ${c===curColor?"#fff":"transparent"};padding:0;cursor:pointer`;
      b.onclick = (ev) => { ev.preventDefault(); curColor = c; colorBtns.forEach((bb,i) => bb.style.border = `2px solid ${COLORS[i]===curColor?"#fff":"transparent"}`); };
      top.appendChild(b);
      return b;
    });

    const sepDiv = document.createElement("div");
    sepDiv.style.cssText = "width:1px;height:24px;background:rgba(255,255,255,0.2);margin:0 4px";
    top.appendChild(sepDiv);

    // Espessura
    const wRange = document.createElement("input");
    wRange.type = "range"; wRange.min = "2"; wRange.max = "20"; wRange.value = "4";
    wRange.style.cssText = "width:80px";
    wRange.oninput = () => { curWidth = parseInt(wRange.value); };
    top.appendChild(wRange);

    // Undo
    const btnUndo = document.createElement("button");
    btnUndo.textContent = "↶";
    btnUndo.title = "Desfazer";
    btnUndo.style.cssText = "background:transparent;border:1px solid rgba(255,255,255,0.3);color:#fff;width:32px;height:32px;border-radius:0;font-size:18px;cursor:pointer;padding:0;margin-left:auto";
    top.appendChild(btnUndo);

    // Limpar
    const btnClear = document.createElement("button");
    btnClear.textContent = "✕";
    btnClear.title = "Limpar desenhos";
    btnClear.style.cssText = "background:transparent;border:1px solid rgba(255,255,255,0.3);color:#fff;width:32px;height:32px;border-radius:0;cursor:pointer;padding:0";
    top.appendChild(btnClear);

    overlay.appendChild(top);

    // Canvas
    const canvasWrap = document.createElement("div");
    canvasWrap.style.cssText = "flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative";
    overlay.appendChild(canvasWrap);

    const canvas = document.createElement("canvas");
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0);
    // Save initial state pra reset
    const baseImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    // Canvas escala pra caber na tela
    canvas.style.cssText = "max-width:100%;max-height:100%;object-fit:contain;touch-action:none";
    canvasWrap.appendChild(canvas);

    // Stack pra undo (cada traço = snapshot)
    const undoStack = [];
    function saveSnapshot(){
      undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
      if (undoStack.length > 30) undoStack.shift();
    }

    btnUndo.onclick = (ev) => {
      ev.preventDefault();
      if (undoStack.length > 0){
        const last = undoStack.pop();
        ctx.putImageData(last, 0, 0);
      }
    };
    btnClear.onclick = (ev) => {
      ev.preventDefault();
      undoStack.length = 0;
      ctx.putImageData(baseImageData, 0, 0);
    };

    // Desenho com pointer events
    let drawing = false;
    let lastX = 0, lastY = 0;
    function getCanvasPos(ev){
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const x = (ev.clientX - rect.left) * scaleX;
      const y = (ev.clientY - rect.top) * scaleY;
      return { x, y };
    }
    canvas.addEventListener("pointerdown", (ev) => {
      ev.preventDefault();
      const p = getCanvasPos(ev);
      drawing = true;
      saveSnapshot();
      lastX = p.x; lastY = p.y;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = curColor;
      ctx.lineWidth = curWidth * (canvas.width / canvas.getBoundingClientRect().width); // escala lineWidth
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x + 0.1, p.y + 0.1);
      ctx.stroke();
      canvas.setPointerCapture(ev.pointerId);
    });
    canvas.addEventListener("pointermove", (ev) => {
      if (!drawing) return;
      ev.preventDefault();
      const p = getCanvasPos(ev);
      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      lastX = p.x; lastY = p.y;
    });
    canvas.addEventListener("pointerup", () => { drawing = false; });
    canvas.addEventListener("pointercancel", () => { drawing = false; });

    // Bottom — comentário (estilo WhatsApp: input + botão enviar)
    const bottom = document.createElement("div");
    bottom.style.cssText = "background:rgba(0,0,0,0.7);padding:10px 12px;display:flex;flex-direction:column;gap:8px";

    const commentRow = document.createElement("div");
    commentRow.style.cssText = "display:flex;gap:8px;align-items:flex-end";

    const commentInput = document.createElement("textarea");
    commentInput.placeholder = "Adicionar comentário…";
    commentInput.rows = 1;
    commentInput.style.cssText = "flex:1;padding:10px 12px;border-radius:0;background:rgba(255,255,255,0.12);border:none;color:#fff;font-size:14px;font-family:inherit;resize:none;outline:none;max-height:80px;line-height:1.4";
    commentInput.addEventListener("input", () => {
      commentInput.style.height = "auto";
      commentInput.style.height = Math.min(80, commentInput.scrollHeight) + "px";
    });
    commentRow.appendChild(commentInput);

    bottom.appendChild(commentRow);

    const btnRow = document.createElement("div");
    btnRow.style.cssText = "display:flex;gap:10px";
    const btnCancel = document.createElement("button");
    btnCancel.textContent = "Cancelar";
    btnCancel.style.cssText = "flex:1;padding:12px;border-radius:0;background:rgba(255,255,255,0.1);border:none;color:#fff;font-weight:600;cursor:pointer";

// Canvas → Blob numa qualidade jpeg. Promisifica o toBlob, que é callback.
function canvasParaBlob(canvas, q){
  return new Promise((res, rej) => {
    canvas.toBlob(
      (b) => b ? res(b) : rej(new Error("Falha ao gerar a imagem")),
      "image/jpeg", q
    );
  });
}

// ── Compressão de foto (lado maior ~1280, jpeg 0.7, ~700KB) ──
// Devolve BLOB, não data URI. A foto sobe pro Storage igual ao vídeo.
// Antes o data URI ia inteiro pra dentro de fiscal_fotos.url, e toda tela que
// lista as fotos da obra (gestão, Central do Cliente, PDF do laudo) baixava a
// imagem embutida no JSON: 1,4 MB por obra, sem cache de navegador possível.
async function compressPhoto(file){
  const dataUrl = await new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result); r.onerror = () => rej(new Error("Falha ao ler"));
    r.readAsDataURL(file);
  });
  const img = await new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im); im.onerror = () => rej(new Error("Imagem inválida"));
    im.src = dataUrl;
  });
  const MAX = 1280;
  let w = img.naturalWidth, h = img.naturalHeight;
  if (w > MAX || h > MAX){ if (w >= h){ h = Math.round(h * MAX / w); w = MAX; } else { w = Math.round(w * MAX / h); h = MAX; } }
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  canvas.getContext("2d").drawImage(img, 0, 0, w, h);
  // No máximo 3 re-encodes: cada canvasParaBlob custa CPU num celular fraco e
  // abaixo de q~0.42 a foto degrada sem ganhar tamanho relevante.
  let q = 0.72, out = await canvasParaBlob(canvas, q);
  for (let i = 0; i < 3 && out.size > 700_000 && q > 0.35; i++){ q -= 0.1; out = await canvasParaBlob(canvas, q); }
  return out;
}

// Recria subscription pro Supabase realtime — dispara o callback ao mudar laudos/agenda.
// Re-renderiza a view atual quando algo muda no Space.
//
// `filtros` mapeia tabela -> filtro postgres_changes ("card_id=eq.<id>"). Sem filtro o
// canal recebe QUALQUER linha da tabela: como os watchers escrevem em kanban_cards e os
// instaladores em instala_* o tempo todo, o detalhe da obra re-renderizava sozinho a
// cada poucos segundos. Valor `false` desliga a tabela quando não dá pra filtrar.
function subscribeFiscalRealtime(view, onChange, filtros){
  if (_rtChannel){ try { sb.removeChannel(_rtChannel); } catch(_){} _rtChannel = null; }
  _rtView = view;
  const f = filtros || {};
  const ouvir = (ch, table) => {
    if (f[table] === false) return ch;
    const cfg = { event: "*", schema: "public", table };
    if (f[table]) cfg.filter = f[table];
    return ch.on("postgres_changes", cfg, () => onChange());
  };
  let ch = sb.channel("fiscal_rt_" + view);
  ch = ouvir(ch, "fiscal_laudos");
  ch = ouvir(ch, "fiscal_agenda");
  // Detalhe da obra também escuta card do gestão + instala (equipes, andamento).
  if (view === "obra"){
    ch = ouvir(ch, "kanban_cards");
    ch = ouvir(ch, "prestadores_obra_servicos");
    ch = ouvir(ch, "instala_item_checks");
    ch = ouvir(ch, "instala_checkins");
  }
  _rtChannel = ch.subscribe();
}

// Cancela canal realtime. Chamado por views que NÃO são Home/Agenda — sem isso
// o callback antigo continua escutando mudanças em fiscal_laudos e dispara
// renderHome() (que joga o usuário de volta pra tela inicial no meio de uma edição).
function unsubscribeFiscalRealtime(){
  if (_rtChannel){ try { sb.removeChannel(_rtChannel); } catch(_){} _rtChannel = null; }
  _rtView = null;
}

// ║ Boot — checa sessão                                           ║
// ╚══════════════════════════════════════════════════════════════╝
async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return renderLogin();
  _user = session.user;

  // 1) Tenta como fiscal
  const { data: fiscalRow } = await sb.from("fiscal_equipe").select("*").eq("user_id", _user.id).maybeSingle();
  if (fiscalRow && fiscalRow.ativo){
    _fiscal = fiscalRow;
  }

  // 2) Checa se é admin/superadmin OU tem dept_permissions.obras
  //    Qualquer um deles entra em modo "admin" (vê tudo, cria como qualquer fiscal)
  const { data: profile } = await sb.from("user_profiles")
    .select("full_name, email, role, dept_permissions")
    .eq("id", _user.id)
    .maybeSingle();
  const isRoleAdmin = profile && (profile.role === "admin" || profile.role === "superadmin");
  const hasObras = profile && profile.dept_permissions && profile.dept_permissions.obras != null;
  // Fiscal cadastrado SEMPRE opera em modo fiscal (só vê o dele) — dept_permissions.obras
  // não eleva quem é fiscal; só role admin/superadmin de verdade.
  if (isRoleAdmin || (!_fiscal && hasObras)){
    _isAdmin = true;
    _adminProfile = profile;
  }

  // 3) Se não é fiscal nem tem acesso (admin/obras) → bloqueia
  if (!_fiscal && !_isAdmin){
    await sb.auth.signOut();
    return renderLogin("Sem permissão. Você precisa ser fiscal cadastrado, admin, ou ter acesso ao depto Obras.");
  }

  // 4) Se é admin, carrega lista de fiscais pro dropdown "operando como"
  if (_isAdmin){
    const { data: fis } = await sb.from("fiscal_equipe").select("id, nome, email, ativo").eq("ativo", true).order("nome");
    _fiscaisLista = fis || [];
    // Default: se também é fiscal, opera como ele mesmo. Senão, primeiro da lista.
    _operandoComoId = (_fiscal && _fiscal.id) || (_fiscaisLista[0] && _fiscaisLista[0].id) || null;
  }

  renderUserChip();
  renderBottomNav();
  // Deep link: restaura a tela da URL (#agenda, #obra/<id>, #laudo/<id>…). Sem hash = OBRAS.
  const inicial = parseHash() || { view: "hoje", params: null };
  try { history.replaceState(inicial, "", hashFor(inicial.view, inicial.params)); } catch {}
  dispatchView(inicial.view, inicial.params);

  // Captura erros globais pra evitar que o WebView do APK feche por exception
  // não-tratada (era um dos sintomas do "crash ao trocar de aba").
  window.addEventListener("error", (ev) => {
    try {
      console.error("[GLOBAL ERR]", ev.error || ev.message);
      const errEl = document.createElement("div");
      errEl.style.cssText = "position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#dc2626;color:#fff;padding:10px 16px;border-radius:0;font-size:12px;z-index:99999;max-width:90%";
      errEl.textContent = "Erro: " + ((ev.error && ev.error.message) || ev.message || "desconhecido");
      document.body.appendChild(errEl);
      setTimeout(() => errEl.remove(), 6000);
    } catch {}
    ev.preventDefault();
    return true;
  });
  window.addEventListener("unhandledrejection", (ev) => {
    try { console.error("[UNHANDLED PROMISE]", ev.reason); } catch {}
    ev.preventDefault();
  });
}

/** Mapeia a categoria de um item do gestão pro vocabulário curto de serviços. */
function servDaCategoria(it){
  const c = `${(it && it.categoria) || ""} ${(it && it.meta && it.meta.categoria_raiz) || ""}`.toUpperCase();
  if (/MARCENARIA|M[OÓ]VE/.test(c)) return "marcenaria";
  if (c.includes("PORTA"))  return "porta";
  if (c.includes("DECK"))   return "deck";
  if (c.includes("FORRO"))  return "forro";
  if (/PAINEL|REVESTIMENTO|BRISE|RIPADO/.test(c)) return "painel";
  if (c.includes("ESCADA")) return "escada";
  if (c.includes("BANCO"))  return "bancos";
  if (/PISO|ASSOALHO|VIN[IÍ]LICO|LAMINADO/.test(c)) return "piso";
  return null;
}

// ║ HISTORY NAVIGATION — usa APENAS browser history + popstate.    ║
// ║ Fonte única da verdade: history.state. Sem stack próprio.       ║
// ║ Guarda: {view, params} no state de cada entry.                  ║
// ║ Botão voltar → history.back() → popstate → dispatchView(state). ║
// ╚══════════════════════════════════════════════════════════════╝
// Flag pra evitar loop: quando dispatchView é chamado por popstate,
// os renders NÃO devem re-empurrar no history.
let _handlingPopstate = false;
let _navStack = [];  // mantido por compat com código legado, não usado pra decisão de back

function dispatchView(view, params){
  switch (view) {
    case "hoje":         return renderHoje();
    case "home":         return renderHoje();
    case "lista":        return renderHoje();
    case "obra":         return renderObraDetail(params && params.id);
    case "calendario":   return renderCalendario();
    case "editar":       return renderEditarLaudo(params && params.id);
    case "checklist":    return renderChecklistInicioObra(params && params.id, params && params.info);
    case "novo":         return renderNovoLaudo(params && params.preset);
    case "login":        return renderLogin(params && params.msg);
    case "mais":         return renderMaisMenu();
    case "focc":         return renderFiscalOcorrencias();
    case "fmat":         return renderFiscalMaterial();
    case "fconf":        return renderFiscalConferencia();
    case "fcst":         return renderFiscalCustos();
    case "fprest":       return renderFiscalPrestadores();
    case "fhist":        return renderFiscalHistorico();
    case "iniciar":      return renderIniciarPlaceholder();
    case "ranking":      return renderRankingPlaceholder();
    default:             return renderHoje();

}

// ── URL por seção ─────────────────────────────────────────────
// Cada tela tem link próprio: #obras, #agenda, #obra/<id>, #laudo/<id>…
// Abrir/recarregar a URL restaura a tela (deep link).
const VIEW2HASH = { hoje:"obras", home:"obras", lista:"obras", calendario:"agenda", focc:"ocorrencias", fmat:"material", fconf:"conferencia", fcst:"custos", fprest:"prestadores", fhist:"historico", editar:"laudo" };
const HASH2VIEW = { obras:"hoje", hoje:"hoje", home:"hoje", lista:"hoje", agenda:"calendario", calendario:"calendario", ocorrencias:"focc", focc:"focc", material:"fmat", fmat:"fmat", conferencia:"fconf", fconf:"fconf", custos:"fcst", fcst:"fcst", prestadores:"fprest", fprest:"fprest", historico:"fhist", fhist:"fhist", laudo:"editar", editar:"editar", obra:"obra", checklist:"checklist", novo:"novo", mais:"mais", iniciar:"iniciar", ranking:"ranking" };

function hashFor(view, params){
  const base = VIEW2HASH[view] || view;
  const id = params && params.id;
  return "#" + base + (id ? "/" + encodeURIComponent(id) : "");
}
function parseHash(){
  const h = (location.hash || "").replace(/^#\/?/, "");
  if (!h) return null;
  const seg = h.split("/");
  const view = HASH2VIEW[seg[0]];
  if (!view) return null;
  const id = seg[1] ? decodeURIComponent(seg[1]) : null;
  return { view, params: id ? { id } : null };
}

// pushHist: chamado no hook de cada função de render. Se estamos processando
// um popstate (voltar), NÃO empurra nova entrada — o browser já ajustou.
// Se a última entrada do history já é o mesmo view+params, dedup.
function pushHist(view, params){
  if (_handlingPopstate) return;
  const st = history.state;
  if (st && st.view === view && JSON.stringify(st.params || null) === JSON.stringify(params || null)) return;
  try { history.pushState({ view, params }, "", hashFor(view, params)); } catch {}
}

window.addEventListener("popstate", (ev) => {
  // Sem state (URL digitada/alterada na mão) → resolve pela hash.
  const st = (ev.state) || (history.state) || parseHash() || { view: "hoje" };
  _handlingPopstate = true;
  try { dispatchView(st.view || "hoje", st.params); }
  finally { setTimeout(() => { _handlingPopstate = false; }, 100); }
});

// Botão "← Voltar" nas telas — usa nativo do browser.
window.voltarPagina = function(){
  try { history.back(); } catch { dispatchView("hoje"); }
};

function navTo(view, params){
  pushHist(view, params);
  dispatchView(view, params);
}

  const card = el(`<div class="card">
    <div class="h1">Entrar</div>

      <input id="_pw" type="password" autocomplete="current-password" placeholder="••••••" style="padding-right:92px"/>
      <button type="button" id="_pw_toggle" aria-label="Mostrar senha"
        style="position:absolute;right:6px;top:50%;transform:translateY(-50%);background:transparent;border:1px solid var(--pk-border2);border-radius:0;color:var(--pk-text-dim);font-size:10px;font-weight:700;letter-spacing:0.08em;width:auto;height:28px;padding:0 10px;cursor:pointer;display:flex;align-items:center;justify-content:center">MOSTRAR</button>
    </div>
    <div style="height:14px"></div>
    <button class="primary" id="_login">Entrar</button>
    <div id="_msg"></div>
  </div>`);
  root.appendChild(card);
  // Toggle "olho" pra mostrar/ocultar senha
  const _pwEl = document.getElementById("_pw");
  const _pwBtn = document.getElementById("_pw_toggle");
  _pwBtn.onclick = () => {
    const isPw = _pwEl.type === "password";
    _pwEl.type = isPw ? "text" : "password";
    _pwBtn.textContent = isPw ? "OCULTAR" : "MOSTRAR";
    _pwBtn.setAttribute("aria-label", isPw ? "Ocultar senha" : "Mostrar senha");
  };
  // APK removido — não distribuímos mais via download direto
  document.getElementById("_login").onclick = async () => {
    const email = document.getElementById("_email").value.trim();
    const pw = document.getElementById("_pw").value;
    const msgEl = document.getElementById("_msg");
    if (!email || !pw){ msgEl.innerHTML = `<div class="err">Preencha email e senha.</div>`; return; }
    msgEl.innerHTML = `<div class="small"><span class="spinner"></span> Entrando…</div>`;
    const { error } = await sb.auth.signInWithPassword({ email, password: pw });
    if (error){
      msgEl.innerHTML = `<div class="err">${esc(error.message || "Falha no login")}</div>`;
      return;
    }
    boot();
  };
}

// ║ HOME — agenda do fiscal + obras                               ║
// ╚══════════════════════════════════════════════════════════════╝
async function renderHome(listKey, listCliente){
  _homeListKey = listKey || null;
  _homeListCliente = listCliente || null;
  root.innerHTML = `<div class="card center"><span class="spinner"></span><div class="small" style="margin-top:8px">Carregando agenda…</div></div>`;
  subscribeFiscalRealtime("home", () => { if (_rtView === "home") renderHome(_homeListKey, _homeListCliente); });

  // Pro admin, o dropdown "operando como" também FILTRA o que vê.
  // Pro fiscal, sempre vê só o dele.
  const filtroFiscalId = _isAdmin ? _operandoComoId : (_fiscal && _fiscal.id);

  const hoje = new Date();
  const inicioSemana = new Date(hoje); inicioSemana.setDate(hoje.getDate() - 60);
  const fimSemana = new Date(hoje); fimSemana.setDate(hoje.getDate() + 180);

  let qAgenda = sb.from("fiscal_agenda")
    .select("id, card_id, fiscal_id, tipo, data_inicio, data_fim, obra, cliente, endereco, status, notas, online, tags, attachments")
    .gte("data_inicio", inicioSemana.toISOString())
    .lte("data_inicio", fimSemana.toISOString())
    .order("data_inicio", { ascending: true });
  if (filtroFiscalId) qAgenda = qAgenda.eq("fiscal_id", filtroFiscalId);
  const { data: agenda, error: e1 } = await qAgenda;

  if (e1){
    root.innerHTML = erroTelaHtml(e1.message);
    return;
  }

  let qLaudos = sb.from("fiscal_laudos")
    .select("id, card_id, fiscal_id, fiscal_nome, obra, cliente, tipo, status, data_vistoria, updated_at")
    .order("updated_at", { ascending: false })
    .limit(60);
  if (filtroFiscalId) qLaudos = qLaudos.eq("fiscal_id", filtroFiscalId);
  const { data: laudos } = await qLaudos;

  // Obras vinculadas ao fiscal = cards com laudo/agenda dele + cards onde ele
  // é fiscal responsável (kanban_cards.details.fiscais — vínculo do gestão)
  let obras = [];
  if (filtroFiscalId){
    const cardIds = new Set([
      ...(agenda || []).map(a => a.card_id).filter(Boolean),
      ...(laudos || []).map(l => l.card_id).filter(Boolean),
    ]);
    const byId = new Map();
    if (cardIds.size > 0){
      const { data: kc } = await sb.from("kanban_cards")
        .select("id, title, obra, column_id, dept_id, responsavel, prestadores:details->prestadores")
        .in("id", Array.from(cardIds));
      for (const o of (kc || [])) byId.set(o.id, o);
    }
    const { data: kcResp } = await sb.from("kanban_cards")
      .select("id, title, obra, column_id, dept_id, responsavel, prestadores:details->prestadores")
      .contains("details->fiscais", JSON.stringify([{ id: filtroFiscalId }]));
    for (const o of (kcResp || [])) byId.set(o.id, { ...(byId.get(o.id) || o), _resp: true });
    obras = Array.from(byId.values());
  }

  root.innerHTML = "";

  // Admin: seletor "operando como" no topo
  if (_isAdmin && !listKey){
    const opts = _fiscaisLista.map(f => `<option value="${f.id}" ${f.id===_operandoComoId?"selected":""}>${esc(f.nome)}</option>`).join("");
    root.appendChild(el(`<div class="card" style="padding:10px 12px;margin-top:0">
      <div class="label">Operando como (fiscal)</div>
      <select id="_op_como" style="margin-top:4px">${opts}</select>
    </div>`));
    document.getElementById("_op_como").onchange = (e) => {
      _operandoComoId = e.target.value;
      renderHome();
    };
  }

  // ── Stats row + Novo laudo ──
  // Modelo: agendamento = "pra fazer". "Próximas visitas" = agenda hoje/futuro.
  // "Vencidos" = agenda com data_inicio < hoje 00h e sem laudo cumprindo.
  // Rascunhos em_andamento vivem dentro do card do cliente (não têm stat próprio).
  const concluidos = (laudos || []).filter(l => l.status === "concluido" || l.status === "cancelado");
  const _hojeMs = new Date(new Date().setHours(0,0,0,0)).getTime();
  const _agsCumpridas = new Set((agenda || [])
    .filter(a => (laudos || []).some(l => l.card_id === a.card_id && l.tipo === a.tipo
      && new Date(l.created_at||0).getTime() >= new Date(a.data_inicio||0).getTime()))
    .map(a => a.id));
  const _agsAtivas = (agenda || []).filter(a => !_agsCumpridas.has(a.id)
    && a.status !== "reagendado" && a.status !== "cancelado" && a.status !== "realizado");
  const agendaFut = _agsAtivas.filter(a => new Date(a.data_inicio).getTime() >= _hojeMs);
  const agsVencidas = _agsAtivas.filter(a => new Date(a.data_inicio).getTime() < _hojeMs);

  // ── TELA DEDICADA DE LISTA — clicar em stat/seção abre página própria
  // com "← Voltar", em vez de expandir inline e espremer a Home no celular.
  // Laudos (paraFazer/concluidos) são agrupados POR CLIENTE: primeiro a lista
  // de clientes, clicou no cliente → os laudos dele.
  if (listKey){
    const proximasSorted = agendaFut.slice().sort((a,b) => new Date(a.data_inicio) - new Date(b.data_inicio));
    const vencidasSorted = agsVencidas.slice().sort((a,b) => new Date(a.data_inicio) - new Date(b.data_inicio));
    const DEFS = {
      obras:      { titulo: _isAdmin ? `Obras de ${esc(fiscalAtualNome())}` : "Minhas obras", items: obras,
                    render: (o) => renderObraCard(o, (laudos || []).filter(l => l.card_id === o.id), (agenda || []).filter(a => a.card_id === o.id)) },
      proximas:   { titulo: "Próximas visitas", items: proximasSorted, render: renderAgendaCard, byCliente: true },
      vencidos:   { titulo: vencidasSorted.length === 1 ? "Visita vencida" : "Visitas vencidas", items: vencidasSorted, render: renderAgendaCard, color: "#F87171", byCliente: true },
      concluidos: { titulo: _isAdmin ? "Concluídos" : "Meus concluídos", items: concluidos, render: renderLaudoCard, byCliente: true },
    };
    const def = DEFS[listKey];
    if (!def) return renderHome();

    const clienteDe = (it) => (it.cliente || it.obra || "Sem cliente").trim() || "Sem cliente";
    const dentroDeCliente = def.byCliente && listCliente;

    root.appendChild(el(`<div style="margin-bottom:10px">
      <button class="ghost" id="_back" style="width:auto;padding:6px 12px;font-size:12px">← Voltar</button>
    </div>`));
    document.getElementById("_back").onclick = () => voltarPagina();

    let titulo = def.titulo, items = def.items;
    if (dentroDeCliente){
      items = def.items.filter(it => clienteDe(it) === listCliente);
      titulo = esc(listCliente);
    }

    root.appendChild(el(`<div class="sect-h" style="background:var(--pk-card1);border:1px solid var(--pk-border1);border-radius:0;padding:10px 12px;margin:0 0 10px">
      <div class="t" style="color:${def.color || 'var(--pk-text)'};font-size:11px">${titulo}${dentroDeCliente ? ` · ${def.titulo}` : ''}</div>
      <div class="n" style="font-size:11px;color:var(--pk-accent);font-weight:700;background:rgba(150,132,115,0.12);padding:2px 8px;border-radius:0">${items.length}</div>
    </div>`));

    if (!items.length){
      root.appendChild(el(`<div class="card center"><div class="small">Nada nesta etapa por enquanto. Novos itens aparecem aqui sozinhos.</div></div>`));
      return;
    }

    // ── Barra de pesquisa (client-side): filtra por cliente + obra + column.
    const searchWrap = el(`<div style="margin-bottom:10px;position:relative">
      <input id="_list_search" type="search" placeholder="Buscar por cliente ou obra…"
        style="width:100%;background:var(--pk-card2);color:var(--pk-text);border:1px solid var(--pk-border1);padding:10px 12px;font-size:14px;box-sizing:border-box" />
    </div>`);
    root.appendChild(searchWrap);
    const searchInput = searchWrap.querySelector("#_list_search");

    const body = el(`<div style="display:flex;flex-direction:column;gap:8px"></div>`);
    // Cada item vai num <div data-search="texto..."> pra filtro rápido.
    const wrapItem = (el2, txt) => {
      const w = document.createElement("div");
      w.setAttribute("data-search", (txt || "").toLowerCase());
      w.style.display = "contents";
      w.appendChild(el2);
      return w;
    };
    if (def.byCliente && !listCliente){
      // Nível 1: clientes com contagem de laudos
      const groups = new Map();
      for (const it of items){ const k = clienteDe(it); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(it); }
      for (const [nome, lds] of groups){
        // Se todos os laudos do cliente apontam pro mesmo card, abre o CARD do
        // cliente (dados + mapa + laudos). Senão, cai na lista simples.
        const cardIds = new Set(lds.map(l => l.card_id));
        const cardUnico = cardIds.size === 1 && lds[0].card_id ? lds[0].card_id : null;
        const c = el(`<div class="lcard">
          <div class="ldot" style="background:${def.color || 'var(--pk-accent)'}"></div>
          <div class="lbody">
            <div class="lcli">${esc(nome)}</div>
            <div class="lsub">${lds.length} laudo${lds.length !== 1 ? "s" : ""}</div>
          </div>
          <div class="larrow">›</div>
        </div>`);
        c.onclick = () => cardUnico ? renderObraDetail(cardUnico) : renderHome(listKey, nome);
        // obras + colunas dos laudos no data-search pra pesquisa ampla
        const extras = lds.map(l => [l.obra, l.column_id, l.cliente].filter(Boolean).join(" ")).join(" ");
        body.appendChild(wrapItem(c, `${nome} ${extras}`));
      }
    } else {
      // Nível 2 (ou lista sem agrupamento): itens direto
      for (const it of items){
        const searchTxt = [it.cliente, it.obra, it.title, it.column_id, clienteDe(it)].filter(Boolean).join(" ");
        body.appendChild(wrapItem(def.render(it), searchTxt));
      }
    }
    root.appendChild(body);
    // Ativa filtro
    const doFilter = () => {
      const q = searchInput.value.trim().toLowerCase();
      let vis = 0;
      body.querySelectorAll("[data-search]").forEach(w => {
        const match = !q || w.dataset.search.includes(q);
        w.style.display = match ? "contents" : "none";
        if (match) vis++;
      });
      let empty = body.querySelector('[data-role="empty"]');
      if (vis === 0 && q){
        if (!empty){
          empty = el(`<div class="card center" data-role="empty"><div class="small">Nenhum resultado pra "${esc(q)}".</div></div>`);
          body.appendChild(empty);
        } else empty.querySelector(".small").textContent = `Nenhum resultado pra "${q}".`;
      } else if (empty){ empty.remove(); }
    };
    searchInput.addEventListener("input", doFilter);
    return;
  }

  const _plural = (n, s, p) => n === 1 ? s : p;
  const statsEl = el(`<div class="stats-row">
    <div class="stat info" data-goto="proximas" style="cursor:pointer"><div class="n">${agendaFut.length}</div><div class="l">${_plural(agendaFut.length, "Próx. visita", "Próx. visitas")}</div></div>
    <div class="stat warn" data-goto="vencidos" style="cursor:pointer;${agsVencidas.length ? 'border-color:rgba(239,68,68,0.35);background:rgba(239,68,68,0.06)' : ''}"><div class="n" style="${agsVencidas.length ? 'color:#F87171' : ''}">${agsVencidas.length}</div><div class="l">${_plural(agsVencidas.length, "Visita vencida", "Visitas vencidas")}</div></div>
    <div class="stat ok" data-goto="concluidos" style="cursor:pointer"><div class="n">${concluidos.length}</div><div class="l">${_plural(concluidos.length, "Concluído", "Concluídos")}</div></div>
  </div>`);
  statsEl.querySelectorAll(".stat").forEach(s => {
    s.onclick = () => renderHome(s.dataset.goto);
  });
  root.appendChild(statsEl);

  // Próxima visita (destaque)
  const proxima = agendaFut.slice().sort((a,b) => new Date(a.data_inicio) - new Date(b.data_inicio))[0];
  if (proxima){
    const tipoLabel = (TIPOS[proxima.tipo] && TIPOS[proxima.tipo].label) || proxima.tipo || "Visita";
    const whenLabel = fmtDate(proxima.data_inicio);
    // fiscal_agenda.obra às vezes vem com UUID do card (bug do sync); só mostra
    // se for texto legível (não uuid, não igual ao cliente).
    const isUuid = /^[0-9a-f-]{32,}$/i.test(proxima.obra || "");
    const obraLegivel = proxima.obra && !isUuid && proxima.obra !== proxima.cliente ? proxima.obra : "";
    const nv = el(`<div class="next-visit">
      <div class="pre">PRÓXIMA VISITA</div>
      <div class="cli">${esc(proxima.cliente || obraLegivel || "-")}</div>
      ${obraLegivel && proxima.cliente ? `<div class="obra">${esc(obraLegivel)}</div>` : ""}
      <div class="when">${esc(tipoLabel)}${proxima.online ? ` · <span style="color:#3B82F6;font-weight:700">ONLINE</span>` : ""} · ${whenLabel}</div>
      ${proxima.endereco ? `<div class="small" style="color:var(--pk-text-dim);margin-top:4px">${esc(proxima.endereco)}</div>${endAcoesHtml(proxima.endereco)}` : ""}
      ${proxima.notas ? `<div class="small" style="color:var(--pk-text);margin-top:4px;white-space:pre-wrap">${esc(proxima.notas)}</div>` : ""}
      ${tagChipsHtml(proxima.tags, 10)}
      ${anexosBtnHtml(proxima.attachments)}
    </div>`);
    wireAnexosBtn(nv, proxima.attachments);
    nv.onclick = () => {
      if (proxima.card_id) return renderObraDetail(proxima.card_id);
      _appToast("Este agendamento não está vinculado a um card. Use o botão \"Novo laudo\" pra registrar.");
    };
    root.appendChild(nv);
  }

  // Botão "novo laudo" — full width (APK removido a pedido)
  root.appendChild(el(`<div style="margin-bottom:14px">
    <button class="primary" id="_novo">Novo laudo</button>
  </div>`));
  document.getElementById("_novo").onclick = () => renderNovoLaudo(null);

  // ── Helpers de card ──
  function renderLaudoCard(l){
    const nomeLaudoSuf = (l.relatorio_dados && l.relatorio_dados.nome_laudo) ? ` · ${esc(l.relatorio_dados.nome_laudo)}` : "";
    const tipoLabel = ((TIPOS[l.tipo] && TIPOS[l.tipo].label) || l.tipo) + nomeLaudoSuf;
    let color = "#9CA3AF";
    if (l.status === "concluido") color = "#34D399";
    else if (l.status === "em_andamento") color = "#3B82F6";
    else if (l.status === "pendente") color = "#FBBF24";
    const subFiscal = _isAdmin && l.fiscal_nome ? ` · ${esc(l.fiscal_nome)}` : "";
    const when = l.data_vistoria ? fmtDate(l.data_vistoria) : fmtDate(l.updated_at);
    const c = el(`<div class="lcard">
      <div class="ldot" style="background:${color}"></div>
      <div class="lbody">
        <div class="lcli">${esc(l.cliente || l.obra || "-")}</div>
        <div class="lsub">${esc(tipoLabel)} · ${when}${subFiscal}</div>
      </div>
      <div class="larrow">›</div>
    </div>`);
    c.onclick = () => renderEditarLaudo(l.id);
    return c;
  }
  function renderAgendaCard(a){
    const tipoLabel = (TIPOS[a.tipo] && TIPOS[a.tipo].label) || a.tipo || "Visita";
    const vencido = new Date(a.data_inicio).getTime() < _hojeMs;
    const c = el(`<div class="lcard"${vencido ? ' style="background:rgba(239,68,68,0.04);border-color:rgba(239,68,68,0.25)"' : ''}>
      <div class="ldot" style="background:${vencido ? '#F87171' : 'var(--pk-accent)'}"></div>
      <div class="lbody">
        <div class="lcli">${esc(a.cliente || a.obra || "-")}</div>
        <div class="lsub">${esc(tipoLabel)} · ${vencido ? 'era ' : ''}${fmtDate(a.data_inicio)}</div>
        ${a.endereco ? `<div class="lsub" style="color:var(--pk-text-dim)">${esc(a.endereco)}</div>${endAcoesHtml(a.endereco)}` : ""}
        ${a.notas ? `<div class="lsub" style="color:var(--pk-text);white-space:pre-wrap">${esc(a.notas)}</div>` : ""}
        ${anexosBtnHtml(a.attachments)}
      </div>
      ${vencido ? '<span class="tag" style="background:rgba(239,68,68,0.20);color:#F87171;flex-shrink:0;font-weight:700;margin-right:6px">vencido</span>' : ''}
      <div class="larrow">›</div>
    </div>`);
    wireAnexosBtn(c, a.attachments);
    // Vencido -> abre direto o modal justificar+reagendar (nunca Novo laudo).
    // Futuro -> abre o card do cliente. Sem card_id, avisa e não abre Novo laudo.
    c.onclick = async () => {
      if (vencido){
        let card = null;
        if (a.card_id){
          const { data } = await sb.from("kanban_cards").select("id, title, details").eq("id", a.card_id).maybeSingle();
          card = data || null;
        }
        renderReagendarModal(a, a.card_id || null, card);
        return;
      }
      if (a.card_id) return renderObraDetail(a.card_id);
      _appToast("Este agendamento não está vinculado a um card. Use o botão \"Novo laudo\" pra registrar.");
    };
    return c;
  }
  function renderObraCard(o, lds, ag){
    const ldsFeitos = lds.filter(l => l.status === "concluido").length;
    const ldsPend = lds.filter(l => l.status === "pendente" || l.status === "em_andamento").length;
    // Prestador vinculado sempre à vista no card: principal manda; sem
    // nenhum vira alerta âmbar (o fiscal resolve no detalhe da obra)
    const _pr = _prestPrincipalDe(o.prestadores);
    const tagsHtml = [
      _pr.princ
        ? `<span class="tag" style="background:rgba(150,132,115,0.18);color:var(--pk-accent);font-weight:600">prest: ${esc(_pr.princ.nome)}${_pr.total > 1 ? " +" + (_pr.total - 1) : ""}</span>`
        : `<span class="tag" style="background:rgba(251,191,36,0.18);color:#FBBF24">sem prestador</span>`,
      o._resp ? `<span class="tag" style="background:rgba(52,211,153,0.15);color:#34D399">responsável</span>` : "",
      ag.length ? `<span class="tag" style="background:rgba(150,132,115,0.15);color:var(--pk-accent)">${ag.length} agenda</span>` : "",
      ldsPend > 0 ? `<span class="tag" style="background:rgba(245,158,11,0.18);color:#FBBF24">${ldsPend} pend.</span>` : "",
      ldsFeitos > 0 ? `<span class="tag" style="background:rgba(52,211,153,0.15);color:#34D399">${ldsFeitos} feito${ldsFeitos!==1?"s":""}</span>` : "",
    ].filter(Boolean).join(" ");
    const c = el(`<div class="lcard" style="flex-direction:column;align-items:stretch">
      <div style="display:flex;gap:10px;align-items:center;width:100%">
        <div class="lbody">
          <div class="lcli">${esc(o.title || "-")}</div>
          <div class="lsub">${esc(obraSemUuid(o.obra, o.title) || "-")} · ${esc(o.column_id || "")}</div>
        </div>

          <button data-g="leve"  style="flex:1;padding:9px 0;background:transparent;color:var(--pk-text);border:1px solid var(--pk-border1);font-size:12px;text-transform:uppercase;letter-spacing:0.1em;cursor:pointer">Leve</button>
          <button data-g="media" style="flex:1;padding:9px 0;background:#c7a45b;color:#050505;border:1px solid #c7a45b;font-size:12px;text-transform:uppercase;letter-spacing:0.1em;cursor:pointer">Média</button>
          <button data-g="grave" style="flex:1;padding:9px 0;background:transparent;color:var(--pk-text);border:1px solid var(--pk-border1);font-size:12px;text-transform:uppercase;letter-spacing:0.1em;cursor:pointer">Grave</button>
        </div>
