// ║ EDITAR LAUDO                                                   ║
// ╚══════════════════════════════════════════════════════════════╝
async function renderEditarLaudo(laudoId){
  unsubscribeFiscalRealtime();
  root.innerHTML = `<div class="card center"><span class="spinner"></span></div>`;
  const { data: laudo, error } = await sb.from("fiscal_laudos").select("*").eq("id", laudoId).single();
  if (error || !laudo){
    root.innerHTML = `<div class="card"><div class="err">Laudo não encontrado: ${esc(error?.message||"")}</div></div>`;
    return;
  }

  root.innerHTML = "";
  root.appendChild(el(`<div style="margin-bottom:10px">
    <button class="ghost" id="_back" style="width:auto;padding:6px 12px;font-size:12px">← Voltar</button>
  </div>`));
  document.getElementById("_back").onclick = () => renderHome();

  // Header laudo
  const tipoDef = TIPOS[laudo.tipo];
  root.appendChild(el(`<div class="card" style="background:linear-gradient(135deg,rgba(150,132,115,0.12),rgba(150,132,115,0.04));border-color:rgba(150,132,115,0.3)">
    <div class="label" style="color:var(--pk-accent)">${esc((tipoDef && tipoDef.label) || laudo.tipo)}</div>
    <div style="font-size:17px;font-weight:700;margin:4px 0 2px">${esc(laudo.obra || "—")}</div>
    <div class="small">${esc(laudo.cliente || "—")} · ${laudo.data_vistoria ? fmtDate(laudo.data_vistoria) : ""}</div>
  </div>`));

  // ── Estado local dos checklists (carregado do laudo) ──
  const ck = {};  // ck[serviço][pergunta] = { valor, obs }
  const textFields = {};  // textFields[campo] = valor
  for (const k of ["piso","deck","forro","painel","porta","escada","bancos","liberacao","equipe","produtividade"]){
    const col = `checklist_${k}`;
    const v = laudo[col];
    if (v && typeof v === "object" && !Array.isArray(v)) ck[k] = v;
  }
  // Campos texto
  for (const k of ["tipo_laje","reforco_necessario","insumos_necessarios","materiais_falta","insumos_falta","metragem_areas","ocorrencias","descritivo_sistema","descritivo_material","descritivo_reparo","sistema_instalacao","obs_solucao","observacoes"]){
    if (laudo[k]) textFields[k] = laudo[k];
  }
  // Checklist extra (entrega.qualidade, reparo.tipo, reparo.materiais, etc)
  const extra = (laudo.checklist_extra && typeof laudo.checklist_extra === "object" && !Array.isArray(laudo.checklist_extra)) ? laudo.checklist_extra : {};

  // Função pra renderizar checklist + fotos de UM serviço.
  // `key` é o servicoKey (piso/deck/forro/painel/porta/escada/bancos/liberacao/equipe/produtividade)
  function renderCkSecao(titulo, key, perguntas){
    if (!ck[key] || Array.isArray(ck[key])) ck[key] = {};
    const sec = el(`<div class="card"><div class="h2">${esc(titulo)}</div></div>`);
    for (const q of perguntas){
      const state = ck[key][q] || { valor: null, obs: "" };
      ck[key][q] = state;
      const row = document.createElement("div");
      row.className = "ck-row";
      row.innerHTML = `
        <div class="ck-q">${esc(q)}</div>
        <div class="ck-btns">
          <button class="ck-btn sim ${state.valor==="sim"?"on":""}" data-v="sim">Sim</button>
          <button class="ck-btn nao ${state.valor==="nao"?"on":""}" data-v="nao">Não</button>
          <button class="ck-btn na  ${state.valor==="na" ?"on":""}" data-v="na">N/A</button>
        </div>
        <input class="ck-obs" placeholder="Observação (opcional)" value="${esc(state.obs||"")}"/>
      `;
      row.querySelectorAll(".ck-btn").forEach(btn => {
        btn.onclick = (ev) => {
          ev.preventDefault();
          state.valor = btn.dataset.v;
          row.querySelectorAll(".ck-btn").forEach(b => b.classList.toggle("on", b === btn));
        };
      });
      row.querySelector(".ck-obs").oninput = (ev) => { state.obs = ev.target.value; };
      sec.appendChild(row);
    }

    // ── Fotos/Vídeos vinculadas a este serviço ──
    const fotosArea = document.createElement("div");
    fotosArea.style.cssText = "margin-top:14px;padding-top:14px;border-top:1px solid var(--pk-border1)";
    fotosArea.innerHTML = `
      <div class="label">Mídias de ${esc(titulo)} <span style="color:var(--pk-text-muted);font-size:10px">(fotos ou vídeos)</span></div>
      <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap">
        <label style="flex:1;min-width:120px;background:rgba(150,132,115,0.10);border:1px dashed rgba(150,132,115,0.35);color:var(--pk-accent);border-radius:0;padding:10px;font-size:12px;font-weight:600;text-align:center;cursor:pointer">
          Tirar foto
          <input type="file" accept="image/*" capture="environment" data-servico="${esc(key)}" class="_foto_servico" style="display:none"/>
        </label>
        <label style="flex:1;min-width:120px;background:rgba(150,132,115,0.10);border:1px dashed rgba(150,132,115,0.35);color:var(--pk-accent);border-radius:0;padding:10px;font-size:12px;font-weight:600;text-align:center;cursor:pointer">
          Da galeria
          <input type="file" accept="image/*" multiple data-servico="${esc(key)}" class="_foto_servico" style="display:none"/>
        </label>
        <label style="flex:1;min-width:140px;background:rgba(150,132,115,0.10);border:1px dashed rgba(150,132,115,0.35);color:var(--pk-accent);border-radius:0;padding:10px;font-size:12px;font-weight:600;text-align:center;cursor:pointer">
          Vídeo
          <input type="file" accept="video/*" data-servico="${esc(key)}" class="_video_servico" style="display:none"/>
        </label>
      </div>
      <div class="_fotos_box" data-servico="${esc(key)}" style="display:flex;flex-direction:column;gap:6px;margin-top:8px"></div>
    `;
    sec.appendChild(fotosArea);
    return sec;
  }

  // Helper: injeta área de fotos+vídeos no fim de uma seção (pra tipos sem renderCkSecao)
  function appendFotosArea(sec, servicoKey, tituloFotos){
    const fotosArea = document.createElement("div");
    fotosArea.style.cssText = "margin-top:14px;padding-top:14px;border-top:1px solid var(--pk-border1)";
    fotosArea.innerHTML = `
      <div class="label">${esc(tituloFotos)} <span style="color:var(--pk-text-muted);font-size:10px">(fotos ou vídeos)</span></div>
      <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap">
        <label style="flex:1;min-width:120px;background:rgba(150,132,115,0.10);border:1px dashed rgba(150,132,115,0.35);color:var(--pk-accent);border-radius:0;padding:10px;font-size:12px;font-weight:600;text-align:center;cursor:pointer">
          Tirar foto
          <input type="file" accept="image/*" capture="environment" data-servico="${esc(servicoKey)}" class="_foto_servico" style="display:none"/>
        </label>
        <label style="flex:1;min-width:120px;background:rgba(150,132,115,0.10);border:1px dashed rgba(150,132,115,0.35);color:var(--pk-accent);border-radius:0;padding:10px;font-size:12px;font-weight:600;text-align:center;cursor:pointer">
          Da galeria
          <input type="file" accept="image/*" multiple data-servico="${esc(servicoKey)}" class="_foto_servico" style="display:none"/>
        </label>
        <label style="flex:1;min-width:140px;background:rgba(150,132,115,0.10);border:1px dashed rgba(150,132,115,0.35);color:var(--pk-accent);border-radius:0;padding:10px;font-size:12px;font-weight:600;text-align:center;cursor:pointer">
          Vídeo
          <input type="file" accept="video/*" data-servico="${esc(servicoKey)}" class="_video_servico" style="display:none"/>
        </label>
      </div>
      <div class="_fotos_box" data-servico="${esc(servicoKey)}" style="display:flex;flex-direction:column;gap:6px;margin-top:8px"></div>
    `;
    sec.appendChild(fotosArea);
  }

  // Função pra renderizar campo texto livre
  function renderTextField(key, label, multiline = true){
    const v = textFields[key] || "";
    const wrap = el(`<div class="card">
      <div class="label">${esc(label)}</div>
      ${multiline ? `<textarea rows="3" style="margin-top:6px"></textarea>` : `<input style="margin-top:6px"/>`}
    </div>`);
    const inp = wrap.querySelector("textarea, input");
    inp.value = v;
    inp.oninput = (ev) => { textFields[key] = ev.target.value; };
    return wrap;
  }

  // Filtro: só mostra serviços que foram selecionados em "novo laudo".
  // Se servicos_inclusos vazio → mostra TODOS (compat com laudos antigos).
  const servSel = Array.isArray(laudo.servicos_inclusos) && laudo.servicos_inclusos.length > 0
    ? new Set(laudo.servicos_inclusos.map(s => String(s).toLowerCase().trim()))
    : null;
  const showServ = (key) => !servSel || servSel.has(key);

  // ── Render por tipo ──
  if (laudo.tipo === "1vistoria"){
    const def = CK["1vistoria"];
    if (servSel){
      root.appendChild(el(`<div class="card" style="background:rgba(150,132,115,0.06);border-color:rgba(150,132,115,0.25)">
        <div class="label" style="color:var(--pk-accent)">Serviços inclusos</div>
        <div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:6px">
          ${[...servSel].map(s => `<span class="tag" style="background:rgba(150,132,115,0.18);color:var(--pk-accent);text-transform:capitalize">${esc(s)}</span>`).join("")}
        </div>
      </div>`));
    }
    if (showServ("piso"))    root.appendChild(renderCkSecao("Piso",   "piso",   def.piso));
    if (showServ("deck"))    root.appendChild(renderCkSecao("Deck",   "deck",   def.deck));
    if (showServ("forro")){
      root.appendChild(renderCkSecao("Forro", "forro", def.forro));
      for (const f of FORRO_EXTRA) root.appendChild(renderTextField(f.key, f.label));
    }
    if (showServ("painel"))  root.appendChild(renderCkSecao("Painel", "painel", def.painel));
    if (showServ("porta"))   root.appendChild(renderCkSecao("Porta",  "porta",  def.porta));
    if (showServ("escada"))  root.appendChild(renderCkSecao("Escada", "escada", def.escada));
  } else if (laudo.tipo === "2vistoria"){
    const def = CK["2vistoria"];
    if (servSel){
      root.appendChild(el(`<div class="card" style="background:rgba(150,132,115,0.06);border-color:rgba(150,132,115,0.25)">
        <div class="label" style="color:var(--pk-accent)">Serviços inclusos</div>
        <div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:6px">
          ${[...servSel].map(s => `<span class="tag" style="background:rgba(150,132,115,0.18);color:var(--pk-accent);text-transform:capitalize">${esc(s)}</span>`).join("")}
        </div>
      </div>`));
    }
    // Liberação sempre aparece (não é serviço, é checklist geral da 2ª vistoria)
    root.appendChild(renderCkSecao("Liberação", "liberacao", def.liberacao));
    if (showServ("piso"))    root.appendChild(renderCkSecao("Piso",   "piso",   def.piso));
    if (showServ("deck"))    root.appendChild(renderCkSecao("Deck",   "deck",   def.deck));
    if (showServ("forro")){
      root.appendChild(renderCkSecao("Forro", "forro", def.forro));
      for (const f of FORRO_EXTRA) root.appendChild(renderTextField(f.key, f.label));
    }
    if (showServ("painel"))  root.appendChild(renderCkSecao("Painel", "painel", def.painel));
    if (showServ("porta"))   root.appendChild(renderCkSecao("Porta",  "porta",  def.porta));
    if (showServ("escada"))  root.appendChild(renderCkSecao("Escada", "escada", def.escada));
    if (showServ("bancos"))  root.appendChild(renderCkSecao("Bancos", "bancos", def.bancos));
  } else if (laudo.tipo === "acompanhamento"){
    const def = CK.acompanhamento;
    root.appendChild(renderCkSecao("Equipe", "equipe", def.equipe));
    root.appendChild(renderCkSecao("Produtividade", "produtividade", def.produtividade));
    for (const f of ACOMP_TEXT) root.appendChild(renderTextField(f.key, f.label));
  } else if (laudo.tipo === "entrega"){
    if (!extra.qualidade) extra.qualidade = {};
    const sec = el(`<div class="card"><div class="h2">Qualidade da entrega</div></div>`);
    for (const q of CK.entrega.qualidade){
      const state = extra.qualidade[q] || { valor: null, obs: "" };
      extra.qualidade[q] = state;
      const row = document.createElement("div");
      row.className = "ck-row";
      row.innerHTML = `<div class="ck-q">${esc(q)}</div>
        <div class="ck-btns">
          <button class="ck-btn sim ${state.valor==="sim"?"on":""}" data-v="sim">Sim</button>
          <button class="ck-btn nao ${state.valor==="nao"?"on":""}" data-v="nao">Não</button>
          <button class="ck-btn na  ${state.valor==="na" ?"on":""}" data-v="na">N/A</button>
        </div>
        <input class="ck-obs" placeholder="Observação (opcional)" value="${esc(state.obs||"")}"/>`;
      row.querySelectorAll(".ck-btn").forEach(btn => {
        btn.onclick = (ev) => { ev.preventDefault(); state.valor = btn.dataset.v; row.querySelectorAll(".ck-btn").forEach(b => b.classList.toggle("on", b === btn)); };
      });
      row.querySelector(".ck-obs").oninput = (ev) => { state.obs = ev.target.value; };
      sec.appendChild(row);
    }
    appendFotosArea(sec, "entrega", "Fotos da Entrega");
    root.appendChild(sec);
    for (const f of ENTREGA_TEXT) root.appendChild(renderTextField(f.key, f.label));
  } else if (laudo.tipo === "reparo"){
    if (!extra.tipo) extra.tipo = {};
    if (!extra.materiais) extra.materiais = {};
    const renderSec = (titulo, obj, list) => {
      const sec = el(`<div class="card"><div class="h2">${esc(titulo)}</div></div>`);
      for (const q of list){
        const state = obj[q] || { valor: null, obs: "" };
        obj[q] = state;
        const row = document.createElement("div");
        row.className = "ck-row";
        row.innerHTML = `<div class="ck-q">${esc(q)}</div>
          <div class="ck-btns">
            <button class="ck-btn sim ${state.valor==="sim"?"on":""}" data-v="sim">Sim</button>
            <button class="ck-btn nao ${state.valor==="nao"?"on":""}" data-v="nao">Não</button>
          </div>
          <input class="ck-obs" placeholder="Observação (opcional)" value="${esc(state.obs||"")}"/>`;
        row.querySelectorAll(".ck-btn").forEach(btn => {
          btn.onclick = (ev) => { ev.preventDefault(); state.valor = btn.dataset.v; row.querySelectorAll(".ck-btn").forEach(b => b.classList.toggle("on", b === btn)); };
        });
        row.querySelector(".ck-obs").oninput = (ev) => { state.obs = ev.target.value; };
        sec.appendChild(row);
      }
      return sec;
    };
    const secTipo = renderSec("Tipo de reparo", extra.tipo, CK.reparo.tipo);
    appendFotosArea(secTipo, "reparo", "Fotos do Reparo");
    root.appendChild(secTipo);
    root.appendChild(renderSec("Materiais em obra", extra.materiais, CK.reparo.materiais));
    for (const f of REPARO_TEXT) root.appendChild(renderTextField(f.key, f.label));
  }

  // ── FOTOS por serviço ──
  // Cada `renderCkSecao` cria seu próprio `<input class="_foto_servico" data-servico="<key>">`
  // + `<div class="_fotos_box" data-servico="<key>">` pra mostrar as fotos.
  // Aqui setamos os handlers que ligam tudo a um state compartilhado.
  let novasFotos = [];  // {file, servico, descricao}
  let fotosExistentes = [];
  const { data: fx } = await sb.from("fiscal_fotos").select("*").eq("laudo_id", laudoId).order("created_at");
  fotosExistentes = fx || [];

  function renderFotosDoServico(servicoKey){
    const box = root.querySelector(`._fotos_box[data-servico="${CSS.escape(servicoKey)}"]`);
    if (!box) return;
    box.innerHTML = "";
    // Existentes
    const existsDoServ = fotosExistentes.filter(f => (f.servico || "outros") === servicoKey);
    for (const f of existsDoServ){
      const isVideo = f.tipo === "video";
      const row = document.createElement("div");
      row.style.cssText = "display:flex;gap:8px;padding:6px;background:var(--pk-card1);border-radius:0";
      const thumb = isVideo
        ? `<video src="${esc(f.url)}" style="width:56px;height:56px;border-radius:0;object-fit:cover;flex-shrink:0;background:#000" muted playsinline preload="metadata"></video>`
        : `<img src="${esc(f.url)}" style="width:56px;height:56px;border-radius:0;object-fit:cover;flex-shrink:0"/>`;
      row.innerHTML = `${thumb}
        <div style="flex:1;min-width:0;font-size:11px;color:var(--pk-text-dim)">
          <div>${isVideo ? "[VÍDEO] " : ""}${esc(f.descricao || "(sem comentário)")}</div>
          <div style="color:var(--pk-text-muted);font-size:10px;margin-top:2px">${fmtDate(f.created_at)}</div>
        </div>`;
      box.appendChild(row);
    }
    // Novas (foto ou vídeo)
    novasFotos.forEach((nf, idx) => {
      if (nf.servico !== servicoKey) return;
      const isVideo = nf.tipo === "video";
      const row = document.createElement("div");
      row.style.cssText = "display:flex;gap:8px;padding:6px;background:rgba(150,132,115,0.06);border:1px solid rgba(150,132,115,0.25);border-radius:0";
      let thumb;
      if (isVideo){
        thumb = document.createElement("video");
        thumb.muted = true; thumb.playsInline = true; thumb.preload = "metadata";
        thumb.style.cssText = "width:56px;height:56px;border-radius:0;object-fit:cover;flex-shrink:0;background:#000";
      } else {
        thumb = document.createElement("img");
        thumb.style.cssText = "width:56px;height:56px;border-radius:0;object-fit:cover;flex-shrink:0";
      }
      thumb.src = URL.createObjectURL(nf.file);
      const right = document.createElement("div");
      right.style.cssText = "flex:1;min-width:0;display:flex;flex-direction:column;gap:4px";
      const tipoLbl = document.createElement("div");
      tipoLbl.style.cssText = "font-size:10px;color:var(--pk-accent);font-weight:700;text-transform:uppercase";
      tipoLbl.textContent = isVideo ? "Vídeo" : "Foto";
      const desc = document.createElement("input");
      desc.placeholder = "Comentário (opcional)";
      desc.value = nf.descricao || "";
      desc.style.cssText = "padding:5px 7px;font-size:11px;background:var(--pk-card2);border:1px solid var(--pk-border1);color:var(--pk-text);border-radius:0";
      desc.oninput = (e) => { novasFotos[idx].descricao = e.target.value; };
      const del = document.createElement("button");
      del.textContent = "×";
      del.style.cssText = "background:transparent;border:1px solid var(--pk-border2);color:var(--pk-status-err);width:24px;height:24px;padding:0;font-size:14px;border-radius:0;cursor:pointer";
      del.onclick = (e) => { e.preventDefault(); novasFotos.splice(idx,1); renderFotosDoServico(servicoKey); };
      right.appendChild(tipoLbl); right.appendChild(desc);
      const wr = document.createElement("div");
      wr.style.cssText = "display:flex;gap:6px;align-items:flex-start;width:100%";
      wr.appendChild(thumb); wr.appendChild(right); wr.appendChild(del);
      box.appendChild(wr);
    });
  }

  // Upload IMEDIATO de foto/vídeo direto pro Supabase — não fica preso em
  // memória local. Se o user trocar de aba, o app fechar, ou recarregar a
  // página, a mídia já está persistida no banco. O botão "Salvar laudo"
  // continua valendo só pros campos de texto/checklist.
  async function uploadMidiaImediato(file, servicoKey, tipo, descricao, statusFn){
    try {
      let url, storage_path = null;
      if (tipo === "video"){
        const ext = (file.name.split(".").pop() || "mp4").toLowerCase();
        const path = `${laudoId}/${servicoKey || "outros"}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
        statusFn && statusFn(`Enviando vídeo… (${(file.size/1024/1024).toFixed(1)}MB)`);
        const { error: upErr } = await sb.storage.from("fiscal-midias").upload(path, file, {
          contentType: file.type || "video/mp4", upsert: false,
        });
        if (upErr) throw upErr;
        const { data: pub } = sb.storage.from("fiscal-midias").getPublicUrl(path);
        url = pub.publicUrl;
        storage_path = path;
      } else {
        statusFn && statusFn("Processando foto…");
        url = await compressPhoto(file);
      }
      const { error: insErr } = await sb.from("fiscal_fotos").insert({
        laudo_id: laudoId,
        card_id: laudo.card_id,
        servico: servicoKey || "outros",
        ambiente: servicoKey || "outros",
        tipo,
        storage_path,
        descricao: descricao || null,
        url,
      });
      if (insErr) throw insErr;
      statusFn && statusFn(`${tipo === "video" ? "Vídeo" : "Foto"} salva`);
      // Recarrega a galeria do banco (pega o item recém-inserido)
      const { data: fxNew } = await sb.from("fiscal_fotos").select("*").eq("laudo_id", laudoId).order("created_at");
      fotosExistentes = fxNew || [];
      renderFotosDoServico(servicoKey);
      setTimeout(() => statusFn && statusFn(""), 2000);
      return true;
    } catch (err) {
      statusFn && statusFn(`Falha: ${err.message || err}. Tente novamente.`);
      console.error("[fiscal upload]", err);
      return false;
    }
  }

  // Bind dos inputs (foto+vídeo) de cada seção
  function bindFotoInputs(){
    // Cria um statusEl global pra mensagens de upload
    let statusEl = document.getElementById("_upload_status");
    if (!statusEl) {
      statusEl = el(`<div id="_upload_status" style="position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#fff;padding:10px 18px;border-radius:0;font-size:13px;z-index:99999;min-width:200px;text-align:center;display:none"></div>`);
      document.body.appendChild(statusEl);
    }
    const showStatus = (msg) => {
      if (!msg) { statusEl.style.display = "none"; return; }
      statusEl.textContent = msg;
      statusEl.style.display = "block";
    };

    // FOTOS — passam pelo editor e sobem imediato
    root.querySelectorAll("._foto_servico").forEach(inp => {
      const servicoKey = inp.dataset.servico;
      renderFotosDoServico(servicoKey);
      inp.onchange = async (e) => {
        const files = Array.from(e.target.files);
        e.target.value = "";
        for (const f of files){
          let result;
          try {
            result = await openPhotoEditor(f);
            if (!result) continue;
          } catch(err){
            console.warn("[editor]", err);
            result = { file: f, comentario: "" };
          }
          await uploadMidiaImediato(result.file, servicoKey, "foto", result.comentario || "", showStatus);
        }
      };
    });
    // VÍDEOS — sobem imediato
    root.querySelectorAll("._video_servico").forEach(inp => {
      const servicoKey = inp.dataset.servico;
      inp.onchange = async (e) => {
        const file = e.target.files[0];
        e.target.value = "";
        if (!file) return;
        if (file.size > 100 * 1024 * 1024){
          alert(`Vídeo muito grande (${(file.size/1024/1024).toFixed(1)}MB). Limite: 100MB. Grava mais curto ou em qualidade menor.`);
          return;
        }
        const comentario = prompt("Comentário do vídeo (opcional):") || "";
        await uploadMidiaImediato(file, servicoKey, "video", comentario, showStatus);
      };
    });
  }
  // Chamada depois de tudo renderizar (no fim da função renderEditarLaudo)
  setTimeout(bindFotoInputs, 0);

  // ── Observação geral ──
  root.appendChild(renderTextField("observacoes", "Observação geral", true));

  // ── Ações: Salvar rascunho / Concluir / Ver link público ──
  const actions = el(`<div class="card">
    <div class="grid2">
      <button class="ghost" id="_rascunho">Salvar rascunho</button>
      <button class="primary" id="_concluir">Concluir laudo</button>
    </div>
    <div class="grid2" style="margin-top:8px">
      <button class="ghost" id="_ver_link">Ver link público (PDF)</button>
      <button class="ghost" id="_copiar_link">Copiar link</button>
    </div>
    <div id="_save_msg"></div>
  </div>`);
  root.appendChild(actions);

  document.getElementById("_ver_link").onclick = () => {
    window.open("/laudo/" + laudoId, "_blank");
  };
  document.getElementById("_copiar_link").onclick = async () => {
    const url = location.origin + "/laudo/" + laudoId;
    try {
      await navigator.clipboard.writeText(url);
      alert("✓ Link copiado: " + url);
    } catch { prompt("Copia o link:", url); }
  };

  async function salvar(concluir){
    const msgEl = document.getElementById("_save_msg");
    msgEl.innerHTML = `<div class="small"><span class="spinner"></span> Salvando…</div>`;
    const payload = {
      updated_at: new Date().toISOString(),
      status: concluir ? "concluido" : "em_andamento",
    };
    // Mapeia checklist por serviço pras colunas correspondentes
    for (const k of ["piso","deck","forro","painel","porta","escada","bancos","liberacao","equipe","produtividade"]){
      if (ck[k]) payload[`checklist_${k}`] = ck[k];
    }
    // Campos texto direto
    for (const k of Object.keys(textFields)){
      payload[k] = textFields[k] || null;
    }
    // Checklist extra (entrega/reparo)
    if (laudo.tipo === "entrega" || laudo.tipo === "reparo"){
      payload.checklist_extra = extra;
    }
    // Upload imediato já fez o trabalho — só varre `novasFotos` (legado, pode
    // estar vazio se tudo subiu) pra não perder nada caso o user tenha
    // adicionado algo via fluxo antigo.
    for (let i = 0; i < novasFotos.length; i++){
      const nf = novasFotos[i];
      const tipo = nf.tipo || "foto";
      msgEl.innerHTML = `<div class="small"><span class="spinner"></span> ${tipo === "video" ? "Vídeo" : "Foto"} ${i+1}/${novasFotos.length}…</div>`;
      try {
        let url, storage_path = null;
        if (tipo === "video"){
          // Upload pro bucket fiscal-midias
          const ext = (nf.file.name.split(".").pop() || "mp4").toLowerCase();
          const path = `${laudoId}/${nf.servico || "outros"}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
          const { error: upErr } = await sb.storage.from("fiscal-midias").upload(path, nf.file, {
            contentType: nf.file.type || "video/mp4", upsert: false,
          });
          if (upErr) throw upErr;
          const { data: pub } = sb.storage.from("fiscal-midias").getPublicUrl(path);
          url = pub.publicUrl;
          storage_path = path;
        } else {
          url = await compressPhoto(nf.file);
        }
        await sb.from("fiscal_fotos").insert({
          laudo_id: laudoId,
          card_id: laudo.card_id,
          servico: nf.servico || "outros",
          tipo,
          storage_path,
          descricao: nf.descricao || null,
          url,
        });
      } catch (err){
        msgEl.innerHTML = `<div class="err">Falha na mídia ${i+1}: ${esc(err.message || err)}</div>`;
        return;
      }
    }

    const { error: upErr } = await sb.from("fiscal_laudos").update(payload).eq("id", laudoId);
    if (upErr){
      msgEl.innerHTML = `<div class="err">${esc(upErr.message)}</div>`;
      return;
    }

    // ─── SYNC com o card do operacional (acompanhamento de obra) ───
    // Grava link público do laudo + status no kanban_cards.details pra o
    // operacional ver no card de obra.
    if (laudo.card_id) {
      try {
        const linkPublico = location.origin + "/laudo/" + laudoId;
        const { data: cardAtual } = await sb.from("kanban_cards").select("details").eq("id", laudo.card_id).single();
        const detalhes = (cardAtual && cardAtual.details) || {};
        const laudosArr = Array.isArray(detalhes.fiscal_laudos) ? detalhes.fiscal_laudos : [];
        // Atualiza/adiciona entrada deste laudo
        const tipoLabel = (TIPOS[laudo.tipo] && TIPOS[laudo.tipo].label) || laudo.tipo;
        const idx = laudosArr.findIndex(x => x.id === laudoId);
        const entry = {
          id: laudoId,
          tipo: laudo.tipo,
          tipo_label: tipoLabel,
          status: concluir ? "concluido" : "rascunho",
          fiscal_nome: laudo.fiscal_nome || null,
          link: linkPublico,
          atualizado_em: new Date().toISOString(),
        };
        if (idx >= 0) laudosArr[idx] = entry; else laudosArr.push(entry);
        await sb.from("kanban_cards").update({
          details: { ...detalhes, fiscal_laudos: laudosArr, ultimo_laudo: entry },
        }).eq("id", laudo.card_id);
      } catch (syncErr) {
        console.warn("[sync card operacional]", syncErr);
      }
    }

    msgEl.innerHTML = `<div class="ok">✓ ${concluir ? "Laudo concluído" : "Rascunho salvo"} · Link: <a href="/laudo/${laudoId}" target="_blank" style="color:var(--pk-accent)">/laudo/${laudoId.slice(0,8)}</a></div>`;
    if (concluir) setTimeout(() => renderHome(), 1200);
    else {
      novasFotos = [];
      const { data: fx2 } = await sb.from("fiscal_fotos").select("*").eq("laudo_id", laudoId).order("created_at");
      fotosExistentes = fx2 || [];
      // Re-render todas as galerias de cada serviço
      root.querySelectorAll("._fotos_box").forEach(box => {
        renderFotosDoServico(box.dataset.servico);
      });
    }
  }
  document.getElementById("_rascunho").onclick = () => salvar(false);
  document.getElementById("_concluir").onclick = () => salvar(true);
}

// ╔══════════════════════════════════════════════════════════════╗
// ║ CALENDÁRIO — mês com visitas/laudos                            ║
// ╚══════════════════════════════════════════════════════════════╝
// Estado de expansão das seções colapsáveis da Home (renderHome)
let _homeOpen = {};
let _calMonth = (() => { const d = new Date(); return { y: d.getFullYear(), m: d.getMonth() }; })();
let _calSelDay = (() => { const d = new Date(); return d.toISOString().slice(0,10); })();
// "mes" mostra grid 7×N (default). "semana" mostra 7 colunas com agenda detalhada.
let _calView = "mes";
// Início da semana atual em vista semanal (segunda da semana de _calSelDay).
let _calWeekStart = (() => {
  const d = new Date();
  const dow = d.getDay();
  // Segunda = dow 1; ajusta pra trás
  const back = dow === 0 ? 6 : dow - 1;
  d.setDate(d.getDate() - back);
  return d.toISOString().slice(0,10);
})();

async function renderCalendario(){
  setActiveNav("agenda");
  root.innerHTML = `<div class="card center"><span class="spinner"></span><div class="small" style="margin-top:8px">Carregando agenda…</div></div>`;
  subscribeFiscalRealtime("agenda", () => { if (_rtView === "agenda") renderCalendario(); });

  const filtroFiscalId = _isAdmin ? _operandoComoId : (_fiscal && _fiscal.id);
  // Janela visível depende da vista (mês: grid 6×7; semana: 7 dias da
  // segunda do _calWeekStart até o domingo)
  let startGrid, endGrid, first, last;
  if (_calView === "semana"){
    const ws = new Date(_calWeekStart + "T00:00:00");
    startGrid = new Date(ws);
    endGrid = new Date(ws); endGrid.setDate(ws.getDate() + 6); endGrid.setHours(23,59,59,999);
    first = startGrid; last = endGrid;
  } else {
    first = new Date(_calMonth.y, _calMonth.m, 1);
    startGrid = new Date(first); startGrid.setDate(first.getDate() - first.getDay());
    last = new Date(_calMonth.y, _calMonth.m + 1, 0);
    endGrid = new Date(last); endGrid.setDate(last.getDate() + (6 - last.getDay()));
  }

  let qA = sb.from("fiscal_agenda")
    .select("id, card_id, tipo, data_inicio, status, notas, obra, cliente")
    .gte("data_inicio", startGrid.toISOString())
    .lte("data_inicio", endGrid.toISOString())
    .order("data_inicio", { ascending: true });
  if (filtroFiscalId) qA = qA.eq("fiscal_id", filtroFiscalId);
  const { data: ags } = await qA;

  let qL = sb.from("fiscal_laudos")
    .select("id, card_id, fiscal_id, fiscal_nome, obra, cliente, tipo, status, data_vistoria")
    .gte("data_vistoria", startGrid.toISOString())
    .lte("data_vistoria", endGrid.toISOString())
    .order("data_vistoria", { ascending: true });
  if (filtroFiscalId) qL = qL.eq("fiscal_id", filtroFiscalId);
  const { data: lds } = await qL;

  // Mapa dia (YYYY-MM-DD em LOCAL TIME) -> eventos. Antes usávamos
  // toISOString().slice(0,10) que dá a data UTC — eventos noturnos no BR
  // caíam no dia seguinte. Agora extrai Y-M-D do timezone do usuário.
  const byDay = {};
  function dayKeyLocal(d){
    const dt = (d instanceof Date) ? d : new Date(d);
    const y = dt.getFullYear();
    const m = String(dt.getMonth() + 1).padStart(2, "0");
    const day = String(dt.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }
  function bucket(date, ev){
    if (!date) return;
    const k = dayKeyLocal(date);
    if (!byDay[k]) byDay[k] = [];
    byDay[k].push(ev);
  }
  (ags || []).forEach(a => bucket(a.data_inicio, {
    kind: "agenda", id: a.id, card_id: a.card_id, when: a.data_inicio,
    cliente: a.cliente, obra: a.obra, tipo: a.tipo, status: a.status, notas: a.notas,
  }));
  (lds || []).forEach(l => bucket(l.data_vistoria, {
    kind: "laudo", id: l.id, card_id: l.card_id, when: l.data_vistoria,
    cliente: l.cliente, obra: l.obra, tipo: l.tipo, status: l.status, fiscal_nome: l.fiscal_nome,
  }));

  root.innerHTML = "";

  // Admin: seletor "operando como"
  if (_isAdmin){
    const opts = _fiscaisLista.map(f => `<option value="${f.id}" ${f.id===_operandoComoId?"selected":""}>${esc(f.nome)}</option>`).join("");
    const sel = el(`<div class="card">
      <div class="label">Operando como (fiscal)</div>
      <select id="_op_como_cal" style="margin-top:6px">${opts}</select>
    </div>`);
    root.appendChild(sel);
    document.getElementById("_op_como_cal").onchange = (e) => { _operandoComoId = e.target.value; renderCalendario(); };
  }

  // Calendário
  let titleLabel;
  if (_calView === "semana"){
    const a = startGrid.toLocaleDateString("pt-BR", { day: "2-digit", month: "short" });
    const b = endGrid.toLocaleDateString("pt-BR", { day: "2-digit", month: "short", year: "numeric" });
    titleLabel = `${a} – ${b}`;
  } else {
    titleLabel = first.toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
  }
  const wrap = el(`<div class="cal-wrap">
    <div class="cal-head">
      <div class="cal-title">${esc(titleLabel)}</div>
      <div class="cal-nav" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end">
        <div style="display:inline-flex;background:var(--pk-card1);border:1px solid var(--pk-border1);border-radius:0;padding:2px;gap:2px">
          <button id="_cal_view_mes" style="width:auto;height:26px;padding:0 10px;border:none;border-radius:0;font-size:11px;font-weight:600;cursor:pointer;background:${_calView==='mes'?'rgba(150,132,115,0.18)':'transparent'};color:${_calView==='mes'?'var(--pk-accent)':'var(--pk-text-dim)'}">Mês</button>
          <button id="_cal_view_sem" style="width:auto;height:26px;padding:0 10px;border:none;border-radius:0;font-size:11px;font-weight:600;cursor:pointer;background:${_calView==='semana'?'rgba(150,132,115,0.18)':'transparent'};color:${_calView==='semana'?'var(--pk-accent)':'var(--pk-text-dim)'}">Semana</button>
        </div>
        <button class="cal-btn today" id="_cal_today">Hoje</button>
        <button class="cal-btn" id="_cal_prev">‹</button>
        <button class="cal-btn" id="_cal_next">›</button>
      </div>
    </div>
    <div class="cal-grid ${_calView==='semana'?'cal-week':''}" id="_cal_grid"></div>
    <div class="swipe-hint">← arraste pro lado pra trocar de ${_calView==='semana'?'semana':'mês'} →</div>
    <div class="cal-legend">
      <div class="lg"><span class="lg-dot" style="background:#FBBF24"></span>Pendente</div>
      <div class="lg"><span class="lg-dot" style="background:#3B82F6"></span>Em andamento</div>
      <div class="lg"><span class="lg-dot" style="background:#34D399"></span>Concluído</div>
      <div class="lg"><span class="lg-dot" style="background:#A78BFA"></span>Agenda</div>
    </div>
  </div>`);
  root.appendChild(wrap);

  // ── Swipe horizontal pra trocar mês/semana (touch screens) ──
  // Detecta gesto horizontal limpo (Δx > 60 e |Δx| > 2×|Δy|) e dispara a
  // mesma ação dos botões ‹/›. Não interfere em scroll vertical da página.
  (function attachSwipe(){
    let sx = 0, sy = 0, started = false;
    wrap.addEventListener("touchstart", (e) => {
      const t = e.touches[0]; if (!t) return;
      sx = t.clientX; sy = t.clientY; started = true;
    }, { passive: true });
    wrap.addEventListener("touchend", (e) => {
      if (!started) return; started = false;
      const t = (e.changedTouches && e.changedTouches[0]) || null;
      if (!t) return;
      const dx = t.clientX - sx, dy = t.clientY - sy;
      if (Math.abs(dx) < 60) return;
      if (Math.abs(dx) < Math.abs(dy) * 2) return;
      // dx > 0 = swipe pra direita = ir pra trás (anterior)
      if (dx > 0) document.getElementById("_cal_prev").click();
      else        document.getElementById("_cal_next").click();
    }, { passive: true });
  })();

  document.getElementById("_cal_view_mes").onclick = () => { _calView = "mes"; renderCalendario(); };
  document.getElementById("_cal_view_sem").onclick = () => {
    _calView = "semana";
    // Realinha a semana do dia selecionado (ou hoje)
    const base = new Date((_calSelDay || new Date().toISOString().slice(0,10)) + "T00:00:00");
    const dow = base.getDay();
    const back = dow === 0 ? 6 : dow - 1;
    base.setDate(base.getDate() - back);
    _calWeekStart = base.toISOString().slice(0,10);
    renderCalendario();
  };
  document.getElementById("_cal_today").onclick = () => {
    const d = new Date();
    if (_calView === "semana"){
      const dow = d.getDay();
      const back = dow === 0 ? 6 : dow - 1;
      const ws = new Date(d); ws.setDate(d.getDate() - back);
      _calWeekStart = ws.toISOString().slice(0,10);
    } else {
      _calMonth = { y: d.getFullYear(), m: d.getMonth() };
    }
    _calSelDay = d.toISOString().slice(0,10);
    renderCalendario();
  };
  document.getElementById("_cal_prev").onclick = () => {
    if (_calView === "semana"){
      const ws = new Date(_calWeekStart + "T00:00:00");
      ws.setDate(ws.getDate() - 7);
      _calWeekStart = ws.toISOString().slice(0,10);
    } else {
      _calMonth.m -= 1;
      if (_calMonth.m < 0){ _calMonth.m = 11; _calMonth.y -= 1; }
    }
    renderCalendario();
  };
  document.getElementById("_cal_next").onclick = () => {
    if (_calView === "semana"){
      const ws = new Date(_calWeekStart + "T00:00:00");
      ws.setDate(ws.getDate() + 7);
      _calWeekStart = ws.toISOString().slice(0,10);
    } else {
      _calMonth.m += 1;
      if (_calMonth.m > 11){ _calMonth.m = 0; _calMonth.y += 1; }
    }
    renderCalendario();
  };

  const grid = document.getElementById("_cal_grid");
  // Header de dias da semana — segunda primeiro na vista semana, domingo na mês
  if (_calView === "semana"){
    ["S","T","Q","Q","S","S","D"].forEach(d => {
      grid.appendChild(el(`<div class="cal-dow">${d}</div>`));
    });
  } else {
    ["D","S","T","Q","Q","S","S"].forEach(d => {
      grid.appendChild(el(`<div class="cal-dow">${d}</div>`));
    });
  }

  const todayK = dayKeyLocal(new Date());
  // Cores por evento (escopo elevado pra ambas vistas usarem)
  function evColor(e){
    if (e.kind === "laudo"){
      if (e.status === "concluido") return "#34D399";
      if (e.status === "em_andamento") return "#3B82F6";
      if (e.status === "cancelado") return "#9CA3AF";
      return "#FBBF24"; // pendente = amarelo
    }
    return "#A78BFA"; // agenda = roxo claro (era var(--pk-accent) igual ao pendente)
  }

  const cur = new Date(startGrid);
  while (cur <= endGrid){
    const k = dayKeyLocal(cur);
    const inMonth = _calView === "semana" ? true : (cur.getMonth() === _calMonth.m);
    const evs = byDay[k] || [];
    const cls = [
      "cal-cell",
      !inMonth ? "muted" : "",
      k === todayK ? "today" : "",
      k === _calSelDay ? "sel" : "",
      evs.length && inMonth ? "has" : "",
    ].filter(Boolean).join(" ");

    let cellHtml;
    if (_calView === "semana"){
      // Vista semanal: cell maior, mostra até 5 eventos inline com hora+tipo
      const items = evs.slice(0,5).sort((a,b) => new Date(a.when) - new Date(b.when)).map(e => {
        const hora = new Date(e.when).toLocaleTimeString("pt-BR",{ hour:"2-digit", minute:"2-digit" });
        const tlabel = (TIPOS[e.tipo] && TIPOS[e.tipo].label) || e.tipo || "";
        const who = e.cliente || e.obra || "—";
        return `<div class="we-it" style="border-left:3px solid ${evColor(e)};padding:2px 4px;margin:2px 0;background:var(--pk-card1);border-radius:0;font-size:9.5px;line-height:1.25;text-align:left;overflow:hidden">
          <div style="color:var(--pk-accent);font-weight:600">${hora} · ${esc(tlabel)}</div>
          <div style="color:var(--pk-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(who)}</div>
        </div>`;
      }).join("");
      const more = evs.length > 5 ? `<div class="more" style="font-size:9px;color:var(--pk-accent);margin-top:2px">+${evs.length - 5} mais</div>` : "";
      cellHtml = `<div class="d" style="display:flex;justify-content:space-between;align-items:center">
          <span>${cur.getDate()}</span>
          ${evs.length ? `<span style="font-size:9px;color:var(--pk-text-muted)">${evs.length}</span>` : ""}
        </div>
        ${items}${more}`;
    } else {
      const dotsHtml = evs.slice(0,4).map(e => `<span class="dot" style="background:${evColor(e)}"></span>`).join("");
      const more = evs.length > 4 ? `<div class="more">+${evs.length - 4}</div>` : "";
      cellHtml = `<div class="d">${cur.getDate()}</div>
        <div class="dots">${dotsHtml}</div>
        ${more}`;
    }
    const cell = el(`<button class="${cls}" data-day="${k}" style="${_calView==='semana'?'min-height:140px;align-items:stretch;justify-content:flex-start;padding:6px':''}">
      ${cellHtml}
    </button>`);
    cell.onclick = () => { _calSelDay = k; renderCalendario(); };
    grid.appendChild(cell);
    cur.setDate(cur.getDate() + 1);
  }

  // Lista do dia selecionado
  const selEvs = (byDay[_calSelDay] || []).sort((a,b) => new Date(a.when) - new Date(b.when));
  const selDate = new Date(_calSelDay + "T12:00:00");
  const selLabel = selDate.toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "long" });

  root.appendChild(el(`<div class="sect-h"><div class="t">${esc(selLabel)}</div><div class="n">${selEvs.length} item(ns)</div></div>`));

  if (!selEvs.length){
    root.appendChild(el(`<div class="card"><div class="small center">Nenhuma visita ou laudo agendado pra esse dia.</div></div>`));
  } else {
    for (const e of selEvs){
      const tipoLabel = (TIPOS[e.tipo] && TIPOS[e.tipo].label) || e.tipo || "—";
      const hora = new Date(e.when).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
      let color = "var(--pk-accent)", labelKind = "Agenda";
      if (e.kind === "laudo"){
        if (e.status === "concluido"){ color = "#34D399"; labelKind = "Concluído"; }
        else if (e.status === "em_andamento"){ color = "#3B82F6"; labelKind = "Em andamento"; }
        else if (e.status === "cancelado"){ color = "#9CA3AF"; labelKind = "Cancelado"; }
        else { color = "#FBBF24"; labelKind = "Pendente"; }
      }
      const fiscalLine = _isAdmin && e.fiscal_nome ? ` · ${esc(e.fiscal_nome)}` : "";
      const c = el(`<div class="lcard">
        <div class="ldot" style="background:${color}"></div>
        <div class="lbody">
          <div class="lcli">${esc(e.cliente || e.obra || "—")}</div>
          <div class="lsub">${hora} · ${esc(tipoLabel)} · ${labelKind}${fiscalLine}</div>
        </div>
        <div class="larrow">›</div>
      </div>`);
      c.onclick = () => {
        if (e.kind === "laudo") renderEditarLaudo(e.id);
        else renderNovoLaudo({ agenda_id: e.id, card_id: e.card_id, obra: e.obra, cliente: e.cliente, tipo: e.tipo });
      };
      root.appendChild(c);
    }
  }

  // Botão "+ Novo laudo" no fim
  root.appendChild(el(`<div style="margin-top:14px"><button class="primary" id="_cal_novo">+ Novo laudo</button></div>`));
  document.getElementById("_cal_novo").onclick = () => renderNovoLaudo(null);
}

// ╔══════════════════════════════════════════════════════════════╗
// ║ Bottom nav                                                     ║
// ╚══════════════════════════════════════════════════════════════╝
function renderBottomNav(){
  // Remove se já existe
  const existing = document.getElementById("_bnav");
  if (existing) existing.remove();
  const nav = el(`<div class="bnav" id="_bnav">
    <button class="bnav-item" data-tab="agenda"><div>Agenda</div></button>
    <button class="bnav-item on" data-tab="laudos"><div>Laudos</div></button>
  </div>`);
  nav.querySelectorAll(".bnav-item").forEach(b => {
    b.onclick = () => {
      const tab = b.dataset.tab;
      if (tab === "agenda") renderCalendario();
      else if (tab === "laudos") renderHome();
    };
  });
  document.body.appendChild(nav);
}
function setActiveNav(tab){
  document.querySelectorAll("#_bnav .bnav-item").forEach(b => {
    b.classList.toggle("on", b.dataset.tab === tab);
  });
}
// Hook: quando renderHome roda, ativa "laudos"; quando renderLogin roda, esconde
const _origRenderHome = renderHome;
renderHome = async function(){ await _origRenderHome.apply(this, arguments); setActiveNav("laudos"); pushHist("home"); };

// ─── Hooks de navegação: cada render() empilha no history pra "voltar" funcionar ───
function pushHist(view, params){
  if (!_navStack) _navStack = [];
  const last = _navStack[_navStack.length - 1];
  if (last && last.view === view && JSON.stringify(last.params||null) === JSON.stringify(params||null)) return;
  _navStack.push({ view, params });
  try { history.pushState({ view, params, idx: _navStack.length - 1 }, "", "#" + view); } catch {}
}

const _origRenderEditarLaudo = renderEditarLaudo;
renderEditarLaudo = async function(laudoId){ await _origRenderEditarLaudo.apply(this, arguments); pushHist("editar", { id: laudoId }); };

const _origRenderNovoLaudo = renderNovoLaudo;
renderNovoLaudo = async function(preset){ await _origRenderNovoLaudo.apply(this, arguments); pushHist("novo", { preset: preset || null }); };

const _origRenderCalendario = renderCalendario;
renderCalendario = async function(){ await _origRenderCalendario.apply(this, arguments); pushHist("calendario"); };

// ╔══════════════════════════════════════════════════════════════╗
// ║ PWA service worker                                            ║
// ╚══════════════════════════════════════════════════════════════╝
if ("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch(err => console.warn("[SW]", err));
  });
}

boot();
</script>
