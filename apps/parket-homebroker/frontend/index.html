<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon-tracking.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <title>Parket · Home Broker</title>
    <meta name="description" content="Plataforma de atendimento e vendas Parket — home broker comercial" />

    <!-- PWA — instalável no Android via banner do Chrome, iOS via 'Add to Home Screen' -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS: meta tags pra modo standalone (sem barra do Safari) + ícones home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tracking" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      html, body, input, button, textarea, select {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
                     Roboto, Helvetica, Arial, sans-serif;
        font-feature-settings: "cv11", "ss01", "ss03";
      }
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      * { scrollbar-width: thin; scrollbar-color: rgba(127,127,127,0.35) transparent; }
      *::-webkit-scrollbar { width: 8px; height: 8px; }
      *::-webkit-scrollbar-track { background: transparent; }
      *::-webkit-scrollbar-thumb {
        background: rgba(127,127,127,0.35);
        border-radius: 8px;
        border: 2px solid transparent;
        background-clip: padding-box;
      }
      *::-webkit-scrollbar-thumb:hover { background: rgba(127,127,127,0.55); background-clip: padding-box; }
      *::-webkit-scrollbar-corner { background: transparent; }

      /* Escala fluida por largura de tela (notebook 11" → TV 4K).
         Baseline (zoom 1) = monitores 1600–2999px. Celular (<640px) fora.
         --pkz espelha o zoom: Chrome NÃO compensa unidades vh dentro de zoom,
         então h-screen/min-h-screen são re-ancorados em calc(100vh / --pkz). */
      :root { --pkz: 1; }
      @media (min-width: 640px) and (max-width: 1599px) { :root { --pkz: 0.92; } body { zoom: 0.92; } }
      @media (min-width: 640px) and (max-width: 1439px) { :root { --pkz: 0.85; } body { zoom: 0.85; } }
      @media (min-width: 640px) and (max-width: 1280px) { :root { --pkz: 0.78; } body { zoom: 0.78; } }
      @media (min-width: 640px) and (max-width: 1100px) { :root { --pkz: 0.70; } body { zoom: 0.70; } }
      @media (min-width: 3000px) { :root { --pkz: 1.45; } body { zoom: 1.45; } }
      .h-screen { height: calc(100vh / var(--pkz, 1)) !important; }
      .min-h-screen { min-height: calc(100vh / var(--pkz, 1)) !important; }
    </style>
  </head>
  <body>
    <style>
      .boot-skel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#050505;color:#77736A;flex-direction:column;gap:14px;z-index:9999;font-family:Inter,system-ui,sans-serif}
      .boot-skel .ring{width:34px;height:34px;border-radius:50%;border:2px solid rgba(216,211,199,0.08);border-top-color:#968473;animation:bootspin .9s linear infinite}
      @keyframes bootspin{to{transform:rotate(360deg)}}
      .boot-skel .lbl{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.20em;text-transform:uppercase;color:#D8D3C7}
    </style>
    <div id="root"></div>
    <div id="boot-skeleton" class="boot-skel">
      <div class="ring"></div>
      <div class="lbl">Parket · Home Broker</div>
    </div>
    <script>
      // Remove o skeleton assim que React renderizar (primeiro filho real no #root)
      (function(){
        var obs = new MutationObserver(function(){
          var root = document.getElementById('root');
          if (root && root.children.length > 0) {
            var s = document.getElementById('boot-skeleton');
            if (s) { s.remove(); obs.disconnect(); }
          }
        });
        var root = document.getElementById('root');
        if (root) obs.observe(root, { childList: true });
        // Failsafe: se passar 8s e React não montou, remove skeleton mesmo assim
        setTimeout(function(){
          var s = document.getElementById('boot-skeleton');
          if (s) s.remove();
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script src="https://server.parket.works/app.js" data-parket-chat data-api="https://server.parket.works" defer></script>
  </body>
</html>
