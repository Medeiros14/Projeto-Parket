version: "3.7"

services:
  lp:
    image: parket-lp:latest
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_public"

        # HTTP → HTTPS redirect
        - "traefik.http.routers.parket-lp-http.entrypoints=web"
        - "traefik.http.routers.parket-lp-http.rule=Host(`lp.parket.works`)"
        - "traefik.http.routers.parket-lp-http.middlewares=https-redirect"

        # HTTPS
        - "traefik.http.routers.parket-lp.entrypoints=websecure"
        - "traefik.http.routers.parket-lp.rule=Host(`lp.parket.works`)"
        - "traefik.http.routers.parket-lp.tls=true"
        - "traefik.http.routers.parket-lp.tls.certresolver=letsencryptresolver"

        # Service port
        - "traefik.http.services.parket-lp.loadbalancer.server.port=80"
    networks:
      - network_public

networks:
  network_public:
    external: true
    name: network_public
