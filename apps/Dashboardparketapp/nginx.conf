server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # index.html nunca fica em cache — garante que o browser
    # sempre carregue os hashes corretos após cada deploy
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # SPA: redireciona tudo para index.html — sem cache
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Chunks alvo de hotpatch ao vivo (MARCFIX/dept-layout/propostaGenerator):
    # cache curto obrigatório pra revalidar via etag antes de servir do cache.
    location ~* /assets/(orcamento-simulador-tab-MARCFIX|dept-layout|propostaGenerator)[A-Za-z0-9_.-]*\.js$ {
        add_header Cache-Control "no-cache, must-revalidate, max-age=0";
        etag on;
    }

    # JS/CSS demais: cache curto revalidado
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
        etag on;
    }

    # Imagens/fontes com hash: cache longo imutável
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Vídeos: cache longo imutável
    location ~* \.(mp4|webm|mov|m4v)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
