version: "3.8"

# PILOTO WAHA (paralelo à Evolution — NÃO toca em nada da produção)
# Deploy: source /root/parket-waha/.env-waha && docker stack deploy -c /root/parket-waha/stack.yml parket-waha
# Dashboard: https://conect2.parket.works/dashboard  |  Swagger: https://conect2.parket.works/

services:
  waha:
    image: devlikeapro/waha:latest
    environment:
      WHATSAPP_API_KEY: ${WAHA_API_KEY}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
      WHATSAPP_SWAGGER_USERNAME: ${WAHA_DASHBOARD_USERNAME}
      WHATSAPP_SWAGGER_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
      WAHA_ENGINE: WEBJS
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
      WAHA_PRINT_QR: "False"
      TZ: America/Sao_Paulo
    volumes:
      - waha_sessions:/app/.sessions
      - waha_media:/app/.media
    networks:
      - network_public
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 2G
      labels:
        traefik.enable: "true"
        traefik.http.routers.parket-waha.entrypoints: websecure
        traefik.http.routers.parket-waha.rule: Host(`conect2.parket.works`)
        traefik.http.routers.parket-waha.tls.certresolver: letsencryptresolver
        traefik.http.services.parket-waha.loadbalancer.server.port: "3000"

volumes:
  waha_sessions:
  waha_media:

networks:
  network_public:
    external: true
