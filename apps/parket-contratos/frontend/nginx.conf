server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno do Swarm (resolver lazy — upstream pode estar down no boot).
    resolver 127.0.0.11 valid=15s ipv6=off;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy pro parket-docusign_api (same-origin → sem CORS).
    # Usa variável pra forçar resolução DNS lazy — assim o container sobe mesmo
    # se o upstream ainda não existe (retorna 502 nos requests /api/docusign/*).
    # $request_uri é obrigatório com variável: sem ele, nginx manda só o path do
    # proxy_pass literal e o backend responde 404.
    location /api/docusign/ {
        set $docusign_upstream "parket-docusign_api:8000";
        proxy_pass http://$docusign_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 25M;
    }

    # cache estático (Vite hashed assets)
    location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # HTML sem cache
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
