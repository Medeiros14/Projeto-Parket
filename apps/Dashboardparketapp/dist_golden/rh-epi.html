  // ═══ KITS POR SETOR ═══════════════════════════════════════════════════
  // Define quais itens (e quantos) cada setor recebe.
  // O cálculo do Controle/Solicitação multiplica isso pelo nº de funcionários ativos do setor,
  // descontando o estoque atual + pedidos pendentes pra mostrar quanto falta comprar.
  state.kitsView = state.kitsView || { setor: null, busca: "" };

  function getSetoresAtivos(){
    var m = {};
    state.funcionarios.forEach(function(f){
      if(f.ativo===false) return;
      var s = (f.funcao||"").toString().trim().toUpperCase();
      if(!s) return;
      m[s] = (m[s]||0) + 1;
    });
    // Garante que setores que já têm kit mas sem funcionário ativo apareçam também
    state.kits.forEach(function(k){
      var s = (k.setor||"").toString().trim().toUpperCase();
      if(s && !(s in m)) m[s] = 0;
    });
    return Object.keys(m).sort().map(function(s){return {setor:s, count:m[s]};});
  }

  function kitsDoSetor(setor){
    var s = (setor||"").toString().trim().toUpperCase();
    return state.kits.filter(function(k){return (k.setor||"").toString().trim().toUpperCase()===s;});
  }

  function pedidosPendentesPorItem(itemId){
    return state.pedidos
      .filter(function(p){return p.item_id===itemId && p.status!=="recebido" && p.status!=="cancelado";})
      .reduce(function(s,p){return s + Math.max(0, (p.qty_solicitada||0) - (p.qty_recebida||0));}, 0);
  }

  function estoqueTotalPorItem(itemId){
    return state.estoque
      .filter(function(e){return e.item_id===itemId;})
      .reduce(function(s,e){return s + (e.qty||0);}, 0);
  }

  function jaEntreguePorSetor(setor, itemId){
    var s = (setor||"").toString().trim().toUpperCase();
    var funcs = state.funcionarios.filter(function(f){return f.ativo!==false && (f.funcao||"").toString().trim().toUpperCase()===s;}).map(function(f){return f.id;});
    var funcSet = {}; funcs.forEach(function(id){funcSet[id]=1;});
    return state.entregas
      .filter(function(e){return e.item_id===itemId && funcSet[e.funcionario_id];})
      .reduce(function(s2,e){return s2 + (e.qty||0);}, 0);
  }

  function renderKits(m){
    var setores = getSetoresAtivos();
    if(state.kitsView.setor === null && setores.length > 0) state.kitsView.setor = setores[0].setor;

    var setorSel = state.kitsView.setor;
    var selInfo = setores.find(function(x){return x.setor===setorSel;}) || {setor: setorSel||"—", count: 0};
    var kitItens = kitsDoSetor(setorSel);
    var kitItemIds = {}; kitItens.forEach(function(k){kitItemIds[k.item_id]=k;});
    var itensCatalogo = state.itens.filter(function(i){return i.ativo!==false;});
    var itensDisponiveis = itensCatalogo.filter(function(i){return !kitItemIds[i.id];});

    // Header com seletor de setor + nº funcionários ativos
    var html =
      '<div style="display:grid;grid-template-columns:240px 1fr;gap:14px;align-items:start">'+
        // ── Sidebar: lista de setores ──
        '<div class="card" style="padding:0;overflow:hidden">'+
          '<div style="padding:12px 14px;border-bottom:1px solid #1a1a1a;background:#0e0e0e">'+
            '<div style="font-size:10px;color:#888;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:4px">SETORES</div>'+
            '<div style="font-size:11px;color:#666">'+setores.length+' setores · '+state.funcionarios.filter(function(f){return f.ativo!==false;}).length+' ativos</div>'+
          '</div>'+
          '<div style="max-height:65vh;overflow-y:auto">'+
            setores.map(function(s){
              var active = s.setor===setorSel;
              var kitCount = kitsDoSetor(s.setor).length;
              return '<div class="kit-setor-row" data-setor="'+escape(s.setor)+'" style="padding:10px 14px;border-bottom:1px solid #1a1a1a;cursor:pointer;'+(active?'background:#1f1a14;border-left:3px solid #B8AA9A':'border-left:3px solid transparent')+'">'+
                '<div style="font-weight:'+(active?'700':'600')+';color:'+(active?'#B8AA9A':'#ccc')+';font-size:12px">'+escape(s.setor)+'</div>'+
                '<div style="font-size:10px;color:#666;margin-top:2px">'+s.count+' funcionários · '+kitCount+' '+(kitCount===1?'item no kit':'itens no kit')+'</div>'+
              '</div>';
            }).join('')+
            (setores.length===0?'<div class="empty">Nenhum setor encontrado</div>':'')+
          '</div>'+
        '</div>'+

        // ── Main: kit do setor selecionado ──
        '<div>'+
          '<div class="card">'+
            '<div class="row" style="justify-content:space-between;align-items:start">'+
              '<div>'+
                '<div style="font-size:10px;color:#888;letter-spacing:0.06em;text-transform:uppercase">Kit do setor</div>'+
                '<div style="font-size:20px;font-weight:800;color:#B8AA9A;margin-top:4px">'+escape(selInfo.setor)+'</div>'+
                '<div style="font-size:11px;color:#666;margin-top:2px">'+selInfo.count+' funcionários ativos · '+kitItens.length+' itens configurados</div>'+
              '</div>'+
              '<div style="display:flex;gap:6px">'+
                '<select id="kit-add-item" style="min-width:240px">'+
                  '<option value="">+ Adicionar item ao kit…</option>'+
                  itensDisponiveis.map(function(i){
                    return '<option value="'+i.id+'">'+escape((i.categoria||"").toUpperCase())+' — '+escape(i.nome)+'</option>';
                  }).join('')+
                '</select>'+
              '</div>'+
            '</div>'+
          '</div>'+

          // Tabela de itens do kit
          '<div class="card" style="padding:0">'+
            '<table>'+
              '<thead><tr>'+
                '<th style="width:30%">Item</th>'+
                '<th style="width:14%">Categoria</th>'+
                '<th style="width:11%;text-align:right">Qty/Func</th>'+
                '<th style="width:11%;text-align:right">Necessário</th>'+
                '<th style="width:10%;text-align:right">Estoque</th>'+
                '<th style="width:10%;text-align:right">Pedidos</th>'+
                '<th style="width:10%;text-align:right">A comprar</th>'+
                '<th style="width:4%"></th>'+
              '</tr></thead>'+
              '<tbody>'+
                (kitItens.length===0
                  ? '<tr><td colspan="8" class="empty">Setor sem itens configurados. Use o seletor acima pra adicionar.</td></tr>'
                  : kitItens.map(function(k){
                      var it = state.itens.find(function(x){return x.id===k.item_id;}) || {nome:"(item removido)", categoria:"—"};
                      var necess = (k.qty_por_funcionario||0) * selInfo.count;
                      var estoq = estoqueTotalPorItem(k.item_id);
                      var ped = pedidosPendentesPorItem(k.item_id);
                      var entregue = jaEntreguePorSetor(selInfo.setor, k.item_id);
                      var faltaEntregar = Math.max(0, necess - entregue);
                      var aComprar = Math.max(0, faltaEntregar - estoq - ped);
                      var aComprarStyle = aComprar>0?'color:#F87171;font-weight:700':'color:#34D399;font-weight:700';
                      return '<tr data-kid="'+k.id+'">'+
                        '<td><div style="font-weight:600;color:#fff">'+escape(it.nome)+'</div>'+
                          (k.obrigatorio===false?'<small style="color:#FBBF24">opcional</small>':'')+
                        '</td>'+
                        '<td><span class="badge">'+escape((it.categoria||"").toUpperCase())+'</span></td>'+
                        '<td style="text-align:right"><input type="number" min="0" step="1" value="'+(k.qty_por_funcionario||0)+'" data-kid="'+k.id+'" class="kit-qty-input" style="width:70px;text-align:right"/></td>'+
                        '<td style="text-align:right;font-weight:700">'+necess+'</td>'+
                        '<td style="text-align:right">'+estoq+'</td>'+
                        '<td style="text-align:right;color:'+(ped>0?'#FBBF24':'#666')+'">'+ped+(ped>0?' 🚚':'')+'</td>'+
                        '<td style="text-align:right;'+aComprarStyle+'">'+aComprar+'</td>'+
                        '<td style="text-align:center"><button class="kit-del-btn" data-kid="'+k.id+'" style="background:transparent;color:#F87171;border:1px solid rgba(248,113,113,0.3);padding:3px 7px;font-size:11px" title="Remover do kit">✕</button></td>'+
                      '</tr>';
                    }).join(''))+
              '</tbody>'+
            '</table>'+
          '</div>'+

          // Legenda
          '<div class="card" style="background:#0e0e0e;font-size:11px;color:#888;line-height:1.7">'+
            '<b style="color:#B8AA9A">Como o cálculo funciona:</b><br>'+
            '• <b>Necessário</b> = Qty/Func × Funcionários ativos do setor<br>'+
            '• <b>Estoque</b> = Soma de todas as entradas em <i>rh_epi_estoque</i> para esse item<br>'+
            '• <b>Pedidos</b> 🚚 = Qty solicitada (ainda não recebida) em pedidos abertos<br>'+
            '• <b>A comprar</b> = Necessário − Já entregue (deste setor) − Estoque − Pedidos pendentes<br>'+
            '<small style="color:#666">Quando o pedido é marcado como <b>"recebido"</b>, o estoque é incrementado automaticamente.</small>'+
          '</div>'+
        '</div>'+
      '</div>';

    m.innerHTML = html;

    // ── Handlers ──
    document.querySelectorAll(".kit-setor-row").forEach(function(el){
      el.onclick = function(){ state.kitsView.setor = el.dataset.setor; renderKits(m); };
    });

    var addSel = $("kit-add-item");
    if(addSel) addSel.onchange = function(){
      var itemId = addSel.value;
      if(!itemId) return;
      sb("rh_epi_kits_setor", {method:"POST", body:{setor: state.kitsView.setor, item_id: itemId, qty_por_funcionario: 1, obrigatorio: true}})
        .then(function(rows){
          if(rows && rows[0]) state.kits.push(rows[0]);
          renderKits(m);
        })
        .catch(function(err){ alert("Erro ao adicionar: "+err.message); });
    };

    document.querySelectorAll(".kit-qty-input").forEach(function(inp){
      var saving = false;
      inp.onchange = function(){
        if(saving) return;
        saving = true;
        var kid = inp.dataset.kid;
        var q = Math.max(0, parseInt(inp.value,10)||0);
        sb("rh_epi_kits_setor?id=eq."+kid, {method:"PATCH", body:{qty_por_funcionario: q}})
          .then(function(){
            var k = state.kits.find(function(x){return x.id===kid;});
            if(k) k.qty_por_funcionario = q;
            renderKits(m);
          })
          .catch(function(err){ alert("Erro ao salvar: "+err.message); saving=false; });
      };
    });

    document.querySelectorAll(".kit-del-btn").forEach(function(btn){
      btn.onclick = function(){
        var kid = btn.dataset.kid;
        if(!confirm("Remover este item do kit do setor?")) return;
        sb("rh_epi_kits_setor?id=eq."+kid, {method:"DELETE"})
          .then(function(){
            state.kits = state.kits.filter(function(k){return k.id!==kid;});
            renderKits(m);
          })
          .catch(function(err){ alert("Erro ao remover: "+err.message); });
      };
    });
  }

  // ─── EMPRESAS ───
  function renderEmpresas(m){
    m.innerHTML =
      '<div class="card">'+
        '<div class="row" style="justify-content:space-between">'+
          '<div><b>Empresas</b> <small>('+state.empresas.length+')</small></div>'+
          '<button id="btn-new-e">+ Nova empresa</button>'+
        '</div>'+
      '</div>'+
      '<div class="card" style="padding:0"><table id="tab-emp"></table></div>';
    var rows = state.empresas.map(function(e){
      return '<tr><td><b>'+escape(e.nome)+'</b></td><td>'+escape(e.cnpj||"-")+'</td><td><button class="ghost" data-e-edit="'+e.id+'">Editar</button></td></tr>';
    }).join("") || '<tr><td colspan="3" class="empty">Nenhuma empresa</td></tr>';
    $("tab-emp").innerHTML = '<thead><tr><th>Nome</th><th>CNPJ</th><th></th></tr></thead><tbody>'+rows+'</tbody>';
    $("btn-new-e").onclick = function(){ openEmpresaModal(null); };
    document.querySelectorAll("[data-e-edit]").forEach(function(b){ b.onclick = function(){ openEmpresaModal(b.dataset.eEdit); }; });
  }

  function openEmpresaModal(id){
    var e = id ? state.empresas.find(function(x){return x.id===id;}) : {};
    e = JSON.parse(JSON.stringify(e||{}));
    var modal = document.createElement("div");
    modal.className = "modal-overlay";
    modal.innerHTML =
      '<div class="modal"><h2>'+(id?"Editar":"Nova")+' empresa</h2>'+
      '<div><label>Nome</label><input id="em-nome" value="'+escape(e.nome||"")+'" /></div>'+
      '<div style="margin-top:10px"><label>CNPJ</label><input id="em-cnpj" value="'+escape(e.cnpj||"")+'" /></div>'+
      '<div class="row" style="margin-top:14px;justify-content:flex-end">'+
        (id?'<button class="danger" id="em-del" style="margin-right:auto">Remover</button>':'')+
        '<button class="ghost" id="em-cancel">Cancelar</button>'+
        '<button id="em-save">Salvar</button>'+
      '</div></div>';
    document.body.appendChild(modal);
    $("em-cancel").onclick = function(){ document.body.removeChild(modal); };
    if(id){
      $("em-del").onclick = function(){
        if(!confirm("Remover empresa?")) return;
        sb("rh_empresas",{method:"DELETE",q:"id=eq."+id}).then(function(){ document.body.removeChild(modal); loadAll().then(render); });
      };
    }
    $("em-save").onclick = function(){
      var body = { nome: $("em-nome").value.trim(), cnpj: $("em-cnpj").value.trim() };
      if(!body.nome){ alert("Nome obrigatório"); return; }
      var p = id ? sb("rh_empresas",{method:"PATCH",q:"id=eq."+id,body:body}) : sb("rh_empresas",{method:"POST",body:body});
      p.then(function(){ document.body.removeChild(modal); loadAll().then(render); }).catch(function(err){ alert("Erro: "+err.message); });
    };
  }

  function el(html){ var d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstChild; }

  // Aplica a aba inicial (caso state.activeTab tenha vindo do ?default=...)
  (function(){
    document.querySelectorAll(".tab").forEach(function(x){ x.classList.remove("active"); });
    var initial = document.querySelector('.tab[data-tab="'+state.activeTab+'"]');
    if(initial) initial.classList.add("active");
  })();

  loadAll().then(render).catch(function(e){ $("main").innerHTML = '<div class="card" style="color:#F87171">Erro ao carregar: '+escape(e.message)+'</div>'; });
})();
</script>
</body>
</html>
