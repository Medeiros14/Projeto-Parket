server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
  gzip_min_length 1024;

  location = /index.html { add_header Cache-Control "no-cache, no-store, must-revalidate"; try_files $uri =404; }
  location = /.well-known/assetlinks.json { default_type application/json; add_header Cache-Control "public, max-age=3600"; try_files $uri =404; }
  location = /manifest.json { default_type application/json; add_header Cache-Control "no-cache, must-revalidate"; try_files $uri =404; }
  location / { add_header Cache-Control "no-cache, no-store, must-revalidate"; try_files $uri $uri/ /index.html; }
  location ~* \.(js|css)$ { add_header Cache-Control "public, max-age=300, must-revalidate"; etag on; }
  location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ { expires 1y; add_header Cache-Control "public, immutable"; }
}
