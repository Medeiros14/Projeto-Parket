server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
  location = /index.html { add_header Cache-Control "no-cache, no-store, must-revalidate"; try_files $uri =404; }
  location / { add_header Cache-Control "no-cache, no-store, must-revalidate"; try_files $uri $uri/ /index.html; }
  location ~* /assets/(orcamento-simulador-tab-MARCFIX|dept-layout|propostaGenerator)[A-Za-z0-9_.-]*\.js$ {
    add_header Cache-Control "no-cache, must-revalidate, max-age=0"; etag on;
  }
  location ~* \.(js|css)$ { add_header Cache-Control "public, max-age=300, must-revalidate"; etag on; }
  location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2)$ { expires 1y; add_header Cache-Control "public, immutable"; }
  location ~* \.(mp4|webm|mov|m4v)$ { expires 1y; add_header Cache-Control "public, immutable"; }
}
